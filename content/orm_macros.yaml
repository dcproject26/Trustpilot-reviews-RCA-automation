# ─────────────────────────────────────────────────────────────────────────────
#  ORM guest-response rules
#
#  This file is the source of truth for everything the app says to a guest:
#  the brand voice, the takedown lines, the untraceable reply, and the macro
#  tag vocabulary. Edit it here - no code change is needed, and the running
#  server picks it up on restart.
#
#  WHO EDITS THIS: CX and content. You do not need to know Python.
#  AFTER EDITING:  run  python3 tools/check_macros.py
#                  It validates the file and shows you the result. If it
#                  fails, the app keeps using the last good version rather
#                  than shipping a broken reply.
#
#  FORMAT NOTES
#   - Text after a "#" is a comment and is ignored.
#   - A block starting with "|" keeps your line breaks exactly as typed.
#   - Keep the two-space indentation. It is what separates the fields.
# ─────────────────────────────────────────────────────────────────────────────

# The voice guide, verbatim from the brand doc. Injected into every prompt
# that writes something a guest will read.
brand_voice: |
  INSPIRATIONAL & POSITIVE - optimistic and solution-oriented. Not cringey,
    not over-effusive.
      Not: "Book this experience now."
      Yes: "Ready to head out? Book now and get going!"
  CONVERSATIONAL - friendly and approachable, like a chat with someone
    familiar. Direct, personal language. Never formal or servile.
      Not: "We've resolved the issue now. Thank you for your patience."
      Yes: "Great news: we've resolved the issue now! Thank you for being
           patient with us, I really appreciate it."
  CLEAR & CONCISE - straightforward, no unnecessary complexity, still warm.
  FACTUALLY ENTERTAINING - an interesting detail where it genuinely fits.
    Never invent a fact to be charming.
  WITTY, NOT SLAPSTICK - subtle and clever, never disrespectful. On a
    complaint reply wit is almost always the wrong instrument: lead with the
    fix.

  HARD RULES
  - American English.
  - Address the guest with "Hey <first name>,".
  - No false information, no invented facts, no unnecessary adjectives, no
    hyperbole.
  - Cut fluff. Precise, impactful, engaging.
  - Numbered points, never bullet points, if a list is unavoidable.

# Appended to every reply. Two lines, exactly as written.
sign_off: |
  Best,
  [Your Name], Headout

# ── Takedown macro ───────────────────────────────────────────────────────────
# When takedown is Yes, ONE of these goes in verbatim as its own paragraph,
# immediately before the sign-off. Add or reword them here; "when" is the
# guidance the model uses to choose between them.
takedown:
  lines:
    a:
      text: "Glad we could make things right. If you have a moment, you can update your TP review here: [link]"
      when: "we fixed it and the guest is satisfied - a clean resolution"
    b:
      text: "Thanks for giving us the chance to fix things. If you're open to it, feel free to update your review here: [link]"
      when: "we corrected our own error and the guest gave us the chance to"
    c:
      text: "Thanks for bearing with us. If you'd like, you can update your TP review here: [link]"
      when: "the guest waited, or the outcome is partial"

  # The macro's own guardrail. When either of these is true, NO takedown line
  # is added and nothing takes its place.
  suppress_when: |
    The guest's tone is abusive or inappropriate, OR this case has already
    been escalated more than once.

  # ── Why we are asking for the review to come down ──────────────────────────
  # The grounds an associate picks from when the takedown verdict is Yes.
  # Order is the order they appear in the dropdown.
  #
  # Edit here, not in the client: the dashboard builds the control from this
  # list, so adding or renaming a ground is a content change, not a code one.
  reasons:
    - "Content issues"
    - "Booking / support issues"
    - "Personal emergency, health issue"

# ── Untraceable reply ────────────────────────────────────────────────────────
# Sent unchanged on any review with no traceable booking. Nothing here is
# generated - there is nothing case-specific to say until the guest gives us a
# reference. {first_name} is the only substitution.
untraceable_reply: |
  Hey {first_name},

  I'm sorry things didn't go as planned, and I'd love to fix this for you right away. Please share your booking ID (if available) or the email address used for your booking at https://bit.ly/hedout. Once we have your details, our team will dive right in to resolve it ASAP.

  Thank you so much for your understanding and patience. I'll make sure we turn this around for you!

# Used when the author's name cannot be read - never a literal placeholder.
fallback_first_name: "there"

# Honorifics stripped before taking a first name. "Frau Nicole Liebschner" is
# not called Frau. Add to this list as new ones turn up.
