<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORM RCA — Stakeholder Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E12;
    --bg-elev: #15151C;
    --bg-elev-2: #1C1C26;
    --bg-elev-3: #22222F;
    --border: #2A2A38;
    --border-lit: #3A3A4A;
    --text: #ECECF0;
    --text-mute: #9696A5;
    --text-dim: #65657A;
    --accent: #C4F25B;
    --green: #5DCC8C;
    --green-bg: rgba(93, 204, 140, 0.12);
    --amber: #F2B544;
    --amber-bg: rgba(242, 181, 68, 0.12);
    --red: #F26B6B;
    --red-bg: rgba(242, 107, 107, 0.12);
    --blue: #6BA4F2;
    --blue-bg: rgba(107, 164, 242, 0.12);
    --purple: #B57DF2;
    --purple-bg: rgba(181, 125, 242, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar {
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #FF6B35, #F7B731);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white;
  }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-sub { font-size: 12px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
  .topbar-status { display: flex; gap: 14px; margin-left: auto; align-items: center; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .status-pill.off .dot { background: var(--text-dim); }

  .main {
    display: grid;
    grid-template-columns: 260px 360px 1fr;
    overflow: hidden;
    height: calc(100vh - 56px);
  }

  /* === COLUMN 1 — INBOX === */
  .inbox {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .inbox-head {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg-elev);
    z-index: 2;
  }
  .inbox-title {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px; font-weight: 600;
  }
  .inbox-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .inbox-tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    padding: 5px 10px;
    border-radius: 14px;
    font-size: 11.5px; font-family: inherit; cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; gap: 5px;
  }
  .inbox-tab:hover { color: var(--text); }
  .inbox-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .inbox-tab .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--border-lit);
    padding: 0 5px; border-radius: 8px;
    color: var(--text-mute);
  }
  .inbox-tab.active .num { background: var(--bg); color: var(--text); }
  .inbox-list { padding: 8px; overflow-y: auto; flex: 1; }
  .review-item {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: all 0.12s ease;
  }
  .review-item:hover { background: var(--bg-elev-2); }
  .review-item.selected { background: var(--bg-elev-2); border-color: var(--border-lit); }
  .review-item-top {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 4px; gap: 8px;
  }
  .review-author-line {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .review-stars-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 11px;
  }
  .review-exp {
    color: var(--text-mute);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .review-stars { color: var(--red); font-size: 11px; letter-spacing: 1px; }
  .review-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-dim); flex-shrink: 0;
  }
  .review-preview {
    font-size: 12px; color: var(--text);
    line-height: 1.4; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .review-tags { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag {
    font-size: 9.5px; padding: 2px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tag-lang { background: var(--blue-bg); color: var(--blue); }
  .tag-new { background: var(--red-bg); color: var(--red); }
  .tag-draft { background: var(--amber-bg); color: var(--amber); }
  .tag-sent { background: var(--green-bg); color: var(--green); }
  .tag-t1 { background: var(--green-bg); color: var(--green); }
  .tag-t2 { background: var(--amber-bg); color: var(--amber); }
  .tag-untr { background: var(--red-bg); color: var(--red); }
  .tag-ch1 { background: rgba(125, 181, 242, 0.1); color: #7DB5F2; }
  .tag-ch2 { background: rgba(242, 125, 181, 0.1); color: #F27DB5; }
  .inbox-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .add-manual-btn, .reporting-link {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border-lit);
    color: var(--text-mute);
    padding: 8px;
    border-radius: 8px;
    font-family: inherit; font-size: 11.5px;
    cursor: pointer; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: all 0.12s ease;
  }
  .add-manual-btn:hover, .reporting-link:hover {
    color: var(--text); border-color: var(--text-mute);
  }
  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
  }

  /* === COLUMN 2 === */
  .review-col {
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 22px 22px 80px;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--text-mute);
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .breadcrumb .sep { color: var(--text-dim); }
  .breadcrumb .current { color: var(--text); }

  .section { margin-bottom: 22px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim);
    font-weight: 600; margin-bottom: 8px;
  }
  .section-label .marker {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }

  .review-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    border-left: 3px solid var(--red);
  }
  .review-card-head {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 8px; gap: 10px;
  }
  .review-author { font-size: 15px; font-weight: 600; }
  .review-meta {
    font-size: 11.5px; color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
  }
  .review-body-original {
    font-size: 13px; color: var(--text);
    line-height: 1.55; white-space: pre-wrap;
  }
  .translation-card {
    margin-top: 8px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    border-left: 3px solid var(--blue);
  }
  .translation-label {
    font-size: 9.5px; color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px; font-weight: 600;
  }
  .translation-body { font-size: 13px; color: var(--text); line-height: 1.55; }

  .match-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .match-tier-badge {
    width: 34px; height: 34px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .match-tier-badge.t1 { background: var(--green-bg); color: var(--green); }
  .match-tier-badge.t2 { background: var(--amber-bg); color: var(--amber); }
  .match-info { flex: 1; }
  .match-title { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .match-method { font-size: 11px; color: var(--text-mute); }

  .candidates-picker {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 10px;
  }
  .candidates-picker-label {
    font-size: 10px;
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .candidate-card {
    background: var(--bg-elev-3);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .candidate-card:last-child { margin-bottom: 0; }
  .candidate-card:hover { border-color: var(--text-mute); }
  .candidate-card.selected {
    border-color: var(--accent);
    background: rgba(196, 242, 91, 0.04);
  }
  .candidate-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }
  .candidate-bid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--blue);
  }
  .candidate-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
  }
  .candidate-score-bar {
    display: inline-block;
    width: 50px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
    overflow: hidden;
  }
  .candidate-score-fill {
    height: 100%;
    background: var(--accent);
  }
  .candidate-exp {
    font-size: 12.5px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .candidate-meta {
    font-size: 11px;
    color: var(--text-mute);
    margin-bottom: 6px;
  }
  .candidate-reasons {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .candidate-reason-pill {
    font-size: 9.5px;
    background: var(--green-bg);
    color: var(--green);
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 500;
  }
  .candidate-confirm-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 9px 14px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  .confidence-trail {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .confidence-trail-label {
    font-size: 10px;
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 600; margin-bottom: 8px;
  }
  .conf-step {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 10px;
    padding: 4px 0;
    font-size: 11.5px;
    align-items: baseline;
  }
  .conf-step .mark {
    color: var(--green);
    font-weight: 700;
    font-size: 10.5px;
  }
  .conf-step .mark.fail { color: var(--red); }
  .conf-step .mark.warn { color: var(--amber); }
  .conf-step .label-text { color: var(--text-mute); }
  .conf-step .label-text strong { color: var(--text); font-weight: 600; }

  .details-grid {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .detail-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    align-items: center;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-mute); font-size: 11px; }
  .detail-row .v { color: var(--text); font-weight: 500; }
  .detail-row .v.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
  .detail-row .v.placeholder { color: var(--text-dim); font-style: italic; }
  .booking-status-pill {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
  }
  .status-cancelled { background: var(--red-bg); color: var(--red); }
  .status-complete { background: var(--green-bg); color: var(--green); }
  .status-pending { background: var(--amber-bg); color: var(--amber); }
  .pill-sm {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .pill-green { background: var(--green-bg); color: var(--green); }
  .pill-grey  { background: var(--bg-elev-3, #2a2a2a); color: var(--text-mute); }
  .pill-red   { background: var(--red-bg); color: var(--red); }
  .bms-link, .tgid-link {
    color: var(--accent, #7c93ff);
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .bms-link:hover, .tgid-link:hover { text-decoration-style: solid; }

  .timeline {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .tl-event {
    display: grid;
    grid-template-columns: 80px 1fr;
    padding: 7px 0;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
    font-size: 12px;
  }
  .tl-event:last-of-type { border-bottom: none; }
  .tl-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--text-dim);
    padding-top: 1px;
  }
  .tl-content { display: flex; flex-direction: column; gap: 4px; }
  .tl-header { display: flex; align-items: center; gap: 8px; }
  .tl-thread {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    flex-shrink: 0;
  }
  .tl-thread.chat { background: rgba(124, 138, 245, 0.15); color: #7C8AF5; }
  .tl-thread.email { background: rgba(95, 170, 240, 0.15); color: #5FAAF0; }
  .tl-thread.sp { background: rgba(160, 122, 234, 0.15); color: #A07AEA; }
  .tl-thread.booking { background: rgba(93, 204, 140, 0.15); color: var(--green); }
  .tl-thread.review { background: rgba(242, 107, 107, 0.15); color: var(--red); }
  .tl-actor {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tl-actor.creation { color: var(--blue); }
  .tl-actor.support { color: var(--amber); }
  .tl-actor.sp { color: var(--purple); }
  .tl-actor.review { color: var(--red); }
  .tl-actor.ai { color: #FA8BFF; }
  .tl-summary { color: var(--text); line-height: 1.5; }
  .timeline-summary {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-mute);
    line-height: 1.5;
  }
  .timeline-summary strong { color: var(--text); font-weight: 600; }

  .insights-wrap {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .insights-header {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-elev-3);
  }
  .insights-title { font-size: 11px; color: var(--text-mute); font-weight: 600; }
  .window-picker {
    display: flex;
    gap: 2px;
    background: var(--bg-elev);
    border-radius: 5px;
    padding: 2px;
  }
  .window-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 3px 8px;
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    border-radius: 3px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.12s ease;
  }
  .window-btn:hover { color: var(--text); }
  .window-btn.active { background: var(--text); color: var(--bg); }
  .insights-grid {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .insight-tile {
    background: var(--bg-elev-3);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 0;
    overflow: hidden;
  }
  .insight-tile-label {
    font-size: 10px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .insight-tile-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }
  .insight-tile-sub {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .insight-tile.amber .insight-tile-value { color: var(--amber); }
  .insight-tile.red .insight-tile-value { color: var(--red); }
  .insight-tile.green .insight-tile-value { color: var(--green); }
  .insight-tile.full { grid-column: 1 / -1; }
  .similar-summary-line {
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.5;
    padding: 6px 0 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 4px;
  }
  .similar-summary-line strong { color: var(--accent); font-weight: 600; }
  .similar-list { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; margin-bottom: 8px; }
  .similar-sub-label {
    font-size: 9.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-top: 8px;
    margin-bottom: 2px;
    font-family: 'JetBrains Mono', monospace;
  }
  .dss-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .dss-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 10px;
    padding: 5px 0;
    font-size: 12px;
  }
  .dss-row .k {
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .dss-row .v.placeholder {
    color: var(--text-mute);
    font-style: italic;
  }
  .dss-note {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 10.5px;
    color: var(--text-dim);
    font-style: italic;
  }
  .placeholder-tag {
    margin-left: auto;
    font-size: 9px;
    background: var(--amber-bg);
    color: var(--amber);
    padding: 2px 6px;
    border-radius: 3px;

<script>
// L2 placeholder catalogue per L1 — to be replaced with real list from CX team
const L2_OPTIONS = {
  'SP issue': ['Venue closure', 'Did not receive tickets', 'Redemption denied at venue', 'SP did not pick up calls', 'SP cancelled last-minute', 'Wrong tickets issued', 'SP system outage'],
  'CO miss': ['Wrong canned response', 'No response within SLA', 'Wrong info given', 'Minded AI wrong guidance', 'Failed escalation'],
  'Fulfilment': ['Voucher not delivered', 'QR code missing', 'Wrong booking details on voucher'],
  'Product/UX': ['Misleading listing name', 'Unclear inclusions', 'Confusing checkout', 'Time slot UX'],
  'Customer error': ['Wrong date booked', 'No-show', 'Misread voucher', 'Misunderstood inclusions'],
  'Pricing': ['Price mismatch vs competitor', 'Hidden fees', 'Currency confusion'],
  'Other': ['(placeholder)'],
};

// Keyed "L1::L2" -> ["A. Name", …, "N. Irrelevant"].
// Populated from /api/taxonomy (which already returns `sub_theme_frameworks`
// in exactly this "L1::L2" key form) so the frontend never duplicates taxonomy.
// Empty is safe: the row still shows the classified sub_theme; the editable
// options simply fill in once the taxonomy loads.
const SUB_THEME_OPTIONS = {};

async function loadSubThemeOptions() {
  try {
    const t = await (await fetch('/api/taxonomy')).json();
    const fw = t.sub_theme_frameworks || {};
    for (const key in fw) {
      const f = fw[key];
      const opts = (f.sub_themes || []).map(([code, name]) => `${code}. ${name}`);
      if (f.exclusion_label) opts.push(f.exclusion_label);
      SUB_THEME_OPTIONS[key] = opts;
    }
  } catch (e) { /* leave empty — row still shows the assigned sub_theme */ }
  // re-render so the sub-theme row appears once options are available
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
}
// call once on load; re-render picks up options after taxonomy resolves
loadSubThemeOptions();

// ── Inbox wiring ─────────────────────────────────────────────────────────────
async function fetchInbox() {
  try {
    const rows = await (await fetch('/api/reviews')).json();
    const byId = new Map(REVIEWS.map(r => [r.id, r]));
    const merged = rows.map(row => {
      const demo = byId.get(row.id);
      if (demo) {
        return {
          ...demo,
          receivedAt:     row.received_at || demo.receivedAt,
          status:         row.status      || demo.status,
          matchTier:      row.match_tier  ?? demo.matchTier,
          candidateState: row.candidate_state ?? demo.candidateState,
        };
      }
      // New API-only review (manual / Slack): minimal template
      const tier = row.match_tier;
      return {
        id:             row.id,
        author:         row.author || 'Unknown',
        firstName:      (row.author || 'Unknown').split(' ')[0],
        rating:         row.rating || 1,
        stars:          '★'.repeat(row.rating || 1) + '☆'.repeat(5 - (row.rating || 1)),
        language:       row.language || 'en',
        lang:           (row.language || 'en').toUpperCase(),
        receivedAt:     row.received_at,
        time:           row.received_at ? new Date(row.received_at).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '',
        status:         row.status || 'new',
        matchTier:      tier,
        candidateState: row.candidate_state || false,
        type:           tier === 1 ? 'identified' : tier === null ? 'untraceable' : 'candidates',
        tier:           tier ? `T${tier}` : '—',
        experience:     row.experience || '',
        channel:        'orm',
        original:       row.snippet || '',
        english:        null,
        originalText:   row.snippet || '',
        englishText:    row.snippet || '',
        booking:        {},
        rca:            {
          issueL1: '', issueL2: '', subTheme: null,
          whatWentWrong: '', statedIssue: '',
          supportInteraction: [], supportSummary: '', spInteraction: [],
          areaOfImproving: '',
          actionsTaken: {sp:[],customer:[],business:[],product:[],ce:[]},
          resolution: '',
          tldr: '', wwrChain: [], prevention: '',
          evidence: [], issueSpecificAnswers: {}, checklistAnswers: [],
        },
        insights: {
          tgidRating: {value:'—',sub:'',tone:''},
          tidVidRating: {value:'—',sub:'',tone:''},
          completion: {value:'—',sub:'',tone:''},
          sameDayIssues: {value:'—',sub:'',tone:''},
          similarSupport: [], similarReviews: [],
        },
        events: [],
        timelineSummary: '',
      };
    });
    merged.sort((a, b) => new Date(b.receivedAt || b.time || 0) - new Date(a.receivedAt || a.time || 0));
    REVIEWS.length = 0;
    REVIEWS.push(...merged);
  } catch (e) {
    console.warn('[inbox] fetch failed, keeping demo REVIEWS:', e);
  }
}

// Overlay real draft fields onto the demo view-models. Data source only:
// sub_theme, support_interaction_frames (+ sp_interaction_frames) and
// support_summary come from /api/reviews/{id}; markup stays demo-v15.
function mapSupportFrame(f) {
  return {
    type: f.thread || 'email',
    time: f.time || '',
    label: f.label || '',
    guestSaid: f.guestSaid || f.summary || '—',
    weDid: f.weDid || '—',
    guestReply: f.guestReply || '—',
    gap: f.gap || '',
  };
}

async function loadDraftOverlays() {
  await Promise.all(REVIEWS.map(async (r) => {
    if (!r.rca) return;
    try {
      const [draftResp, insightsResp] = await Promise.all([
        fetch(`/api/reviews/${r.id}`),
        fetch(`/api/reviews/${r.id}/insights`),
      ]);
      if (!draftResp.ok) return;
      const draft = (await draftResp.json()).draft;
      if (!draft) return;

      r.rca.subTheme = draft.sub_theme || null;
      r.rca.tldr = draft.tldr || '';
      r.rca.wwrChain = draft.wwr_chain || [];
      r.rca.prevention = draft.prevention || '';
      r.rca.evidence = draft.evidence || [];
      r.rca.issueSpecificAnswers = draft.issue_specific_answers || {};
      r.rca.checklistAnswers = draft.checklist_answers || [];
      r.rca.supportInteraction = (draft.support_interaction_frames || []).map(mapSupportFrame);
      r.rca.supportSummary = draft.support_summary || '';
      r.rca.spInteraction = (draft.sp_interaction_frames || []).map(f => ({
        time: f.time || '',
        label: f.label || '',
        summary: f.summary || f.weDid || '',
      }));

      // Wire booking fields from draft.booking
      if (draft.booking) {
        const db = draft.booking;
        r.booking = r.booking || {};
        r.booking.bid              = r.booking.bid              || db.id;
        r.booking.experience       = r.booking.experience       || db.experienceName || db.experience_name;
        r.booking.tgid             = r.booking.tgid             || db.tgid;
        r.booking.tid              = r.booking.tid              || db.tid;
        r.booking.vid              = r.booking.vid              || db.vid || db.vendor_id;
        r.booking.vendorName       = r.booking.vendorName       || db.vendorName || db.vendor_name;
        r.booking.fulfilmentType   = db.fulfilmentType   || db.fulfilment_type   || r.booking.fulfilmentType;
        r.booking.experienceDate   = r.booking.experienceDate   || db.visitDate || db.date_of_visit;
        r.booking.bookingDate      = db.date_of_booking || r.booking.bookingDate;
        r.booking.primaryGuestName = db.primary_guest_name      || r.booking.primaryGuestName;
        r.booking.bmsLink          = db.bms_link;
        r.booking.tgidLink         = db.tgid_link;
        r.booking.ticketMailSeen   = !!db.ticket_mail_seen;
      }

      // Live insights from API
      if (insightsResp.ok) {
        const ins = await insightsResp.json();
        r.liveInsights = ins;
      }
    } catch (e) { /* keep demo data for this review if the API is unreachable */ }
  }));
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
  renderReviewCol();
  renderInbox();
}

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const filtered = REVIEWS.filter(r => {
    if (state.filter === 'identified') return r.type === 'identified' && r.status !== 'sent';
    if (state.filter === 'candidates') return r.type === 'candidates';
    if (state.filter === 'untraceable') return r.type === 'untraceable';
    if (state.filter === 'sent') return r.status === 'sent';
    return false;
  });

  document.getElementById('cnt-identified').textContent = REVIEWS.filter(r => r.type === 'identified' && r.status !== 'sent').length;
  document.getElementById('cnt-candidates').textContent = REVIEWS.filter(r => r.type === 'candidates').length;
  document.getElementById('cnt-untraceable').textContent = REVIEWS.filter(r => r.type === 'untraceable').length;
  document.getElementById('cnt-sent').textContent = REVIEWS.filter(r => r.status === 'sent').length;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No reviews in this tab.</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="review-item ${r.id === state.selected ? 'selected' : ''}" data-id="${r.id}">
      <div class="review-item-top">
        <span class="review-author-line">${r.author}</span>
        <span class="review-time">${r.time}</span>
      </div>
      <div class="review-stars-line"><span class="review-stars">${r.stars}</span>${r.booking?.experience ? `<span class="review-exp">· ${r.booking.experience.length > 40 ? r.booking.experience.substring(0, 40) + '…' : r.booking.experience}</span>` : ''}</div>
      <div class="review-preview">${(r.english || r.original).substring(0, 100)}${(r.english || r.original).length > 100 ? '…' : ''}</div>
      <div class="review-tags">
        <span class="tag tag-lang">${r.lang}</span>
        <span class="tag tag-${r.status}">${r.status}</span>
        <span class="tag tag-${r.tier === 'T1' ? 't1' : r.tier === 'T2' ? 't2' : 'untr'}">${r.tier}</span>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.review-item').forEach(el => {
    el.addEventListener('click', () => {
      state.selected = el.dataset.id;
      renderInbox();
      renderReviewCol();
      renderRcaCol();
    });
  });
}

                  </div>
                  <div class="action-context"><span class="action-edit" contenteditable="true" spellcheck="false">${a.context}</span></div>
                  <a class="action-where action-edit" contenteditable="true" spellcheck="false" href="#">${a.where}</a>
                </div>
              `).join('')}
          <button class="action-add-btn" data-add-action>+ Add action</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">
        <span class="marker"></span>Resolution<span class="ai-tag-inline">AI</span>
        <button class="connect-dss-btn" data-connect-dss>⚡ Click to connect</button>
      </div>
      <div class="resolution-block">
        <textarea class="field-textarea" placeholder="Final resolution offered to the guest — comp / refund / explanation">${rca.resolution || ''}</textarea>
        <div class="dss-status" id="dss-status">
          <span class="dss-status-dot off"></span>
          <span class="dss-status-text">[DSS to be connected]</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Response to Guest<span class="ai-tag-inline">AI</span></div>
      <div class="reply-block">
        <div class="reply-edit-header">
          <span>Editable — review before sending</span>
          <span class="edit-hint">✎ Click to edit</span>
        </div>
        <textarea class="reply-text" placeholder="AI-drafted response — edit as needed">${rca.reply}</textarea>
        <div class="reply-meta">
          <span>Goes out via Trustpilot Slack integration on Send ↑</span>
          <span>${rca.reply.length} chars</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Slack Thread Post</div>
      ${slackPost}
    </div>

    <div class="send-bar">
      <div class="send-info"><span class="dot"></span>RCA posts to the Slack thread · guest response handled via Trustpilot Slack integration</div>
      <div class="send-actions">
        <button class="btn">Preview</button>
        <button class="btn primary">Send ↑</button>
      </div>
    </div>
  `;

  col.querySelectorAll('.action-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.actionTab = tab.dataset.tab;
      renderRcaCol();
    });
  });

  // ── v3 event handlers ──────────────────────────────────────────────────────

  // TL;DR blur → PATCH
  const tldrEl = col.querySelector('.tldr-banner[data-patch-field="tldr"]');
  if (tldrEl) {
    tldrEl.addEventListener('blur', async () => {
      rca.tldr = tldrEl.textContent.trim();
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({tldr: rca.tldr}),
        });
      } catch (e) { /* keep local edit */ }
    });
  }

  // Prevention blur → PATCH
  const prevEl = col.querySelector('textarea[data-patch-field="prevention"]');
  if (prevEl) {
    prevEl.addEventListener('blur', async () => {
      rca.prevention = prevEl.value;
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({prevention: rca.prevention}),
        });
      } catch (e) { /* keep local edit */ }
    });
  }

  // WWR chain — inline edits on what/why fields
  col.querySelectorAll('[data-wwr-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const idx = parseInt(el.dataset.wwrIdx);
      const field = el.dataset.wwrField;
      if (!rca.wwrChain[idx]) return;
      rca.wwrChain[idx][field] = el.textContent.trim();
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({wwr_chain: rca.wwrChain}),
        });
      } catch (e) { /* keep local edit */ }
    });
  });

  // WWR chain — delete step
  col.querySelectorAll('[data-wwr-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.wwrDelete);
      rca.wwrChain.splice(idx, 1);
      rca.wwrChain.forEach((s, i) => { s.step = i + 1; });
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({wwr_chain: rca.wwrChain}),
        });
      } catch (e) { /* keep local edit */ }
      renderRcaCol();
    });
  });

  // WWR chain — add step
  const wwrAddBtn = col.querySelector('[data-wwr-add]');
  if (wwrAddBtn) {
    wwrAddBtn.addEventListener('click', async () => {
      rca.wwrChain.push({step: rca.wwrChain.length + 1, what: 'New step', why: ''});
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({wwr_chain: rca.wwrChain}),
        });
      } catch (e) { /* keep local edit */ }
      renderRcaCol();
    });
  }

  // Evidence — toggle collapsible
  const evToggle = col.querySelector('[data-toggle-evidence]');
  if (evToggle) {
    evToggle.addEventListener('click', () => {
      const body = col.querySelector('#evidence-body');
      if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
    });
  }

  // Issue-Specific Answers — select change → PATCH
  col.querySelectorAll('[data-isa-key]').forEach(sel => {
    sel.addEventListener('change', async () => {
      rca.issueSpecificAnswers[sel.dataset.isaKey] = sel.value;
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({issue_specific_answers: rca.issueSpecificAnswers}),
        });
      } catch (e) { /* keep local edit */ }
    });
  });

  // Checklist Answers — select change → PATCH
  col.querySelectorAll('[data-ca-idx]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const idx = parseInt(sel.dataset.caIdx);
      if (rca.checklistAnswers[idx]) rca.checklistAnswers[idx].answer = sel.value;
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({checklist_answers: rca.checklistAnswers}),
        });
      } catch (e) { /* keep local edit */ }
    });
  });

  const subThemeSel = col.querySelector('[data-subtheme-select]');
  if (subThemeSel) {
    subThemeSel.addEventListener('change', async () => {
      const val = subThemeSel.value || null;
      rca.subTheme = val;
      try {
        await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sub_theme: val }),
        });
        fetchInbox().then(() => { renderInbox(); });
      } catch (e) { /* keep local edit; server save retried on next change */ }
    });
  }

  col.querySelectorAll('[data-add-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      rca.actionsTaken[state.actionTab].push({
        with: 'New action',
        handle: '@handle',
        time: 'Today',
        context: 'Click to edit context',
        where: 'link.example.com',
      });
      renderRcaCol();
    });
  });

  col.querySelectorAll('[data-action-delete]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.actionDelete);
      rca.actionsTaken[state.actionTab].splice(idx, 1);
      renderRcaCol();
    });
  });

  col.querySelectorAll('[data-toggle-frame]').forEach(btn => {
    btn.addEventListener('click', () => {
      const frame = btn.closest('.convo-frame');
      frame.classList.toggle('open');
    });
  });

  const dssBtn = col.querySelector('[data-connect-dss]');
  if (dssBtn) {
    dssBtn.addEventListener('click', () => {
      const r = REVIEWS.find(x => x.id === state.selected);
      if (!r) return;
      const statusDot = col.querySelector('.dss-status-dot');
      const statusText = col.querySelector('.dss-status-text');
      const textarea = col.querySelector('.resolution-block .field-textarea');

      // Loading state
      dssBtn.disabled = true;
      dssBtn.textContent = '⟳ Calling DSS…';
      statusDot.className = 'dss-status-dot loading';
      statusText.textContent = 'Calling DSS webhook…';

      setTimeout(() => {
        // Mock DSS response based on L1/L2
        const dssRec = dssRecommendation(r.rca.issueL1, r.rca.issueL2, r);
        textarea.value = dssRec.text;
        dssBtn.classList.add('connected');
        dssBtn.disabled = false;
        dssBtn.textContent = '✓ DSS Connected';
        statusDot.className = 'dss-status-dot connected';
        statusText.innerHTML = `DSS · <strong>${dssRec.policy}</strong> · ${dssRec.coverage}`;
      }, 900);
    });
  }
}

function dssRecommendation(l1, l2, r) {
  // Mock DSS policy lookup — in production, this would call the Retool webhook
  const key = `${l1}::${l2}`;
  const lookup = {
    'SP issue::Venue closure': {
      policy: 'SP venue closure',
      coverage: 'Full refund + 25% HOC',
      text: `DSS Recommendation:\n• Full refund of booking value\n• 25% HOC credit on next booking\n• Coverage: Yes — SP-side failure with no advance notice to Headout`,
    },
    'Customer error::Misunderstood inclusions (upsell not selected)': {
      policy: 'Customer error',
      coverage: 'No comp · goodwill optional',
      text: `DSS Recommendation:\n• No compensation — booking issued and fulfilled correctly\n• Goodwill HOC credit up to €10 at CE discretion (optional)\n• Coverage: No — guest error`,
    },
  };
  return lookup[key] || {
    policy: '[Policy not mapped]',
    coverage: '[Coverage TBC]',
    text: `DSS Recommendation:\n• [Policy lookup for L1: ${l1} / L2: ${l2} — webhook to return policy + coverage]\n• To be wired to live DSS service`,
  };
}

function openFlagDraftModal(r) {
  // Remove any existing modal
  const existing = document.getElementById('flag-modal');
  if (existing) existing.remove();

  const defaultMsg = `Flagging low completion rate for review.\n\nVendor: ${r.booking.vendorName} (VID ${r.booking.vid})\nTID: ${r.booking.tid} · TGID: ${r.booking.tgid}\nCompletion: ${r.insights.completion.value} (below market avg)\nWindow: ${state.insightsWindow}\n\nFlagged from review BID ${r.booking.bid} — guest reported ${r.rca.issueL2.toLowerCase()}. Please review supply allocation and consider raising completion to market rate.`;

  const modal = document.createElement('div');
  modal.id = 'flag-modal';
  modal.className = 'flag-modal-backdrop';
  modal.innerHTML = `
    <div class="flag-modal">
      <div class="flag-modal-head">
        <div class="flag-modal-title">Draft Slack message to Biz team</div>
        <button class="flag-modal-close" data-close-modal>×</button>
      </div>
      <div class="flag-modal-body">
        <div class="flag-modal-row">
          <label>Channel</label>
          <input type="text" class="flag-input" id="flag-channel" value="#biz-supply-ops" />
        </div>
        <div class="flag-modal-row">
          <label>Tag</label>
          <input type="text" class="flag-input" id="flag-tag" value="[Biz handle placeholder]" />
        </div>
        <div class="flag-modal-row">
          <label>Message</label>
          <textarea class="flag-textarea" id="flag-message">${defaultMsg}</textarea>
        </div>
      </div>
      <div class="flag-modal-actions">
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn primary" id="flag-send-btn">Send to Slack ↑</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => modal.remove());
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
  modal.querySelector('#flag-send-btn').addEventListener('click', () => {
    const channel = modal.querySelector('#flag-channel').value;
    const tag = modal.querySelector('#flag-tag').value;
    const message = modal.querySelector('#flag-message').value;
    if (!r.rca.actionsTaken.business) r.rca.actionsTaken.business = [];
    r.rca.actionsTaken.business.push({
      with: 'Biz team — raise completion to market rate',
      handle: tag,
      time: new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
      context: message.substring(0, 200) + (message.length > 200 ? '…' : ''),
      where: `slack.com/${channel.replace('#', '')}/[posted]`,
    });
    modal.remove();
    state.actionTab = 'business';
    // Mark the completion flag as already-flagged for this case
    r.insights.completion.flagged = true;
    renderRcaCol();
    renderReviewCol();
  });
}


document.querySelectorAll('.inbox-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.filter = tab.dataset.tab;
    document.querySelectorAll('.inbox-tab').forEach(t => t.classList.toggle('active', t === tab));
    // Auto-select first in tab
    const inTab = REVIEWS.filter(r => {
      if (state.filter === 'identified') return r.type === 'identified' && r.status !== 'sent';
      if (state.filter === 'candidates') return r.type === 'candidates';
      if (state.filter === 'untraceable') return r.type === 'untraceable';
      if (state.filter === 'sent') return r.status === 'sent';
      return false;
    });
    state.selected = inTab[0]?.id || null;
    renderInbox();
    renderReviewCol();
    renderRcaCol();
  });
});

renderInbox();
renderReviewCol();
renderRcaCol();
</script>
</body>
</html>
