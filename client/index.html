// Machinery toggle. Hiding is a display choice, so it is reversible and it
// says how many it hid — a filter that silently removes rows is how the regex
// in the old renderer went unnoticed for so long.
//
// Delegated, and it re-renders the RCA column. §13 moved the events timeline
// out of the review column, and the binding stayed behind: it was still
// queried off `review-col` (which no longer contains the note, so nothing was
// bound) and still called renderReviewCol (which no longer draws the
// timeline, so nothing would have changed if it had been). The control
// rendered and did nothing, which is how it went unnoticed.
document.addEventListener('click', ev => {
  const t = ev.target.closest && ev.target.closest('[data-tl-toggle]');
  if (!t) return;
  state.tlShowInternal = !state.tlShowInternal;
  if (state.selected) renderRcaCol();
});

// ── Classification (L1 / L2) ────────────────────────────────────────────────
//
// Both selects rendered and neither was bound to anything: no data- hook, no
// listener. Changing the L1 or L2 on the card did nothing, silently — which
// is also how the L2 dropdown being EMPTY went unnoticed, because a control
// nobody can operate cannot report that its options are missing.
//
// DELEGATED, and that is the point. The first fix bound these inside
// renderRcaCol while the block itself is drawn by renderReviewCol, so the
// first change worked and every one after it did nothing: the L2 handler
// called renderReviewCol, which replaced the selects with unbound copies.
// Exactly the §13 failure again — rendered by one function, bound by another,
// and only the first click ever lands. A delegated listener cannot come
// unbound by a re-render, whichever function does the rendering.
//
// Everything downstream is keyed on this pair — the macro filing, the
// support-tag comparison, the sub-theme framework — so a re-classification
// has to reach the server AND redraw the chips below it.
// One-click revert: adopt what routing says instead of the hand-set scenario.
//
// DELEGATED, for the same reason the classify selects above are. The reconcile
// row is drawn by renderReviewCol; binding it inside renderRcaCol with a
// col-scoped query found nothing at all, because `col` is the RCA column and
// the row is not in it. That is the §13 failure for the fifth time, and the
// browser test caught it — the button rendered perfectly and did nothing.
//
// Reverting is itself a judgement, so it goes through the same path as any
// other scenario edit and is recorded as hand-set too. One that agrees with
// routing reads as `diverged: false` on the next load, so the row disappears
// on its own rather than needing to be dismissed.
document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest('[data-scenario-revert]');
  if (!btn) return;
  const target = btn.dataset.scenarioRevert;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!target || !r || !r.rca) return;
  const rca = r.rca;
  rca.scenarios = [target, ...(rca.scenarios || []).slice(1)
                                .filter(x => x !== target)];
  rca.primaryScenario = target;
  await saveDraft(r.id, {scenarios: rca.scenarios, primary_scenario: target});
  // Reverting IS a scenario change, so the RCA has to be re-run against the
  // new checklists like any other. Saving the chip and leaving the analysis
  // written for the old scenario is the state the uncovered-scenario flag
  // exists to report — better not to create it in the first place.
  const st = document.querySelector('[data-scenario-regen-status]');
  if (st) st.textContent = '⟳ re-running RCA for the routed scenario…';
  let failed = '';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scenarios: rca.scenarios}),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'regen failed');
    rca.v3 = data.rca_v3 || rca.v3;
    rca.prevention = data.prevention || rca.prevention;
    rca.issueSpecificAnswers = data.issue_specific_answers || {};
    if (data.area_of_improving) rca.areaOfImproving = data.area_of_improving;
    rca.checklistAnswers = [];
  } catch (e) {
    failed = '✗ RCA re-run failed — scenario saved, try again';
  }
  await refreshAfterScenarioChange(r.id);
  renderReviewCol(); renderRcaCol();
  // AFTER the re-render, not before. Writing it first put the message into a
  // node renderReviewCol then replaced, so a failed re-run reported itself for
  // a few hundred milliseconds and then looked exactly like a success.
  if (failed) {
    const after = document.querySelector('[data-scenario-regen-status]');
    if (after) after.textContent = failed;
  }
});

document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest('[data-classify]');
  if (!sel) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const rca = r.rca;
  if (sel.dataset.classify === 'l1') {
    rca.issueL1 = sel.value;
    // The old L2 belongs to the old L1. Carrying it over produces a pair that
    // exists nowhere in the taxonomy — the state that makes every downstream
    // lookup correctly report that it found nothing.
    const valid = L2_OPTIONS[sel.value] || [];
    if (!valid.includes(rca.issueL2)) rca.issueL2 = valid[0] || '';
  } else {
    rca.issueL2 = sel.value;
  }
  // The sub-theme framework is keyed "L1::L2", so a pair change makes the
  // sub-themes wrong rather than merely stale.
  const stillValid = SUB_THEME_OPTIONS[`${rca.issueL1}::${rca.issueL2}`] || [];
  rca.subThemes = (rca.subThemes || []).filter(s => stillValid.includes(s));
  rca.subTheme = rca.subThemes[0] || null;
  await saveDraft(r.id, {l1: rca.issueL1, l2: rca.issueL2,
                         sub_themes: rca.subThemes});
  renderReviewCol();
});

function renderRcaCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('rca-col').innerHTML = '';
    return;
  }

  const col = document.getElementById('rca-col');

  // The RCA runs against a specific booking, so an unconfirmed candidate set
  // gets a gate rather than a half-built workspace: editing an analysis that
  // is about to be regenerated against a different booking wastes the work.
  if (r.type === 'candidates') {
    col.innerHTML = `
      <div class="rca-head">
        <div>
          <div class="rca-title">RCA &amp; response</div>
          <div class="rca-sub">Locked until a booking is confirmed</div>
        </div>
      </div>
      <div class="rca-gate">
        <div class="rca-gate-title">Confirm the booking first</div>
        <div class="rca-gate-body">The RCA runs against a specific booking. Pick the
          correct candidate in the middle panel — the full analysis fills in here
          once confirmed.</div>
      </div>`;
    return;
  }

  if (r.type === 'untraceable') {
    col.innerHTML = `
      <div class="untr-wrap">
      <div class="col-label">Untraceable — ask the guest</div>
      <div class="untr-card">
        <!-- One statement of the situation, not four. The facts pane already
             carries the trail; repeating "no booking" in three more sentences
             told the reader nothing they had not just read. -->
        <div class="untr-lead">No booking matched this review. Ask the guest for a booking
          reference; it stays in this tab until it matches.</div>
        <!-- Approved copy, sent unchanged. There is nothing case-specific to
             say until the guest gives us a reference, so nothing here is
             generated - only the name is filled in. -->
        <div class="untr-template editable-text" contenteditable="true" spellcheck="false"
             data-untraceable-template>${esc(UNTRACEABLE_REPLY(r.firstName))}</div>
        <div class="untraceable-actions">
          <!-- Copy, not send: this reply is pasted into the Slack thread by
               hand like every other response in this app. -->
          <button class="btn primary" data-copy-untraceable>Copy reply</button>
          <button class="btn" data-rerun-match>↻ Re-run matching</button>
        </div>
      </div>


    `;
    const vBtn = col.querySelector('[data-copy-untraceable]');
    if (vBtn) {
      vBtn.addEventListener('click', async () => {
        const tpl = col.querySelector('[data-untraceable-template]');
        const text = (tpl ? tpl.textContent : '').trim();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          vBtn.textContent = '✓ Copied';
        } catch (e) {
          // Clipboard can be blocked by the browser; select the text so it can
          // still be copied by hand rather than leaving a dead button.
          try {
            const range = document.createRange();
            range.selectNodeContents(tpl);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
            vBtn.textContent = '✗ Clipboard blocked — text selected';
          } catch (_) {
            vBtn.textContent = '✗ Copy failed';
          }
        }
        setTimeout(() => { vBtn.textContent = 'Copy reply'; }, 2500);
      });
    }
    return;
  }

  const rca = r.rca;
  const actions = rca.actionsTaken[state.actionTab] || [];

  // v3 new-shape data + shared helpers (used by interactions and v3 sections)
  const v3d = rca.v3 || {};
  const _zdB = (r.zendeskSubdomain || 'headout');
  const zdLink = ref => {
    const id = String(ref || '').replace(/^ZD-?/i, '').trim();
    if (!id) return '';
    return `<a class="tl-tid" href="https://${_zdB}.zendesk.com/agent/tickets/${id}" target="_blank" rel="noopener" title="open ZD-${id}">ZD-${id}</a>`;
  };

  // Pointer fields arrive as arrays now, but older drafts hold one long
  // string - normalise both to a list so the renderer never prints "[object]"
  // or a wall of prose.

  const points = (v, cls = 'chk-ev') => asPoints(v)
    .map(p => `<div class="${cls}">• ${esc(p)}</div>`).join('');
  // Editable variants. Every fact in the RCA must be correctable in place -
  // the person signing it owns the words, not the model. data-v3p is a dot
  // path into rca.v3; one delegated blur handler persists all of them.
  // An empty field renders its placeholder AS the text, so focusing and
  // blurring it without typing would otherwise save "click to write" as the
  // value. data-ph carries the placeholder so the saver can tell the two
  // apart, and the class greys it so it does not read as content.
  const edPoints = (path, v, cls = 'chk-ev') => asPoints(v)
    .map((p, i) => `<div class="${cls}">• ${edSpan(`${path}.${i}`, p)}</div>`).join('');

  // §11 v4 sends an array of {question, verdict, evidence, source, ref}; a
  // draft written before that holds {question: answer}. Both normalise to the
  // array here so the renderer has one shape - and an old answer that opens
  // with a fact keeps its text as evidence instead of being lost to a pill.
  const _isaRaw = rca.issueSpecificAnswers;
  const _isaRows = Array.isArray(_isaRaw)
    ? _isaRaw.filter(a => a && a.question).map(a => ({
        question: a.question,
        verdict: ['Yes','No','Unknown'].indexOf(a.verdict) >= 0 ? a.verdict : 'Unknown',
        evidence: a.evidence || '', source: a.source || null, ref: a.ref || null}))
    : Object.entries(_isaRaw || {}).map(([q, v]) => {
        const raw = String(v == null ? '' : v);
        const m = raw.match(/^\s*(Yes|No|Unknown)\b[:\s—-]*/i);
        return {question: q,
                verdict: m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : 'Unknown',
                evidence: (m ? raw.slice(m[0].length) : raw).trim(),
                source: null, ref: null};
      });
  const _isaNo = _isaRows.filter(a => a.verdict === 'No').length;
  const _isaCls = v => v === 'Yes' ? 'ok' : v === 'No' ? 'bad' : 'unk';


  // ── Guest ↔ support: facts from Zendesk, interpretation from the model ──
  // The rows are CONTACTS, not events. The Events timeline is the per-event
  // view; one row per frame here would make the contact count report events,
  // and a count nobody trusts is worse than none.
  const _zdKey = v => { const m = String(v == null ? '' : v).match(/\d+/); return m ? m[0] : ''; };
  const _noteFor = key => key
    ? (rca.supportNotes || []).find(n => n && _zdKey(n.zd_ref) === key) || null : null;
  // Frames group by ticket; untracked ones fall back to a 30-minute window,
  // because consecutive messages minutes apart are one exchange however they
  // were logged. The grouping is a judgement, and the pipeline says so in the
  // trail when it fires.
  const _contacts = (frames) => {
    const out = []; let lastAt = null;
    (frames || []).forEach(fr => {
      const key = _zdKey(fr.ticket_id);
      if (key) {
        const hit = out.find(g => g.key === key);
        if (hit) hit.rows.push(fr); else out.push({key, rows: [fr]});
        lastAt = null; return;
      }
      const at = Date.parse(fr.time_sort || '') || null;
      const near = at && lastAt && Math.abs(at - lastAt) <= 30 * 60 * 1000;
      if (near && out.length && !out[out.length - 1].key) out[out.length - 1].rows.push(fr);
      else out.push({key: '', rows: [fr]});
      lastAt = at;
    });
    return out;
  };

  const _groups = _contacts(rca.supportFrames);
  const _used = new Set(_groups.map(g => g.key).filter(Boolean).filter(k => _noteFor(k)));
  // A note whose ticket has no frame still renders, marked. A zd_ref that
  // matched nothing is a failed join; no zd_ref at all is an off-Zendesk
  // contact the model saw. Different facts, so they read differently.
  const _orphans = (rca.supportNotes || []).filter(n => n && !_used.has(_zdKey(n.zd_ref)));
  const _rows = [
    ..._groups.map((g, i) => ({kind: 'frame', g, note: _noteFor(g.key), i})),
    ..._orphans.map((n, k) => ({kind: 'orphan', note: n, i: _groups.length + k})),
  ];

  const _contactRow = (row) => {
    const i = row.i;
    const open = !!state.ixOpen[i];
    const note = row.note || {};
    if (row.kind === 'orphan') {
      // The index into the REAL notes list, not into _orphans. The save path
      // writes to rca_v3.support_interaction_notes[n], so a position in a
      // filtered view sent every orphan's edit to a different note: orphan 0
      // and note 0 are only the same row when nothing was filtered out, and
      // the moment one note matched a frame they diverged. Editing an
      // unmatched contact then silently rewrote a matched one, and both
      // rendered as if nothing had happened.
      const why = _zdKey(note.zd_ref) ? 'unmatched ZD reference' : "guest's account, unverified";
      const oIdx = (rca.supportNotes || []).indexOf(note);
      // No frame means no fact to take a time or channel from, so the model's
      // are all there is. Rendering a dash instead - which is what this row
      // did - showed an off-Zendesk contact the same way it shows a lookup
      // that broke. The row is already badged unverified; the badge covers
      // these two as much as it covers the summary.
      const oCh = String(note.channel || '').trim();
      const oTime = String(note.time || '').trim();
      return `
        <div class="convo-frame ${open ? 'open' : ''}">
          <div class="convo-frame-head" data-ix-toggle="${i}">
            <span class="convo-num">${String(i + 1).padStart(2, '0')}</span>
            ${oCh ? `<span class="convo-type-pill">${esc(oCh)}</span>` : ''}
            <span class="convo-time${oTime ? '' : ' dim'}">${esc(oTime || '—')}</span>
            <span class="interaction-summary-line">${edSpan(`support_interaction_notes.${oIdx}.summary`, note.summary)}</span>
            <span class="convo-unverified" title="no Zendesk frame backs this contact">${esc(why)}</span>
            ${note.zd_ref ? zdLink(note.zd_ref) : ''}
            <span class="convo-chevron">${open ? '▾' : '▸'}</span>
          </div>
          <div class="convo-body">
            ${note.detail ? `<div class="convo-detail">${edSpan(`support_interaction_notes.${oIdx}.detail`, note.detail)}</div>` : ''}
            ${note.ce_miss ? `<div class="convo-gap">⚠ CE miss: ${edSpan(`support_interaction_notes.${oIdx}.ce_miss`, note.ce_miss)}</div>` : ''}
          </div>
        </div>`;
    }
    const rows = row.g.rows, first = rows[0] || {};
    const nIdx = (rca.supportNotes || []).indexOf(row.note);
    // Precedence, not exclusion. The frame's channel and time are verifiable
    // and win; the model's stand in only where the frame has none, which is
    // why the model is asked for them at all. Letting the model's value
    // override a frame is the mistake that struck these fields from the
    // schema in the first place - "chat at 15:41" in the prose beside two
    // nulls - and precedence fixes that without the blank.
    const ch = (first.thread || '').trim() || String((row.note || {}).channel || '').trim();
    const tm = (first.time || '').trim() || String((row.note || {}).time || '').trim();
    const summary = (row.note && row.note.summary) || first.guestSaid || '';
    return `
      <div class="convo-frame ${open ? 'open' : ''}">
        <div class="convo-frame-head" data-ix-toggle="${i}">
          <span class="convo-num">${String(i + 1).padStart(2, '0')}</span>
          ${ch ? `<span class="convo-type-pill">${esc(ch)}</span>` : ''}
          <span class="convo-time${tm ? '' : ' dim'}">${esc(tm || '—')}</span>
          <span class="interaction-summary-line">${nIdx >= 0
            ? edSpan(`support_interaction_notes.${nIdx}.summary`, summary)
            : esc(summary)}</span>
          ${rows.length > 1 ? `<span class="convo-count">${rows.length} events</span>` : ''}
          ${row.g.key ? zdLink(row.g.key) : ''}
          <span class="convo-chevron">${open ? '▾' : '▸'}</span>
        </div>
        <div class="convo-body">
          ${rows.map(fr => `
            <div class="convo-line">
              <span class="convo-ev-time">${esc(fr.time || '—')}</span>
              <span class="convo-ev-body">${esc(fr.guestSaid || '')}${
                fr.weDid ? ` <span class="convo-ev-we">we: ${esc(fr.weDid)}</span>` : ''}</span>
            </div>
            ${fr.gap ? `<div class="convo-gap">⚠ ${esc(fr.gap)}</div>` : ''}`).join('')}
          ${row.note && row.note.detail ? `<div class="convo-detail">${
            edSpan(`support_interaction_notes.${nIdx}.detail`, row.note.detail)}</div>` : ''}
          ${row.note && row.note.ce_miss ? `<div class="convo-gap">⚠ CE miss: ${
            edSpan(`support_interaction_notes.${nIdx}.ce_miss`, row.note.ce_miss)}</div>` : ''}
        </div>
      </div>`;
  };

  // Defect 4: "01 · UNKNOWN · Unknown · No guest contact found" was a
  // nothing-found message dressed as a numbered data row. An absence gets the
  // neutral empty state - no number, no channel pill, no time.
  const sup = _rows.length
    ? `<div class="interactions">${_rows.map(_contactRow).join('')}
        <button class="row-add" data-contact-add>+ Add contact</button></div>`
    : `<div class="interactions">
        <div class="interactions-empty">No guest contact was found on this booking — the guest never reached support.</div>
        <button class="row-add" data-contact-add>+ Add contact</button></div>`;

  // SP interaction — the same facts/interpretation split as guest ↔ support.
  // The records come from the pipeline's sp_interaction_frames; the model's
  // account joins by zd_ref under sp_interaction_notes. Reading the pre-split
  // key left this section rendering nothing at all after the rename, which is
  // exactly the failure mode of a lookup that cannot say it found nothing.
  // Defaulted, never null. The whole SP block used to disappear when the model
  // said nothing about the supply partner — and it took "+ Add SP record" with
  // it, so an operator could not record an SP contact on exactly the drafts
  // where they are most likely to know of one the pipeline missed. A button
  // that does not render is more inert than one that does nothing. Guest ↔
  // support already keeps its "+ Add" beside an empty state (defect 4); this
  // is the same treatment, and it gives the "Raised with SP" select somewhere
  // to live so the answer can be entered by hand.
  //
  // "N/A" here is the default the select already shows for a missing value, so
  // an unanswered section still reads as unanswered rather than as "No".
  const spV3 = v3d.sp_interaction_notes || v3d.sp_interaction || {raised: 'N/A', records: []};
  const spNoteFor = key => key
    ? ((spV3 && spV3.records) || []).find(x => x && _zdKey(x.zd_ref) === key) || null : null;
  const spGroups = _contacts(rca.spFrames);
  const spUsed = new Set(spGroups.map(g => g.key).filter(k => k && spNoteFor(k)));
  const spOrphans = ((spV3 && spV3.records) || [])
    .filter(x => x && !spUsed.has(_zdKey(x.zd_ref)));
  const spLegacyText = spV3 && !((spV3.records || []).length)
    ? (asPoints(spV3.detail).join(' ') || spV3.reason_if_not || '') : '';
  const spRowCount = spGroups.length + spOrphans.length;
  const spInter = spV3
    ? `<div class="interactions">
        <div class="sp-frame">
          <div class="sp-frame-head">
            <span class="convo-num sp">SP</span>
            <span class="convo-label">Raised with SP:</span>

        `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    };
    // §2b one evidence row: 62px source rail | text | ×. The rail is the row
    // marker, so no leading em-dash; a legacy string renders with a "—" rail.
    const evRow = (i, j, e) => {
      const o = (e && typeof e === 'object') ? e : {text: e, source: null, ref: null};
      const src = o.source ? String(o.source) : '';
      // The rail says WHICH system; the ref says which row in it, and without
      // the second the reader has been told where to look and not what to
      // open. A ZD-xxxxx is not a URL - it went into href= verbatim and
      // produced a relative link to a page that does not exist, so a ticket
      // reference the model DID supply looked exactly like one it had not.
      const ref = o.ref ? String(o.ref).trim() : '';
      const isZd  = /^ZD-?\d+$/i.test(ref);
      const isUrl = /^https?:\/\//i.test(ref);
      const rail = src
        ? (isUrl
             ? `<a href="${esc(ref)}" target="_blank" rel="noopener" title="${esc(ref)}">${esc(src)}</a>`
             : esc(src))
        : '—';
      // Non-URL refs - a ticket id, a booking id, the insights window - are
      // shown as text beside the row rather than dropped. They are the answer
      // to "where is this from", which is the question the source rail alone
      // kept prompting.
      const refTag = !ref ? ''
        : isZd  ? ` <span class="ev-ref">${zdLink(ref)}</span>`
        : isUrl ? ''
        : ` <span class="ev-ref" title="where this came from">${esc(ref)}</span>`;
      return `<div class="ev-row">
        <span class="ev-src${src ? '' : ' none'}" title="${esc(src || 'no source recorded')}">${rail}</span>
        <span class="ev-text">${edSpan(`what_went_wrong.guest_issues.${i}.evidence.${j}.text`, o.text || '', 'click to write the finding')}${refTag}</span>
        <button class="x-del" data-ev-del="${i}:${j}" title="remove this evidence row">×</button>
      </div>`;
    };
    // §2 the four optional analysis lines. Present ones render as an editable
    // key-value row with a ×; absent ones become a "+" button in the wrap row.
    const ALINES = [
      ['operational_failure', 'Operational failure', 'what a person or system did wrong'],
      ['sop_gap',             'SOP / process gap',   'the missing or deficient process step'],
      ['pattern',             'Pattern',             'recurrence evidence, with counts and window'],
      ['fix',                 'Fix',                 'Team: action (owner: Team)'],
    ];

    const causesList = wh.root_causes || [];
    const gIssues = w.guest_issues || [];
    const legacyPaired = gIssues.some(g => !g.root_cause && !g.owner);
    const rowCount = Math.max(gIssues.length, legacyPaired ? causesList.length : 0);
    const wwrRows = Array.from({length: rowCount}, (_, i) => {
      const gi = gIssues[i] || {};
      const rcLegacy = causesList[i] || {};
      const open = state.wwrOpen[i] !== false;
      const title = gi.issue || rcLegacy.issue || 'Untitled issue';
      const evidence = Array.isArray(gi.evidence) ? gi.evidence : asPoints(gi.evidence);
      const hasOwnCause = !!gi.root_cause;
      const causeText  = hasOwnCause ? gi.root_cause : (rcLegacy.cause || '');
      const causePath  = hasOwnCause
        ? `what_went_wrong.guest_issues.${i}.root_cause`
        : `what_went_wrong.what_happened.root_causes.${i}.cause`;
      const owner = gi.owner || rcLegacy.classification || '';
      const claim = gi.claim;
      const acc   = accCanon(gi.claim_accuracy);
      // The legacy tail parser is a net, not a path: claim_accuracy_note is a
      // real field now, and it is what renders when present.
      const rawAcc = gi.claim_accuracy_raw || gi.claim_accuracy || '';
      const tail = gi.claim_accuracy_note ||
        (String(rawAcc).match(/^[^—:-]+[—:-]\s*(.+)$/) || [])[1] || '';
      const bp = `what_went_wrong.guest_issues.${i}`;
      const present = ALINES.filter(([k]) => String(gi[k] || '').trim());
      const absent  = ALINES.filter(([k]) => !String(gi[k] || '').trim());
      return `
      <div class="wwr-issue">
        <div class="wwr-issue-head">
          <span class="wwr-n" data-wwr-toggle="${i}">${String(i + 1).padStart(2, '0')}</span>
          <span class="wwr-issue-title">${edSpan(`${bp}.issue`, title, 'click to name the issue')}</span>
          ${chipSel(`${bp}.claim_accuracy`, acc, ACC, accCls(acc), 'chip-acc-sel', rawAcc)}
          <span class="wwr-issue-chev" data-wwr-toggle="${i}">${open ? '▾' : '▸'}</span>
        </div>
        ${open ? `
        <div class="wwr-issue-body">
          <div class="wwr-blk">
            <span class="wwr-blk-label">Claim</span>
            ${claim && String(claim).trim() ? `
              <div class="wwr-claim-row">
                <span class="wwr-claim wwr-claim-q">“${edSpan(`${bp}.claim`, claim)}”</span>
                <button class="x-del" data-claim-del="${i}" title="remove the claim">×</button>
              </div>`
            /* An absent claim is not a blank quote with quote marks around
               nothing - that reads as a guest who said "". It is either the
               review not stating it in their words, or our own finding filed
               as a complaint, and the empty state says which. */
            : `<div class="rca-empty">The review does not state this in the guest's own words.</div>
               <button class="row-add wwr-add" data-claim-add="${i}">+ Claim</button>`}
          </div>
          <div class="wwr-blk">
            <span class="wwr-blk-label">Evidence
              <button class="row-add wwr-add" data-wwr-ev-add="${i}">+ add</button></span>
            ${evidence.length ? evidence.map((e, j) => evRow(i, j, e)).join('')
              : '<div class="rca-empty">No evidence recorded.</div>'}
          </div>
          <div class="wwr-blk">
            <span class="wwr-blk-label">Analysis — what actually happened?</span>
            <div class="wwr-analysis">
              <div class="wwr-analysis-head">
                ${chipSel(`${bp}.claim_accuracy`, acc, ACC, accCls(acc), 'chip-acc-sel', rawAcc)}
                ${chipSel(`${bp}.owner`, owner, OWNS, 'unk', 'chip-owner-sel', owner || 'unassigned')}
              </div>
              ${tail ? `<div class="wwr-analysis-note">${esc(tail)}</div>` : ''}
              <div class="wwr-aline">
                <span class="wwr-aline-key">Root cause:</span>
                <span class="wwr-aline-val">${
                  causeText ? edSpan(causePath, causeText)
                            : edSpan(`${bp}.root_cause`, '', 'click to write the failing step')}</span>
                <!-- no ×: an issue with no root cause is not an RCA -->
              </div>
              ${present.map(([k, label]) => `
              <div class="wwr-aline">
                <span class="wwr-aline-key">${esc(label)}:</span>
                <span class="wwr-aline-val">${edSpan(`${bp}.${k}`, gi[k])}</span>
                <button class="x-del" data-aline-del="${i}:${k}" title="remove this line">×</button>
              </div>`).join('')}
              ${absent.length ? `<div class="wwr-addrow">${absent.map(([k, label]) =>
                `<button class="row-add wwr-add" data-aline-add="${i}:${k}">+ ${esc(label)}</button>`
              ).join('')}</div>` : ''}
            </div>
          </div>
        </div>` : ''}
      </div>`;
    }).join('') + `
      <button class="wwr-addissue" data-wwr-issue-add>
        <span class="wwr-addissue-circle">+</span><span>Add issue</span>
      </button>`;

    // A systemic cause that belongs to no single issue keeps its own row.
    const orphanCauses = legacyPaired ? [] : causesList;
    const orphanHtml = orphanCauses.length ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">Cross-cutting root causes</span>
        ${orphanCauses.map((rc, i) => `
          <div class="chk-row">
            <span class="chk-mark">→</span>
            <div class="chk-item">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.issue`, rc.issue)}
              <div class="chk-ev">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.cause`, rc.cause)}</div>
            </div>
          </div>`).join('')}
      </div>` : '';

    // §2 removes the card-level Operational failure / SOP gap / Pattern /
    // Fixes blocks - those fields live on the issue they explain now. A draft
    // written before that still holds them at card level, and dropping them
    // would delete analysis someone wrote. They render as extra rows under the
    // LAST issue, at their own v3 paths so an edit still saves where the value
    // actually lives, and labelled so nobody reads them as issue-scoped.
    const _legacyRows = [
      ['what_went_wrong.what_happened.operational_failure', 'Operational failure', wh.operational_failure],
      ['what_went_wrong.what_happened.sop_gap',             'SOP / process gap',   wh.sop_gap],
      ['what_went_wrong.what_happened.pattern',             'Pattern',             wh.pattern],
      ['what_went_wrong.fixes.actions',                     'Fix',                 fx.actions],
    ].filter(([, , v]) => asPoints(v).length);
    const _spLegacy = asPoints(spx.detail).length || spx.escalated;
    const legacyExtras = (_legacyRows.length || _spLegacy) ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">From an earlier draft — not yet attached to an issue</span>
        ${_legacyRows.map(([path, label, v]) => asPoints(v).map((pt, n) => `
          <div class="wwr-aline">
            <span class="wwr-aline-key">${esc(label)}:</span>
            <span class="wwr-aline-val">${edSpan(
              Array.isArray(v) || asPoints(v).length > 1 ? `${path}.${n}` : path, pt)}</span>
          </div>`).join('')).join('')}
        ${_spLegacy ? `
          <div class="wwr-aline">
            <span class="wwr-aline-key">SP escalation:</span>
            <span class="wwr-aline-val">${edSpan('what_went_wrong.sp_escalation.escalated', spx.escalated || '—')}</span>
          </div>
          ${asPoints(spx.detail).map((d, n) => `
          <div class="wwr-aline">
            <span class="wwr-aline-key"></span>
            <span class="wwr-aline-val">${edSpan(`what_went_wrong.sp_escalation.detail.${n}`, d)}</span>
          </div>`).join('')}` : ''}
      </div>` : '';

    const wwrOpenAll = rowCount > 0 && Array.from({length: rowCount}, (_, i) => state.wwrOpen[i] !== false).every(Boolean);
    const wwrHtml = v3d.what_went_wrong ? `
    <div class="section" id="rca-wwr5-section">
      <div class="section-label">
        <span>What went wrong</span>
        <span class="hint">${rowCount} issue${rowCount === 1 ? '' : 's'} · ${
          (legacyPaired ? causesList.length
                        : gIssues.filter(g => g.root_cause).length + causesList.length)
        } root cause${((legacyPaired ? causesList.length : gIssues.filter(g => g.root_cause).length + causesList.length)) === 1 ? '' : 's'}</span>
        <button class="btn" style="margin-left:auto;font-size:11px;padding:2px 9px" data-wwr-all>${wwrOpenAll ? 'Collapse all' : 'Expand all'}</button>
        <span class="section-chev">▾</span>
      </div>
      ${wwrRows || '<div class="rca-empty">No guest issues were identified — re-run the RCA if the review names one.</div>'}
      ${orphanHtml}
      ${legacyExtras}
    </div>` : '';

    // Numbered stepper, same shape as the WWR chain - a reader follows the
    // case down the left rail. Strings from older drafts still render: the
    // leading "1." is stripped so the badge does not repeat it.
    // "Unknown" is the model's way of saying it could not date an event. It
    // is not a timestamp, so it should not be printed as one - an em-dash
    // says the same thing without looking like data.
    const flags = v3d.flags || [];
    // Grouped by owning team with counts, because a flat list of a dozen
    // flags on a complex case gives a reader no idea who has to act. Each
    // group collapses; each row is editable and removable, since a flag the
    // AI got wrong must be correctable by the person signing the RCA.
    const flagGroups = {};
    flags.forEach((f, i) => {
      const t = String(f.team || 'other').toUpperCase();
      (flagGroups[t] = flagGroups[t] || []).push({...f, _i: i});
    });
    const flagOrder = ['CE','RO','SP','CONTENT','TECH','OTHER'];
    const flagSecs = Object.keys(flagGroups).sort((a, b) => {
      const ia = flagOrder.indexOf(a), ib = flagOrder.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const flagsHtml = `
    <div class="section" id="rca-flags-section">
      <div class="section-label">Flags
        ${flags.length ? `<span class="sec-count">${flagSecs.map(t => flagGroups[t].length + ' ' + t).join(' · ')}</span>` : ''}
      <span class="section-chev">▾</span></div>
      ${flags.length === 0
        ? `<div class="field-block rca-empty affirm">✓ Every QA area was checked and none needed raising.</div>`
        : `<div class="chk-groups">${flagSecs.map(t => `
            <div class="chk-group has-flags open" data-chk-section="${t}">
              <div class="chk-group-head" data-chk-group-toggle>
                <span class="chk-chevron">▸</span>
                <span>${t}</span>
                <span class="chk-gtag">${flagGroups[t].length} flag${flagGroups[t].length === 1 ? '' : 's'}</span>
              </div>
              <div class="chk-group-body">
                ${flagGroups[t].map(f => `
                  <div class="chk-row chk-flag">
                    <span class="chk-mark">⚠</span>
                    <div class="chk-item">
                      <!-- §8 the team is a closed list, so an invented value
                           cannot become a stray option on the control. -->
                      <select class="chip-sel chip-team-sel part"
                              data-v3sel="flags.${f._i}.team"
                              title="${esc(f.team_raw || f.team || 'OTHER')}">
                        ${['CE','RO','SP','CONTENT','PRODUCT','BIZ','TECH','OTHER'].map(o =>
                          `<option${String(f.team || 'OTHER').toUpperCase() === o ? ' selected' : ''}>${o}</option>`).join('')}
                      </select>
                      <span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag text"
                            data-flag-idx="${f._i}" data-flag-field="flag">${esc(f.flag)}</span>
                      <div class="chk-ev"><span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag evidence"
                            data-flag-idx="${f._i}" data-flag-field="evidence">${esc(f.evidence) || 'No evidence — click to add.'}</span>${f.zd_ref ? ' · ' + zdLink(f.zd_ref) : ''}</div>
                    </div>
                    <button class="row-del" data-flag-del="${f._i}" title="Remove flag">×</button>
                  </div>`).join('')}
              </div>
            </div>`).join('')}</div>`}
      <button class="row-add" data-flag-add>+ Add flag</button>
    </div>`;

    _flagsHtml = flagsHtml;
    return eventsTimelineHtml(r) + wwrHtml;
  })() : '';

  // ── v3 sections (legacy shape) ─────────────────────────────────────────
  const v3Block = newShapeBlock ? newShapeBlock : (rca.wwrScenarios || []).length ? `
    <div class="section" id="rca-wwr-section">
      <div class="section-label">What Went Wrong<span class="section-chev">▾</span></div>
      ${(rca.wwrScenarios || []).length ? `
      <div class="wwr-scenarios">
        ${rca.wwrScenarios.map((sc, i) => `
          <div class="wwr-scn ${sc.is_primary ? 'primary' : ''}" data-scn-idx="${i}">
            <div class="wwr-scn-head">
              <span class="wwr-scn-tag">${sc.is_primary ? 'PRIMARY' : 'overlay'}</span>
              <span class="wwr-scn-name">${sc.scenario_name || ''}</span>
            </div>
            <div class="wwr-scn-row">
              <span class="wwr-scn-k">Accurate?</span>
              <select class="classify-select" style="width:110px" data-scn-idx="${i}" data-scn-field="accuracy">
                ${['Yes','Partially','No'].map(o => `<option${(sc.accuracy||'')===o?' selected':''}>${o}</option>`).join('')}
              </select>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="accuracy_explanation">${sc.accuracy_explanation || ''}</span>
            </div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Why</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="why">${sc.why || ''}</span></div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Fix</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="fix">${sc.fix || ''}</span></div>
          </div>
        `).join('')}
      </div>` : `
      <div class="wwr-stepper">
        ${/* Legacy chain. Suppressed when v3 booking_logs exist: both render as
             the same numbered stepper, so a part-migrated draft showed two
             "what happened" narratives back to back. */
          ((v3d.booking_logs || []).length ? [] : (rca.wwrChain || [])).map((step, i) => `
          <div class="wwr-step" data-step="${i}">
            <div class="wwr-step-num">${step.step || (i + 1)}</div>
            <div class="wwr-step-body">
              <div class="wwr-what editable-text" contenteditable="true" spellcheck="false"
                   data-wwr-idx="${i}" data-wwr-field="what"><strong>${step.what || ''}</strong></div>
              <div class="wwr-why editable-text" contenteditable="true" spellcheck="false"
                   style="color:var(--muted-2)"
                   data-wwr-idx="${i}" data-wwr-field="why">${step.why || ''}</div>
            </div>
            <button class="action-delete-btn" data-wwr-delete="${i}" title="Remove step">×</button>
          </div>
        `).join('<div class="wwr-connector"></div>')}
      </div>
      <button class="action-add-btn" data-wwr-add>+ Add step</button>`}
    </div>



    <!-- The legacy checklist wall is gone. Its answers were "No" for "was
         there a tone problem?", i.e. No = no error, so rendering every No as
         a flag produced flags that contradicted their own evidence. Flags now
         come only from rca_v3.flags, which returns failures only. -->
  ` : '';

  col.innerHTML = `
    <!-- §14 one baseline-aligned row, not a two-line stack: the label and the
         sub-line cost ~34px at the top of every review. The dropped clause is
         not lost - it moves into the row's title, and the Send button's own
         card already says "goes out via Trustpilot on Send ↑". -->
    <div class="rca-head" title="Send marks the review as sent — paste the reply into Trustpilot manually">
      <div class="rca-title-row">
        <div class="rca-title">RCA &amp; response</div>
        <div class="rca-sub">Drafted by AI ${r.time || ''} · every field editable</div>
      </div>
      <div class="rca-head-actions">
        <button class="refresh-slack-btn" data-rca-only-regen
                title="One model call over the stored booking/timeline/insights — no re-matching, no BigQuery, no Zendesk.">↻ RCA only</button>
        <button class="btn copy-response-btn">Copy response</button>
        <button class="send-btn">Send ↑</button>
      </div>
    </div>

    <div class="rca-stack-outer">
    <div class="section">
      <div class="section-label"><span>Guest's stated issue</span><span class="section-chev">▾</span></div>
      <div class="stated-issue">
        <div class="stated-issue-text editable-text" contenteditable="true" spellcheck="false">${r.statedIssue || ''}</div>
        ${(r.statedIssue || '').trim() ? '' : `<div class="rca-empty">${
          // "Nothing was extracted" is a claim about the review, and it was
          // made for a call that threw just as readily as for a review with
          // nothing in it. When the RCA below is full, the claim is provably
          // false: the model had plenty to say about the same text.
          ((v3d.what_went_wrong && (v3d.what_went_wrong.guest_issues || []).length) || 0)
            ? `This step returned nothing, but the RCA below found ${(v3d.what_went_wrong.guest_issues || []).length} issue${(v3d.what_went_wrong.guest_issues || []).length === 1 ? '' : 's'} in the same review — so it is the step that failed, not a review with nothing to state. See the confidence trail. Click above to write it in one line.`
            : `Nothing was extracted — see the confidence trail for whether the step ran. Click above to write the guest's issue in one line.`
        }</div>`}
      </div>
    </div>

    ${v3Block}
    ${isaBlock}

    <div class="section">
      <!-- The count reads the list the rows are actually built from. It used
           to read v3d.support_interaction — a different list, populated on a
           different path — so the heading said "0 contacts" above eight
           rendered contacts. A count that cannot be checked against what is
           under it is worse than no count. -->
      <div class="section-label"><span>Guest ↔ support</span><span class="hint">${_rows.length} contact${_rows.length === 1 ? '' : 's'}</span><span class="section-chev">▾</span></div>
      ${sup}
    </div>

    ${true ? `
    <div class="section">
      <div class="section-label"><span>SP interaction</span><span class="hint">with the supply partner</span><span class="section-chev">▾</span></div>
      ${spInter || `<div class="interactions"><div class="interactions-empty">${spV3 && spV3.possible === false
            ? 'No SP interaction — escalation was not possible (' + esc(spV3.reason_if_not || 'vendor not partnered or opted out') + ').'
            : 'No SP interaction recorded. If escalation was possible, that is itself a gap worth flagging.'}</div></div>`}
    </div>
    ` : ''}

    ${_flagsHtml}

    <div class="section">
      <div class="section-label"><span>Area of improvement</span><span class="section-chev">▾</span></div>
      <!-- One pointer per line, editable in place. A single textarea invited

      <div class="field-block rca-points">
        ${asPoints(rca.areaOfImproving).length
          ? asPoints(rca.areaOfImproving).map((a, i) => `
            <div class="rca-point">
              <span class="rca-bullet">•</span>
              <span class="editable-text rca-ptext" contenteditable="true" spellcheck="false"

          : `<div class="rca-empty">Nothing recorded yet — add a point, or re-run the RCA.</div>`}
        <button class="row-add" data-aoi-add>+ Add point</button>
      </div>
