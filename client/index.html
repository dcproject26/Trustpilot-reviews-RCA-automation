  // Outside the try: the scenario was saved either way, so the routing
  // verdict and the insights panel are stale either way.
  await refreshAfterScenarioChange(r.id);
  renderReviewCol(); renderRcaCol();
  if (failed) {
    const after = document.querySelector('[data-scenario-regen-status]');
    if (after) after.textContent = failed;
  }
}

// The chip controls, delegated. See regenerateForScenarios above for why.
const _CHIP_KEYS = {
  'data-scenario-add': 'scenarios', 'data-scenario-remove': 'scenarios',
  'data-overlay-add': 'overlayScenarios', 'data-overlay-remove': 'overlayScenarios',
};
document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest(
    '[data-scenario-add], [data-overlay-add]');
  if (!sel || !sel.value) return;
  const attr = sel.hasAttribute('data-scenario-add')
    ? 'data-scenario-add' : 'data-overlay-add';
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const key = _CHIP_KEYS[attr];
  r.rca[key] = [...(r.rca[key] || []), sel.value];
  await regenerateForScenarios(r.id);
});
document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest(
    '[data-scenario-remove], [data-overlay-remove]');
  if (!btn) return;
  const attr = btn.hasAttribute('data-scenario-remove')
    ? 'data-scenario-remove' : 'data-overlay-remove';
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const key = _CHIP_KEYS[attr];
  const idx = parseInt(btn.getAttribute(attr));
  if (Number.isNaN(idx)) return;
  r.rca[key] = (r.rca[key] || []).filter((_, i) => i !== idx);
  await regenerateForScenarios(r.id);
});

// Sub-themes, delegated for the same reason. They do NOT re-run the RCA:
// the sub-theme does not change the checklists, so it saves and redraws.
async function saveSubThemes(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r || !r.rca) return;
  r.rca.subTheme = (r.rca.subThemes || [])[0] || null;
  await saveDraft(r.id, {sub_themes: r.rca.subThemes || [],
                         scenarios: r.rca.scenarios || [],
                         overlay_scenarios: r.rca.overlayScenarios || []});
  renderReviewCol(); renderRcaCol();
}
document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest('[data-subtheme-add]');
  if (!sel || !sel.value) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  r.rca.subThemes = [...(r.rca.subThemes || []), sel.value];
  await saveSubThemes(r.id);
});
document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest('[data-subtheme-remove]');
  if (!btn) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const idx = parseInt(btn.getAttribute('data-subtheme-remove'));
  if (Number.isNaN(idx)) return;
  r.rca.subThemes = (r.rca.subThemes || []).filter((_, i) => i !== idx);
  await saveSubThemes(r.id);
});

async function refreshAfterScenarioChange(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r) return;
  try {
    const [draftResp, insResp] = await Promise.all([
      fetch(`/api/reviews/${reviewId}`),
      fetch(`/api/reviews/${reviewId}/insights?window=`
            + encodeURIComponent(state.insightsWindow)),
    ]);
    if (draftResp.ok) {
      const d = (await draftResp.json()).draft;
      if (d) {
        r.rca.scenarioRouting  = d.scenario_routing || null;
        r.rca.primaryScenario  = d.primary_scenario || '';
        r.rca.scenarios        = d.scenarios || [];
        r.rca.overlayScenarios = d.overlay_scenarios || [];
      }
    }
    if (insResp.ok) {
      const ins = unwrapInsights(await insResp.json());
      if (ins) r.liveInsights = ins;
    }
  } catch (e) {
    // Leave what is on screen and say so, rather than blanking the panel:
    // a refresh that failed is not the same as figures that are empty.
    state.insightsError = 'The scenario was saved, but the panel could not be '
      + 'refreshed — the figures below may be for the previous scenario.';
  }
}

async function loadDraftOverlays() {
  await Promise.all(REVIEWS.map(async (r) => {
    if (!r.rca) return;
    try {
      const [draftResp, insightsResp] = await Promise.all([
        fetch(`/api/reviews/${r.id}`),
        // Send the window the picker is displaying. Without it the server
        // applied its own default (30d) while the picker highlighted 90d, so
        // every first load showed one window's numbers under another window's
        // button - and clicking around masked it, because clicking does send
        // the window.
        fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(state.insightsWindow)}`),
      ]);
      if (!draftResp.ok) return;
      const payload = await draftResp.json();
      const draft   = payload.draft;
      const review  = payload.review;

      // ── Full review text ──────────────────────────────────────────────────
      // BEFORE the no-draft bail-out. The inbox list carries a 120-character
      // snippet, and this is what replaces it with the real body; behind the
      // guard, any review without a draft row (every untraceable one, if the
      // pipeline never saved) was left showing a sentence cut mid-word.
      if (review) {
        r.original     = review.body_original || r.original     || '';
        r.originalText = review.body_original || r.originalText || '';
        r.english      = review.body_english  || r.english      || null;
        r.englishText  = review.body_english  || r.englishText  || '';
      }
      if (!draft) return;

      // ── RCA core fields ───────────────────────────────────────────────────
      r.rca.issueL1   = draft.l1        || r.rca.issueL1  || '';
      r.rca.issueL2   = draft.l2        || r.rca.issueL2  || '';
      r.rca.subTheme  = draft.sub_theme || r.rca.subTheme || null;
      r.rca.subThemes = draft.sub_themes || (draft.sub_theme ? [draft.sub_theme] : []);
      r.rca.scenarios = draft.scenarios ||
        [draft.primary_scenario, ...(draft.overlay_scenarios || [])].filter(Boolean);
      r.rca.v3        = draft.rca_v3    || {};
      r.insightsRaw   = draft.insights  || {};
      r.untraceableReason  = (draft.extracted_signals || {}).untraceable_reason || '';
      r.extractedSignals   = draft.extracted_signals || {};
      r.narrowingAttempts  = draft.narrowing_attempts || [];
      r.rca.wwrChain  = draft.wwr_chain || [];
      r.rca.prevention= draft.prevention|| '';
      r.rca.evidence  = draft.evidence  || [];
      r.rca.checks    = draft.diagnostic_checks || [];

      r.rca.whatWentWrong = Array.isArray(draft.what_went_wrong_bullets)
        ? draft.what_went_wrong_bullets.join('\n')
        : (draft.what_went_wrong_bullets || r.rca.whatWentWrong || '');

      r.rca.areaOfImproving = Array.isArray(draft.area_of_improving)
        ? draft.area_of_improving.join('\n')
        : (draft.area_of_improving || r.rca.areaOfImproving || '');

      r.rca.resolution = draft.resolution || r.rca.resolution || '';
      r.rca.reply      = draft.final_response || draft.suggested_response || r.rca.reply || '';
      r.rca.primaryScenario  = draft.primary_scenario || r.rca.primaryScenario || '';
      r.rca.overlayScenarios = draft.overlay_scenarios || [];
      // Where the primary came from and how it stands against routing NOW.
      // Computed server-side so the card, the regenerate endpoint and the
      // trail cannot each reach a different answer.
      r.rca.scenarioRouting  = draft.scenario_routing || null;
      r.rca.wwrScenarios     = draft.wwr_scenarios    || [];

      // actions_taken: API returns {sp: [strings], ce: [strings], …}
      // render expects [{context, with, handle, time, where}]
      if (draft.actions_taken) {
        const toItems = arr => (arr || []).map(s => (typeof s === 'string'
          ? { context: s, with: '', handle: '', time: '', where: '#' }
          : { context: s.context || '', with: s.with || '', handle: s.handle || '',
              time: s.time || '', where: s.where || '#' }));
        r.rca.actionsTaken = {
          sp:       toItems(draft.actions_taken.sp),
          customer: toItems(draft.actions_taken.customer),
          business: toItems(draft.actions_taken.business),
          ce:       toItems(draft.actions_taken.ce),
          product:  toItems(draft.actions_taken.product),
        };
      }

      r.rca.issueSpecificAnswers = draft.issue_specific_answers || {};
      r.rca.checklistAnswers     = draft.checklist_answers      || [];
      r.rca.slackThreadOverride  = draft.slack_thread_override  || '';
      r.rca.supportInteraction   = (draft.support_interaction_frames || []).map(mapSupportFrame);
      // Facts and interpretation arrive separately and are merged at render:
      // the frames are Zendesk-derived rows, the notes are the model's account
      // joined by zd_ref. Keeping the raw frames because grouping needs
      // ticket_id and time_sort, which mapSupportFrame drops.
      r.rca.supportFrames        = draft.support_interaction_frames || [];
      r.rca.supportNotes         = draft.support_interaction_notes  || [];
      r.rca.spFrames             = draft.sp_interaction_frames      || [];
      r.rca.spNotes              = draft.sp_interaction_notes       || {};
      r.rca.supportSummary       = draft.support_summary        || '';
      r.rca.spInteraction        = (draft.sp_interaction_frames || []).map(f => ({
        time: f.time || '', label: f.label || '', summary: f.summary || f.weDid || '',
      }));

      // ── Candidate list (T2) ──────────────────────────────────────────────
      if (Array.isArray(draft.candidates_list) && draft.candidates_list.length) {
        r.candidatesList = draft.candidates_list.map(c => ({
          bid:            c.id || c.bid,
          score:          c.score != null ? c.score : null,
          scoreVenue:     c.score_venue != null ? c.score_venue : null,
          scoreDate:      c.score_date  != null ? c.score_date  : null,
          venueSignal:    c.venue_signal === true,
          matchReasons:   c.matchReasons || c.match_reasons || [],
          experience:     c.experience || c.experienceName || '',
          tgid:           c.tgid || '',
          tid:            c.tid || '',
          vendorName:     c.vendorName || c.partner || '',
          experienceDate: c.experienceDate || c.visitDate || '',
          creationDate:   c.creationDate || c.bookedOn || '',
          status:         c.status || '',
          leadTime:       c.leadTime || '',
          // The guest on the booking, and — when the booking was found through
          // a support contact — what that contact was about. Both are what an
          // associate actually picks between two candidates on.
          guestName:      c.primary_guest_name || c.guestName || '',
          contactCount:   c.contact_count || 0,
          contactTags:    c.contact_tags || '',
        }));
      }

      // ── Stated issue ──────────────────────────────────────────────────────
      r.statedIssue = draft.stated_issue || r.statedIssue || '';

      // Which tickets the timeline was built from. An empty events list means
      // something different when tickets matched and yielded nothing than when
      // none matched at all, and the panel could not tell them apart.
      r.zendeskTicketIds = draft.zendesk_ticket_ids || r.zendeskTicketIds || [];

      // ── Timeline → events ─────────────────────────────────────────────────
      if (Array.isArray(draft.timeline) && draft.timeline.length) {
        r.events = draft.timeline.map(t => ({
          time:      t.time    || '',
          // Sortable ISO alongside the display string. Never shown; it is
          // what makes the order checkable rather than assumed.
          time_sort: t.time_sort || '',
          thread:    t.thread  || 'email',
          actor:     t.actor   || '',
          label:     t.label   || '',
          summary:   t.summary || '',
          // Which ticket this came from, so an entry can be opened and
          // verified instead of believed.
          ticket_id: t.ticket_id || '',
          is_internal:     !!t.is_internal,
          internal_reason: t.internal_reason || '',
        }));
      }

      // ── Match title (may be missing on demo stubs) ────────────────────────
      if (!r.matchTitle) {
        const _t = r.matchTier;
        r.matchTitle = _t === 1 ? 'Direct match'
          : _t === 2 ? 'Possible matches — associate to confirm'
          : 'Untraceable';
      }

      // ── Confidence trail + extracted signals ──────────────────────────────
      // Both were read by the renderer but never populated here, so the
      // "How we built this match" box never appeared.
      r.confidenceTrail   = (draft.confidence_trail && draft.confidence_trail.length)
                            ? draft.confidence_trail : null;
      r.extractedSignals  = draft.extracted_signals || {};
      r.slackMentions     = draft.slack_mentions || [];

      // Actions that already went OUT. The server has recorded all three and
      // has been sending them all along; nothing read them, so after a reload
      // every button offered to do it again — and both of these post into a
      // Slack channel people are reading.
      r.rcaPostedAt   = draft.rca_posted_at || null;
      r.flagToBizState = draft.flag_to_biz_state || '';
      r.sentAt        = draft.sent_at || null;

      // ── Match method from confidence trail ────────────────────────────────
      r.matchMethod = draft.match_method
        || (draft.confidence_trail && draft.confidence_trail.length
            ? draft.confidence_trail.map(c => c.text.replace(/<[^>]+>/g, '')).join(' · ')
            : r.matchMethod || '—');

      // ── Wire booking fields from draft.booking ────────────────────────────
      if (draft.booking) {
        const db = draft.booking;
        r.booking = r.booking || {};
        // Fresh draft data ALWAYS wins over whatever is on screen — a re-run
        // can change the matched booking entirely; stale values must not stick.
        r.booking.bid              = db.id                                || r.booking.bid;
        r.booking.experience       = db.experienceName || db.experience_name || r.booking.experience;
        r.booking.tgid             = db.tgid                              || r.booking.tgid;
        r.booking.tid              = db.tid                               || r.booking.tid;
        r.booking.vid              = db.vid || db.vendor_id               || r.booking.vid;
        r.booking.vendorName       = db.vendorName || db.vendor_name      || r.booking.vendorName;
        r.booking.fulfilmentType   = db.fulfilmentType || db.fulfilment_type || r.booking.fulfilmentType;
        r.booking.experienceDate   = db.visitDate || db.date_of_visit     || r.booking.experienceDate;
        r.booking.creationDate     = db.date_of_booking       || r.booking.creationDate || '';
        r.booking.bookingDate      = db.date_of_booking       || r.booking.bookingDate;
        r.booking.bmsLink          = db.bms_link;
        r.booking.tgidLink         = db.tgid_link;
        r.booking.ticketMailSeen   = !!db.ticket_mail_seen;
        // Tri-state on purpose: true, false, and "no fulfilment row said".
        // ?? rather than || so a genuine false is not read as absent.
        r.booking.isPartnered      = db.isPartnered ?? db.is_partnered ?? null;
        r.booking.escalationEmail  = db.escalationEmail || '';
        r.booking.escalationType   = db.escalationType || '';
        r.booking.contactCount     = db.contactCount ?? null;
        r.booking.contactTypes     = db.contactTypes || '';

        // booking_status and tid_name from BigQuery enrichment
        r.booking.status  = db.booking_status || db.status || r.booking.status || '';
        r.booking.tidName = db.tid_name || db.tour_name || r.booking.tidName || '';

        // Guest name: use plaintext BQ name, then Zendesk requester, then say
        // WHICH source came up empty.
        //
        // The fallback was '[Guest name in Zendesk ticket]' — a sentence
        // dressed as a value. It sat in the value column looking like data,
        // and it made three different situations identical: the warehouse
        // holds a hash, the linked ticket carries no requester, and no ticket
        // was ever matched. The first two are worth opening Zendesk for; the
        // third is not. The server works out which and sends the reason.
        const rawGuest    = db.primary_guest_name || r.booking.primaryGuestName || '';
        const zdRequester = r.booking.zendesk_requester_name || db.zendesk_requester_name || '';
        if (rawGuest && rawGuest !== '[Guest name in Zendesk ticket]'
            && (rawGuest.length <= 20 || /\s/.test(rawGuest))) {
          r.booking.primaryGuestName = rawGuest;
          r.booking.guestNameNote = '';
        } else if (zdRequester) {
          r.booking.primaryGuestName = zdRequester;
          r.booking.guestNameNote = '';
        } else {
          r.booking.primaryGuestName = '';
          r.booking.guestNameNote = db.guest_name_note
            || 'no guest name on the booking or on any linked Zendesk ticket';
        }
      }

      // ── Review date ───────────────────────────────────────────────────────
      if (review && review.received_at) {
        r.booking = r.booking || {};
        r.booking.reviewDate = review.received_at.split('T')[0];
      }

      // ── Lead time: days between booking date and visit date ───────────────
      {
        const bookingStr = (r.booking.bookingDate || r.booking.creationDate || '').split('T')[0];
        const visitStr   = (r.booking.experienceDate || '').split('T')[0];
        if (bookingStr && visitStr) {
          const bookingMs = new Date(bookingStr).getTime();
          const visitMs   = new Date(visitStr).getTime();
          const diffDays  = Math.round((visitMs - bookingMs) / 86400000);
          r.booking.leadTime = diffDays >= 2 ? `${diffDays} days`
                             : diffDays === 1 ? '1 day'
                             : diffDays === 0 ? '0 days'
                             : '—';
        } else {
          r.booking.leadTime = '—';
        }
      }

      // ── Live insights from API ────────────────────────────────────────────
      if (insightsResp.ok) {
        // Accept either shape. The endpoint returns {ok, window, insights};
        // older builds returned the insights dict bare. Unwrapping defensively
        // means a page cached from before a deploy still renders numbers
        // instead of "undefined / undefined", which is what an envelope read
        // one level too shallow looks like on every tile.
        const payload = await insightsResp.json();
        r.liveInsights = unwrapInsights(payload) || r.liveInsights;
      }
    } catch (e) { /* keep demo data for this review if the API is unreachable */ }
  }));
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
  renderReviewCol();
  renderInbox();
}

let REVIEWS = [];   // populated live from /api/reviews — no demo/placeholder rows

const state = {
  // A leftover from the mock data; there is no review with this id, so it
  // simply means "nothing selected" until the inbox is clicked.
  selected: null,
  // Must agree with the tab marked `active` in the markup, which is All.
  // It said 'identified' while the All tab rendered as selected, so the
  // dashboard opened claiming to show everything, with the count saying 3,
  // and listed one review. The two it hid were the ones that need a human:
  // the unconfirmed match and the untraceable one.
  filter: 'all',
  // What is typed in the inbox search box. Empty means no search — which is
  // not the same as a search that matched nothing, and the empty state below
  // says which.
  search: '',
  actionTab: 'sp',
  dssEdit: false,
  rawErrOpen: {},
  insightsWindow: '90d',
  // Why the last window switch did not produce numbers, or ''. A failed switch
  // used to be a console line only, so on screen it was identical to a switch
  // that had worked and returned the same figures.
  insightsError: '',
  // Which RCA sections go into the Slack thread post. All on by default;
  // unticking one drops it from the generated text.
  // Slack post section choices, keyed BY REVIEW ID. A single global map
  // silently carried one review's choices onto the next, so a post could
  // ship without the section the previous analyst had switched off.
  slackSections: {},
  slackPicker: {},
  // Section open/closed state, keyed by section label text.
  collapsed: {},
  replyTranslation: {},   // review id -> guest-language reply
  wwrOpen: {},      // per-issue open state in What went wrong
  ixOpen: {},       // per-contact open state in Guest <-> support
  // Machinery is hidden by default - it was ~8 of 14 events on a real
  // review, and an associate writing an RCA should not be scrolling past
  // Selenium runs to find the two events that matter.
  tlShowInternal: false,
};

// fire once REVIEWS + state exist; fetchInbox merges API rows then loads drafts
(async () => {
  pollBulk(false);          // reattach to a bulk run already in flight
  await fetchInbox();
  await loadSubThemeOptions();
  await loadDraftOverlays();
  renderInbox();
  if (state.selected) renderRcaCol();
})();

// Which tab a review belongs to. One expression, used by the list AND by the
// counts, because those two disagreeing is what made the dashboard claim to
// show everything while listing one review.
function inTab(r, tab) {
  if (tab === 'all') return true;
  if (tab === 'identified') return r.type === 'identified' && r.status !== 'sent';
  if (tab === 'candidates') return r.type === 'candidates';
  if (tab === 'untraceable') return r.type === 'untraceable';
  if (tab === 'processing') return r.type === 'processing';
  if (tab === 'sent') return r.status === 'sent';
  return false;
}

// Does this review match what was typed?
//
// Searched across everything the reader might have to hand — the guest's
// name, the booking id, a ZD ticket number, the review text, the
// classification, the review id. A search that only looked at the author
// would answer "no such review" to somebody holding a ticket number, which is
// the same sentence as "it is not here" and means something completely
// different.
//
// Every term must match SOMETHING (AND across terms, OR across fields), so
// "lewis refund" narrows rather than widens.
function matchesSearch(r, q) {
  const query = String(q || '').trim().toLowerCase();
  if (!query) return true;
  const rca = r.rca || {};
  const hay = [
    r.author, r.id, r.lang, r.status, r.type,
    r.original, r.originalText, r.english,
    (r.booking || {}).id, (r.booking || {}).bid,
    (r.booking || {}).experienceName, (r.booking || {}).vendorName,
    rca.issueL1, rca.issueL2, rca.subTheme,
    ...(r.zendeskTicketIds || []),
    ...(rca.subThemes || []),
    ...(rca.scenarios || []),
  ].filter(v => v != null).join('  ').toLowerCase();
  // ZD-34125496 and 34125496 have to find the same review — the prefix is
  // ours, and half the people searching will paste it and half will not.
  // Stripping it from the TERM is enough in both directions, because a stored
  // "ZD-34125496" contains "34125496" as a substring anyway. Stripping it from
  // the haystack as well was a second line that changed no outcome, which
  // mutation testing proved by deleting it and killing nothing.
  return query.split(/\s+/).every(term =>
    hay.includes(term) || hay.includes(term.replace(/^zd-/, '')));
}

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const q = state.search;
  const hits = REVIEWS.filter(r => matchesSearch(r, q));
  const filtered = hits.filter(r => inTab(r, state.filter));

  // While searching, the tab numbers count MATCHES, not totals — otherwise
  // "Untraceable 12" sits above an empty list and the reader concludes the
  // list is broken. They also answer the question a search actually asks,
  // which is "where is it".
  const TABS = [['all', 'cnt-all'], ['identified', 'cnt-identified'],
                ['candidates', 'cnt-candidates'],
                ['processing', 'cnt-processing'],
                ['untraceable', 'cnt-untraceable'], ['sent', 'cnt-sent']];
  const perTab = {};
  for (const [tab, id] of TABS) {
    perTab[tab] = hits.filter(r => inTab(r, tab)).length;
    document.getElementById(id).textContent = perTab[tab];
    const btn = document.querySelector(`.inbox-tab[data-tab="${tab}"]`);
    if (btn) btn.classList.toggle('has-hits', !!q && perTab[tab] > 0
                                                && tab !== state.filter);
  }
  const clearBtn = document.getElementById('inbox-search-clear');
  if (clearBtn) clearBtn.hidden = !q;

  if (filtered.length === 0) {
    // Three different nothings, and they were all one sentence. "No reviews
    // in this tab" told somebody searching for a guest that the guest does
    // not exist, when the review was one tab across.
    if (!q) {
      list.innerHTML = `<div class="empty-state">No reviews in this tab.</div>`;
    } else if (perTab.all === 0) {
      list.innerHTML = `<div class="empty-state">Nothing matches
        “${esc(q)}” in any tab — searched name, booking id, ticket number,
        review text and classification across all ${REVIEWS.length}
        review(s).</div>`;
    } else {
      const others = TABS.filter(([t]) => t !== state.filter && t !== 'all'
                                          && perTab[t] > 0);
      list.innerHTML = `<div class="empty-state">No match for “${esc(q)}”
        in this tab.</div>
        <div class="inbox-elsewhere">${perTab.all} elsewhere:
        ${others.map(([t]) =>
          `<button data-goto-tab="${t}">${_tabLabel(t)} (${perTab[t]})</button>`
        ).join('')}</div>`;
    }
    return;
  }

  // One stage chip per card, coloured by what it asks of the reader:
  // green = nothing to do, amber = a human must confirm, red = stuck.
  // Coloured by what the row asks of the reader: green = nothing to do,
  // amber = a human must act, red = stuck. A review still being processed
  // asks for nothing but patience, so it must not be red — it was, because it
  // was being filed as Untraceable.
  const stageOf = (r) => r.status === 'sent'          ? ['Sent', 'ok']
                       : r.type === 'candidates'      ? ['Confirm match', 'warn']
                       : r.type === 'processing'      ?
                           (r.processingState === 'stalled'
                              ? ['Run stopped', 'bad'] : ['Processing', ''])
                       : r.type === 'untraceable'     ? ['Untraceable', 'bad']
                       :                                ['Draft ready', 'ok'];
  list.innerHTML = filtered.map(r => {
    const [stage, kind] = stageOf(r);
    const body = r.english || r.original || '';
    return `
    <div class="review-item ${r.id === state.selected ? 'active' : ''}" data-id="${r.id}">
      <div class="review-item-top">
        <span class="review-author">${esc(r.author)}</span>
        <span class="review-time">${esc(r.time)}</span>
      </div>
      <div class="review-stars-line">
        <span class="review-stars">${r.stars}</span>
        <span class="review-exp">${esc(r.booking?.experience || '—')}</span>
      </div>
      <div class="review-preview">${esc(body.substring(0, 120))}${body.length > 120 ? '…' : ''}</div>
      <div class="review-tags">
        <span class="tag stage-${kind}">${stage}</span>
        <span class="tag tag-lang">${esc(r.lang || '')}</span>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.review-item').forEach(el => {
    el.addEventListener('click', () => {
      state.selected = el.dataset.id;
      renderInbox();
      renderReviewCol();
      renderRcaCol();
    });
  });
}

// The translation belongs on every card, not just the matched ones: the
// reply goes out in the guest's language, so whoever writes it needs the
// English beside the original whatever tier the review sits in. Absent
// English on a foreign review is itself worth saying - it means the
// translation step never ran, not that the review needs none.
function translationCard(r) {
  const foreign = (r.lang || '').toUpperCase() !== 'EN';
  if (r.english) {
    return `<div class="translation-card">
      <div class="translation-label">English translation · AI</div>
      <div class="translation-body">${esc(r.english)}</div>
    </div>`;
  }
  if (!foreign) return '';
  return `<div class="translation-card">
    <div class="translation-label">English translation · AI</div>
    <div class="rca-empty">Not translated yet — re-run this review to generate it.</div>
  </div>`;
}

// §13 the booking timeline lives in the FACTS column now: it is
// system-of-record data (created / fulfilment / sent / refunded), which is
// what that column is for. No treatment change - same 88px mono grid,
// same editable rows, same + Add event. Top-level because the column that
// renders it is no longer the one that built it.
// §5 "Unknown" / "N/A" / "TBD" from the model are not timestamps. Hoisted
// with the booking timeline it serves, which now renders from the facts
// column - the same rule applies to convo and action times.
function _tlTime(t) {
  const v = String(t || '').trim();
  // "undated" is prompt rule 10b's answer, not a failed timestamp: the entry
  // came from the guest's narrative, which has an order but no clock. It is
  // dropped to '' like the other non-times so the column stays clean, and the
  // section footnote below says how many rows are in that state — a per-row
  // word would repeat itself down the whole column.
  return (!v || /^(unknown|n\/?a|none|null|tbd|undated|-)$/i.test(v)) ? '' : v;
}

// How many rows of a timeline have no time, and whether the model said why.
// A column of dashes reads as timestamps we failed to load. Distinguishing
// "the guest narrated this, so there was never a clock" from "this is a real
// system event whose time is not recorded" is the difference between a
// working RCA and a broken lookup, and they rendered identically.
function _undatedNote(rows, raw) {
  const missing = rows.filter(l => !l.time).length;
  if (!missing) return '';
  const narrated = (raw || []).filter(l => l && typeof l === 'object'
    && /^undated$/i.test(String(l.time || '').trim())).length;
  const unverified = (raw || []).filter(l => l && typeof l === 'object'
    && /guest's account, unverified/i.test(String(l.detail || ''))).length;
  const n = Math.max(narrated, unverified);
  if (n >= missing && missing === rows.length)
    return `Every entry here is the guest's own account of the order things `
         + `happened in — the systems returned no events for this booking, so `
         + `there are no timestamps to show. Not a failed lookup.`;
  if (n)
    return `${n} of ${missing} undated ${n === 1 ? 'entry is' : 'entries are'} `
         + `the guest's account, which has an order but no clock. The `
         + `${missing - n} other${missing - n === 1 ? '' : 's'} are system `
         + `events whose time is not recorded.`;
  return `${missing} ${missing === 1 ? 'entry has' : 'entries have'} no time. `
       + `The model gave no reason, so this is not the same as a guest-narrated `
       + `sequence — check the confidence trail.`;
}

function bookingTimelineHtml(r, v3d) {
  const logRows = (v3d.booking_logs || []).map(l => (typeof l === 'string'
    ? {time: '', what: l.replace(/^\s*\d+[.)]\s*/, ''), detail: ''}
    : {time: _tlTime(l.time), what: l.what || '', detail: l.detail || ''}));
  // The section renders even with nothing in it. It used to collapse to ''
  // on an empty list, which took the "+ Add event" button with it - so the
  // one case where a human most needs to write the timeline by hand was the
  // one case with no way to do it, and the RCA simply had no such heading.
  const logsEmptyWhy = (r.booking && r.booking.bid)
    ? 'The model returned no events for this booking. Re-run the RCA, or add them by hand below.'
    : (r.candidateState
        ? 'No booking is confirmed yet, so there is no system timeline to draw from. Confirm a candidate above and re-run the RCA, or add the events by hand below.'
        : 'No booking was matched, so there is no system timeline to draw from. Add the events by hand below.');
  const logsHtml = `
  <div class="section" id="rca-booking-logs-section">
    <div class="section-label"><span>Booking timeline</span>
      <span class="hint">times in IST</span>
      ${logRows.length ? `<span class="sec-count">${logRows.length} event${logRows.length === 1 ? '' : 's'}</span>` : ''}
    <span class="section-chev">▾</span></div>
    ${logRows.length ? '' : `<div class="rca-empty">${logsEmptyWhy}</div>`}
    ${logRows.map((l, i) => `
      <div class="tl-row">
        <span class="tl-time editable-text${l.time ? '' : ' is-placeholder'}"
              contenteditable="true" spellcheck="false"
              ${l.time ? '' : 'data-ph="—"'}
              data-log-idx="${i}" data-log-field="time">${esc(l.time) || '—'}</span>
        <div class="tl-body">
          <span class="tl-what editable-text" contenteditable="true" spellcheck="false"
                data-log-idx="${i}" data-log-field="what">${esc(l.what)}</span><span class="tl-detail"> — <span
                class="editable-text" contenteditable="true" spellcheck="false"
                data-log-idx="${i}" data-log-field="detail">${esc(l.detail) || 'no detail'}</span></span>
        </div>
        <button class="row-del" data-log-del="${i}" title="Remove event">×</button>
      </div>`).join('')}
    ${(() => { const n = _undatedNote(logRows, v3d.booking_logs);
       return n ? `<div class="tl-undated-note">${esc(n)}</div>` : ''; })()}
    <button class="row-add" data-log-add>+ Add event</button>
  </div>`;
  return logsHtml;
}

// §13 the events timeline moves to the RCA column, taking the slot the
// booking timeline held (after TL;DR, before What went wrong). It is the
// interpreted guest journey - channel pills, actors, ZD links, hidden
// machinery, narrative summary - so it sits beside the analysis that cites it.
// No treatment change; only position.
function eventsTimelineHtml(r) {
  function _normTlEvent(e) {
    // Bookends carry actor creation/review and thread booking/review. They
    // frame the timeline and belong to no conversation, so no channel pill.
    const isBookend = e.actor === 'creation' || e.actor === 'review';
    const isElided  = /comments elided/.test(e.label || '');
    return { ...e, _isBookend: isBookend, _isElided: isElided,
             time: e.time || '', label: (e.label || '').trim() };
  }

  const _allEvents = (r.events || []).map(_normTlEvent);
  const _internal  = _allEvents.filter(e => e.is_internal);
  const _shown     = state.tlShowInternal ? _allEvents
                                          : _allEvents.filter(e => !e.is_internal);

  const _zdBase = (r.zendeskSubdomain || 'headout');
  const events = _shown.map(e => `
    <div class="tl-event${e.is_internal ? ' tl-internal' : ''}">
      <div class="tl-time" title="${e.time_sort || ''}">${(e.time || '').replace(/ IST$/, '')}</div>
      <div class="tl-content">
        <div class="tl-header">
          ${(!e._isBookend && !e._isElided && e.thread)
              ? `<span class="tl-thread ${e.thread}">${e.thread}</span>` : ''}
          <div class="tl-actor ${e.actor}">${e.label}</div>
          ${e.is_internal
              ? `<span class="tl-flag" title="Headout machinery, not part of the guest&#39;s story">${e.internal_reason || 'internal'}</span>`
              : ''}
          ${e.ticket_id
              ? `<a class="tl-tid" href="https://${_zdBase}.zendesk.com/agent/tickets/${e.ticket_id}" target="_blank" rel="noopener" title="open ZD-${e.ticket_id}">ZD-${e.ticket_id}</a>`
              : ''}
        </div>
        <div class="tl-summary">${e.summary || ''}</div>
      </div>
    </div>
  `).join('')
  + (_internal.length && !state.tlShowInternal
      ? `<div class="tl-hidden-note" data-tl-toggle>${_internal.length} internal event${_internal.length === 1 ? '' : 's'} hidden · show</div>`
      : _internal.length
        ? `<div class="tl-hidden-note" data-tl-toggle>showing ${_internal.length} internal event${_internal.length === 1 ? '' : 's'} · hide</div>`
        : '');

  return `
    <div class="section" id="rca-events-timeline-section">
      <div class="section-label"><span>Events timeline</span>
        <span class="hint">times in IST</span>
        ${_shown.length ? `<span class="sec-count">${_shown.length} event${_shown.length === 1 ? '' : 's'}</span>` : ''}
      <span class="section-chev">▾</span></div>

        ? `<div class="tl-events">${events}</div>
           ${r.timelineSummary ? `<div class="timeline-summary">${esc(r.timelineSummary)}</div>` : ''}`
        : _allEvents.length
          // Every event on this booking is Headout machinery, so the filter
          // emptied the list. Saying "no events were found" here is false, and
          // it also swallowed the toggle that reveals them — the note is
          // appended to `events`, which this branch never renders.
          ? `<div class="rca-empty">All ${_allEvents.length} Zendesk event${_allEvents.length === 1 ? ' is' : 's are'} internal Headout machinery and hidden by the filter — none of them are part of the guest's story.</div>

               (r.zendeskTicketIds || []).length
                 ? `${r.zendeskTicketIds.length} ticket${r.zendeskTicketIds.length === 1 ? '' : 's'} matched but carried no timeline events.`

  col.innerHTML = `

      <div class="insights-wrap">

          // broken in the place it costs most, because the numbers are what
          // an RCA's "pattern" bullets are built on.
          //
          // So the window travels WITH the numbers. If it disagrees with the
          // button, the panel says so instead of putting fresh labels over
          // stale figures.
          const _wantD = windowDays(state.insightsWindow);
          const _gotD  = li._window_days;
          const _stale = _gotD != null && _wantD != null && _gotD !== _wantD;
          // rating_15d / rating_30d are back-compat aliases: the server sends
          // TGID in the first and TID.VID in the second. They are SCOPES, not

          const _ratTgid = li.rating_tgid || li.rating_15d || {};
          const _ratTv   = li.rating_tidvid || li.rating_30d || {};
          // Ops thumb rule: under 95%, and only over ~100 bookings, because the

          const _ffAttn  = li.ff_vid ? !!li.ff_vid.needs_attention
                                     : (li.vid_completion_rate != null
                                        && li.vid_completion_rate < 0.95);
          // TGID's own attention flag is gone with its tile. It was read by

          // live one. ff_tgid is still in the payload for whoever wants it.
          //
          // TID+VID, the tile that replaced TGID. Same rule: the server
          // applies the under-95%-over-100-bookings test and needs_attention
          // is its answer; the rate comparison is only the fallback for a
          // payload that predates it.
          const _ffAttnTv = li.ff_tidvid ? !!li.ff_tidvid.needs_attention
                                         : (li.tidvid_completion_rate != null
                                            && li.tidvid_completion_rate < 0.95);
          // Sample size, shown only when it changes how the number should be
          // read. Over 100 bookings the rate stands on its own; under it, the
          // ops rule says the rate is noise and the count is the honest
          // caveat. Zero is not a dash - "no bookings in this window" is a
          // fact about the vendor, and a dash reads as a broken query.
          // Which queries BROKE. A tile backed by one of these has no
          // number, and the affirmative wording below - "no bookings", "no
          // negative reviews" - would state a warehouse failure as a fact
          // about the vendor. _broken() marks those tiles instead.
          const _failed = new Set(li._failed_queries || []);
          const _broken = (...names) => names.some(n => _failed.has(n));
          const _err = '<span class="tile-empty" title="the query for this '
            + 'tile failed - this is not a zero">could not load</span>';

          const _rate = (r, n, ...q) =>
            _broken(...q) ? _err
            : n === 0 ? 'no bookings'
            : r == null ? '—'
            : `${(r * 100).toFixed(1)}%` +
              (n < 100 ? ` <span class="tile-n">of ${n} booking${n === 1 ? '' : 's'}</span>` : '');
          const _rr = li.review_ratio || 0;
          const _sr = li.support_ratio || 0;

          // Why a tile has no number. The server says so - _zeroed_because when
          // nothing could be computed, _partial_because when only the
          // vendor-level half ran. The subtitles used to read "no visit date"
          // no matter what the actual reason was, which is worse than silence:
          // it sends you looking for a missing date that was never the problem.
          const _why = li._zeroed_because || li._partial_because || '';
          const _n = (v) => (v == null ? '—' : v);
          const _pair = (a, b) =>
            (a == null || b == null) ? '—' : `${a} / ${b}`;

          // Grouped by the question each answers, because a flat grid of ten
          // equal tiles gives no clue which two matter for an RCA and which
          // are background. Ratio and counts were also two tiles showing one
          // fact - "12.5%" and "1 / 8" - so they are now one line each.
          // What the shortfall was. "57.1% of 7" leaves the obvious question
          // unanswered - three did not complete, why - and cancelled by the
          // vendor points somewhere different from a fulfilment backlog.
          // The booking ids behind the count. A number is something to note;
          // an id is something to open.
          const _ids = (list) => {
            if (!Array.isArray(list) || !list.length) return '';
            const shown = list.slice(0, 6).join(' · ');
            return `<div class="tile-why">${shown}` +
                   (list.length > 6 ? ` <span class="why-n">+${list.length - 6}</span>` : '') +
                   '</div>';
          };
          const _why_not = (rows) => {
            if (!Array.isArray(rows) || !rows.length) return '';
            return '<div class="tile-why">' + rows.slice(0, 3).map(r =>
              `<span class="why-n">${r.count}</span> ${r.reason}`).join(' · ')
              + '</div>';
          };
          // Headings carry the title only. Repeating the range on every
          // group put a date next to numbers that had not been recomputed for
          // it yet, so a stale label read as fact - and the picker at the top
          // already states the window for the whole panel.
          const _grp = (t) => `<div class="insight-group">${t}</div>`;
          const _tile = (label, value, cls) =>
            `<div class="insight-tile ${cls || ''}">
               <div class="insight-tile-label">${label}</div>
               <div class="insight-tile-value">${value}</div>
             </div>`;
          // Average rating over the picked window, with the count that decides
          // how much weight to put on it - a mean over one review reads the
          // same as a mean over a thousand without it.
          const _avgRating = (r, ...q) => {
            if (_broken(...q)) return _err;
            if (r.avg == null) return '<span class="tile-empty">no ratings</span>';
            const n = r.n || 0;
            return `${r.avg} ★ ` +
              `<span class="tile-n">from ${n.toLocaleString()} ` +
              `rating${n === 1 ? '' : 's'}</span>`;
          };
          const _share = (hit, tot, none, ...q) =>
            _broken(...q) ? _err
            : !tot ? `<span class="tile-empty">${none}</span>`
                 : `${hit} <span class="tile-n">of ${tot}</span>` +
                   ` <span class="tile-pct">${((hit / tot) * 100).toFixed(1)}%</span>`;
          const sd = li.same_day || {};

          return `<div class="insights-grid">
            <div class="insight-window ${_stale ? 'stale' : ''}">${
              li._window_label ? esc(li._window_label)
                               : (_gotD != null ? `last ${_gotD} days`
                                                : 'window not recorded')
            }${_stale ? ` — you picked ${esc(state.insightsWindow)}; these `
                      + `figures were not recomputed for it` : ''}</div>
            ${state.insightsError
              ? `<div class="insight-note">${esc(state.insightsError)}</div>` : ''}
            ${_why ? `<div class="insight-note">${_why}</div>` : ''}

            ${(() => {
              // Scoped to TID + VID: is this vendor's version of the
              // experience failing? Booking ids under each count, because
              // "3 reviews" is a number and three booking ids are something
              // an associate can open.
              const r = (li.recurrence || {}).tidvid || {};
              const rr = r.reviews_total ? r.reviews / r.reviews_total : 0;
              const sr = r.support_total ? r.support / r.support_total : 0;
              return `
            ${_grp('Is this issue recurring here?')}
            ${_tile('Reviews',
                    _share(r.reviews, r.reviews_total, 'no negative reviews',
                           'reviews', 'reviews_total') + _ids(r.review_ids),
                    rr > 0.15 ? 'red' : '')}
            ${_tile('Support contacts',
                    _share(r.support, r.support_total, 'no contacts',
                           'support', 'support_total') + _ids(r.support_ids),
                    sr > 0.15 ? 'red' : '')}`;
            })()}

            ${_grp('Same visit date, same issue')}
            ${_tile('Reviews', _broken('same_day_reviews') ? _err
                                : (li.same_day ? _n(sd.reviews) : '—')
                                  + _ids(sd.review_ids),
                    (sd.reviews > 0) ? 'red' : '')}
            ${_tile('Support contacts', _broken('same_day_support') ? _err
                                        : (li.same_day ? _n(sd.support) : '—')
                                          + _ids(sd.support_ids),
                    (sd.support > 0) ? 'red' : '')}

            ${_grp('Experience &amp; vendor')}
            ${_tile('Average rating · TGID', _avgRating(_ratTgid, 'rating_tgid'),
                    _ratTgid.avg == null ? 'grey' : '')}
            ${_tile('Average rating · TID · VID', _avgRating(_ratTv, 'rating_tidvid'),
                    _ratTv.avg == null ? 'grey' : '')}
            <!-- TID+VID and VID, not TGID and VID. TID+VID is the narrowest
                 population that still answers "can this vendor fulfil THIS
                 tour"; VID alone spans everything they run, so a vendor good
                 at one tour and bad at another averages to something true of
                 neither. The two together separate "this pairing is broken"
                 from "this vendor is broken".

                 The why-rows stay on the VID tile: they are computed at
                 vendor scope, and hanging vendor-wide reasons under a
                 TID+VID rate would explain a number with the wrong evidence. -->
            ${_tile('Completion · TID · VID',
                    _rate(li.tidvid_completion_rate,
                          (li.ff_tidvid || {}).total ?? null,
                          'completion_tidvid'),
                    _ffAttnTv ? 'red' : '')}
            ${_tile('Completion · VID',
                    _rate(li.vid_completion_rate, (li.ff_vid || {}).total ?? null,
                          'completion_vid')
                    + _why_not(li.vid_incomplete_why),
                    _ffAttn ? 'red' : '')}
            <!-- Driven by the tiles that are actually on screen. This read
                 _ffAttnT, and TGID no longer HAS a tile - so the button would
                 have appeared over two healthy-looking rates with nothing
                 visible to explain it, and the associate would be flagging a
                 vendor on evidence the card never showed them. The message
                 itself is built from VID anyway. -->
            ${_ffAttnTv || _ffAttn
              ? '<button class="flag-biz-btn full" data-flag-biz>⚑ Flag to Biz · draft message</button>'
              : ''}
          </div>`;
        })() : `
        <div class="insights-grid">
          <div class="insight-tile ${ins.tgidRating.tone}">
            <div class="insight-tile-label">TGID Rating</div>
            <div class="insight-tile-value">${ins.tgidRating.value}</div>
            <div class="insight-tile-sub">${ins.tgidRating.sub} · ${state.insightsWindow}</div>
          </div>
          <div class="insight-tile ${ins.tidVidRating.tone}">
            <div class="insight-tile-label">TID · VID Rating</div>
            <div class="insight-tile-value">${ins.tidVidRating.value}</div>
            <div class="insight-tile-sub">${ins.tidVidRating.sub} · ${state.insightsWindow}</div>
          </div>
          ${(() => {
            const _li = r.liveInsights;
            const _cr = _li ? _li.vid_completion_rate : null;
            const _crStr = _li ? (_li.vidCompletionRate || 'N/A') : ins.completion.value;
            const _ffv = _li ? _li.ff_vid : null;
            const _crTone = _cr != null && _cr < 0.95 ? 'red' : _cr == null && !_li ? ins.completion.tone : _cr == null ? 'grey' : '';
            const _crFlagToBiz = _ffv ? _ffv.needs_attention : (_cr != null ? _cr < 0.95 : ins.completion.flagToBiz);
            // The server records this and sends it on every load. Reading it
            // only out of the in-memory object meant a reload re-armed the
            // button and a second click sent a duplicate to #biz-supply-ops.
            const _crFlagged = r.flagToBizState === 'sent' || ins.completion.flagged;
            const _sdi = _li ? _li.sameDaySameVidIssues : ins.sameDayIssues.value;
            const _sdObj = _li ? _li.same_day_same_vid : null;
            const _sdiTone = _li ? (_sdObj && _sdObj.issues > 0 ? 'red' : _sdObj == null ? 'grey' : '') : ins.sameDayIssues.tone;
            return `
          <div class="insight-tile ${_crTone}">
            <div class="insight-tile-label">Completion %</div>
            <div class="insight-tile-value">${_crStr}</div>
            <div class="insight-tile-sub">${_li ? (_cr != null ? 'VID' : 'no data') : ins.completion.sub} · ${state.insightsWindow}</div>
            ${_crFlagToBiz
              ? '<button class="flag-biz-btn' + (_crFlagged ? ' flagged' : '') + '" data-flag-biz' + (_crFlagged ? ' disabled' : '') + '>' + (_crFlagged ? '✓ Flagged · sent to Slack' : '⚑ Flag to Biz · draft message') + '</button>'
              : ''}
          </div>
          <div class="insight-tile ${_sdiTone}">
            <div class="insight-tile-label">Same-Day Issues</div>
            <div class="insight-tile-value">${_sdi || '—'}</div>
            <div class="insight-tile-sub">${_li ? (_sdObj ? 'same-day VID bookings' : 'no visit date') : ins.sameDayIssues.sub}</div>
          </div>`;
          })()}
          ${similar}
        </div>`}
      </div>
    </div>
    ${(() => {
      const rc = r.rca || {};
      const chipRow = (label, values, addAttr, options, removeAttr) => `
        <div class="chip-row">
          <span class="chip-row-label">${label}</span>
          ${(values || []).map((v, i) => `
            <span class="chip">${esc(v)}
              <button ${removeAttr}="${i}" title="Remove">×</button>
            </span>`).join('')}
          <select class="chip-add" ${addAttr}>
            <option value="">+ add</option>
            ${(options || []).filter(o => !(values || []).includes(o))
                .map(o => `<option>${esc(o)}</option>`).join('')}
          </select>
        </div>`;
      const subOpts = SUB_THEME_OPTIONS[rc.issueL1 + '::' + rc.issueL2] || [];
      return `
      <div class="classify-block">
        <div class="col-label" style="margin-bottom:10px">Classification</div>
        <div class="classify-selects">
          <label class="classify-row">L1
            <select class="classify-select" data-classify="l1">
              ${(rc.issueL1 && !L1_CATEGORIES.includes(rc.issueL1)
                  ? `<option>${esc(rc.issueL1)}</option>` : '')}
              ${L1_CATEGORIES.map(o =>
                  `<option${o === rc.issueL1 ? ' selected' : ''}>${esc(o)}</option>`).join('')}
            </select>
          </label>
          <label class="classify-row">L2
            <select class="classify-select" data-classify="l2">
              ${(rc.issueL2 && !(L2_OPTIONS[rc.issueL1] || []).includes(rc.issueL2)
                  ? `<option>${esc(rc.issueL2)}</option>` : '')}
              ${(L2_OPTIONS[rc.issueL1] || []).map(o =>
                  `<option${o === rc.issueL2 ? ' selected' : ''}>${esc(o)}</option>`).join('')}
            </select>
          </label>
        </div>
        ${chipRow('Sub-themes', rc.subThemes || [], 'data-subtheme-add', subOpts, 'data-subtheme-remove')}
        ${chipRow('Scenarios', rc.scenarios || [], 'data-scenario-add', SCENARIO_OPTIONS, 'data-scenario-remove')}
        ${(() => {
          // The scenario was set by hand and routing has since moved. Not a
          // "manual" tag: provenance alone makes the reader reconstruct months
          // later WHY it was set. The contradiction is what matters, and it is
          // shown the moment L1/L2 changes — while they still remember.
          //
          // Nothing renders when the override agrees with routing. A badge
          // that fires on agreement is one people learn to ignore, and then
          // it is not there when it counts.
          const sr = rc.scenarioRouting;
          if (!sr || !sr.diverged || !sr.routed_now) return '';
          return `<div class="scenario-reconcile">
            <span class="reconcile-mark">⚠</span>
            <span class="reconcile-text">Set by hand as
              <strong>${esc(sr.primary)}</strong>. This classification now routes to
              <strong>${esc(sr.routed_now)}</strong>.</span>
            <button class="reconcile-revert" data-scenario-revert="${esc(sr.routed_now)}"
                    title="Use the routed scenario instead">Use routed</button>
          </div>`;
        })()}
        ${chipRow('Overlays', rc.overlayScenarios || [], 'data-overlay-add',
                  SCENARIO_OPTIONS.filter(o => !(rc.scenarios || []).includes(o)), 'data-overlay-remove')}
        ${(() => {
          // Output rule 13 guarantees every routed scenario is covered by a
          // guest issue AT GENERATION TIME. An override applied afterwards
          // breaks that silently, so the gap is named here rather than left
          // for someone to notice the RCA does not mention the scenario the
          // chip claims. Regeneration stays the analyst's call.
          const un = (rc.scenarioRouting || {}).uncovered || [];
          if (!un.length) return '';
          return `<div class="scenario-uncovered">
            <span class="reconcile-mark">⚠</span>
            <span class="reconcile-text">${un.length === 1
              ? `No guest issue covers <strong>${esc(un[0])}</strong>`
              : `No guest issue covers ${un.map(u => `<strong>${esc(u)}</strong>`).join(', ')}`
            } — the RCA was written before this scenario was set. Re-run to cover it.</span>
          </div>`;
        })()}
        <span data-scenario-regen-status style="font-size:11px;color:var(--muted-2)"></span>
      </div>`;
    })()}

  `;

  // The machinery toggle is bound by a delegated handler near renderRcaCol —
  // the timeline it controls lives in the RCA column now (§13).

  // Window picker — recompute against the chosen range. This used to only set
  // state and re-render, so the caption changed ("· 90d") while the number
  // underneath stayed on whatever window the pipeline had hardcoded.
  col.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const w = btn.dataset.window;
      state.insightsWindow = w;
      renderReviewCol();
      // The server recomputes for this window - it is not a client-side
      // filter. Until it answers, the tiles show the previous window's
      // numbers under the new label, so say so rather than letting them read
      // as the answer.
      col.querySelectorAll('.insight-tile-value').forEach(el => {
        el.style.opacity = '0.45';
      });
      const r = REVIEWS.find(x => x.id === state.selected);
      // No booking-id guard. It used to check r.booking.bid, which is not the
      // key the pipeline writes - it writes id - so for every review the guard
      // returned early: state moved to the new window, the panel re-rendered
      // with the OLD numbers, the tiles stayed dimmed, and no request was ever
      // sent. The picker looked stuck on one window's data forever.
      //
      // There is nothing to guard anyway. The server resolves the booking
      // itself and answers with _zeroed_because when it cannot, which is a
      // result worth rendering rather than a reason not to ask.
      if (!r) return;
      state.insightsError = '';
      try {
        const resp = await fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(w)}`);
        if (resp.ok) {
          const ins = unwrapInsights(await resp.json());
          // Three ways this call produces nothing new, and they used to be one
          // silent path: the request failed, it succeeded with a body this
          // client cannot read, or it succeeded and answered for a different
          // window. All three leave the previous window's figures on screen,
          // which is the state the user reported as "the figures should be
          // updating on the basis of the date window but its not". Each says
          // which one it was.
          if (ins) {
            r.liveInsights = ins;
            const got = ins._window_days, want = windowDays(w);
            if (got != null && want != null && got !== want) {
              state.insightsError = `Asked for ${w}, the server answered for `
                + `${got} days. The figures below are for ${got} days.`;
            }
          } else {
            state.insightsError = 'The server answered, but not in a shape this '
              + 'page can read — the figures below are the previous window\'s.';
          }
        } else {
          state.insightsError = `Could not recompute for ${w} — the server `
            + `returned ${resp.status}. The figures below are still the `
            + `previous window's.`;
        }
      } catch (e) {
        state.insightsError = `Could not reach the server to recompute for ${w}`
          + ` (${e && e.message ? e.message : e}). The figures below are still `
          + `the previous window's.`;
        // Say something. A bare "keep what is on screen" catch is what let a
        // ReferenceError in this block masquerade as a broken window picker
        // for as long as it did: the request worked, the reply was dropped on
        // the floor, and the only visible effect was numbers that would not
        // change. A swallowed exception here has no other symptom, so it has
        // to announce itself.
        console.error('[insights] window switch failed:', e);
      }
      // Always, on every path. Leaving the dimming on is what made a failed
      // fetch look like a loaded one.
      renderReviewCol();
    });
  });

  const flagBtn = col.querySelector('[data-flag-biz]');
  if (flagBtn) {
    flagBtn.addEventListener('click', () => {
      const r = REVIEWS.find(x => x.id === state.selected);
      if (!r) return;
      // Open the draft modal
      openFlagDraftModal(r);
    });
  }

  col.querySelectorAll('.candidate-card').forEach(card => {
    card.addEventListener('click', () => {
      col.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  const confirmBtn = col.querySelector('.candidate-confirm-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      const selectedCard = col.querySelector('.candidate-card.selected');
      if (!selectedCard) return;
      const idx = parseInt(selectedCard.dataset.candidateIdx);
      const candidate = r.candidatesList && r.candidatesList[idx];
      if (!candidate) return;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '⟳ Confirming…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/select-candidate`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({bid: candidate.bid}),
        });
        if (!res.ok) throw new Error(await res.text());
        confirmBtn.textContent = '✓ Confirmed · pipeline running…';
        r.candidateState = false;
        // Poll every 3 s until the pipeline finishes (candidate_state clears)
        let polls = 0;
        const poll = setInterval(async () => {
          polls++;
          try {
            const check = await fetch(`/api/reviews/${r.id}`);
            if (!check.ok) return;
            const payload = await check.json();
            const d = payload.draft;
            if (d && !d.candidate_state) {
              clearInterval(poll);
              await loadDraftOverlays();
              renderInbox();
              renderReviewCol();
              renderRcaCol();
            }
          } catch (_) {}
          if (polls > 20) clearInterval(poll); // give up after 60 s
        }, 3000);
      } catch (e) {
        confirmBtn.textContent = '✗ Error — try again';
        confirmBtn.disabled = false;
      }
    });
  }
}

// The window these numbers were actually computed for. The picker is a
// button someone may have clicked after the numbers were fetched, so labelling
// a cached 7-day count "90d" because 90d is highlighted is how a Slack post
// tells leadership the wrong scope. The data carries its own window.
function _insightsWindowLabel(r) {
  const raw = (r && r.insightsRaw) || {};
  if (typeof raw._window_days === 'number' && raw._window_days > 0) return raw._window_days + 'd';
  if (raw._window_label) return String(raw._window_label);
  return (typeof state !== 'undefined' && state.insightsWindow)
    ? state.insightsWindow + ' (picker — data carried no window)'
    : 'unknown';
}

// Shared by every branch of the RCA column, including the untraceable one,
// which returns before the main renderer's locals exist - a helper defined
// down there is a ReferenceError up here.
const esc = s => String(s == null ? '' : s).replace(/</g, '&lt;').replace(/>/g, '&gt;');

// One save path for every RCA edit.
//
// Nine handlers did this inline with `catch (e) { /* keep local edit */ }` and
// no res.ok check. fetch only rejects on a network failure, so a 400 or a 500
// resolved and was treated as a successful save: the edit stayed on screen,
// the tick appeared, and the change was gone on reload with nothing said.
// Anything that cannot be saved has to say so while the words are still on
// the screen to copy.
async function saveDraft(reviewId, patch, el) {
  try {
    const res = await fetch(`/api/reviews/${reviewId}/draft-v2`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(patch),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`.slice(0, 200));
    if (el && typeof el.dataset === 'object') _saveMark(el, true);
    return true;
  } catch (e) {
    console.warn('draft save failed', patch, e);
    if (el && typeof el.dataset === 'object') _saveMark(el, false);
    _saveToast(String(e.message || e));
    return false;
  }
}

function _saveMark(el, ok) {
  const host = el.parentElement || el;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  let tick = host.querySelector(':scope > .save-tick');
  if (!tick) {
    tick = document.createElement('span');
    tick.className = 'save-tick';
    host.appendChild(tick);
  }
  tick.textContent = ok ? '✓ saved' : '✗ not saved';
  tick.style.color = ok ? '' : '#e5534b';
  tick.classList.add('on');
  setTimeout(() => tick.classList.remove('on'), ok ? 1400 : 6000);
}

// Not every save is tied to an element on screen, and a save that failed with
// nowhere to show it is the failure mode this is fixing.
function _saveToast(msg) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);'
      + 'background:#e5534b;color:#fff;padding:9px 14px;border-radius:8px;z-index:9999;'
      + 'font-size:12.5px;max-width:80vw;box-shadow:0 4px 16px rgba(0,0,0,.25)';
    document.body.appendChild(t);
  }
  t.textContent = 'Not saved — ' + msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 7000);
}

// "14:02" today, "3 Jul" before that. Used on buttons whose action already
// happened, so the label says when rather than inviting a repeat.
function _shortWhen(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})
    : d.toLocaleDateString([], {day: 'numeric', month: 'short'});
}
// Pointer fields are lists in the v3 shape; older drafts hold one string.
// "Frau Nicole Liebschner" is not called Frau. Taking the first word of the
// author name put a German honorific into a guest-facing greeting - "Hey
// Frau,". Titles are stripped before the first real name is taken.
const _TITLES = new Set(['mr','mrs','ms','miss','mx','dr','prof','sir','madam',
  'herr','frau','fraulein','fräulein','monsieur','madame','mademoiselle','m',
  'sr','sra','srta','don','dona','doña','dott','ing','sig','sig.ra','signora',
  'signore','heer','mevrouw','pan','pani','hr','fru','herra','rouva']);
// Approved untraceable reply. Kept in one place so the copy button, the
// panel and anything else that needs it cannot drift apart.
const UNTRACEABLE_REPLY = (first) =>
`Hey ${first},

I'm sorry things didn't go as planned, and I'd love to fix this for you right away. Please share your booking ID (if available) or the email address used for your booking at https://bit.ly/hedout. Once we have your details, our team will dive right in to resolve it ASAP.

Thank you so much for your understanding and patience. I'll make sure we turn this around for you!

Best,
[Your Name], Headout`;

const _firstName = (author) => {
  const parts = String(author || '').trim().split(/\s+/).filter(Boolean);
  for (const p of parts) {
    const bare = p.replace(/\.$/, '').toLowerCase();
    if (_TITLES.has(bare)) continue;
    return p;
  }
  return 'there';
};
const asPoints = v => (Array.isArray(v) ? v : (v ? [v] : [])).filter(Boolean)
  .map(p => String(p).replace(/^\s*[•·\-–▪]\s*/, ''));

// Delegated once: the toggle appears in both columns and both re-render from
// scratch, so a per-element binding would have to be re-attached in every
// place that touches innerHTML - which is how a control ends up live in one
// column and dead in the other.
// §13 the booking timeline renders from the facts column now, so its controls
// are delegated: a per-render binding inside renderRcaCol left them dead the
// moment the markup moved. Same reason as the raw-error toggle.
document.addEventListener('click', async ev => {
  const t = ev.target.closest && ev.target.closest('[data-log-del], [data-log-add]');
  if (!t) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  if (t.hasAttribute('data-log-del')) {
    v3.booking_logs = (v3.booking_logs || []).filter((_, i) => i !== parseInt(t.dataset.logDel));
  } else {
    v3.booking_logs = [...(v3.booking_logs || []),
      {time: '', what: 'New event — click to edit', detail: ''}];
  }
  await saveDraft(r.id, {rca_v3: v3});
  renderReviewCol(); if (state.selected) renderRcaCol();
});

document.addEventListener('blur', async ev => {
  const el = ev.target.closest && ev.target.closest('[data-log-idx]');
  if (!el) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  const l = (v3.booking_logs || [])[parseInt(el.dataset.logIdx)];
  if (!l || typeof l === 'string') return;
  l[el.dataset.logField] = el.textContent.trim();
  await saveDraft(r.id, {rca_v3: v3});
}, true);

// Which build is this page talking to.
//
// "The dashboard looks like the previous version" is unanswerable from the
// browser: a stale page, a server that was never restarted after a pull, and a
// deploy that silently failed all look identical. /api/version already knows -
// it compares the running process against what is checked out on disk - so the
// only thing missing was saying it where the reader is.
//
// Quiet when current: the build goes on <body data-build> and into the logo's
// tooltip. Loud when stale, because that is the case someone has to act on.
(async () => {
  try {
    const v = await (await fetch('/api/version', {cache: 'no-store'})).json();
    const tag = `${v.short} · ${v.fingerprint} · ${v.environment} · up ${v.uptime_s}s`;
    document.body.dataset.build = tag;
    document.body.dataset.stale = v.stale ? 'yes' : 'no';
    const logo = document.querySelector('.logo, .brand, .topbar-title, .top-bar');
    if (logo) logo.title = tag;
    console.info('[build] ' + tag + (v.stale ? '  ← STALE' : ''));
    if (v.stale) {
      const bar = document.createElement('div');
      bar.className = 'stale-bar';
      bar.textContent = `This page is talking to an older build — running ${v.short}, `
        + `checked out ${String(v.on_disk).slice(0, 7)}. Restart the server to pick up the pull.`;
      document.body.prepend(bar);
    }
  } catch (_) { document.body.dataset.build = 'unknown'; }
})();

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-slack-customize]');
  if (!b) return;

});

document.addEventListener('click', ev => {
