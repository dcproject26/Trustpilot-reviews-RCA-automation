  const query = String(q || '').trim().toLowerCase();
  if (!query) return true;
  const rca = r.rca || {};
  const hay = [
    r.author, r.id, r.lang, r.status, r.type,
    r.original, r.originalText, r.english,
    (r.booking || {}).id, (r.booking || {}).bid,
    (r.booking || {}).experienceName, (r.booking || {}).vendorName,
    rca.issueL1, rca.issueL2, rca.subTheme,
    ...(r.zendeskTicketIds || []),
    ...(rca.subThemes || []),
    ...(rca.scenarios || []),
  ].filter(v => v != null).join('  ').toLowerCase();
  // ZD-34125496 and 34125496 have to find the same review — the prefix is
  // ours, and half the people searching will paste it and half will not.
  // Stripping it from the TERM is enough in both directions, because a stored
  // "ZD-34125496" contains "34125496" as a substring anyway. Stripping it from
  // the haystack as well was a second line that changed no outcome, which
  // mutation testing proved by deleting it and killing nothing.
  return query.split(/\s+/).every(term =>
    hay.includes(term) || hay.includes(term.replace(/^zd-/, '')));
}

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const q = state.search;
  const hits = REVIEWS.filter(r => matchesSearch(r, q));
  const filtered = hits.filter(r => inTab(r, state.filter));

  // While searching, the tab numbers count MATCHES, not totals — otherwise
  // "Untraceable 12" sits above an empty list and the reader concludes the
  // list is broken. They also answer the question a search actually asks,
  // which is "where is it".
  const TABS = [['all', 'cnt-all'], ['identified', 'cnt-identified'],
                ['candidates', 'cnt-candidates'],
                ['processing', 'cnt-processing'],
                ['untraceable', 'cnt-untraceable'], ['sent', 'cnt-sent']];
  const perTab = {};
  for (const [tab, id] of TABS) {
    perTab[tab] = hits.filter(r => inTab(r, tab)).length;
    document.getElementById(id).textContent = perTab[tab];
    const btn = document.querySelector(`.inbox-tab[data-tab="${tab}"]`);
    if (btn) btn.classList.toggle('has-hits', !!q && perTab[tab] > 0
                                                && tab !== state.filter);
  }
  const clearBtn = document.getElementById('inbox-search-clear');
  if (clearBtn) clearBtn.hidden = !q;

  if (filtered.length === 0) {
    // Three different nothings, and they were all one sentence. "No reviews
    // in this tab" told somebody searching for a guest that the guest does
    // not exist, when the review was one tab across.
    if (!q) {
      list.innerHTML = `<div class="empty-state">No reviews in this tab.</div>`;
    } else if (perTab.all === 0) {
      list.innerHTML = `<div class="empty-state">Nothing matches
        “${esc(q)}” in any tab — searched name, booking id, ticket number,
        review text and classification across all ${REVIEWS.length}
        review(s).</div>`;
    } else {
      const others = TABS.filter(([t]) => t !== state.filter && t !== 'all'
                                          && perTab[t] > 0);
      list.innerHTML = `<div class="empty-state">No match for “${esc(q)}”
        in this tab.</div>
        <div class="inbox-elsewhere">${perTab.all} elsewhere:
        ${others.map(([t]) =>
          `<button data-goto-tab="${t}">${_tabLabel(t)} (${perTab[t]})</button>`
        ).join('')}</div>`;
    }
    return;
  }

  // One stage chip per card, coloured by what it asks of the reader:
  // green = nothing to do, amber = a human must confirm, red = stuck.
  // Coloured by what the row asks of the reader: green = nothing to do,
  // amber = a human must act, red = stuck. A review still being processed
  // asks for nothing but patience, so it must not be red — it was, because it
  // was being filed as Untraceable.
  // "unassigned", dim, when nobody has typed a name — a review nobody has
  // taken and one whose owner was typed then cleared both read as unassigned
  // in the queue; the data keeps them apart (null vs ""), the column does not
  // need to.
  const ownerCell = (o) => (o && String(o).trim())
      ? `<span class="ic-owner-name">${esc(o)}</span>`
      : `<span class="ic-owner-none">unassigned</span>`;
  list.innerHTML = filtered.map(r => {
    const [stage, kind] = _stageOf(r);
    const body = r.english || r.original || '';
    const snippet = esc(body.substring(0, 120)) + (body.length > 120 ? '…' : '');
    const bid = r.booking?.id || r.booking?.bid || '';
    return `
    <div class="inbox-row ${r.id === state.selected ? 'active' : ''}" data-id="${r.id}">
      <div class="ic-guest">
        <div class="ic-name">${esc(r.author)}</div>
        <div class="ic-stars">${r.stars}</div>
      </div>
      <div class="ic-review">
        <div class="ic-snippet">${snippet}</div>
        <div class="ic-sub">${esc(r.booking?.experience || '')}</div>
      </div>
      <div class="ic-booking">
        <div class="ic-bid ${bid ? '' : 'ic-bid-none'}">${bid ? esc(bid) : '—'}</div>
        <div class="ic-lang">${esc(r.lang || '')}</div>
      </div>
      <div class="ic-state"><span class="tag stage-${kind}">${stage}</span></div>
      <div class="ic-owner">${ownerCell(r.owner)}</div>
      <div class="ic-received">${esc(r.time)}</div>
    </div>`;
  }).join('');

  list.querySelectorAll('.inbox-row').forEach(el => {
    el.addEventListener('click', () => {
      // Selecting a row is what moves from the queue to the case page. The
      // review is the same object; only the surface changes. The RCA opens on
      // demand, so a freshly opened case shows the facts first.
      state.selected = el.dataset.id;
      state.screen = 'case';
      state.rcaOpen = false;
      applyScreen();
      renderReviewCol();
      renderRcaCol();
    });
  });
}

// The stage chip, shared by the queue row and the case header so the two
// never disagree about what a review is. "Closed out" is not "Sent": both
// have status sent; one had an RCA and a reply, the other was finished by
// someone deciding there was nothing to send. Colour by what it asks of the
// reader — green nothing-to-do, amber a human must act, red stuck.
function _stageOf(r) {
  return r.status === 'sent'    ? (r.closedAt ? ['Closed out', 'warn'] : ['Sent', 'ok'])
       : r.type === 'candidates' ? ['Confirm match', 'warn']
       : r.type === 'processing' ? (r.processingState === 'stalled' ? ['Run stopped', 'bad']
                                   : r.processingState === 'queued'  ? ['Queued', '']
                                   :                                    ['Processing', ''])
       : r.type === 'untraceable' ? ['Untraceable', 'bad']
       :                            ['Draft ready', 'ok'];
}

// WHICH SURFACE IS SHOWING. The queue table and the case page are the same
// DOM the old three columns were — the class on `.main` decides which is
// visible, so nothing is unmounted and no state is lost moving between them.
function applyScreen() {
  const main = document.querySelector('.main');
  if (main) {
    main.classList.toggle('screen-inbox', state.screen === 'inbox');
    main.classList.toggle('screen-case',  state.screen === 'case');
  }
  if (state.screen === 'case') renderCaseHeader();
  applyRca();
}

// Open or close the RCA & response slide-over. The panel and its close control
// move together; leaving the case (or going back to the inbox) closes it so it
// never hangs over the queue. Non-modal — the facts stay live beside it.
function applyRca() {
  const body = document.getElementById('case-body');
  const open = state.screen === 'case' && state.rcaOpen;
  if (body) body.classList.toggle('rca-open', open);
  const close = document.getElementById('rca-close');
  if (close) close.hidden = !open;
}

// The case header: who is on the case, the stage, and the way back. Rendered
// from the selected review — the same object the queue row reads — so name
// and stage cannot drift between the two surfaces.
function renderCaseHeader() {
  const el = document.getElementById('case-header');
  if (!el) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) { el.innerHTML = ''; return; }
  const [stage, kind] = _stageOf(r);
  const meta = [r.booking?.experience, (r.tier && r.tier !== '—') ? r.tier : '']
                 .filter(Boolean).join(' · ');
  const owner = (r.owner == null) ? '' : String(r.owner);
  el.innerHTML = `
    <button class="back-to-inbox" id="back-to-inbox">← Inbox</button>
    <div class="ch-divider"></div>
    <div class="ch-name">${esc(r.author)}</div>
    <div class="ch-meta">${esc(meta)}</div>
    <span class="tag stage-${kind} ch-stage">${stage}</span>
    <label class="ch-owner ${owner.trim() ? 'is-owned' : ''}">
      <span class="ch-owner-label">Picked up by</span>
      <input type="text" id="case-owner-input" value="${esc(owner)}"
             placeholder="unassigned" autocomplete="off" spellcheck="false" />
    </label>
    <button class="ch-rca" id="open-rca">RCA &amp; response →</button>`;
  el.querySelector('#back-to-inbox').addEventListener('click', () => {
    state.screen = 'inbox'; applyScreen(); renderInbox();
  });
  el.querySelector('#open-rca').addEventListener('click', () => {
    state.rcaOpen = true; applyRca();
  });
  const inp = el.querySelector('#case-owner-input');
  // Saved on blur, and on Enter (which blurs). No claim button — the associate
  // types the name, and it stays editable because reviews get handed over.
  inp.addEventListener('blur', () => saveOwner(r.id, inp.value));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
}

// Persist the typed owner. Optimistic, then reconciled with what the server
// stored — and on failure it REVERTS, because a control that looks saved and
// was not is invariant 9 broken (a bound and an unbound control must not look
// alike). renderInbox() repaints the queue column from the same record.
async function saveOwner(id, name) {
  const r = REVIEWS.find(x => x.id === id);
  if (!r) return;
  const trimmed = (name || '').trim();
  if ((r.owner == null ? '' : String(r.owner)) === trimmed) return;   // nothing changed
  const prev = r.owner;
  r.owner = trimmed;                 // optimistic; "" means typed-then-cleared
  renderInbox();
  // Reconcile against the record as it stands AFTER the await, re-found by id —
  // never the `r` captured above. A fetchInbox that lands mid-request rebuilds
  // REVIEWS with fresh objects, orphaning that `r`; writing the authoritative
  // value (or the revert) to the detached copy would leave the visible record
  // — the one renderInbox now reads — untouched. A failed save that silently
  // sticks is precisely the invariant-9 break this function exists to prevent.
  const settle = (val) => {
    const cur = REVIEWS.find(x => x.id === id);
    if (cur) cur.owner = val;
    renderInbox();
    if (state.screen === 'case') renderCaseHeader();
  };
  try {
    const resp = await fetch(`/api/reviews/${encodeURIComponent(id)}/picked-up-by`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: trimmed}),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    settle(data.picked_up_by);       // authoritative (server trims/caps)
  } catch (e) {
    settle(prev);                    // it did not save — do not look saved
    console.error('[owner] could not save "picked up by":', e);
  }
}

// The translation belongs on every card, not just the matched ones: the
// reply goes out in the guest's language, so whoever writes it needs the
// English beside the original whatever tier the review sits in.
//
// ABSENT ENGLISH HAS FOUR CAUSES AND THEY ARE NOT THE SAME. The line here used
// to be "Not translated yet — re-run this review to generate it" for all of
// them, under a comment asserting it "means the translation step never ran".
// It does not. pipeline.py step 1 leaves body_english empty when:
//
//   1. the run died before step 1            — re-running is the fix
//   2. the model answered ENGLISH_ALREADY    — nothing is wrong; a Spanish
//                                              review answered this way is a
//                                              MIS-detection, not a no-op
//   3. english_or_reject refused the result  — a wrong-language translation is
//                                              a FAILED one, kept out on purpose
//   4. the translate call threw              — the reason is on the trail
//
// Re-running only helps case 1, and telling an associate to re-run a review
// whose translation is being actively rejected sends them round a loop that
// cannot terminate. The pipeline already writes which one happened onto the
// confidence trail (`_xl_trail`, prepended, mark pass|warn); this reads it
// back instead of guessing. No trail entry at all IS case 1, and says so.
function _translationNote(r) {
  const t = (r.confidenceTrail || []).find(
    c => c && typeof c.text === 'string' && /<strong>Translation<\/strong>/.test(c.text));
  if (!t) return null;
  // The trail carries the sentence and the verdict; strip the markup and hand
  // both back so the caller can colour a warn differently from a pass.
  return {mark: t.mark || 'pass',
          why: String(t.text).replace(/<[^>]+>/g, '').replace(/^Translation\s*—\s*/, '')};
}

function translationCard(r) {
  const foreign = (r.lang || '').toUpperCase() !== 'EN';
  if (r.english) {
    return `<div class="translation-card">
      <div class="translation-label">English translation · AI</div>
      <div class="translation-body">${esc(r.english)}</div>
    </div>`;
  }
  if (!foreign) return '';
  const note = _translationNote(r);
  // No entry on the trail: step 1 did not run on any completed pass. This is
  // the only case a re-run actually fixes, so it is the only one that says so.
  const body = !note
    ? `<div class="rca-empty">Not translated yet — the translation step has
         not run on this review. Re-run it to generate one.</div>`
    : `<div class="rca-empty${note.mark === 'warn' ? ' err' : ''}">${
        note.mark === 'warn' ? '⚠ ' : ''}No English stored — ${esc(note.why)}</div>`;
  return `<div class="translation-card">
    <div class="translation-label">English translation · AI</div>
    ${body}
  </div>`;
}

// §13 the booking timeline lives in the FACTS column now: it is
// system-of-record data (created / fulfilment / sent / refunded), which is
// what that column is for. No treatment change - same 88px mono grid,
// same editable rows, same + Add event. Top-level because the column that
// renders it is no longer the one that built it.
// §5 "Unknown" / "N/A" / "TBD" from the model are not timestamps. Hoisted
// with the booking timeline it serves, which now renders from the facts
// column - the same rule applies to convo and action times.
function _tlTime(t) {
  const v = String(t || '').trim();
  // "undated" is prompt rule 10b's answer, not a failed timestamp: the entry
  // came from the guest's narrative, which has an order but no clock. It is
  // dropped to '' like the other non-times so the column stays clean, and the
  // section footnote below says how many rows are in that state — a per-row
  // word would repeat itself down the whole column.
  return (!v || /^(unknown|n\/?a|none|null|tbd|undated|-)$/i.test(v)) ? '' : v;
}

// How many rows of a timeline have no time, and whether the model said why.
// A column of dashes reads as timestamps we failed to load. Distinguishing
// "the guest narrated this, so there was never a clock" from "this is a real
// system event whose time is not recorded" is the difference between a
// working RCA and a broken lookup, and they rendered identically.
function _undatedNote(rows, raw) {
  const missing = rows.filter(l => !l.time).length;
  if (!missing) return '';
  const narrated = (raw || []).filter(l => l && typeof l === 'object'
    && /^undated$/i.test(String(l.time || '').trim())).length;
  const unverified = (raw || []).filter(l => l && typeof l === 'object'
    && /guest's account, unverified/i.test(String(l.detail || ''))).length;
  const n = Math.max(narrated, unverified);
  if (n >= missing && missing === rows.length)
    return `Every entry here is the guest's own account of the order things `
         + `happened in — the systems returned no events for this booking, so `
         + `there are no timestamps to show. Not a failed lookup.`;
  if (n)
    return `${n} of ${missing} undated ${n === 1 ? 'entry is' : 'entries are'} `
         + `the guest's account, which has an order but no clock. The `
         + `${missing - n} other${missing - n === 1 ? '' : 's'} are system `
         + `events whose time is not recorded.`;
  return `${missing} ${missing === 1 ? 'entry has' : 'entries have'} no time. `
       + `The model gave no reason, so this is not the same as a guest-narrated `
       + `sequence — check the confidence trail.`;
}

// ── ONE CHRONOLOGICAL TIMELINE ────────────────────────────────────────────
//
// The card carried two: "Booking timeline" in the facts column, built from the
// model's booking_logs, and "Events timeline" in the RCA column, built from
// the real Zendesk events. Two lists of the same story, in two places, each
// missing what the other had — the events had the actor, the channel and the
// ticket link; the logs had the readable detail line and could be edited.
// A reader had to hold both in their head and neither was complete.
//
// They merge here, in the FACTS column, under the heading that column already
// had. Rows are sorted by time and nothing is pinned: the review takes its
// place by its own timestamp rather than being forced last, which matters now
// that the publish date is read from the payload instead of being the moment
// Slack relayed it.
//
// Events are read-only — they are what Zendesk recorded. booking_logs rows
// stay editable, because they are the model's account and a person may need
// to correct it. That difference is visible: only the editable rows carry the
// delete control.
const _TL_MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,
                    jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

// A comparable number for a timeline row, or null when it has no time at all.
//
// The two halves of this list carry times in different shapes. Real events
// have `time_sort`, an ISO string the pipeline attaches. booking_logs rows
// have whatever the model wrote, which is normally "21 Jul 15:28" — no year,
// and nothing a lexical sort can do anything with. Comparing the two as
// strings put an August log row above a July event, because "~" sorts before
// digits and a bare day-month sorts nowhere sensible.
//
// The missing year is taken from the review, which is the only year in scope:
// these are all events on one booking, weeks apart at most.
function _tlSortValue(row, fallbackYear) {
  // THE DISPLAYED TIME FIRST, and time_sort only as a fallback.
  //
  // They are in DIFFERENT TIME ZONES. `time_sort` is the pipeline's UTC
  // instant; `time` is what the row shows, in IST. A log row has only the
  // displayed string, so comparing one row's UTC against another's IST put a
  // 21:22 UTC event after a 02:50 IST one — on screen, 02:52, 02:59, 02:50,
  // 02:51, which is the whole point of a chronology gone.
  //
  // Sorting on what the reader SEES keeps every comparison in one frame, and
  // it is the order they will check the list against.
  const t = String(row.time || '').trim();
  const shown = t ? _tlParse(t, fallbackYear) : null;
  if (shown !== null) return shown;
  const iso = String(row.time_sort || '').trim();
  if (iso) {
    const n = Date.parse(iso.length <= 10 ? iso + 'T00:00:00' : iso);
    if (!isNaN(n)) return n;
  }
  return null;
}

function _tlParse(t, fallbackYear) {
  if (!t) return null;
  // NORMALISE FIRST, exactly as the display does. `stampText` runs
  // `normaliseStamp` before formatting, so a raw epoch renders as a proper
  // "04 Aug 15:52" in the gutter — while this function parsed the RAW value,
  // where an epoch matches neither branch below and returns null. A null sort
  // value sinks the row to the end, so "Booking created" showed a correct
  // 04 Aug 15:52 and rendered BELOW a review posted on 05 Aug.
  //
  // The display and the sort reading one value through two different paths is
  // the same defect this function's own comment describes for time_sort vs
  // time. One value, one path.
  t = normaliseStamp(t) || t;
  // "2026-08-02 10:00" and "2026-08-02T10:00" — already carries its year.
  // Parsed WITHOUT a zone so it is read as local, the same frame the
  // day-month branch below uses. A trailing Z or offset would be honoured by
  // Date.parse and drag one row into another timezone.
  const bare = t.replace(' ', 'T').replace(/(Z|[+-]\d{2}:?\d{2})$/, '');
  let n = Date.parse(bare);
  if (!isNaN(n)) return n;
  // "21 Jul 15:28" / "21 Jul" — day, month name, optional clock, no year.
  const m = t.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*(?:\s+(\d{1,2}):(\d{2}))?/);
  if (m && _TL_MONTHS[m[2].toLowerCase()] !== undefined) {
    // new Date(...), not Date.UTC: the branch above parses as local, and two
    // branches in two zones is the fault this function exists to fix.
    return new Date(fallbackYear, _TL_MONTHS[m[2].toLowerCase()],
                    +m[1], +(m[3] || 0), +(m[4] || 0)).getTime();
  }
  return null;
}

function mergedTimelineRows(r, v3d) {
  const evs = (r.events || []).map(e => ({
    kind: 'event',
    time: e.time || '', time_sort: e.time_sort || '',
    thread: e.thread || '', actor: e.actor || '', label: (e.label || '').trim(),
    detail: e.summary || '', ticket_id: e.ticket_id || '',
    is_internal: !!e.is_internal, internal_reason: e.internal_reason || '',
  }));
  const logs = (v3d.booking_logs || []).map((l, i) => (typeof l === 'string'
    ? {kind: 'log', idx: i, time: '', label: l.replace(/^\s*\d+[.)]\s*/, ''),
       detail: '', hand: true}
    : {kind: 'log', idx: i, time: _tlTime(l.time), label: l.what || '',
       detail: l.detail || '', hand: !!l.hand}));
  // The year the undated log rows belong to. Taken from the review's own date
  // where there is one, else from the first event that carries a year.
  const _y = (() => {
    const d = Date.parse(String(r.receivedAt || '').trim());
    if (!isNaN(d)) return new Date(d).getUTCFullYear();
    for (const e of evs) {
      const n = Date.parse(String(e.time_sort || ''));
      if (!isNaN(n)) return new Date(n).getUTCFullYear();
    }
    return new Date().getUTCFullYear();
  })();
  // THE TWO SOURCES ARE NOT TWO SETS OF FACTS. The Zendesk events are the
  // RECORD; booking_logs is the model NARRATING that same record. Merging
  // both showed every event twice — once with a channel chip, once with a
  // delete button — seventeen rows for nine events on a real card.
  //
  // MATCHING THEM UP CANNOT WORK, and trying was the first mistake. "Guest
  // reached out" and "Guest fulfilment query — no CE action recorded" are the
  // same event at the same minute sharing one word; "Guest reply" and "Refund
  // issued" are DIFFERENT events at the same minute. No overlap threshold
  // separates those two cases, and a wrong guess either hides a real event or
  // shows a duplicate.
  //
  // So there is no guessing. Where Zendesk gave us events they are the
  // timeline, and the only booking_logs rows shown beside them are the ones a
  // PERSON typed — the only ones carrying anything the events do not. Where
  // there are no events at all, the narration is all we have and it is shown
  // in full.
  const kept = evs.length ? logs.filter(l => l.hand) : logs;
  const all = [...evs, ...kept].map(x => ({...x, _sv: _tlSortValue(x, _y)}));
  // A row with NO time sinks to the end rather than floating to the top: an
  // undated row at the top reads as the first thing that happened, which is a
  // claim nobody made. Ties keep the order they arrived in, so an event and
  // a log row at the same minute stay put rather than swapping on re-render.
  return all
    .map((x, i) => [x, i])
    .sort((A, B) => {
      const a = A[0]._sv, b = B[0]._sv;
      if (a === null && b === null) return A[1] - B[1];
      if (a === null) return 1;
      if (b === null) return -1;
      return a - b || A[1] - B[1];
    })
    .map(([x]) => x);
}

function bookingTimelineHtml(r, v3d) {
  const rows = mergedTimelineRows(r, v3d);
  const logRows = rows.filter(x => x.kind === 'log');
  const internal = rows.filter(x => x.is_internal);
  const shown = state.tlShowInternal ? rows : rows.filter(x => !x.is_internal);
  const _zdBase = (r.zendeskSubdomain || 'headout');

  // The section renders even with nothing in it. It used to collapse to ''
  // on an empty list, which took the "+ Add event" button with it - so the
  // one case where a human most needs to write the timeline by hand was the
  // one case with no way to do it, and the RCA simply had no such heading.
  // WHY IT IS EMPTY, and never a claim the lookup ran. This wording came off
  // the events timeline before the merge — the panel cannot know whether
  // Zendesk was searched, so it points at the trail, which does know. Losing
  // it in the move would have traded a section that said which kind of empty
  // this is for one that just looked blank.
  const emptyWhy = (r.booking && r.booking.bid)
    ? 'No Zendesk events were found for this booking, and no events were '
      + 'written for it. Whether the lookup ran is in the confidence trail '
      + 'above. Re-run the RCA, or add the events by hand below.'
    : (r.candidateState
        ? 'No booking is confirmed yet, so there is no system timeline to draw from. Confirm a candidate above and re-run the RCA, or add the events by hand below.'
        : 'No booking was matched, so there is no system timeline to draw from. Add the events by hand below.');

  const row = (x) => {
    // A Zendesk event: read-only, with everything that says WHERE it came
    // from — the channel it arrived on, who acted, and the ticket it is on.
    if (x.kind === 'event') return `
      <div class="tl-row tl-row-event${x.is_internal ? ' tl-internal' : ''}">
        <span class="tl-time">${esc(stampText(x.time)) || '—'}</span>
        <div class="tl-body">
          <div class="tl-head">
            ${x.thread ? `<span class="tl-thread ${esc(x.thread)}">${esc(x.thread)}</span>` : ''}
            <span class="tl-what">${esc(x.label)}</span>
            ${x.is_internal
              ? `<span class="tl-flag" title="Internal note">${esc(x.internal_reason || 'internal')}</span>` : ''}
            ${x.ticket_id
              ? `<a class="tl-tid" href="https://${esc(_zdBase)}.zendesk.com/agent/tickets/${esc(x.ticket_id)}" target="_blank" rel="noopener">ZD-${esc(x.ticket_id)}</a>` : ''}
          </div>
          ${x.detail ? `<div class="tl-detail-line">${esc(x.detail)}</div>` : ''}
        </div>
      </div>`;
    // A booking_logs row: the model's own account, and editable, because a
    // person may need to correct it. Only these carry the delete control —
    // that is what tells the two kinds apart without a legend.
    return `
      <div class="tl-row">
        <span class="tl-time editable-text${x.time ? '' : ' is-placeholder'}"
              contenteditable="true" spellcheck="false"
              ${x.time ? '' : 'data-ph="—"'}
              data-log-idx="${x.idx}" data-log-field="time">${esc(x.time) || '—'}</span>
        <div class="tl-body">
          <div class="tl-head">
            <span class="tl-what editable-text" contenteditable="true" spellcheck="false"
                  data-log-idx="${x.idx}" data-log-field="what">${esc(x.label)}</span>
          </div>
          <div class="tl-detail-line"><span class="editable-text" contenteditable="true"
                spellcheck="false" data-log-idx="${x.idx}"
                data-log-field="detail">${esc(x.detail) || 'no detail'}</span></div>
        </div>
        <button class="row-del" data-log-del="${x.idx}" title="Remove event">×</button>
      </div>`;
  };

  return `
  <div class="section" id="rca-booking-logs-section">
    <div class="section-label"><span>Events timeline</span>
      <span class="hint">times in IST</span>
      ${shown.length ? `<span class="sec-count">${shown.length} event${shown.length === 1 ? '' : 's'}</span>` : ''}
    <span class="section-chev">▾</span></div>
    ${shown.length ? '' : `<div class="rca-empty">${
        // EMPTY MEANS FOUR DIFFERENT THINGS AND THE READER ACTS ON EACH ONE
        // DIFFERENTLY. This branch used to print one sentence for all of
        // them, which said "No Zendesk events were found" over a booking
        // whose every event was internal and merely filtered out — false,
        // and it took the toggle with it, because the toggle is appended to
        // the row string this branch never renders.
        rows.length
          ? `Every event on this booking is internal machinery, so the filter `
            + `has emptied the list. Nothing is missing — use the toggle below `
            + `to see ${rows.length} internal note${rows.length === 1 ? '' : 's'}.`
          : ((r.zendeskTicketIds || []).length
              // Tickets matched and carried nothing. "No events were found"
              // sends the reader nowhere; a ticket number is something they
              // can open.
              ? `${(r.zendeskTicketIds || []).length} tickets matched this `
                + `booking and none of them carried a readable event. Open them `
                + `on Zendesk, or add the events by hand below.`
              : emptyWhy)}</div>`}
    ${shown.map(row).join('')}
    ${/* Rendered outside the row list on purpose. It used to be appended to
          the rows string, so an all-internal timeline — the one case where a
          reader most needs it — rendered no rows and therefore no toggle. */
      internal.length ? `<div class="tl-hidden-note" data-tl-toggle>${
        state.tlShowInternal
          ? `showing ${internal.length} internal note${internal.length === 1 ? '' : 's'} · hide`
          : `${internal.length} internal note${internal.length === 1 ? '' : 's'} hidden · show`}</div>` : ''}
    ${(() => { const n = _undatedNote(logRows, v3d.booking_logs);
       return n ? `<div class="tl-undated-note">${esc(n)}</div>` : ''; })()}
    <button class="row-add" data-log-add>+ Add event</button>
  </div>`;
}


function renderReviewCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('review-col').innerHTML = `<div class="empty-state" style="padding: 60px 20px;">Select a review from the inbox.</div>`;
    return;
  }

  const col = document.getElementById('review-col');

  // Processing shares this layout: neither has a booking to render, and the
  // traceable branch below would dereference one. What differs is the CLAIM
  // the panel makes — "no booking found" is a result, and a run that has not
  // searched yet has produced no result to report.
  // A review closed out of Untraceable / Candidates / Processing keeps its
  // bucket only until it is sent — after that classify() answers "sent", and
  // the branch below is the only one that can render a card with no booking
  // on it. Before Close out existed those reviews could never reach Sent, so
  // this state could not occur; now it can, and the full layout would draw a
  // booking panel over an empty object.
  const _closedNoBooking = r.type === 'sent'
    && !((r.booking || {}).bid || (r.booking || {}).id);
  if (r.type === 'untraceable' || r.type === 'processing' || _closedNoBooking) {
    col.innerHTML = `
      <div class="story-col">
      ${r.closedAt ? `
      <div class="content-mismatch">
        <span class="reconcile-mark">✓</span>
        <span class="reconcile-text">Closed out ${esc(
          new Date(r.closedAt).toLocaleString('en-GB',
            {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))} —
          ${esc(r.closeReason || 'no reason was recorded')} Nothing was posted
          to Slack.</span>
      </div>` : ''}

      <div class="review-card">
        <div class="review-card-head">
          <div class="review-author-line">${esc(r.author)}</div>
          <div class="review-meta">${esc(r.lang)} · no reference</div>
        </div>
        <span class="review-stars">${r.stars}</span>
        <div class="review-body-original">${esc(r.original)}</div>
        ${translationCard(r)}
      </div>
      </div><!-- /story-col -->
      <div class="facts-rail-handle" data-rail-drag title="Drag to resize the facts rail"></div>
      <div class="facts-rail">

      <div class="facts-block">
        <div class="facts-head"><span class="facts-head-title">Booking match</span>
          <button class="rerun-btn" data-rerun-match title="Re-run the booking search for this review">↻ Re-run</button>
        </div>
        <div class="match-card">
          <div class="match-top">
            <span class="match-tier-badge untr">—</span>
            <div>
              <div class="match-title">${r.type === 'processing'
                ? (r.processingState === 'stalled'
                     ? 'The run stopped before it searched'
                     : 'Still running — nothing searched yet')
                : 'No booking found'}</div>
              <div class="match-method">${r.type === 'processing' ? ''
                : 'No venue, date or name usable for search'}</div>
            </div>
          </div>
          <div class="match-warn">${r.type === 'processing'
            ? esc(r.processingReason || 'This review has no draft row yet.')
            : (r.untraceableReason
            || 'No trail was recorded — the pipeline never reached matching. Re-run the match; if it stays empty the run fails before matching.')}</div>
        <!-- Reads r.confidenceTrail, the trail the pipeline actually writes.
             This panel used to read r.untraceableChecks, which nothing in the
             client ever assigns - so it was empty on every untraceable review
             no matter what matching had done, and an empty panel got read as
             "matching never ran". Each step keeps its own mark instead of a
             hardcoded ✗: a warn and a fail are different findings. -->
          ${trailSection(r.confidenceTrail, 'a')}
        </div>
      </div>
      </div><!-- /facts-rail -->
    `;
    return;
  }

  const b = r.booking;

  // The pipeline now settles thread, actor, timestamp, machinery and ticket
  // id where the event is built. This used to redo all of it here: filtering
  // machinery by regex over rendered text, converting a second timestamp
  // format, and INFERRING the thread pill from whether a Claude-written
  // summary happened to contain the word "chat". Every one of those was a
  // repair applied after the wrong data had been stored, in the one place it
  // could not be tested - and each one hid the upstream bug it was covering.
  //
  // What is left is a display decision: machinery is hidden by default and
  // counted, so an associate reads the guest's story and can still get at the
  // rest. Nothing is dropped silently.

  const ins = r.insights;
  const similarSupport = ins.similarSupport || [];
  const similarReviews = ins.similarReviews || [];
  const totalSimilar = similarSupport.length + similarReviews.length;
  const summaryLine = totalSimilar === 0
    ? 'No similar complaints found in window'
    : `Found <strong>${similarSupport.length}</strong> in support · <strong>${similarReviews.length}</strong> in reviews on the same issue`;
  const similar = `<div class="insight-tile full">
       <div class="insight-tile-label">Similar complaints — TID·VID</div>
       <div class="similar-summary-line">${summaryLine}</div>
       ${similarSupport.length > 0 ? `
         <div class="similar-sub-label">In support (Zendesk chats / calls / emails)</div>
         <div class="similar-list">
           ${similarSupport.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
       ${similarReviews.length > 0 ? `
         <div class="similar-sub-label">In reviews (Trustpilot)</div>
         <div class="similar-list">
           ${similarReviews.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
     </div>`;

  // What the AI pulled out of the review — the inputs every search and score
  // downstream is built from. Shown plainly so a wrong match is traceable to a
  // wrong indicator rather than looking like a mystery.
  const _sig = r.extractedSignals || {};
  const _ind = _sig.match_indicators || {};
  const _sigRows = [
    ['Venue / experience', _ind.experience_or_venue],
    ['City / country',     _ind.city_or_country],
    ['Guest name',         _ind.guest_name],
    ['Visit date hint',    _ind.visit_date_hint],
    ['Pax',                _ind.pax || _sig.pax_hint],
    ['Searched Zendesk as', [_sig.author_first, _sig.author_last].filter(Boolean).join(' ')],
    ['Venue hints used',   (_sig.venue_hints || []).join(' · ')],
  ].filter(([, v]) => v != null && String(v).trim() !== '');

  const signalsBox = _sigRows.length
    ? `<div class="section">
         <div class="section-label">Extracted from review<span class="section-chev">▾</span></div>

           ${_sigRows.map(([k, v]) => `
             <div class="detail-row">
               <span class="k">${k}</span>
               <span class="v">${String(v)}</span>
             </div>`).join('')}
         </div>
       </div>`
    : (() => {
        // When the booking was found by its id, no indicators were ever needed
        // and their absence is not a problem. Rendering an amber "Matching has
        // no indicators to search on" next to a green "Direct match · BID
        // confirmed" reads as a contradiction and makes a healthy match look
        // broken.
        //
        // Derived here rather than trusting the server to have set
        // matching_skipped: the client already knows the match tier, and a
        // draft written before that field existed would still show the alarm.
        const _bidMatched = !!(r.booking && (r.booking.bid || r.booking.id))
                            && (r.matchTier === 1 || r.match_tier === 1
                                || _sig.matching_skipped);

          || (_bidMatched
              ? `Not needed — the review carried its booking id, so the booking was

        return `<div class="section">
         <div class="section-label">Extracted from review<span class="section-chev">▾</span></div>
         <div class="chk-none" style="font-size:12px;color:${_bidMatched ? 'var(--muted-2)' : 'var(--amber)'}">
           ${_msg}
         </div>
       </div>`;
      })();

  // Slack pings referencing this BID — ops/escalation/SP chatter that never
  // reaches Zendesk but is part of what actually happened to the booking.
  //
  // Three states, not two. search_mentions returns a sentinel row when it
  // could not search at all - no user token, or the API refused for want of
  // search:read - and rendering that as "No Slack messages found" states
  // something about the workspace that nobody looked at. An unsearched
  // workspace and an empty one lead to opposite conclusions during an RCA.
  const _mentions = r.slackMentions || [];
  const _searchDead = !!(_mentions.length && _mentions[0].search_unavailable);
  const slackPings = r.booking && r.booking.bid
    ? `<div class="section">
         <div class="section-label">Slack mentions of this BID<span class="section-chev">▾</span></div>
         ${_searchDead ? `
         <div class="chk-none" style="font-size:12px;color:var(--amber)">
           ${(_mentions[0].text || 'Slack could not be searched.').replace(/</g,'&lt;')}
         </div>` : _mentions.length ? `
         <div class="details-grid">
           ${_mentions.map(m => `
             <div class="detail-row" style="grid-template-columns:130px 1fr">
               <span class="k">#${m.channel || '—'}${m.user ? ' · ' + m.user : ''}</span>
               <span class="v" style="white-space:normal">${(m.text || '').replace(/</g,'&lt;')}${m.permalink ? ` <a href="${m.permalink}" target="_blank" style="color:var(--accent)">open</a>` : ''}</span>
             </div>`).join('')}
         </div>` : `
         <div class="chk-none" style="font-size:12px">Slack was searched — no messages mention this booking.</div>`}
       </div>`
    : '';

  const confTrail = trailSection(r.confidenceTrail, 'b');

  col.innerHTML = `
    <div class="story-col">

    <div class="review-card">
      <div class="review-card-head">
        <div class="review-author-line">${esc(r.author)}</div>
        <!-- WHETHER THE REVIEW CARRIED A BOOKING ID, not which bucket it
             landed in. This read r.type === 'identified', so every review
             outside that bucket said "no BID in text" — including one whose
             BID was extracted from the review, verified in BigQuery, and
             named in the trail two panels down. The card contradicted itself
             because two elements derived one fact from different stores.

        <div class="review-meta">${esc(r.lang)}${(() => {

          if (!hasBid) return ' · no BID in text';
          // A BID that is present but not yet confirmed is a different fact
          // from one that matched, and from none at all. Three states, three
          // sentences — the middle one is exactly this case.
          return r.type === 'identified'
            ? ' · BID ' + esc(shown)
            : ' · BID ' + esc(shown) + ' in text — not confirmed';

      </div>
      <span class="review-stars">${r.stars}</span>
      <div class="review-body-original">${esc(r.original)}</div>

           chars of "IST" wrapped the 80px time column and read as three
           date formats); the stored string keeps its suffix and

      ${bookingTimelineHtml(r, (r.rca && r.rca.v3) || {})}
    </div>
    </div><!-- /story-col -->
    <div class="facts-rail-handle" data-rail-drag title="Drag to resize the facts rail"></div>

    <div class="facts-block">

      </div>
      <div class="match-card">

               attachment" — which is the confidence trail below, rebuilt as
               one run-on sentence and printed twice on the same card. The
               trail says it properly, tick by tick. -->
          <div><div class="match-title">${r.matchTitle}</div></div>
        </div>
        ${(() => {
          // Only on a clear disagreement. "unchecked" draws nothing: a line
          // saying we could not tell would appear on most reviews and teach
          // the reader to skip this whole area, which costs more than it
          // saves. A match draws nothing either — it is the expected case.
          const cm = r.contentMatch;
          if (!cm || cm.state !== 'mismatch') return '';
          return `<div class="content-mismatch">
            <span class="reconcile-mark">⚠</span>
            <span class="reconcile-text">This review reads like a
              <strong>${esc(cm.review_family)}</strong>, but this booking is a
              <strong>${esc(cm.booking_family)}</strong>${
                cm.experience ? ` (${esc(cm.experience)})` : ''}. The guest may
              have given a reference number for a different booking — check
              before relying on the match.</span>
          </div>`;
        })()}
        ${(() => {
          // The same rule as the content check above, and for the same
          // reason: only a clear disagreement draws. "match" and "unchecked"
          // are NOT silent — the pipeline writes both onto the confidence
          // trail below this line, which is where a reader goes to see what
          // ran. Drawing them here as well would put an amber-adjacent row on
          // every card and turn this whole area into furniture.
          const im = r.indicatorMatch;
          if (!im || im.state !== 'mismatch') return '';
          const rows = (im.signals || []).filter(s => s.state === 'mismatch');
          return `<div class="content-mismatch">
            <span class="reconcile-mark">⚠</span>
            <span class="reconcile-text">This booking id is real, but it does
              not match what the review says. ${rows.map(s =>
                `<strong>${esc(s.name)}</strong>: ${esc(s.why)}`).join('; ')}.
              The guest may be quoting someone else's reference number. The
              match has NOT been undone — confirm before relying on it.</span>
          </div>`;
        })()}
        ${signalsBox}
        ${confTrail}
        ${slackPings}
      ${r.candidateState && r.candidatesList ? `
        <div class="candidates-picker">
          <div class="candidates-picker-label">Pick the correct booking to continue</div>
          ${r.candidatesList.some(c => c.scoreVenue != null) && !r.candidatesList.some(c => c.venueSignal) ? `
          <div class="candidates-picker-label" style="color:var(--amber);text-transform:none;letter-spacing:0">
            ⚠ No venue agreement — none of these match the venue in the review.
            Ranked on the whole match score, not on the venue; treat as weak.
          </div>` : ''}
          ${r.candidatesList.map((c, i) => {
            const hasScore = typeof c.score === 'number' && c.score > 0;
            const pct = hasScore ? Math.min(100, Math.round(c.score / 5 * 100)) : 0;
            const metaParts = [
              c.guestName,
              c.vendorName,
              c.experienceDate,
              c.contactCount ? `${c.contactCount} support contact${c.contactCount > 1 ? 's' : ''}`
                             + (c.contactTags ? ` · ${c.contactTags}` : '') : '',
              (c.tgid || c.tid) ? `TGID ${c.tgid || '—'} / TID ${c.tid || '—'}` : '',
              c.leadTime ? `lead ${c.leadTime}` : '',
            ].filter(Boolean);
            return `
            <div class="candidate-card ${i === 0 ? 'selected' : ''}" data-candidate-idx="${i}">
              <div class="candidate-top">
                <div class="candidate-bid">#${c.bid}</div>
                ${hasScore ? `
                <div class="candidate-score" title="${_candScore(c)}">
                  <span class="candidate-score-bar"><span class="candidate-score-fill" style="width: ${pct}%"></span></span>
                  ${_candScore(c)}
                </div>` : ''}
              </div>
              <div class="candidate-exp">${c.experience || '—'}</div>
              <div class="candidate-meta">${metaParts.length ? metaParts.join(' · ') : (() => {
                // NOTHING IS LOADING. This said "Booking details load on
                // confirm", which reads as a spinner for a state that is
                // permanent: no request is in flight and none will be until
                // Confirm is pressed. A reader waits for something that is
                // never coming — "we found nothing" rendered as "we have not
                // finished yet", which is the one thing this card must not do.
                //
                // FOUR DIFFERENT FACTS, and the server says which. This used
                // to branch on the PATH — `indicator_shortlist` meaning "never
                // queried the warehouse" — which stopped being true when the
                // shortlist started resolving its ids. A message inferred from
                // a path is a message that goes stale the moment the path
                // changes what it does, silently, while still reading as an
                // explanation.
                //
                // "we looked and it is not there" and "we could not look" must
                // not share a sentence: the first is a dead end, the second is
                // a re-run.
                if (c.detailsLookup === 'absent')
                  return 'This id is not in the warehouse — the Zendesk ticket is everything we have on it.';
                if (c.detailsLookup === 'failed')
                  return 'The booking lookup did not complete, so nothing here was ruled out. Re-run to try again.';
                if (c.detailsLookup === 'found')
                  return 'The booking record was read and carries no experience, date or vendor.';
                // No answer recorded — a candidate built before the lookup
                // existed, or by a path that does not do one. Says that it
                // does not know, rather than picking one of the three above.
                return 'No booking details were read for this id. Confirm to fetch them.';
              })()}</div>
              <div class="candidate-reasons">
                ${(c.matchReasons || []).map(r => `<span class="candidate-reason-pill">${r}</span>`).join('')}
              </div>
            </div>`;
          }).join('')}
          <div class="picker-actions">
            <button class="candidate-confirm-btn">Confirm · run full RCA</button>
            <button class="skip-btn" data-mark-untraceable
                    title="None of these is this guest's booking">None → Untraceable</button>
            <!-- The third outcome, which had nowhere to go. Send ↑ lives in
                 the RCA column header, and that header is replaced by this
                 picker for a review in candidate state — so a review nobody
                 could confirm could not be finished at all. -->
            <button class="skip-btn" data-close-out
                    data-close-reason="Closed without confirming a booking — none of the candidates was this guest's."
                    title="Finish this review without confirming a booking. Nothing is posted to Slack.">Close out → Sent</button>
          </div>
        </div>
      ` : ''}
      </div>
    </div>

    <!-- SET THE BOOKING ID BY HAND. The commonest recovery there was no route
         for: the associate searches Zendesk or BMS, finds the booking the
         pipeline could not, and had nowhere to put it. Sits ABOVE Booking
         details and the timeline because everything below is regenerated from
         it. Shown in every state — on a matched review it overwrites, which
         is exactly when it is needed, since the pipeline being wrong is the
         reason to reach for it.
         No backticks in this comment: it is inside a template literal. -->
    <div class="facts-block bid-set-block">
      <div class="facts-head">
        <span class="facts-head-title">Booking ID</span>
        <span class="bid-set-hint">${r.type === 'identified'
          ? 'Replaces the current match and regenerates everything below'
          : 'Found it yourself? Set it here and everything below is built from it'}</span>
      </div>
      <div class="bid-set-row">
        <input class="bid-set-input" data-bid-set-input type="text" inputmode="numeric"
               placeholder="e.g. 33204378" value="" aria-label="Booking ID">
        <button class="btn" data-bid-set disabled>${r.type === 'identified' ? 'Replace' : 'Set'}</button>
      </div>
      <div class="bid-set-note" data-bid-set-note></div>
    </div>

    ${r.type === 'identified' ? `
    <div class="facts-block">
      <div class="facts-head"><span class="facts-head-title">Booking details</span></div>
      ${b.detailsLookup && b.detailsLookup !== 'found' ? `
      <div class="rca-empty" data-booking-lookup style="font-style:normal;color:var(--warn,#c93)">
        ${b.detailsLookup === 'failed'
          ? 'These fields are from the Zendesk ticket, not the booking record — the warehouse lookup did not complete. Re-run to fetch it.'
          : 'These fields are from the Zendesk ticket. The warehouse has no booking with this id, so there is no record to read.'}
      </div>` : ''}
      <div class="details-grid">
        <div class="detail-row"><span class="k">Booking ID</span><span class="v mono">${b.bmsLink ? `<a href="${b.bmsLink}" target="_blank" rel="noopener" class="bms-link">${b.bid}</a>` : b.bid}</span></div>
        <div class="detail-row"><span class="k">Experience</span><span class="v">${b.experience || "—"}</span></div>
        <div class="detail-row"><span class="k">TID name</span><span class="v ${b.tidName ? '' : 'placeholder'}">${b.tidName || '—'}</span></div>
        <div class="detail-row"><span class="k">TGID / TID</span><span class="v">${b.tgidLink ? `<a href="${b.tgidLink}" target="_blank" rel="noopener" class="tgid-link">${b.tgid || "—"}</a>` : (b.tgid || "—")} / ${b.tid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor ID</span><span class="v">${b.vid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor name</span><span class="v">${b.vendorName || "—"}</span></div>
        <div class="detail-row"><span class="k">Fulfilment type</span><span class="v">${b.fulfilmentType || '—'}</span></div>
        <!-- CANCELLATION IS NOT RENDERED FOR NOW, by request, to be brought
             back later. The ROW is gone; nothing that produces the value is.
             ticket_notes.cancellation_policy and policy_from_events still run,
             and b.cancellationPolicy / b.cancellationPolicyNote still reach
             the client, so restoring this is putting the row back and nothing
             else. Deleting the computation too would make "later" mean
             rebuilding it.
             NO BACKTICKS IN HERE: this comment sits inside a JS template
             literal, so one would end the string. The first version of this
             comment did exactly that and broke the parse. -->
        <!-- PRIMARY GUEST IS NOT RENDERED, by request, until the hash
             problem is actually solved. fct_bookings.primary_guest_name is a
             PII hash for a large share of rows, and the fallbacks — the
             Zendesk requester, the ticket custom field — resolve it often
             enough to look promising and rarely enough to be useless. What
             reached the card was a row that mostly read "— the warehouse
             stores this as a hash — check the Zendesk ticket": a row whose
             job had become telling the reader to go and do the lookup
             themselves.

             The DATA still ships. primaryGuestName and guestNameNote are on
             the payload and the resolution still runs, so restoring this is
             putting the row back and nothing else.

             NO BACKTICKS IN HERE, for the reason the comment above gives.
             The first version of THIS comment used them for three field
             names and broke the parse — directly underneath the warning. -->
        <div class="detail-row"><span class="k">Visit date</span><span class="v">${b.experienceDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Booking date</span><span class="v">${stampDetail(b.bookingDate || b.creationDate)}</span></div>
        <div class="detail-row"><span class="k">Review date</span><span class="v">${b.reviewDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Partnered vendor</span><span class="v">${b.isPartnered == null ? '<span class="placeholder">—</span>' : `<span class="pill-sm ${b.isPartnered ? 'pill-green' : 'pill-grey'}">${b.isPartnered ? 'Yes' : 'No'}</span>`}</span></div>
        <div class="detail-row"><span class="k">Escalation email</span><span class="v">${
          b.escalationEmail
            ? `<a href="mailto:${b.escalationEmail}" style="color:var(--accent)">${b.escalationEmail}</a>`
              + (b.escalationType ? `<span class="tile-n"> · ${b.escalationType}</span>` : '')
            : b.escalationEmailSource === 'none_found'
              ? `<span class="pill-sm pill-grey">None on record</span>`
              : `<span class="placeholder">not retrieved</span>`}</span></div>
        <div class="detail-row"><span class="k">Booking status</span><span class="v">${b.status ? `<span class="booking-status-pill status-${b.status}">${b.status}</span>` : '—'}</span></div>
        <div class="detail-row"><span class="k">Lead time</span><span class="v">${b.leadTime || '—'}</span></div>
      </div>
    </div>` : ''}

    <div class="facts-block">
      <!-- Picker lives outside the branch on purpose: it used to sit only in
           the fallback arm, so the moment real insights arrived it vanished
           and the window could not be changed at all. -->
      <div class="insights-header">
        <span class="insights-title">Experience insights</span>
        <div class="window-picker">
          <button class="window-btn ${state.insightsWindow === '7d' ? 'active' : ''}" data-window="7d">7d</button>
          <button class="window-btn ${state.insightsWindow === '30d' ? 'active' : ''}" data-window="30d">30d</button>
          <button class="window-btn ${state.insightsWindow === '90d' ? 'active' : ''}" data-window="90d">90d</button>
        </div>
      </div>
      <div class="insights-wrap">
        ${r.liveInsights ? (() => {
          const li = r.liveInsights;
          // Which window these numbers are ACTUALLY for, from the same payload
          // that carried them. The picker is a request; this is the answer.
          //
          // "the figures should be updating on the basis of the date window
          // but its not" — and there was no way to tell, from the panel, which
          // of the three layers had not updated: the click, the request, or
          // the query. Every tile read the same whether the switch had worked
          // or silently done nothing, which is this codebase's first rule
          // broken in the place it costs most, because the numbers are what
          // an RCA's "pattern" bullets are built on.
          //
          // So the window travels WITH the numbers. If it disagrees with the
          // button, the panel says so instead of putting fresh labels over
          // stale figures.
          const _wantD = windowDays(state.insightsWindow);
          const _gotD  = li._window_days;
          const _stale = _gotD != null && _wantD != null && _gotD !== _wantD;
          // rating_15d / rating_30d are back-compat aliases: the server sends
          // TGID in the first and TID.VID in the second. They are SCOPES, not
          // windows - the window is whatever the picker above is set to.
          const _ratTgid = li.rating_tgid || li.rating_15d || {};
          const _ratTv   = li.rating_tidvid || li.rating_30d || {};
          // Ops thumb rule: under 95%, and only over ~100 bookings, because the
          // rate is noise below that - one unfulfilled booking out of two is
          // 50%. The server applies both halves; needs_attention is the answer.
          const _ffAttn  = li.ff_vid ? !!li.ff_vid.needs_attention
                                     : (li.vid_completion_rate != null
                                        && li.vid_completion_rate < 0.95);
          // TGID's own attention flag is gone with its tile. It was read by
          // the Flag-to-Biz button and by nothing else, and a computed value
          // nothing reads is the thing this codebase keeps mistaking for a
          // live one. ff_tgid is still in the payload for whoever wants it.
          //
          // TID+VID, the tile that replaced TGID. Same rule: the server
          // applies the under-95%-over-100-bookings test and needs_attention
          // is its answer; the rate comparison is only the fallback for a
          // payload that predates it.
          const _ffAttnTv = li.ff_tidvid ? !!li.ff_tidvid.needs_attention
                                         : (li.tidvid_completion_rate != null
                                            && li.tidvid_completion_rate < 0.95);
          // Sample size, shown only when it changes how the number should be
          // read. Over 100 bookings the rate stands on its own; under it, the
          // ops rule says the rate is noise and the count is the honest
          // caveat. Zero is not a dash - "no bookings in this window" is a
          // fact about the vendor, and a dash reads as a broken query.
          // Which queries BROKE. A tile backed by one of these has no
          // number, and the affirmative wording below - "no bookings", "no
          // negative reviews" - would state a warehouse failure as a fact
          // about the vendor. _broken() marks those tiles instead.
          const _failed = new Set(li._failed_queries || []);
          const _broken = (...names) => names.some(n => _failed.has(n));
          const _err = '<span class="tile-empty" title="the query for this '
            + 'tile failed - this is not a zero">could not load</span>';

          const _rate = (r, n, ...q) =>
            _broken(...q) ? _err
            : n === 0 ? 'no bookings'
            : r == null ? '—'
            : `${(r * 100).toFixed(1)}%` +
              (n < 100 ? ` <span class="tile-n">of ${n} booking${n === 1 ? '' : 's'}</span>` : '');
          const _rr = li.review_ratio || 0;
          const _sr = li.support_ratio || 0;

          // Why a tile has no number. The server says so - _zeroed_because when
          // nothing could be computed, _partial_because when only the
          // vendor-level half ran. The subtitles used to read "no visit date"
          // no matter what the actual reason was, which is worse than silence:
          // it sends you looking for a missing date that was never the problem.
          const _why = li._zeroed_because || li._partial_because || '';
          const _n = (v) => (v == null ? '—' : v);
          const _pair = (a, b) =>
            (a == null || b == null) ? '—' : `${a} / ${b}`;

          // Grouped by the question each answers, because a flat grid of ten
          // equal tiles gives no clue which two matter for an RCA and which
          // are background. Ratio and counts were also two tiles showing one
          // fact - "12.5%" and "1 / 8" - so they are now one line each.
          // What the shortfall was. "57.1% of 7" leaves the obvious question
          // unanswered - three did not complete, why - and cancelled by the
          // vendor points somewhere different from a fulfilment backlog.
          // The booking ids behind the count. A number is something to note;
          // an id is something to open.
          const _ids = (list) => {
            if (!Array.isArray(list) || !list.length) return '';
            const shown = list.slice(0, 6).join(' · ');
            return `<div class="tile-why">${shown}` +
                   (list.length > 6 ? ` <span class="why-n">+${list.length - 6}</span>` : '') +
                   '</div>';
          };
          const _why_not = (rows) => {
            if (!Array.isArray(rows) || !rows.length) return '';
            return '<div class="tile-why">' + rows.slice(0, 3).map(r =>
              `<span class="why-n">${r.count}</span> ${r.reason}`).join(' · ')
              + '</div>';
          };
          // Headings carry the title only. Repeating the range on every
          // group put a date next to numbers that had not been recomputed for
          // it yet, so a stale label read as fact - and the picker at the top
          // already states the window for the whole panel.
          const _grp = (t) => `<div class="insight-group">${t}</div>`;
          const _tile = (label, value, cls) =>
            `<div class="insight-tile ${cls || ''}">
               <div class="insight-tile-label">${label}</div>
               <div class="insight-tile-value">${value}</div>
             </div>`;
          // Average rating over the picked window, with the count that decides
          // how much weight to put on it - a mean over one review reads the
          // same as a mean over a thousand without it.
          const _avgRating = (r, ...q) => {
            if (_broken(...q)) return _err;
            if (r.avg == null) return '<span class="tile-empty">no ratings</span>';
            const n = r.n || 0;
            return `${r.avg} ★ ` +
              `<span class="tile-n">from ${n.toLocaleString()} ` +
              `rating${n === 1 ? '' : 's'}</span>`;
          };
          const _share = (hit, tot, none, ...q) =>
            _broken(...q) ? _err
            : !tot ? `<span class="tile-empty">${none}</span>`
                 : `${hit} <span class="tile-n">of ${tot}</span>` +
                   ` <span class="tile-pct">${((hit / tot) * 100).toFixed(1)}%</span>`;
          const sd = li.same_day || {};

          return `<div class="insights-grid">
            <div class="insight-window ${_stale ? 'stale' : ''}">${
              li._window_label ? esc(li._window_label)
                               : (_gotD != null ? `last ${_gotD} days`
                                                : 'window not recorded')
            }${_stale ? ` — you picked ${esc(state.insightsWindow)}; these `
                      + `figures were not recomputed for it` : ''}</div>
            ${state.insightsError
              ? `<div class="insight-note">${esc(state.insightsError)}</div>` : ''}
            ${_why ? `<div class="insight-note">${_why}</div>` : ''}

            ${(() => {
              // Scoped to TID + VID: is this vendor's version of the
              // experience failing? Booking ids under each count, because
              // "3 reviews" is a number and three booking ids are something
              // an associate can open.
              const r = (li.recurrence || {}).tidvid || {};
              const rr = r.reviews_total ? r.reviews / r.reviews_total : 0;
              const sr = r.support_total ? r.support / r.support_total : 0;
              return `
            ${_grp('Is this issue recurring here?')}
            ${_tile('Reviews',
                    _share(r.reviews, r.reviews_total, 'no negative reviews',
                           'reviews', 'reviews_total') + _ids(r.review_ids),
                    rr > 0.15 ? 'red' : '')}
            ${_tile('Support contacts',
                    _share(r.support, r.support_total, 'no contacts',
                           'support', 'support_total') + _ids(r.support_ids),
                    sr > 0.15 ? 'red' : '')}`;
            })()}

            ${_grp('Same visit date, same issue')}
            ${_tile('Reviews', _broken('same_day_reviews') ? _err
                                : (li.same_day ? _n(sd.reviews) : '—')
                                  + _ids(sd.review_ids),
                    (sd.reviews > 0) ? 'red' : '')}
            ${_tile('Support contacts', _broken('same_day_support') ? _err
                                        : (li.same_day ? _n(sd.support) : '—')
                                          + _ids(sd.support_ids),
                    (sd.support > 0) ? 'red' : '')}

            ${_grp('Experience &amp; vendor')}
            ${_tile('Average rating · TGID', _avgRating(_ratTgid, 'rating_tgid'),
                    _ratTgid.avg == null ? 'grey' : '')}
            ${_tile('Average rating · TID · VID', _avgRating(_ratTv, 'rating_tidvid'),
                    _ratTv.avg == null ? 'grey' : '')}
            <!-- TID+VID and VID, not TGID and VID. TID+VID is the narrowest
                 population that still answers "can this vendor fulfil THIS
                 tour"; VID alone spans everything they run, so a vendor good
                 at one tour and bad at another averages to something true of
                 neither. The two together separate "this pairing is broken"
                 from "this vendor is broken".

                 The why-rows stay on the VID tile: they are computed at
                 vendor scope, and hanging vendor-wide reasons under a
                 TID+VID rate would explain a number with the wrong evidence. -->
            ${_tile('Completion · TID · VID',
                    _rate(li.tidvid_completion_rate,
                          (li.ff_tidvid || {}).total ?? null,
                          'completion_tidvid'),
                    _ffAttnTv ? 'red' : '')}
            ${_tile('Completion · VID',
                    _rate(li.vid_completion_rate, (li.ff_vid || {}).total ?? null,
                          'completion_vid')
                    + _why_not(li.vid_incomplete_why),
                    _ffAttn ? 'red' : '')}
            <!-- Driven by the tiles that are actually on screen. This read
                 _ffAttnT, and TGID no longer HAS a tile - so the button would
                 have appeared over two healthy-looking rates with nothing
                 visible to explain it, and the associate would be flagging a
                 vendor on evidence the card never showed them. The message
                 itself is built from VID anyway. -->
            ${_ffAttnTv || _ffAttn
              ? '<button class="flag-biz-btn full" data-flag-biz>⚑ Flag to Biz · draft message</button>'
              : ''}
          </div>`;
        })() : `
        <div class="insights-grid">
          <div class="insight-tile ${ins.tgidRating.tone}">
            <div class="insight-tile-label">TGID Rating</div>
            <div class="insight-tile-value">${ins.tgidRating.value}</div>
            <div class="insight-tile-sub">${ins.tgidRating.sub} · ${state.insightsWindow}</div>
          </div>
          <div class="insight-tile ${ins.tidVidRating.tone}">
            <div class="insight-tile-label">TID · VID Rating</div>
            <div class="insight-tile-value">${ins.tidVidRating.value}</div>
            <div class="insight-tile-sub">${ins.tidVidRating.sub} · ${state.insightsWindow}</div>
          </div>
          ${(() => {
            const _li = r.liveInsights;
            const _cr = _li ? _li.vid_completion_rate : null;
            const _crStr = _li ? (_li.vidCompletionRate || 'N/A') : ins.completion.value;
            const _ffv = _li ? _li.ff_vid : null;
            const _crTone = _cr != null && _cr < 0.95 ? 'red' : _cr == null && !_li ? ins.completion.tone : _cr == null ? 'grey' : '';
            const _crFlagToBiz = _ffv ? _ffv.needs_attention : (_cr != null ? _cr < 0.95 : ins.completion.flagToBiz);
            // The server records this and sends it on every load. Reading it
            // only out of the in-memory object meant a reload re-armed the
            // button and a second click sent a duplicate to #biz-supply-ops.
            const _crFlagged = r.flagToBizState === 'sent' || ins.completion.flagged;
            const _sdi = _li ? _li.sameDaySameVidIssues : ins.sameDayIssues.value;
            const _sdObj = _li ? _li.same_day_same_vid : null;
            const _sdiTone = _li ? (_sdObj && _sdObj.issues > 0 ? 'red' : _sdObj == null ? 'grey' : '') : ins.sameDayIssues.tone;
            return `
          <div class="insight-tile ${_crTone}">
            <div class="insight-tile-label">Completion %</div>
            <div class="insight-tile-value">${_crStr}</div>
            <div class="insight-tile-sub">${_li ? (_cr != null ? 'VID' : 'no data') : ins.completion.sub} · ${state.insightsWindow}</div>
            ${_crFlagToBiz
              ? '<button class="flag-biz-btn' + (_crFlagged ? ' flagged' : '') + '" data-flag-biz' + (_crFlagged ? ' disabled' : '') + '>' + (_crFlagged ? '✓ Flagged · sent to Slack' : '⚑ Flag to Biz · draft message') + '</button>'
              : ''}
          </div>
          <div class="insight-tile ${_sdiTone}">
            <div class="insight-tile-label">Same-Day Issues</div>
            <div class="insight-tile-value">${_sdi || '—'}</div>
            <div class="insight-tile-sub">${_li ? (_sdObj ? 'same-day VID bookings' : 'no visit date') : ins.sameDayIssues.sub}</div>
          </div>`;
          })()}
          ${similar}
        </div>`}
      </div>
    </div>
    </div><!-- /facts-rail -->

  `;

  // The machinery toggle is bound by a delegated handler near renderRcaCol —
  // the timeline it controls lives in the RCA column now (§13).

  // Window picker — recompute against the chosen range. This used to only set
  // state and re-render, so the caption changed ("· 90d") while the number
  // underneath stayed on whatever window the pipeline had hardcoded.
  col.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const w = btn.dataset.window;
      state.insightsWindow = w;
      renderReviewCol();
      // The server recomputes for this window - it is not a client-side
      // filter. Until it answers, the tiles show the previous window's
      // numbers under the new label, so say so rather than letting them read
      // as the answer.
      col.querySelectorAll('.insight-tile-value').forEach(el => {
        el.style.opacity = '0.45';
      });
      const r = REVIEWS.find(x => x.id === state.selected);
      // No booking-id guard. It used to check r.booking.bid, which is not the
      // key the pipeline writes - it writes id - so for every review the guard
      // returned early: state moved to the new window, the panel re-rendered
      // with the OLD numbers, the tiles stayed dimmed, and no request was ever
      // sent. The picker looked stuck on one window's data forever.
      //
      // There is nothing to guard anyway. The server resolves the booking
      // itself and answers with _zeroed_because when it cannot, which is a
      // result worth rendering rather than a reason not to ask.
      if (!r) return;
      state.insightsError = '';
      try {
        const resp = await fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(w)}`);
        if (resp.ok) {
          const ins = unwrapInsights(await resp.json());
          // Three ways this call produces nothing new, and they used to be one
          // silent path: the request failed, it succeeded with a body this
          // client cannot read, or it succeeded and answered for a different
          // window. All three leave the previous window's figures on screen,
          // which is the state the user reported as "the figures should be
          // updating on the basis of the date window but its not". Each says
          // which one it was.
          if (ins) {
            r.liveInsights = ins;
            const got = ins._window_days, want = windowDays(w);
            if (got != null && want != null && got !== want) {
              state.insightsError = `Asked for ${w}, the server answered for `
                + `${got} days. The figures below are for ${got} days.`;
            }
          } else {
            state.insightsError = 'The server answered, but not in a shape this '
              + 'page can read — the figures below are the previous window\'s.';
          }
        } else {
          state.insightsError = `Could not recompute for ${w} — the server `
            + `returned ${resp.status}. The figures below are still the `
            + `previous window's.`;
        }
      } catch (e) {
        state.insightsError = `Could not reach the server to recompute for ${w}`
          + ` (${e && e.message ? e.message : e}). The figures below are still `
          + `the previous window's.`;
        // Say something. A bare "keep what is on screen" catch is what let a
        // ReferenceError in this block masquerade as a broken window picker
        // for as long as it did: the request worked, the reply was dropped on
        // the floor, and the only visible effect was numbers that would not
        // change. A swallowed exception here has no other symptom, so it has
        // to announce itself.
        console.error('[insights] window switch failed:', e);
      }
      // Always, on every path. Leaving the dimming on is what made a failed
      // fetch look like a loaded one.
      renderReviewCol();
    });
  });

  const flagBtn = col.querySelector('[data-flag-biz]');
  if (flagBtn) {
    flagBtn.addEventListener('click', () => {
      const r = REVIEWS.find(x => x.id === state.selected);
      if (!r) return;
      // Open the draft modal
      openFlagDraftModal(r);
    });
  }

  col.querySelectorAll('.candidate-card').forEach(card => {
    card.addEventListener('click', () => {
      col.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  const confirmBtn = col.querySelector('.candidate-confirm-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      const selectedCard = col.querySelector('.candidate-card.selected');
      if (!selectedCard) return;
      const idx = parseInt(selectedCard.dataset.candidateIdx);
      const candidate = r.candidatesList && r.candidatesList[idx];
      if (!candidate) return;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '⟳ Confirming…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/select-candidate`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({bid: candidate.bid}),
        });
        if (!res.ok) throw new Error(await res.text());
        confirmBtn.textContent = '✓ Confirmed · pipeline running…';
        r.candidateState = false;
        // THE COMPLETION SIGNAL IS generated_at, NOT candidate_state.
        //
        // This polled `!d.candidate_state`, which the confirm request itself
        // clears and commits before it returns — so the condition was already
        // true when the first poll fired three seconds later. The poll stopped
        // while the run was still at step 1, and nothing looked at the review
        // again. Worse, it refreshed with loadDraftOverlays() alone, which
        // does not touch r.type; r.type is only recomputed by fetchInbox().
        // So the review stayed typed 'candidates' for the rest of the session
        // and the RCA column kept drawing its gate — "Locked until a booking
        // is confirmed", on a booking that had just been confirmed. Exactly
        // the two shapes this codebase keeps hitting: a signal that cannot
        // distinguish "not started" from "finished", and a refresh that reads
        // one store while the screen renders off another.
        //
        // generated_at moves only when the run writes its result, and it is
        // the same signal the Re-run button waits on.
        let before = null;
        try {
          const pre = await fetch(`/api/reviews/${r.id}`);
          if (pre.ok) before = ((await pre.json()).draft || {}).generated_at || null;
        } catch (_) {}
        let polls = 0;
        const poll = setInterval(async () => {
          polls++;
          try {
            const check = await fetch(`/api/reviews/${r.id}`);
            if (check.ok) {
              const d = (await check.json()).draft;
              if (d && d.generated_at && d.generated_at !== before) {
                clearInterval(poll);
                await reloadFromServer();
                return;
              }
            }
          } catch (_) {}
          // Stage naming, and the one case where waiting is wrong: the run
          // has an entry that has stopped moving. Display only — a progress
          // endpoint with nothing to say is a restarted server, not a
          // finished run, so silence there never ends the poll.
          try {
            const pr = await fetch(`/api/reviews/${r.id}/progress`);
            if (pr.ok) {
              const p = await pr.json();
              if (p.state === 'queued') {
                confirmBtn.textContent = p.queue_size > 1
                  ? `⋯ queued ${p.queue_position}/${p.queue_size}` : '⋯ queued';
