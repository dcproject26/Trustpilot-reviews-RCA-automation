<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORM RCA — Stakeholder Demo</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     Reviews RCA Workbench — light workbench theme.
     Tokens are the handoff's, verbatim. Colour earns its place: purple is
     the accent and nothing else uses it; green/amber/red mean done / needs
     a human / guest-facing problem. Everything else is the neutral ramp.
     Single-theme by design - the handoff commits to a light surface for
     all-day reading, so there is no dark variant to get half-right.
     ═══════════════════════════════════════════════════════════════════════ */
  :root {
    --page:        #F6F5F2;
    --facts-bg:    #FBFAF8;
    --card:        #FFFFFF;
    --inset:       #F7F5F0;
    --hover-fill:  #F0EEE8;

    --border:      #E6E4DE;
    --hairline:    #F2F0EA;
    --input-bd:    #E0DDD6;
    --dashed:      #D4D0C7;

    --text:        #1D1C1A;
    --body:        #4B4843;
    --muted:       #6E6B64;
    --muted-2:     #8A867E;
    --dim:         #9B968D;
    --empty:       #B9B4AA;

    --accent:      #8000FF;
    --accent-hov:  #6E00DB;
    --accent-bg:   #F5F1FC;
    --accent-bd:   #D8CDEF;
    --accent-bd-2: #E3D7F7;
    --chip-bg:     #EDE6F9;
    --chip-fg:     #6E00DB;

    --green:       #2F7A4D;  --green-bg: #E7F1E9;
    --amber:       #8A6414;  --amber-bg: #FBF3DC;
    --red:         #B8443C;  --red-bg:   #FAE9E7;

    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: #E5DCF8; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mono, .k.mono, .v.mono { font-family: var(--mono); }

  /* ── app shell ───────────────────────────────────────────────────────── */
  .app { height: 100vh; overflow-x: auto; overflow-y: hidden; }
  .topbar {
    height: 52px; flex: none; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    min-width: 1280px;
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .brand-name { font-weight: 650; font-size: 14px; }
  .brand-sub  { font-size: 11.5px; color: var(--muted-2); }
  .topbar-status { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted-2);
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .status-pill.warn { color: var(--amber); }
  .status-pill.warn .dot { background: #B8860B; }

  .main {
    display: flex; min-width: 0;
    height: calc(100vh - 52px); overflow: hidden;
  }

  /* ── column resize handles ───────────────────────────────────────────── */
  /* A 5px strip sitting on the border, not beside it, so it does not shift
     the layout by its own width. The hit area is wider than the line because
     a 1px target is a target people miss. */
  .col-resize {
    flex: none; width: 5px; margin: 0 -2px; cursor: col-resize;
    background: transparent; position: relative; z-index: 5;
  }
  .col-resize:hover, .col-resize.dragging { background: var(--accent); opacity: .35; }
  /* While dragging, the pointer must not select text or flip to an I-beam
     over whatever it passes across. */
  body.col-dragging { cursor: col-resize; user-select: none; }

  /* ── buttons ─────────────────────────────────────────────────────────── */
  .btn, .refresh-slack-btn, .rerun-btn, .verify-btn, .skip-btn,
  .copy-response-btn, .slack-regen-btn, .reporting-link, .flag-biz-btn {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--card);
    color: var(--body); cursor: pointer;
  }
  .btn:hover, .refresh-slack-btn:hover, .rerun-btn:hover, .verify-btn:hover,
  .skip-btn:hover, .copy-response-btn:hover, .slack-regen-btn:hover,
  .reporting-link:hover, .flag-biz-btn:hover {
    border-color: var(--empty); color: var(--text);
  }
  .btn.primary, .send-btn, .candidate-confirm-btn {
    font-weight: 600; border: none;
    background: var(--accent); color: #fff;
  }
  .btn.primary:hover, .send-btn:hover, .candidate-confirm-btn:hover {
    background: var(--accent-hov); color: #fff;
  }
  .btn:disabled, .send-btn:disabled { opacity: .5; cursor: default; }
  /* Dashed = "add something that isn't there yet". */
  .row-add, .add-manual-btn, .action-add-btn {
    font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 6px;
    border: 1px dashed var(--dashed); background: none; color: var(--muted);
    cursor: pointer; align-self: flex-start;
  }
  .row-add:hover, .add-manual-btn:hover, .action-add-btn:hover {
    color: var(--text); border-color: var(--empty);
  }
  .row-del, .action-delete-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 3px; flex: none;
  }
  .row-del:hover, .action-delete-btn:hover { color: var(--red); }

  /* ── column 1 · inbox ────────────────────────────────────────────────── */
  .inbox {
    width: var(--col-inbox, 300px); flex: none; background: var(--card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .inbox-head { padding: 14px 14px 10px; border-bottom: 1px solid #EEECE6; }
  .inbox-title {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 11px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
  }
  .inbox-title .refresh-slack-btn {
    font-size: 11px; padding: 3px 9px; text-transform: none;
    letter-spacing: 0; font-weight: 400;
  }
  /* Search. Sits above the tabs because it cuts across them — a review you
     are looking for is usually in a tab you are not on. */
  .inbox-search-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .inbox-search {
    font: inherit; font-size: 12px; flex: 1; min-width: 0;
    padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--text);
  }
  .inbox-search::placeholder { color: var(--dim); }
  .inbox-search:focus { outline: none; border-color: var(--accent); }
  .inbox-search-clear {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    padding: 3px 8px; border-radius: 7px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--muted);
  }
  /* A tab holding matches you cannot see from here. Without it, searching in
     the wrong tab reads as "this review does not exist". */
  .inbox-tab.has-hits { border-color: var(--accent); color: var(--accent); }
  .inbox-elsewhere { margin-top: 8px; font-size: 11.5px; color: var(--muted-2); }
  .inbox-elsewhere button {
    font: inherit; font-size: 11.5px; cursor: pointer; padding: 2px 7px;
    margin-left: 4px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--accent);
  }

  .inbox-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .inbox-tab {
    font: inherit; font-size: 11.5px; padding: 5px 9px; border-radius: 7px;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--muted);
  }
  .inbox-tab .num {
    font-size: 10px; font-family: var(--mono); padding: 0 5px;
    border-radius: 7px; background: var(--hover-fill); color: var(--muted-2);
  }
  .inbox-tab.active { border-color: var(--text); background: var(--text); color: #fff; }
  .inbox-tab.active .num { background: rgba(255,255,255,.2); color: #fff; }
  .inbox-list { flex: 1; overflow-y: auto; padding: 8px; }

  .review-item {
    padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; background: transparent;
  }
  .review-item:hover { background: var(--facts-bg); }
  .review-item.active { border-color: #C9BBE8; background: var(--accent-bg); }
  .review-item-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .review-author { font-weight: 600; font-size: 12.5px; }
  .review-time   { font-size: 11px; color: var(--dim); flex: none; }
  .review-stars-line { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .review-stars { color: var(--red); font-size: 11px; letter-spacing: 1px; flex: none; }
  .review-exp {
    font-size: 11px; color: var(--muted-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .review-preview {
    font-size: 12px; color: var(--body); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .review-tags { display: flex; gap: 5px; margin-top: 6px; align-items: center; }
  /* One stage chip per card carries the colour; language is plain text. */
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 5px;
    background: var(--hover-fill); color: var(--muted);
  }
  .tag.stage-ok   { background: var(--green-bg); color: var(--green); }
  .tag.stage-warn { background: var(--amber-bg); color: var(--amber); }
  .tag.stage-bad  { background: var(--red-bg);   color: var(--red); }
  .tag-lang { background: none; padding: 0; font-size: 10.5px; font-weight: 400; color: var(--dim); }
  .inbox-footer {
    padding: 10px 12px; border-top: 1px solid #EEECE6; display: flex; gap: 8px;
  }
  .inbox-footer .add-manual-btn { flex: 1; padding: 7px; border-radius: 7px; text-align: center; }
  .inbox-footer .reporting-link { flex: 1; padding: 7px; border-radius: 7px; background: none; }

  /* bulk job progress */
  .bulk-bar { margin: 0 0 10px; }
  .bulk-track { height: 4px; background: var(--hover-fill); border-radius: 3px; overflow: hidden; }
  .bulk-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .bulk-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10.5px; color: var(--muted-2); margin-top: 4px;
  }
  .bulk-cancel { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 10.5px; }
  .bulk-cancel:hover { color: var(--red); }

  /* ── column 2 · the facts ────────────────────────────────────────────── */
  .review-col {
    width: var(--col-facts, 410px); flex: none; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 20px 20px 60px; background: var(--facts-bg);
  }
  .col-label {
    font-size: 11px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 14px;
  }
  .breadcrumb { font-size: 11.5px; color: var(--muted-2); margin-bottom: 10px; }

  .review-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
  }
  .review-card-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  }
  .review-author-line { font-weight: 650; font-size: 14px; }
  .review-meta { font-size: 11.5px; color: var(--muted-2); }
  .review-card .review-stars { font-size: 12px; letter-spacing: 2px; margin: 2px 0 8px; display: block; }
  .review-body-original { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .translation-card {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    background: none; border-radius: 0;
  }
  .translation-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 4px;
  }
  .translation-body { font-size: 12.5px; color: var(--body); line-height: 1.6; }

  /* facts sub-heading + its inline control */
  .facts-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; gap: 8px;
  }
  .facts-head-title { font-size: 12px; font-weight: 650; color: var(--body); }
  .facts-block { margin-bottom: 14px; }

  .match-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .match-top { display: flex; align-items: center; gap: 10px; }
  .match-tier-badge {
    flex: none; width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; font-family: var(--mono);
    background: var(--hover-fill); color: var(--muted);
  }
  .match-tier-badge.t1   { background: var(--green-bg); color: var(--green); }
  .match-tier-badge.t2, .match-tier-badge.t3 { background: var(--amber-bg); color: var(--amber); }
  .match-tier-badge.untr { background: var(--red-bg); color: var(--red); }
  .match-title  { font-weight: 600; font-size: 12.5px; }
  .match-method { font-size: 11.5px; color: var(--muted-2); }
  .match-foot {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: 11.5px; color: var(--muted-2); line-height: 1.55;
  }
  .match-foot strong { color: var(--body); font-weight: 600; }
  .match-warn {
    margin-top: 10px; font-size: 12px; color: var(--amber);
    background: var(--amber-bg); border-radius: 7px; padding: 8px 10px; line-height: 1.55;
  }

  /* match trail — "how we built this match" */
  .confidence-trail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .confidence-trail-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 5px;
  }
  .conf-step {
    display: flex; gap: 8px; font-size: 12px; padding: 2px 0;
    align-items: baseline; color: var(--body);
  }
  .conf-step .mark { flex: none; font-weight: 700; font-size: 11px; }
  .conf-step.pass .mark { color: var(--green); }
  .conf-step.warn .mark, .conf-step.fail .mark { color: var(--amber); }

  /* candidate picker */
  .candidates-picker { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .candidates-picker-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim);
  }
  .candidate-card {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--facts-bg);
  }
  .candidate-card.active, .candidate-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .candidate-top { display: flex; justify-content: space-between; align-items: center; }
  .candidate-bid { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); }
  .candidate-radio {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid #C9C4BA; background: #fff; box-sizing: border-box;
  }
  .candidate-card.active .candidate-radio, .candidate-card.selected .candidate-radio { border: 4px solid var(--accent); }
  .candidate-exp  { font-size: 12px; margin-top: 2px; }
  .candidate-meta, .candidate-reasons { font-size: 11px; color: var(--muted-2); }
  .candidate-score { font-size: 11px; color: var(--muted-2); }
  .candidate-score-bar { height: 3px; background: var(--hover-fill); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .candidate-score-fill { height: 100%; background: var(--accent); }
  .candidate-reason-pill {
    font-size: 10px; padding: 1px 6px; border-radius: 5px;
    background: var(--hover-fill); color: var(--muted); margin-right: 4px;
  }
  .picker-actions { display: flex; gap: 8px; margin-top: 4px; }
  .picker-actions .candidate-confirm-btn { flex: 1; padding: 8px; border-radius: 7px; font-size: 12px; }
  .picker-actions .skip-btn { padding: 8px 10px; border-radius: 7px; font-size: 12px; color: var(--muted); }

  /* booking details */
  .details-grid { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 0; }
  .detail-row {
    display: grid; grid-template-columns: 118px 1fr; padding: 4px 16px;
    font-size: 12px; align-items: baseline;
  }
  .detail-row .k { color: var(--muted-2); font-size: 11.5px; }
  .detail-row .v { font-weight: 500; overflow-wrap: anywhere; }
  .detail-row .v.mono { font-family: var(--mono); font-size: 11.5px; }
  .detail-row .v.dim, .detail-row .v .placeholder { color: var(--empty); }
  /* An absent value carrying its reason. Same colour as .placeholder so it
     never reads as data, and normal weight so it does not compete with the
     rows that hold real values. */
  .detail-row .v .v-absent { color: var(--empty); font-weight: 400; }
  /* Why a timeline column is dashes. Same quiet register as .tl-hidden-note —
     it is a statement about the data, not a warning about the pipeline. */
  .tl-undated-note { color: var(--empty); font-size: 11px; line-height: 1.45;
                     padding: 4px 0 2px 0; overflow-wrap: anywhere; }
  .booking-status-pill { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--hover-fill); color: var(--muted); }
  .bms-link, .tgid-link, .dss-row-ref { font-family: var(--mono); font-size: 11.5px; }

  /* insights */
  .insights-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .insights-title { font-size: 12px; font-weight: 650; color: var(--body); }
  .window-picker { display: flex; gap: 2px; background: var(--hover-fill); border-radius: 6px; padding: 2px; }
  .window-btn {
    font: inherit; font-size: 11px; font-family: var(--mono);
    padding: 2px 8px; border-radius: 5px; border: none; cursor: pointer;
    background: transparent; color: var(--muted-2);
  }
  .window-btn.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .insights-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  /* Group headings and the footnote span the whole 2-col grid; the note is
     ordered last so it reads as a footnote wherever the builder emits it. */
  .insight-group { grid-column: 1 / -1; margin: 4px 0 0; font-size: 10.5px;
                   font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
                   color: var(--dim); }
  .insight-group:first-child { margin-top: 0; }
  .insight-note { grid-column: 1 / -1; order: 99; margin-top: 4px; }
  .insight-group > .label-text {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 6px; display: block;
  }
  .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: start; }
  .insight-tile { background: var(--inset); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .insight-tile-label { font-size: 10.5px; color: var(--muted-2); margin-bottom: 2px; }
  .insight-tile-value { font-size: 15px; font-weight: 650; color: var(--text); font-family: var(--mono); }
  .insight-tile-value.tile-empty { font-size: 12px; font-weight: 500; color: var(--empty); font-style: italic; font-family: var(--sans); }
  .insight-tile-sub, .tile-n, .tile-why { font-size: 10.5px; color: var(--muted-2); font-family: var(--sans); font-weight: 400; }
  .insight-note {
    display: flex; gap: 6px; align-items: baseline; padding-top: 8px;
    border-top: 1px dashed var(--border); font-size: 11.5px;
    color: var(--amber); line-height: 1.5;
  }
  /* The window the figures below were actually computed for. First row of the
     grid on purpose: a count means nothing without the range it covers, and
     the picker above states an intention, not a result. */
  .insight-window {
    grid-column: 1 / -1; order: -1; font-size: 10.5px; color: var(--muted-2);
    font-family: var(--mono); margin-bottom: 2px;
  }
  .insight-window.stale {
    color: var(--amber); font-family: var(--sans); font-weight: 600;
  }

  /* classification */
  .classify-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-top: 14px;
  }
  .classify-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .classify-row { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted-2); }
  .classify-label { font-size: 11px; color: var(--muted-2); }
  .classify-select, .field-input, select.classify-select {
    font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--facts-bg); color: var(--text);
    max-width: 100%;
  }
  .classify-select:focus, .field-input:focus { outline: none; border-color: var(--accent); }
  /* multi-value chip rows */
  .chip-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 0 3px; min-width: 0;
  }
  .chip-row-label {
    flex: none; width: 100%; font-size: 11px; color: var(--muted-2); margin-bottom: -2px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
    padding: 3px 6px 3px 10px; border-radius: 12px;
    background: var(--accent-bg); color: var(--body); border: 1px solid var(--accent-bd-2);
  }
  .chip button {
    font: inherit; font-size: 11px; line-height: 1; border: none; background: none;
    color: var(--dim); cursor: pointer; padding: 0 2px;
  }
  .chip button:hover { color: var(--red); }
  .chip-add {
    font: inherit; font-size: 11px; padding: 3px 6px; border-radius: 10px;
    border: 1px dashed var(--dashed); background: none; color: var(--muted);
    cursor: pointer; width: auto;
  }

  /* ── column 3 · RCA & response ───────────────────────────────────────── */
  .rca-col { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 40px; }
  .rca-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 10px; max-width: 720px;
  }
  .rca-title-row { display: flex; align-items: baseline; gap: 8px;
    flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
  .rca-title {
    font-size: 11px; font-weight: 650; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim);
  }
  .rca-edit-icon { display: none; }
  .rca-sub { font-size: 11.5px; color: var(--muted-2); min-width: 0;
    overflow-wrap: anywhere; }
  .rca-head-actions { display: flex; gap: 8px; flex: none; }
  .rca-head-actions .btn, .rca-head-actions .send-btn, .rca-head-actions .copy-response-btn {
    font-size: 12.5px; padding: 7px 14px; border-radius: 7px;
  }
  .rca-head-actions .send-btn { padding: 7px 16px; }
  .rca-stack-outer { max-width: 720px; display: flex; flex-direction: column; gap: 12px; }

  /* every RCA block is a white card with a collapsible header */
  .section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .section-label {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 11px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim);
    margin-bottom: 8px; cursor: pointer; user-select: none;
  }
  .section-label .marker { display: none; }
  .section-chev {
    margin-left: auto; flex: none; font-size: 10px; color: var(--dim);
    cursor: pointer; user-select: none; padding: 2px 6px;
  }
  .section.is-collapsed > *:not(.section-label) { display: none; }
  .section-label .hint,
  .sec-count { font-size: 11px; color: var(--muted-2); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .section-label .hint.dim { color: var(--empty); font-size: 10.5px; }
  .ai-tag-inline { display: none; }

  /* inline-editable text: hover tint, purple focus ring */
  .editable-text {
    outline: none; border-radius: 4px; padding: 1px 4px; margin: -1px -4px;
    cursor: text; display: inline-block; min-width: 40px;
  }
  .editable-text.is-placeholder { color: var(--empty); font-style: italic; }
  /* The save confirmation floats. It had NO styling at all, so it was an
     inline span injected into the parent - it inserted itself between
     timeline rows and shoved the layout around on every blur. */
  .save-tick {
    position: absolute; right: 0; top: 0;
    font-size: 10.5px; color: var(--green);
    pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity .15s ease;
  }
  .save-tick.on { opacity: 1; }
  .editable-text:hover { background: var(--accent-bg); }
  .editable-text:focus { background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent); }
  .rca-wrap, .editable-text.rca-wrap { display: block; overflow-wrap: anywhere; }
  .stated-issue { background: none; border: none; padding: 0; }
  .stated-issue-text { font-size: 13px; line-height: 1.55; }
  /* §4 exactly two empty-state treatments, and amber is a third meaning.
     NEUTRAL (the default): absence is unremarkable.
     AFFIRMATIVE (.affirm): the empty state is itself a positive finding
       someone verified - regular weight, green tick, because "nothing needed
       raising" is a result and reading it in the same grey italic as "nothing
       here" loses that.
     .err stays reserved for "the pipeline failed / re-run" and must never
       share styling with either. */
  .rca-empty { font-size: 12px; color: var(--empty); font-style: italic; }
  .rca-empty.affirm { color: var(--green); font-style: normal; }
  .rca-empty.err { color: var(--amber); font-style: normal; }
  .empty-state, .interactions-empty, .action-empty, .chk-none {
    font-size: 12px; color: var(--empty); font-style: italic; padding: 4px 0;
  }
  .field-block { background: none; border: none; border-radius: 0; padding: 0; }
  .rca-stack { display: flex; flex-direction: column; gap: 8px; }
  .rca-kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 12.5px; min-width: 0; }
  .rca-kv > span { min-width: 0; overflow-wrap: anywhere; }
  .rca-kv > span:nth-child(odd) { color: var(--muted-2); }
  .rca-points { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rca-point { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; min-width: 0; }
  .rca-point > .rca-bullet { color: var(--empty); flex: none; }
  .rca-point > .rca-ptext { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* booking timeline */
  .tl-row {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--hairline); font-size: 12px;
    align-items: baseline;
  }
  .tl-row:last-of-type { border-bottom: none; }
  .tl-time { font-family: var(--mono); font-size: 11px; color: var(--dim); padding-top: 1px; }
  .tl-body { min-width: 0; }
  .tl-what { font-weight: 600; font-size: 12px; }
  .tl-detail { color: var(--muted); font-size: 11.5px; line-height: 1.5; }

  /* what went wrong — numbered collapsible issues */
  .wwr-issue { min-width: 0; border-bottom: 1px solid var(--hairline); }
  .wwr-issue:last-of-type { border-bottom: none; }
  .wwr-issue-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    cursor: pointer; user-select: none;
  }
  .wwr-n {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--dashed); color: var(--muted-2);
    font-size: 10.5px; font-weight: 600; font-family: var(--mono);
    display: flex; align-items: center; justify-content: center;
  }
  /* The heading owns the row. A long accuracy chip used to claim its full
     width and crush the title to one character per line, so the chip is
     capped and truncated instead - the full text is in the analysis panel
     and in the title attribute. */
  .wwr-issue-title { font-weight: 600; font-size: 12.5px; flex: 1 1 auto; min-width: 40%; }
  .wwr-issue-head .chip-acc {
    max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wwr-issue-chev { flex: none; font-size: 10px; color: var(--dim); }
  .wwr-issue-body {
    padding: 2px 0 12px 30px; min-width: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .wwr-blk { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wwr-blk-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim);
  }
  .wwr-claim {
    font-size: 12px; color: var(--body); line-height: 1.5;
    border-left: 2px solid var(--border); padding-left: 10px; font-style: italic;
  }
  .wwr-ev-row { font-size: 12px; color: var(--body); line-height: 1.5; display: flex; gap: 8px; }
  .wwr-ev-row > .dash { color: var(--empty); flex: none; }
  .wwr-ev-row > .editable-text { min-width: 0; flex: 1; overflow-wrap: anywhere; display: block; }
  .wwr-analysis {
    font-size: 12px; color: var(--body); padding: 8px 10px;
    background: var(--inset); border-radius: 8px; line-height: 1.5; min-width: 0;
  }
  .wwr-analysis-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; }
  .wwr-analysis .editable-text:hover { background: #F0EBE2; }
  .wwr-analysis .editable-text:focus { background: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .wwr-cause-label { color: var(--text); font-weight: 600; }
  .row-add.wwr-add { margin-top: 2px; font-size: 11px; padding: 2px 8px; }

  /* chips shared by accuracy / owner / team / verdict */
  .chip-acc {
    font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px;
    background: var(--hover-fill); color: var(--muted); flex: none;
  }
  .chip-acc.ok   { background: var(--green-bg); color: var(--green); }
  .chip-acc.part { background: var(--amber-bg); color: var(--amber); }
  .chip-acc.no   { background: var(--red-bg);   color: var(--red); }
  .chip-owner {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 5px;
    background: var(--chip-bg); color: var(--chip-fg); flex: none;
  }
  .chip-team {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 5px;
    background: var(--amber-bg); color: var(--amber); margin-top: 1px;
  }
  .chk-pill, .chip-verdict {
    font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 5px;
    background: var(--hover-fill); color: var(--muted);
  }
  .chk-pill.pass, .chip-verdict.pass { background: var(--green-bg); color: var(--green); }
  .chk-pill.flag, .chip-verdict.flag { background: var(--red-bg);   color: var(--red); }
  .chk-pill.na,   .chip-verdict.na   { background: var(--hover-fill); color: var(--muted); }

  /* SOP */
  .sop-line { font-size: 12px; line-height: 1.55; margin-top: 3px; }
  .sop-line .k { color: var(--muted-2); }
  .sop-note { font-size: 11.5px; color: var(--muted-2); margin-top: 6px; }

  /* guest ↔ support, SP records */
  .interactions { display: flex; flex-direction: column; }
  .convo-frame { border-bottom: 1px solid var(--hairline); min-width: 0; }
  .convo-frame:last-of-type { border-bottom: none; }
  .convo-frame-head {
    display: flex; gap: 10px; padding: 9px 0; font-size: 12px;
    align-items: center; cursor: pointer; user-select: none;
    background: none; border: none; width: 100%; text-align: left; color: var(--text);
  }
  .convo-num { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--dim);
               width: auto; height: auto; border: none; background: none; }
  .convo-type-pill {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 5px; background: var(--hover-fill);
    color: var(--muted); text-transform: uppercase;
  }
  .convo-time { flex: none; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .interaction-summary-line {
    flex: 1; min-width: 0; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .convo-frame.open .interaction-summary-line { white-space: normal; overflow: visible; }
  .convo-chevron { flex: none; font-size: 10px; color: var(--dim); }
  .convo-body { padding: 0 0 10px 30px; min-width: 0; display: none; }
  .convo-frame.open .convo-body { display: block; }
  .convo-line { font-size: 12px; color: var(--body); line-height: 1.6; overflow-wrap: anywhere; }
  .convo-line .k {
    color: var(--muted-2); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .convo-detail {
    font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px;
    padding: 8px 10px; background: var(--inset); border-radius: 6px; overflow-wrap: anywhere;
  }
  .convo-gap {
    background: var(--red-bg); color: var(--red); font-size: 11px;
    padding: 4px 8px; border-radius: 5px; margin-top: 6px;
  }
  /* The per-contact summary: concise bullets, one sentence each, in the order
     the contact happened. Same type scale and colour as .convo-line so the
     card still reads as one card. */
  .convo-narr {
    margin: 6px 0 0; padding: 0 0 0 16px; list-style: none;
    display: grid; gap: 3px;
  }
  .convo-bullet {
    position: relative; font-size: 12px; color: var(--body);
    line-height: 1.6; overflow-wrap: anywhere;
  }
  .convo-bullet::before {
    content: "·"; position: absolute; left: -12px; color: var(--dim);
    font-weight: 700;
  }
  .sp-frame { border-bottom: 1px solid var(--hairline); padding: 9px 0; }
  .sp-frame:last-of-type { border-bottom: none; }
  .sp-frame-head { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .sp-frame-body { padding-left: 0; margin-top: 4px; }
  .sp-frame-summary { font-size: 12px; color: var(--body); line-height: 1.5; }
  .sp-raised-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .sp-raised-row .k { color: var(--muted-2); }

  /* flags */
  .flag-row { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .flag-body { min-width: 0; font-size: 12.5px; flex: 1; }
  .flag-ev { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; }
  .chk-groups { display: flex; flex-direction: column; gap: 8px; }
  .chk-group { border: none; }
  .chk-group-head { display: none; }
  .chk-group-body { display: flex; flex-direction: column; gap: 8px; }
  .chk-row { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .chk-mark { flex: none; color: var(--empty); }
  .chk-item { font-size: 12.5px; color: var(--text); line-height: 1.5; min-width: 0; flex: 1; }
  .chk-ev { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; line-height: 1.5; }
  .chk-zd, .zd-link { font-family: var(--mono); font-size: 11px; }
  .chk-gtag { font-size: 10px; font-weight: 700; color: var(--muted); }

  /* actions taken */
  .action-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .action-tab {
    font: inherit; font-size: 11.5px; padding: 4px 9px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--muted);
  }
  .action-tab .count {
    font-size: 10px; font-family: var(--mono); padding: 0 5px; border-radius: 7px;
    background: var(--hover-fill); color: var(--muted-2);
  }
  .action-tab.active { border-color: var(--text); background: var(--text); color: #fff; }
  .action-tab.active .count { background: rgba(255,255,255,.2); color: #fff; }
  .action-item {
    display: flex; gap: 8px; padding: 5px 0; font-size: 12px;
    border-bottom: 1px solid var(--hairline); align-items: baseline;
  }
  .action-time { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
  .action-content { flex: 1; min-width: 0; }
  .action-item-head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .action-raised-with { display: flex; gap: 4px; align-items: baseline; }
  .action-sep { color: var(--empty); }
  .action-edit {
    outline: none; border-radius: 4px; padding: 0 4px; margin: 0 -4px;
    cursor: text; line-height: 1.5;
  }
  .action-edit:hover { background: var(--accent-bg); }
  .action-edit:focus { background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent); }
  .action-context { flex: 1; min-width: 0; }
  .action-where { font-family: var(--mono); font-size: 11px; }

  /* resolution & takedown, side by side */
  .wrapup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wrapup-field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted-2); }
  .wrapup-field input, .wrapup-field select {
    font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--facts-bg); color: var(--text);
  }
  .resolution-block { background: none; border: none; padding: 0; }
  /* The override/routing disagreement, and a scenario no issue covers. Amber,
     the same token the confidence trail uses for a coercion — this is "we
     changed something, or something changed under you", not an error. */
  .scenario-reconcile, .scenario-uncovered {
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
    margin: 6px 0 2px; padding: 6px 9px; border-radius: 6px;
    background: var(--amber-bg); color: var(--amber);
    font-size: 11.5px; line-height: 1.5;
  }
  .reconcile-mark { flex: none; }
  .reconcile-text { flex: 1; min-width: 140px; overflow-wrap: anywhere; }
  .reconcile-revert {
    flex: none; font: inherit; font-size: 11px; padding: 2px 9px;
    border-radius: 5px; border: 1px solid var(--input-bd);
    background: var(--card); color: var(--body); cursor: pointer;
  }
  /* The ground for a takedown, under the verdict it belongs to. Same grid as
     the row above so the control lines up with the verdict select rather than
     starting a second visual column. */
  /* Resolution & takedown: three stacked parts, each a wrapping flex row so
     the whole card survives a 320px column. No fixed grids. */
  .res-block { margin-top: 12px; }
  .res-block:first-of-type { margin-top: 0; }
  .res-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .res-label {
    flex: none; font-size: 10.5px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted-2);
  }
  .chip-select {
    flex: none; font: inherit; font-size: 10.5px; font-weight: 700;
    padding: 1px 5px; border-radius: 5px; border: 1px solid transparent;
    background: var(--hover-fill); color: var(--muted); cursor: pointer;
  }
  .chip-select.td-yes { background: var(--green-bg); color: var(--green); }
  .chip-select.td-untraceable { background: var(--amber-bg); color: var(--amber); }
  .res-amount {
    flex: none; width: 64px; font: inherit; font-size: 12px; text-align: right;
    padding: 3px 6px; border-radius: 6px; border: 1px solid var(--input-bd);
    background: var(--facts-bg); color: var(--text);
  }
  .res-unit { flex: none; font-size: 10.5px; color: var(--dim); }
  /* A legitimate state, never an error: we know a HOC was issued and not how
     much. Styled as absence, not as a problem. */
  .res-amount-unknown { flex: none; font-size: 11px; font-style: italic; color: var(--empty); }
  .res-reason {
    flex: 1 1 auto; min-width: 120px; font: inherit; font-size: 12px;
    padding: 4px 7px; border-radius: 6px; border: 1px solid var(--input-bd);
    background: var(--facts-bg); color: var(--text);
  }
  .res-line { margin-top: 5px; font-size: 12px; color: var(--body);
              line-height: 1.55; overflow-wrap: anywhere; }
  .res-note { margin-top: 5px; font-size: 11.5px; line-height: 1.5;
              overflow-wrap: anywhere; }
  .res-note-label { color: var(--dim); margin-right: 5px; }
  /* The two DSS absences, rendered differently ON PURPOSE. One is a fact, the
     other is a pipeline failure, and they must never look alike. */
  .dss-none { font-size: 12px; font-style: italic; color: var(--muted);
              line-height: 1.55; }
  .dss-broken {
    font-size: 12px; line-height: 1.5; color: var(--amber);
    background: var(--amber-bg); border-radius: 8px; padding: 7px 10px;
  }
  .dss-panel { overflow-wrap: anywhere; }


  /* response to guest — the only purple-bordered card */
  .reply-block {
    background: var(--card); border: 1px solid var(--accent-bd);
    border-radius: 10px; padding: 14px 16px;
  }
  .reply-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .reply-head .section-label { margin: 0; color: var(--accent); cursor: default; }
  .reply-head-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .reply-head-actions button {
    font: inherit; font-size: 11px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--card); color: var(--body); cursor: pointer;
  }
  .reply-head-actions button:hover { border-color: var(--empty); }
  .reply-edit-header { display: none; }
  .reply-text, .field-textarea, .flag-textarea {
    width: 100%; box-sizing: border-box; min-height: 110px;
    font: inherit; font-size: 13px; line-height: 1.6; padding: 10px 12px;
    border-radius: 7px; border: 1px solid var(--input-bd);
    background: var(--facts-bg); color: var(--text); resize: vertical; outline: none;
  }
  .reply-text:focus, .field-textarea:focus { border-color: var(--accent); }
  .reply-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-top: 6px; }
  .template-card { background: var(--inset); border-radius: 8px; padding: 10px 12px; font-size: 12px; }

  /* slack thread post */
  .slack-preview { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .slack-preview-label {
    font-size: 11px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim);
  }
  .slack-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .slack-sections { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; align-items: center; }
  .slack-sections-label {
    font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em;
  }
  .slack-sec-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted); border: 1px solid var(--input-bd); border-radius: 10px;
    padding: 2px 8px; cursor: pointer; user-select: none;
  }
  .slack-sec-chip input { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .slack-sec-actions { display: flex; gap: 6px; margin-left: auto; }
  .slack-sec-actions button {
    font: inherit; font-size: 10.5px; background: none; border: none;
    color: var(--dim); cursor: pointer; text-decoration: underline;
  }
  .slack-sec-actions button:hover { color: var(--text); }
  .slack-edit-wrap { position: relative; }
  .slack-edit-area {
    width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 220px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    padding: 10px 12px; border-radius: 7px; border: 1px solid var(--input-bd);
    background: var(--facts-bg); color: var(--text); resize: vertical; outline: none;
  }
  .slack-edit-hint { position: absolute; right: 10px; top: 16px; font-size: 10px; color: var(--empty); }
  .slack-post-row { display: flex; justify-content: flex-end; margin-top: 10px; gap: 8px; }
  .slack-post-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 7px 16px;
    border-radius: 7px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .slack-post-btn:hover { background: var(--accent-hov); }

  /* T2 gate + untraceable one-click reply */
  .rca-gate {
    max-width: 520px; margin: 40px auto 0; text-align: center;
    padding: 40px 30px; border: 1px dashed var(--dashed); border-radius: 12px;
  }
  .rca-gate-title { font-size: 15px; font-weight: 650; margin-bottom: 6px; }
  .rca-gate-body { font-size: 12.5px; color: var(--muted); line-height: 1.6; max-width: 38ch; margin: 0 auto; }
  .untr-wrap { max-width: 560px; }
  .untr-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .untr-lead { font-size: 12.5px; color: var(--body); line-height: 1.6; margin-bottom: 12px; }
  .untr-template { background: var(--inset); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; }
  .untraceable-actions { display: flex; gap: 8px; margin-top: 12px; }
  .untraceable-actions .btn.primary { padding: 8px 16px; border-radius: 7px; font-size: 12.5px; }
  .untraceable-actions .btn { padding: 8px 14px; border-radius: 7px; font-size: 12.5px; }
  .untraceable-status, .untraceable-detail { font-size: 12px; color: var(--muted-2); line-height: 1.55; }

  /* send bar */
  .send-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 14px; max-width: 720px;
  }
  .send-info { font-size: 11.5px; color: var(--muted-2); }
  .send-actions { display: flex; gap: 8px; }

  /* similar reviews / support */
  .similar-list { display: flex; flex-direction: column; gap: 6px; }
  .similar-item { font-size: 12px; color: var(--body); line-height: 1.5; }
  .similar-sub-label { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .similar-summary-line { font-size: 11.5px; color: var(--muted-2); }

  /* legacy timeline (facts pane) */
  .timeline { display: flex; flex-direction: column; }
  .tl-event { border-bottom: 1px solid var(--hairline); padding: 8px 0; font-size: 12px; }
  .tl-event:last-child { border-bottom: none; }
  .tl-header { display: flex; gap: 8px; align-items: baseline; }
  .tl-actor { font-weight: 600; }
  .tl-tid, .tl-time { font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
  .tl-content { color: var(--body); line-height: 1.55; margin-top: 2px; overflow-wrap: anywhere; }
  .tl-summary, .timeline-summary { font-size: 11.5px; color: var(--muted-2); }
  .tl-flag { color: var(--amber); font-size: 11px; }
  .tl-thread { padding-left: 14px; border-left: 2px solid var(--hairline); }
  .tl-hidden-note { font-size: 11px; color: var(--dim); font-style: italic; }

  /* WWR scenario blocks (legacy drafts) */
  .wwr-scenarios { display: flex; flex-direction: column; gap: 10px; }
  .wwr-scn { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .wwr-scn-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .wwr-scn-name { font-weight: 600; font-size: 12.5px; }
  .wwr-scn-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--chip-bg); color: var(--chip-fg); }
  .wwr-scn-row { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12px; }
  .wwr-scn-k { color: var(--muted-2); }
  .wwr-scn-v { color: var(--body); overflow-wrap: anywhere; }

  /* legacy stepper (kept so old drafts still render) */
  .wwr-stepper { display: flex; flex-direction: column; }
  .wwr-step { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
  .wwr-step-num {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: none; border: 1px solid var(--dashed); color: var(--muted-2);
    font-size: 11px; font-weight: 600; font-family: var(--mono);
    display: flex; align-items: center; justify-content: center;
  }
  .wwr-step-body { flex: 1; min-width: 0; }
  .wwr-what { font-size: 12.5px; font-weight: 600; color: var(--text); cursor: text; }
  .wwr-why  { font-size: 12px; color: var(--muted); margin-top: 3px; cursor: text; line-height: 1.5; }
  .wwr-connector { width: 1px; height: 10px; background: var(--border); margin-left: 11px; }
  .wwr5-h {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 5px;
  }

  /* modals */
  .flag-modal {
    position: fixed; inset: 0; background: rgba(29,28,26,.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .flag-modal-body {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; width: 560px; max-width: 92vw; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(29,28,26,.16);
  }
  .flag-modal-head { display: flex; align-items: center; margin-bottom: 12px; }
  .flag-modal-title { font-size: 14px; font-weight: 650; }
  .flag-modal-close {
    margin-left: auto; background: none; border: none; font-size: 18px;
    color: var(--dim); cursor: pointer; line-height: 1;
  }
  .flag-modal-close:hover { color: var(--text); }
  .flag-modal-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 11.5px; color: var(--muted-2); }
  .flag-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .flag-input, .flag-dest {
    font: inherit; font-size: 12.5px; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--input-bd); background: var(--facts-bg); color: var(--text);
  }
  .flag-hint { font-size: 11px; color: var(--dim); }
  .flag-textarea { min-height: 140px; font-size: 12.5px; }

  /* misc */
  .pill-sm { font-size: 10px; padding: 1px 6px; border-radius: 5px; }
  .pill-grey { background: var(--hover-fill); color: var(--muted); }
  .sep { color: var(--empty); }
  .why-n { color: var(--muted-2); font-weight: 600; }
  .placeholder { color: var(--empty); }
  #build-stamp {
    position: fixed; right: 8px; bottom: 6px; z-index: 40;
    font-size: 10px; font-family: var(--mono); color: var(--dim);
    pointer-events: none; display: none;
  }
  #build-stamp.is-stale, #build-stamp.is-deploy { display: block; color: var(--amber); }
  [hidden] { display: none !important; }

  /* ── RCA v2: WWR issue internals ───────────────────────────────────────
     Additive only. Every value comes from a :root token; no new colours.
     Existing class names are contractual (JS queries them) - these are all
     new names alongside them. */

  /* §7 density: chrome tightens, nothing text-bearing shrinks. */
  .wwr-issue-body { gap: 6px; padding-bottom: 10px; }

  /* §1 verdict + owner as chip-SELECTS with a closed vocabulary, recolouring
     live. The caps are belt-and-braces against a sentence-length verdict -
     the canonical labels all render in full well inside them. */
  .chip-sel {
    font: inherit; font-size: 10.5px; font-weight: 600; line-height: 1.5;
    border-radius: 999px; padding: 1px 8px; border: 1px solid transparent;
    background: var(--hover-fill); color: var(--muted);
    -webkit-appearance: none; appearance: none; cursor: pointer;
    box-sizing: border-box; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: none;
  }
  .chip-sel:focus-visible { outline: 2px solid var(--accent-bd); outline-offset: 1px; }
  .chip-sel.ok   { background: var(--green-bg); color: var(--green); }
  .chip-sel.part { background: var(--amber-bg); color: var(--amber); }
  .chip-sel.bad  { background: var(--red-bg);   color: var(--red); }
  .chip-sel.unk  { background: var(--hover-fill); color: var(--muted); }
  .chip-acc-sel   { max-width: 140px; }          /* cap, not a fixed width */
  .chip-owner-sel { max-width: 26ch; font-size: 10px; }
  .chip-isa-sel   { width: 82px; }               /* FIXED: five stacked rows
                                                    need one column width */

  /* §2 the analysis panel: one treatment for every key-value line. */
  .wwr-analysis-note {
    font-size: 11.5px; color: var(--muted); margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .wwr-aline {
    display: flex; align-items: flex-start; gap: 6px; min-width: 0;
    margin-top: 3px;
  }
  .wwr-aline-key {
    flex: none; font-weight: 650; font-size: 12px; color: var(--body);
  }
  .wwr-aline-val { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .wwr-addrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

  /* One × treatment everywhere. Delete controls never vary in colour
     between rows or sections. */
  .x-del {
    flex: none; width: 16px; text-align: right; cursor: pointer;
    color: var(--dim); font-size: 12px; line-height: 1.5;
    background: none; border: none; padding: 0;
  }
  .x-del:hover { color: var(--red); }

  /* §2b evidence as a 3-column grid; the source rail is the row marker, so
     there is no leading em-dash - two markers for one row was the defect. */
  .ev-row {
    display: grid; grid-template-columns: 62px 1fr 16px; gap: 8px;
    align-items: start; min-width: 0; padding: 1px 0;
  }
  .ev-src {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; padding-top: 1px;
  }
  .ev-src a { color: var(--muted); text-decoration: none; }
  .ev-src a:hover { color: var(--accent); text-decoration: underline; }
  .ev-src.none { color: var(--empty); }
  .ev-text {
    font-size: 12px; color: var(--body); line-height: 1.55;
    min-width: 0; overflow-wrap: anywhere;
  }

  /* §2 claim: quote marks live INSIDE the inline flow (defect 2 - a "
     and a " on their own lines around a multi-line quote).
     .editable-text is display:inline-block globally, which makes it one
     atomic box: as soon as the quote wraps, the box takes the full width and
     the glyphs are pushed onto lines of their own. Inside the claim it has to
     be a plain inline so the text and the marks share one flow. Scoped here,
     not changed globally - the empty-state min-width elsewhere needs the
     inline-block. */
  .wwr-claim-row { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
  .wwr-claim-q { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .wwr-claim-q .editable-text { display: inline; min-width: 0; }

  /* §2c "+ Add issue": matches the numbered rows it sits under. */
  .wwr-addissue {
    display: flex; align-items: center; gap: 10px; padding: 8px 0 2px;
    background: none; border: none; cursor: pointer; color: var(--muted-2);
    font: inherit; font-size: 12px;
  }
  .wwr-addissue:hover { color: var(--text); }
  .wwr-addissue-circle {
    width: 20px; height: 20px; flex: none; border-radius: 50%;
    border: 1px dashed var(--dashed); display: flex;
    align-items: center; justify-content: center; font-size: 11px;
    color: var(--dim);
  }
  .wwr-addissue:hover .wwr-addissue-circle { border-color: var(--muted-2); color: var(--muted-2); }

  /* Contacts, not events: the count in the header means contacts, and the
     individual events sit inside the expanded row. */
  .convo-count {
    flex: none; font-size: 10px; color: var(--dim); font-family: var(--mono);
  }
  .convo-unverified {
    flex: none; font-size: 10px; color: var(--amber); background: var(--amber-bg);
    border-radius: 999px; padding: 1px 7px; white-space: nowrap;
  }
  .convo-time.dim { color: var(--empty); }
  .convo-ev-time {
    flex: none; width: 88px; font-family: var(--mono); font-size: 10.5px;
    color: var(--dim);
  }
  .convo-ev-body { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .convo-ev-we { color: var(--muted); }

  /* Defect 5: a raw exception is not a trail step. Plain-language line, with
     the traceback and SQL behind a toggle. */
  .err-raw-toggle {
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--muted-2); text-decoration: underline;
  }
  .err-raw-toggle:hover { color: var(--text); }
  .err-raw {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    background: var(--inset); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; margin-top: 6px; max-height: 120px; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* §11 five stacked Q&A pairs need a rule to read as a list, not a gap. */
  .isa-list { display: flex; flex-direction: column; gap: 0; }
  .isa-row { padding: 8px 0; border-bottom: 1px solid var(--hairline); min-width: 0; }
  .isa-row:last-child { border-bottom: none; }
  .isa-q { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .isa-qtext {
    flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere;
    font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  .isa-ev {
    margin-top: 3px; font-size: 11.5px; color: var(--muted);
    min-width: 0; overflow-wrap: anywhere;
  }
  /* The source chip TRAILS the text, so evidence starts at the same x on
     every row regardless of how long the source name is. */
  .isa-src {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    margin-left: 6px;
  }
  /* The row the evidence came from - a ticket id, a booking id, the window a
     count covers. The source rail names the system; this names the record. */
  .ev-ref {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    margin-left: 6px; white-space: nowrap;
  }

  .chip-sop-sel  { max-width: 130px; font-size: 11px; }
  .chip-team-sel { max-width: 13ch; font-size: 10px; }
  .chip-team-sel.part { background: var(--amber-bg); color: var(--amber); }

  /* §12 the DSS block: reference data, read-only until ✎ Edit. */
  .dss-block { border-top: 1px dashed var(--dashed); margin-top: 10px; padding-top: 8px; }
  .dss-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dss-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim); flex: none;
  }
  .dss-src { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .dss-row { flex: 1 1 auto; min-width: 0; font-size: 11.5px; color: var(--muted);
             overflow-wrap: anywhere; }
  .dss-panel {
    margin-top: 6px; background: var(--inset); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; color: var(--body); line-height: 1.55;
    min-width: 0; overflow-wrap: anywhere;
  }
  .dss-panel .k { font-weight: 650; }

  /* §6 collapsed by default: one quiet line with a live count. */
  .slack-sections-summary { font-size: 11.5px; color: var(--muted-2); }
  .slack-customize {
    background: none; border: none; padding: 0 0 0 6px; cursor: pointer;
    font: inherit; font-size: 11.5px; color: var(--accent); text-decoration: underline;
  }
  .slack-customize:hover { color: var(--accent-hov); }
  .slack-sec-chip {
    border: 1px solid var(--input-bd); border-radius: 999px; padding: 2px 9px;
    font-size: 11px; color: var(--muted-2); cursor: pointer;
  }
  .slack-sec-chip.on {
    background: var(--accent-bg); color: var(--chip-fg); border-color: var(--accent-bd);
  }
  .slack-sec-chip input { display: none; }

  /* Amber, because it is the "broken / act on this" meaning - the same role
     .rca-empty.err has, and deliberately not either empty-state treatment. */
  .stale-bar {
    background: var(--amber-bg); color: var(--amber); font-size: 12px;
    padding: 6px 16px; border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="logo-block">
      <div class="logo">R</div>
      <div class="brand-name">Reviews RCA</div>
      <div class="brand-sub">Headout · CX</div>
    </div>
    <div class="topbar-status">
      <!-- The environment and service chips were removed on request. They
           read "dev · b75c5e0 · postgresql:helium/heliumdb · 30 reviews ·
           8 services live" across the top of a page CX uses all day - a
           commit hash and a database name are for whoever is deploying,
           not for whoever is answering a guest. Both are still at
           /api/health if either is ever wanted back. -->
      <button class="refresh-slack-btn" data-refresh-slack
              title="Pull Trustpilot reviews from Slack that aren't here yet">↻ Refresh from Slack</button>
      <button class="refresh-slack-btn" data-rerun-all
              title="Re-run every review missing a match or an RCA">⟳ Fix incomplete</button>
    </div>
  </header>

  <div class="main">
    <aside class="inbox">
      <div class="inbox-head">
        <!-- Job progress. The state lives on the server, so closing the tab or
             reloading does not lose the run - this bar reattaches to whatever
             is already going. -->
        <div class="bulk-bar" id="bulk-bar" hidden>
          <div class="bulk-track"><div class="bulk-fill" id="bulk-fill"></div></div>
          <div class="bulk-meta">
            <span id="bulk-text">…</span>
            <button class="bulk-cancel" id="bulk-cancel">cancel</button>
          </div>
        </div>
        <div class="inbox-search-row">
          <!-- type=text, not type=search. Chromium clears a search input on
               Escape by itself, which made our own Escape handler redundant
               there and load-bearing everywhere else — a behaviour difference
               no test would catch, because the test runs in Chromium. It also
               draws a second native clear button next to ours. -->
          <input id="inbox-search" class="inbox-search" type="text"
                 autocomplete="off" spellcheck="false"
                 placeholder="Search name, BID, ZD-…, review text, L1/L2">
          <button class="inbox-search-clear" id="inbox-search-clear"
                  title="Clear the search" hidden>×</button>
        </div>
        <div class="inbox-tabs">
          <button class="inbox-tab active" data-tab="all">All <span class="num" id="cnt-all">0</span></button>
          <button class="inbox-tab" data-tab="identified">Matched <span class="num" id="cnt-identified">0</span></button>
          <button class="inbox-tab" data-tab="candidates">Confirm <span class="num" id="cnt-candidates">0</span></button>
          <button class="inbox-tab" data-tab="processing">Processing <span class="num" id="cnt-processing">0</span></button>
          <button class="inbox-tab" data-tab="untraceable">Untraceable <span class="num" id="cnt-untraceable">0</span></button>
          <button class="inbox-tab" data-tab="sent">Sent <span class="num" id="cnt-sent">0</span></button>
        </div>
      </div>
      <div class="inbox-list" id="inbox-list"></div>
      <div class="inbox-footer">
        <button class="add-manual-btn">+ Add review</button>
        <button class="reporting-link">Reporting</button>
      </div>
    </aside>

    <div class="col-resize" data-resize="inbox" role="separator"
         aria-orientation="vertical" tabindex="0"
         aria-label="Resize the inbox column"></div>
    <section class="review-col" id="review-col"></section>
    <div class="col-resize" data-resize="facts" role="separator"
         aria-orientation="vertical" tabindex="0"
         aria-label="Resize the facts column"></div>
    <section class="rca-col" id="rca-col"></section>
  </div>
</div>

<script>
// The REAL L1/L2 catalogue, from /api/taxonomy — the same source the
// classifier, the macro filing and the support-tag lookup all read.
//
// What was here was a placeholder catalogue written before the taxonomy
// existed, and its own comment said so: "to be replaced with real list from
// CX team". It shipped. Its L1 keys — 'SP issue', 'CO miss', 'Fulfilment',
// 'Product/UX' — are not L1s. There was no entry for 'Operations Issue' or
// any other real one, so the L2 dropdown was EMPTY on every review, and the
// L1 dropdown offered seven categories that would classify a review into a
// bucket nothing downstream can match: no macro, no support tags, no
// sub-themes. The card then reported "no support-tag mapping" and was right.
//
// Empty until it loads, exactly like SUB_THEME_OPTIONS and SCENARIO_OPTIONS
// below — the selects still show the current classification meanwhile.
let L1_CATEGORIES = [];
let L2_OPTIONS = {};

// Keyed "L1::L2" -> ["A. Name", …, "N. Irrelevant"].
// Populated from /api/taxonomy (which already returns `sub_theme_frameworks`
// in exactly this "L1::L2" key form) so the frontend never duplicates taxonomy.
// Empty is safe: the row still shows the classified sub_theme; the editable
// options simply fill in once the taxonomy loads.
const SUB_THEME_OPTIONS = {};
// The scenario vocabulary from /api/taxonomy. Empty until it loads - the row
// still shows the routed scenario; the other options fill in after.
let SCENARIO_OPTIONS = [];
// The grounds for a takedown, from the copy file via /api/taxonomy. Empty
// until it loads, and an empty list draws no control at all rather than an
// empty dropdown - a select with nothing in it reads as a broken lookup.
let TAKEDOWN_REASONS = [];

async function loadSubThemeOptions() {
  try {
    const t = await (await fetch('/api/taxonomy')).json();
    const fw = t.sub_theme_frameworks || {};
    for (const key in fw) {
      const f = fw[key];
      const opts = (f.sub_themes || []).map(([code, name]) => `${code}. ${name}`);
      if (f.exclusion_label) opts.push(f.exclusion_label);
      SUB_THEME_OPTIONS[key] = opts;
    }
    SCENARIO_OPTIONS = t.scenarios || [];
    TAKEDOWN_REASONS = t.takedown_reasons || [];
    // The classification catalogue, from the same call. Everything else in
    // this function was already taxonomy-driven; L1/L2 were the one pair
    // still hardcoded, and they were hardcoded WRONG.
    L1_CATEGORIES = t.l1_categories || [];
    L2_OPTIONS = t.l2_options || {};
  } catch (e) { /* leave empty — row still shows the assigned sub_theme */ }
  // re-render so the sub-theme row appears once options are available
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
}
// call once on load; re-render picks up options after taxonomy resolves
loadSubThemeOptions();

// ── Inbox wiring ─────────────────────────────────────────────────────────────
// Did the booking id come from the review itself, or did we infer it?
// attachment / manual / regex all mean the review carried it. Anything else
// (a Zendesk requester match, a venue search) is inferred, however confident.
// The server decides the bucket (server/tiers.py) and sends it. These exist
// only for rows from an older build that predates the field, and they mirror
// that rule exactly - a second, differently-worded copy of this logic is what
// put confirmed candidates in the wrong tab for weeks.
function _bucketFallback(row, tier, candState) {
  // Mirrors server/tiers.py classify() exactly, on the same three facts the
  // server sends. Only used for rows from a build that predates the bucket
  // field; kept in lockstep because a second, differently-worded copy of this
  // rule is what misfiled confirmed candidates.
  if (row.status === 'sent') return 'sent';
  // No draft row is NOT untraceable — see server/tiers.py. Untraceable is a
  // result; this is a run that has not produced one yet.
  if (row.has_draft === false) return 'processing';
  const pickerOpen = !!candState && !row.confirmed;
  if (pickerOpen) return 'candidates';
  if (row.has_booking) return 'identified';
  if (row.has_candidates) return 'candidates';
  return 'untraceable';
}

function _matchTitle(row, tier, candState) {
  const bucket = row.bucket || _bucketFallback(row, tier, candState);
  if (bucket === 'candidates') return 'Possible matches — associate to confirm';
  // "Untraceable" is a claim about the booking. This one is a claim about the
  // run, and saying the first when you mean the second sends someone looking
  // for a booking nobody has searched for.
  if (bucket === 'processing')
    return row.processing_state === 'stalled'
      ? 'The run stopped before it searched'
      : 'Still running — nothing has been searched yet';
  if (bucket === 'untraceable') return 'Untraceable';
  if (row.unverified) return 'BID from the review — not verified in BigQuery';
  return _bidFromReview(row) ? 'Direct match' : 'Matched from Zendesk';
}

function _bidFromReview(row) {
  if (!row) return false;
  // The review carried a booking id: either the pipeline recorded where it came
  // from, or the review row itself still holds the reference number. Falling
  // back to reference_number matters for rows drafted before bid_source existed.
  if (['attachment', 'manual', 'regex'].includes(row.bid_source)) return true;
  return !!(row.reference_number && String(row.reference_number).trim());
}

// Backend identity chip. Stale code or a different database is the single
// most confusing failure in this app - two dashboards, two answers - so it is
// on screen rather than in a curl command.
async function fetchInbox() {
  try {
    const rows = await (await fetch('/api/reviews')).json();
    const byId = new Map(REVIEWS.map(r => [r.id, r]));
    const merged = rows.map(row => {
      const demo = byId.get(row.id);
      if (demo) {
        // Recompute type/tier/title from the FRESH row — a re-run can move a
        // review between tabs (untraceable -> candidates -> identified).
        const t = row.match_tier ?? demo.matchTier;
        const c = row.candidate_state ?? demo.candidateState;
        return {
          ...demo,
          receivedAt:     row.received_at || demo.receivedAt,
          status:         row.status      || demo.status,
          matchTier:      t,
          candidateState: c,
          type:           row.bucket || _bucketFallback(row, t, c),
          tier:           row.tier_label || (t ? `T${t}` : '—'),
          unverified:     !!row.unverified,
          // Which kind of not-yet-searched this is: a run in flight, or one
          // that ended without writing a draft. Same blank card, opposite
          // responses — wait, versus re-run and read the log.
          processingState:  row.processing_state || '',
          processingReason: row.processing_reason || '',
          matchTitle:     _matchTitle(row, t, c),
        };
      }
      // New API-only review (manual / Slack): minimal template
      const tier = row.match_tier;
      return {
        id:             row.id,
        author:         row.author || 'Unknown',
        firstName:      _firstName(row.author),
        rating:         row.rating || 1,
        stars:          '★'.repeat(row.rating || 1) + '☆'.repeat(5 - (row.rating || 1)),
        language:       row.language || 'en',
        lang:           (row.language || 'en').toUpperCase(),
        receivedAt:     row.received_at,
        time:           row.received_at ? new Date(row.received_at).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '',
        status:         row.status || 'new',
        matchTier:      tier,
        matchTitle:     _matchTitle(row, tier, row.candidate_state),
        candidateState: row.candidate_state || false,
        type:           row.bucket || _bucketFallback(row, tier, row.candidate_state),
        tier:           row.tier_label || (tier ? `T${tier}` : '—'),
        unverified:     !!row.unverified,
        // Which kind of not-yet-searched this is: a run in flight, or one
        // that ended without writing a draft. Same blank card, opposite
        // responses — wait, versus re-run and read the log.
        processingState:  row.processing_state || '',
        processingReason: row.processing_reason || '',
        experience:     row.experience || '',
        channel:        'orm',
        original:       row.snippet || '',
        english:        null,
        originalText:   row.snippet || '',
        englishText:    row.snippet || '',
        booking:        {},
        rca:            {
          issueL1: '', issueL2: '', subTheme: null,
          whatWentWrong: '', statedIssue: '',
          supportInteraction: [], supportSummary: '', spInteraction: [],
          areaOfImproving: '',
          actionsTaken: {sp:[],customer:[],business:[],product:[],ce:[]},
          resolution: '',
          v3: {}, wwrChain: [], wwrScenarios: [], prevention: '',
          evidence: [], issueSpecificAnswers: {}, checklistAnswers: [],
          checks: [], reply: '', reasoning: '',
          primaryScenario: '',
          slackThreadOverride: '',
        },
        insights: {
          tgidRating: {value:'—',sub:'',tone:''},
          tidVidRating: {value:'—',sub:'',tone:''},
          completion: {value:'—',sub:'',tone:''},
          sameDayIssues: {value:'—',sub:'',tone:''},
          similarSupport: [], similarReviews: [],
        },
        events: [],
        timelineSummary: '',
      };
    });
    merged.sort((a, b) => new Date(b.receivedAt || b.time || 0) - new Date(a.receivedAt || a.time || 0));
    REVIEWS.length = 0;
    REVIEWS.push(...merged);
  } catch (e) {
    console.warn('[inbox] fetch failed, keeping last loaded reviews:', e);
  }
}

// Overlay real draft fields onto the demo view-models. Data source only:
// sub_theme, support_interaction_frames (+ sp_interaction_frames) and
// support_summary come from /api/reviews/{id}; markup stays demo-v15.

// Defect 5: a pipeline exception is never rendered as a trail step. The step
// carries a plain-language sentence; the raw error and its SQL sit behind a
// toggle, in mono, height-capped and scrollable, so a 500-character SELECT
// cannot push the panel apart. Shared by both trail renderers - two copies of
// this drifted once already.
function trailStep(st, key) {
  const mark = st.mark === 'pass' ? '✓' : st.mark === 'warn' ? '!' : '✗';
  const cls  = st.mark === 'pass' ? 'pass' : st.mark === 'warn' ? 'warn' : 'fail';
  const raw  = st.raw ? String(st.raw) : '';
  const open = !!state.rawErrOpen[key];
  return `
    <div class="conf-step ${cls}">
      <span class="mark">${mark}</span>
      <span class="label-text">${st.text}${raw ? `
        <button class="err-raw-toggle" data-raw-err="${key}">${open ? 'hide raw error' : 'show raw error'}</button>
        ${open ? `<div class="err-raw">${esc(raw)}</div>` : ''}` : ''}</span>
    </div>`;
}

// Hoisted so both columns can use it: §13 moves the booking timeline into the
// facts column, and its rows are editable. It closes over nothing but esc().
// Resolution as an object, whatever shape the draft holds. Drafts written
// before the split store it as a bare string; reading `.text` off one would
// return undefined and blank the line on every older review.
function _resObj(raw) {
  if (raw && typeof raw === 'object') return raw;
  return {text: typeof raw === 'string' ? raw : '',
          compensation_type: null, amount: null};
}

function edSpan(path, text, ph = 'click to write') {
  const empty = !String(text == null ? '' : text).trim();
  return `<span class="editable-text${empty ? ' is-placeholder' : ''}" contenteditable="true"
    spellcheck="false" data-v3p="${path}"${empty ? ` data-ph="${esc(ph)}"` : ''}>${empty ? esc(ph) : esc(text)}</span>`;
}

function mapSupportFrame(f) {
  return {
    type: f.thread || 'email',
    time: f.time || '',
    label: f.label || '',
    guestSaid: f.guestSaid || f.summary || '—',
    weDid: f.weDid || '—',
    guestReply: f.guestReply || '—',
    gap: f.gap || '',
  };
}

// {ok, window, insights} or a bare insights dict - take whichever this server
// speaks. Recognised by a field every insights payload carries.
//
// Top level, because two callers need it: the initial load below and the
// window-picker handler in renderReviewCol. It used to be declared inside
// loadDraftOverlays, so the picker's call threw a ReferenceError into a catch
// that discarded it - the fetch succeeded, the response was thrown away, and
// the panel kept the previous window's numbers under the previous window's
// label. Every symptom of a broken window picker, with a working request
// behind it.
// "90d" -> 90. Mirrors _WINDOWS in server/services/insights.py, and exists so
// the panel can compare the window it ASKED for against the one the payload
// says it got. Unknown strings return null rather than a guess: claiming a
// mismatch on a window we cannot parse would be its own false alarm.
function windowDays(w) {
  const m = /^(\d+)\s*([dwm])$/i.exec(String(w || '').trim());
  if (!m) return null;
  return Number(m[1]) * {d: 1, w: 7, m: 30}[m[2].toLowerCase()];
}

function unwrapInsights(payload) {
  if (!payload || typeof payload !== 'object') return null;
  if (payload.insights && typeof payload.insights === 'object') return payload.insights;
  if ('similar_reviews_30d' in payload || '_computed_for_l2' in payload) return payload;
  return null;
}

// Everything a scenario change invalidates, re-read from the server.
//
// The scenario drives the checklists, the issue questions, the DSS routing and
// the prompt, so changing it makes the RCA on screen an answer to a question
// nobody is asking any more. It also changes `scenario_routing.diverged` and
// the uncovered-scenario list, both computed server-side — guessing those
// locally is how the card and the server end up disagreeing about the same
// scenario.
//
// The insights go too. They are scoped by L1/L2 rather than by scenario, but a
// scenario change usually follows a classification change, and a panel that
// silently keeps the previous classification's figures is the exact complaint
// this dashboard already had once.
// Save the routing lists and re-run the RCA against them, for whichever
// review is selected.
//
// TOP LEVEL, not a closure inside renderRcaCol, because the chip controls it
// serves are DRAWN by renderReviewCol. A closure has to be re-created by a
// render that runs after the markup exists, and eight callers of
// renderReviewCol do not call renderRcaCol afterwards - so changing the
// insights window, among others, left every scenario control on the card
// bound to nothing. Silently: the select still opens, still shows options,
// and does nothing when you pick one.
async function regenerateForScenarios(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r || !r.rca) return;
  const rca = r.rca;
  const scenarios = [...(rca.scenarios || []),
                     ...(rca.overlayScenarios || [])].filter(Boolean);
  rca.primaryScenario = scenarios[0] || '';
  // Save first: if generation fails the chips still reflect what the person
  // chose, instead of snapping back on the next render.
  await saveDraft(r.id, {sub_themes: rca.subThemes || [],
                         scenarios: rca.scenarios || [],
                         overlay_scenarios: rca.overlayScenarios || []});
  if (!scenarios.length) { renderReviewCol(); renderRcaCol(); return; }
  const st = document.querySelector('[data-scenario-regen-status]');
  if (st) st.textContent = '⟳ re-running RCA for new scenarios…';
  let failed = '';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scenarios}),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'regen failed');
    rca.v3 = data.rca_v3 || {};
    rca.prevention = data.prevention || rca.prevention;
    rca.issueSpecificAnswers = data.issue_specific_answers || {};
    if (data.area_of_improving) rca.areaOfImproving = data.area_of_improving;
    rca.checklistAnswers = [];
    rca.primaryScenario = data.primary_scenario || rca.primaryScenario;
    rca.overlayScenarios = data.overlay_scenarios || rca.overlayScenarios;
  } catch (e) {
    failed = '✗ RCA re-run failed — scenario saved, try again';
    await saveDraft(r.id, {primary_scenario: rca.primaryScenario || null});
  }
