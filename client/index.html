              } else if (p.state === 'stalled') {
                clearInterval(poll);
                await reloadFromServer();
                confirmBtn.disabled = false;
                confirmBtn.textContent =
                  `✗ no progress for ${Math.round(p.since_progress_s / 60)}m — re-run`;
                return;
              } else if (p.running) {
                const m = String(Math.floor(p.elapsed_s / 60));
                const sec = String(p.elapsed_s % 60).padStart(2, '0');
                confirmBtn.textContent = `⟳ ${p.step}/${p.total} ${p.stage} · ${m}:${sec}`;
              }
            }
          } catch (_) {}
          // A confirmed candidate runs the FULL pipeline — Zendesk, insights,
          // RCA, response draft — which is minutes, not seconds. Sixty seconds
          // was the old budget and no run has ever finished inside it, so the
          // poll gave up every single time and the only visible difference
          // between that and a broken confirm was nothing at all.
          if (polls > 200) {              // ~10 min, the runner's own budget
            clearInterval(poll);
            await reloadFromServer();     // it may have landed just after
            confirmBtn.disabled = false;
            confirmBtn.textContent = '⏱ still running after 10m — reload to check';
          }
        }, 3000);
      } catch (e) {
        confirmBtn.textContent = '✗ Error — try again';
        confirmBtn.disabled = false;
      }
    });
  }
}

// The window these numbers were actually computed for. The picker is a
// button someone may have clicked after the numbers were fetched, so labelling
// a cached 7-day count "90d" because 90d is highlighted is how a Slack post
// tells leadership the wrong scope. The data carries its own window.
function _insightsWindowLabel(r) {
  const raw = (r && r.insightsRaw) || {};
  if (typeof raw._window_days === 'number' && raw._window_days > 0) return raw._window_days + 'd';
  if (raw._window_label) return String(raw._window_label);
  return (typeof state !== 'undefined' && state.insightsWindow)
    ? state.insightsWindow + ' (picker — data carried no window)'
    : 'unknown';
}

// Shared by every branch of the RCA column, including the untraceable one,
// which returns before the main renderer's locals exist - a helper defined
// down there is a ReferenceError up here.
const esc = s => String(s == null ? '' : s).replace(/</g, '&lt;').replace(/>/g, '&gt;');

// One save path for every RCA edit.
//
// Nine handlers did this inline with `catch (e) { /* keep local edit */ }` and
// no res.ok check. fetch only rejects on a network failure, so a 400 or a 500
// resolved and was treated as a successful save: the edit stayed on screen,
// the tick appeared, and the change was gone on reload with nothing said.
// Anything that cannot be saved has to say so while the words are still on
// the screen to copy.
//
// A NETWORK FAILURE IS RETRIED; A REFUSAL IS NOT. fetch rejects only when the
// request never completed — the server restarting, the tab asleep, the tunnel
// dropping. That is transient by nature and the message the browser gives for
// it, "Failed to fetch", says nothing a person can act on. This app is
// restarted constantly, and every restart turned a typed edit into a red
// toast that vanished after seven seconds while the words sat on screen
// looking saved.
//
// An HTTP failure is the opposite: the server received the patch and refused
// it. Retrying sends the same body to the same rule and gets the same answer,
// three times as slowly, so those break out immediately.
async function saveDraft(reviewId, patch, el) {
  const MAX = 3;
  let lastErr = null, refused = false;
  for (let attempt = 1; attempt <= MAX; attempt++) {
    try {
      const res = await fetch(`/api/reviews/${reviewId}/draft-v2`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(patch),
      });
      if (!res.ok) {
        refused = true;
        throw new Error(`${res.status} ${await res.text()}`.slice(0, 200));
      }
      if (el && typeof el.dataset === 'object') _saveMark(el, true);
      return true;
    } catch (e) {
      lastErr = e;
      if (refused || attempt === MAX) break;
      // 400ms, then 1200ms. A Replit restart is back inside two seconds; a
      // longer wait would just hold the edit hostage for a server that is
      // properly down.
      await new Promise(r => setTimeout(r, attempt * 400));
    }
  }
  console.warn('draft save failed', patch, lastErr);
  if (el && typeof el.dataset === 'object') _saveMark(el, false);
  _saveToast(refused
    ? String(lastErr && lastErr.message || lastErr)
    : `the server did not answer after ${MAX} tries. Your edit is still on `
      + `screen and has NOT been saved — it will save if you change it again `
      + `once the server is back.`,
    !refused);
  return false;
}

function _saveMark(el, ok) {
  const host = el.parentElement || el;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  let tick = host.querySelector(':scope > .save-tick');
  if (!tick) {
    tick = document.createElement('span');
    tick.className = 'save-tick';
    host.appendChild(tick);
  }
  tick.textContent = ok ? '✓ saved' : '✗ not saved';
  tick.style.color = ok ? '' : '#e5534b';
  tick.classList.add('on');
  setTimeout(() => tick.classList.remove('on'), ok ? 1400 : 6000);
}

// Not every save is tied to an element on screen, and a save that failed with
// nowhere to show it is the failure mode this is fixing.
function _saveToast(msg, sticky) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);'
      + 'background:#e5534b;color:#fff;padding:9px 14px;border-radius:8px;z-index:9999;'
      + 'font-size:12.5px;max-width:80vw;box-shadow:0 4px 16px rgba(0,0,0,.25)';
    document.body.appendChild(t);
  }
  t.textContent = 'Not saved — ' + msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  // AN UNSAVED EDIT OUTLIVES SEVEN SECONDS. A refusal is actionable now and
  // clears; an unreachable server leaves work on screen that is still not
  // saved a minute later, and a toast that has already gone is the same as
  // never having shown one.
  t._h = setTimeout(() => { t.style.display = 'none'; }, sticky ? 30000 : 7000);
}

// "14:02" today, "3 Jul" before that. Used on buttons whose action already
// happened, so the label says when rather than inviting a repeat.
function _shortWhen(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})
    : d.toLocaleDateString([], {day: 'numeric', month: 'short'});
}
// Pointer fields are lists in the v3 shape; older drafts hold one string.
// "Frau Nicole Liebschner" is not called Frau. Taking the first word of the
// author name put a German honorific into a guest-facing greeting - "Hey
// Frau,". Titles are stripped before the first real name is taken.
const _TITLES = new Set(['mr','mrs','ms','miss','mx','dr','prof','sir','madam',
  'herr','frau','fraulein','fräulein','monsieur','madame','mademoiselle','m',
  'sr','sra','srta','don','dona','doña','dott','ing','sig','sig.ra','signora',
  'signore','heer','mevrouw','pan','pani','hr','fru','herra','rouva']);
// Approved untraceable reply. Kept in one place so the copy button, the
// panel and anything else that needs it cannot drift apart.
const UNTRACEABLE_REPLY = (first) =>
`Hey ${first},

I'm sorry things didn't go as planned, and I'd love to fix this for you right away. Please share your booking ID (if available) or the email address used for your booking at https://bit.ly/hedout. Once we have your details, our team will dive right in to resolve it ASAP.

Thank you so much for your understanding and patience. I'll make sure we turn this around for you!

Best,
[Your Name], Headout`;

const _firstName = (author) => {
  const parts = String(author || '').trim().split(/\s+/).filter(Boolean);
  for (const p of parts) {
    const bare = p.replace(/\.$/, '').toLowerCase();
    if (_TITLES.has(bare)) continue;
    return p;
  }
  return 'there';
};
// The nine teams a row can be raised with, in the order the ORM team gave
// them. Same vocabulary as the flags, because Actions Taken IS the join of the
// two: the DSS guidelines say a step must be raised, a flag says the team it
// belongs to went wrong, and a row appears only where both are true. The server
// computes the join (server/checklist.py::actions_raised); this list is what
// renders it, so the labels have to be the same nine or a tab goes missing.
// THE TAB STRIP, which is the nine teams PLUS Unrouted. The server routes a
// fix with no owner to `unrouted` (checklist.ACTION_TAB_ORDER), and this list
// used to be ACTION_TEAMS — nine — so those rows landed on a tab that was
// never drawn. Invisible, on the screen whose whole job is to say what each
// team has to pick up.
//
// SEPARATE from ACTION_TEAMS on purpose: that list is also the owner-select
// vocabulary, and a tenth entry there would offer "Unrouted" as a team an
// associate could assign work to.
const ACTION_TAB_ORDER = [
  ['unrouted', 'Unrouted'],
];
const ACTION_TEAMS = [
  ['guest',     'NA/Guest error'],
  ['sp',        'Supply Partner'],
  ['content',   'Content/Catalog/Media team'],
  ['co',        'CO team'],
  ['tech',      'Tech team'],
  ['inventory', 'Inventory Team'],
  ['product',   'Product team'],
  ['biz',       'Biz team'],
  ['finance',   'Finance team'],
];
// Where a draft written under the five old tabs lands. CE and RO were both the
// support desk, "Customer" was never a team, and "Business" carried everything
// commercial. Folding them keeps an old card's rows on screen instead of
// emptying it, which would read as a card with nothing raised.
const ACTION_TEAM_LEGACY = {customer: 'co', ce: 'co', ro: 'co',
                            business: 'biz', other: ''};
const actionTeamKey = k => {
  const key = String(k || '').trim().toLowerCase();
  if (ACTION_TEAMS.some(([t]) => t === key)) return key;
  return ACTION_TEAM_LEGACY[key] !== undefined ? ACTION_TEAM_LEGACY[key] : '';
};

const asPoints = v => (Array.isArray(v) ? v : (v ? [v] : [])).filter(Boolean)
  .map(p => String(p).replace(/^\s*[•·\-–▪]\s*/, ''));

// §5 an area-of-improvement point is {point, from, source} now. The provenance
// is not decoration and it is not a second column: it is the constraint that
// makes an invented point impossible to write, because the server drops any
// point whose source matches no operational failure, SOP gap or flag on the
// card (server/services/rca_v4_validate.py::_improvements). On screen it is a
// marker you can hover, so a reader who doubts a point can check it without
// every reader having to read it.
//
// A draft written before that holds bare strings, and a point somebody types
// here is theirs, not the model's - both normalise to the same row shape so the
// renderer has one thing to draw and neither reads as unsourced model output.
const aoiRows = v => (Array.isArray(v) ? v : (v ? String(v).split('\n') : []))
  .map(x => (x && typeof x === 'object')
    ? {point: String(x.point || x.text || '').trim(),
       from:  x.from || null, source: x.source || null}
    : {point: String(x || '').replace(/^\s*[•·\-–▪]\s*/, '').trim(),
       from: null, source: null})
  .filter(x => x.point);

// Delegated once: the toggle appears in both columns and both re-render from
// scratch, so a per-element binding would have to be re-attached in every
// place that touches innerHTML - which is how a control ends up live in one
// column and dead in the other.
// §13 the booking timeline renders from the facts column now, so its controls
// are delegated: a per-render binding inside renderRcaCol left them dead the
// moment the markup moved. Same reason as the raw-error toggle.
document.addEventListener('click', async ev => {
  const t = ev.target.closest && ev.target.closest('[data-log-del], [data-log-add]');
  if (!t) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  if (t.hasAttribute('data-log-del')) {
    v3.booking_logs = (v3.booking_logs || []).filter((_, i) => i !== parseInt(t.dataset.logDel));
  } else {
    // MARKED AS HAND-ADDED. It is the only thing that distinguishes a row a
    // person wrote from the model's narration of the Zendesk events, and the
    // merged timeline needs that: the narration duplicates the events, a
    // typed row does not.
    v3.booking_logs = [...(v3.booking_logs || []),
      {time: '', what: 'New event — click to edit', detail: '', hand: true}];
  }
  await saveDraft(r.id, {rca_v3: v3});
  renderReviewCol(); if (state.selected) renderRcaCol();
});

document.addEventListener('blur', async ev => {
  const el = ev.target.closest && ev.target.closest('[data-log-idx]');
  if (!el) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  const l = (v3.booking_logs || [])[parseInt(el.dataset.logIdx)];
  if (!l || typeof l === 'string') return;
  l[el.dataset.logField] = el.textContent.trim();
  await saveDraft(r.id, {rca_v3: v3});
}, true);

// Which build is this page talking to.
//
// "The dashboard looks like the previous version" is unanswerable from the
// browser: a stale page, a server that was never restarted after a pull, and a
// deploy that silently failed all look identical. /api/version already knows -
// it compares the running process against what is checked out on disk - so the
// only thing missing was saying it where the reader is.
//
// Quiet when current: the build goes on <body data-build> and into the logo's
// tooltip. Loud when stale, because that is the case someone has to act on.
(async () => {
  try {
    const v = await (await fetch('/api/version', {cache: 'no-store'})).json();
    const tag = `${v.short} · ${v.fingerprint} · ${v.environment} · up ${v.uptime_s}s`;
    document.body.dataset.build = tag;
    // Three states. `stale === null` is "this environment has no .git, so the
    // commit could not be read" — which used to arrive as false and read as
    // "you are current". Say it, and say what answers it, because the reader
    // of a deployment has no other way to find out which code is serving.
    const st = buildState(v);
    document.body.dataset.stale =
      st === 'unknown' ? 'unknown' : st === 'stale' ? 'yes' : 'no';
    const logo = document.querySelector('.logo, .brand, .topbar-title, .top-bar');
    if (logo) logo.title = tag;
    console.info('[build] ' + tag + (st === 'stale' ? '  ← STALE'
                                     : st === 'unknown' ? '  ← BUILD UNKNOWN' : ''));
    if (st !== 'current') {
      const bar = document.createElement('div');
      bar.className = 'stale-bar';
      bar.textContent = st === 'stale'
        ? `This page is talking to an older build — running ${v.short}, `
          + `checked out ${String(v.on_disk).slice(0, 7)}. Restart the server to pick up the pull.`
        : `Cannot tell which build this is — no .git in this environment. `
          + `Fingerprint ${v.fingerprint}: compare it with the repl's `
          + `/api/version. Equal means identical code; different means this `
          + `one is behind and needs a Deploy.`;
      document.body.prepend(bar);
    }
  } catch (_) { document.body.dataset.build = 'unknown'; }
})();

document.addEventListener('click', ev => {
  const btn = ev.target.closest && ev.target.closest('[data-raw-err]');
  if (!btn) return;
  ev.stopPropagation();
  state.rawErrOpen[btn.dataset.rawErr] = !state.rawErrOpen[btn.dataset.rawErr];
  renderReviewCol();
  if (state.selected) renderRcaCol();
});

// Machinery toggle. Hiding is a display choice, so it is reversible and it
// says how many it hid — a filter that silently removes rows is how the regex
// in the old renderer went unnoticed for so long.
//
// Delegated, and it re-renders the RCA column. §13 moved the events timeline
// out of the review column, and the binding stayed behind: it was still
// queried off `review-col` (which no longer contains the note, so nothing was
// bound) and still called renderReviewCol (which no longer draws the
// timeline, so nothing would have changed if it had been). The control
// rendered and did nothing, which is how it went unnoticed.
document.addEventListener('click', ev => {
  const t = ev.target.closest && ev.target.closest('[data-tl-toggle]');
  if (!t) return;
  state.tlShowInternal = !state.tlShowInternal;
  // renderReviewCol, not renderRcaCol. The timeline merged into the FACTS
  // column, and a toggle that re-renders the column the section is no longer
  // in flips the state and changes nothing on screen — a live-looking control
  // that does nothing, which is the exact failure §13 caused the first time
  // this section moved.
  if (state.selected) renderReviewCol();
});

// ── Classification (L1 / L2) ────────────────────────────────────────────────
//
// Both selects rendered and neither was bound to anything: no data- hook, no
// listener. Changing the L1 or L2 on the card did nothing, silently — which
// is also how the L2 dropdown being EMPTY went unnoticed, because a control
// nobody can operate cannot report that its options are missing.
//
// DELEGATED, and that is the point. The first fix bound these inside
// renderRcaCol while the block itself is drawn by renderReviewCol, so the
// first change worked and every one after it did nothing: the L2 handler
// called renderReviewCol, which replaced the selects with unbound copies.
// Exactly the §13 failure again — rendered by one function, bound by another,
// and only the first click ever lands. A delegated listener cannot come
// unbound by a re-render, whichever function does the rendering.
//
// Everything downstream is keyed on this pair — the macro filing, the
// support-tag comparison, the sub-theme framework — so a re-classification
// has to reach the server AND redraw the chips below it.
// One-click revert: adopt what routing says instead of the hand-set scenario.
//
// DELEGATED, for the same reason the classify selects above are. The reconcile
// row is drawn by renderReviewCol; binding it inside renderRcaCol with a
// col-scoped query found nothing at all, because `col` is the RCA column and
// the row is not in it. That is the §13 failure for the fifth time, and the
// browser test caught it — the button rendered perfectly and did nothing.
//
// Reverting is itself a judgement, so it goes through the same path as any
// other scenario edit and is recorded as hand-set too. One that agrees with
// routing reads as `diverged: false` on the next load, so the row disappears
// on its own rather than needing to be dismissed.
document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest('[data-scenario-revert]');
  if (!btn) return;
  const target = btn.dataset.scenarioRevert;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!target || !r || !r.rca) return;
  const rca = r.rca;
  rca.scenarios = [target, ...(rca.scenarios || []).slice(1)
                                .filter(x => x !== target)];
  rca.primaryScenario = target;
  await saveDraft(r.id, {scenarios: rca.scenarios, primary_scenario: target});
  // Reverting IS a scenario change, so the RCA has to be re-run against the
  // new checklists like any other. Saving the chip and leaving the analysis
  // written for the old scenario is the state the uncovered-scenario flag
  // exists to report — better not to create it in the first place.
  const st = document.querySelector('[data-scenario-regen-status]');
  if (st) st.textContent = '⟳ re-running RCA for the routed scenario…';
  let failed = '';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scenarios: rca.scenarios}),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'regen failed');
    rca.v3 = data.rca_v3 || rca.v3;
    rca.prevention = data.prevention || rca.prevention;
    if (data.area_of_improving) rca.areaOfImproving = data.area_of_improving;
    rca.checklistAnswers = [];
  } catch (e) {
    failed = '✗ RCA re-run failed — scenario saved, try again';
  }
  await refreshAfterScenarioChange(r.id);
  renderReviewCol(); renderRcaCol();
  // AFTER the re-render, not before. Writing it first put the message into a
  // node renderReviewCol then replaced, so a failed re-run reported itself for
  // a few hundred milliseconds and then looked exactly like a success.
  if (failed) {
    const after = document.querySelector('[data-scenario-regen-status]');
    if (after) after.textContent = failed;
  }
});

document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest('[data-classify]');
  if (!sel) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const rca = r.rca;
  if (sel.dataset.classify === 'l1') {
    rca.issueL1 = sel.value;
    // The old L2 belongs to the old L1. Carrying it over produces a pair that
    // exists nowhere in the taxonomy — the state that makes every downstream
    // lookup correctly report that it found nothing.
    const valid = L2_OPTIONS[sel.value] || [];
    if (!valid.includes(rca.issueL2)) rca.issueL2 = valid[0] || '';
  } else {
    rca.issueL2 = sel.value;
  }
  // The sub-theme framework is keyed "L1::L2", so a pair change makes the
  // sub-themes wrong rather than merely stale.
  const stillValid = SUB_THEME_OPTIONS[`${rca.issueL1}::${rca.issueL2}`] || [];
  rca.subThemes = (rca.subThemes || []).filter(s => stillValid.includes(s));
  rca.subTheme = rca.subThemes[0] || null;
  await saveDraft(r.id, {l1: rca.issueL1, l2: rca.issueL2,
                         sub_themes: rca.subThemes});
  // Classification lives in the RCA (Diagnosis tab) now, not the facts column,
  // so its L1/L2 change must repaint the RCA — repainting only the facts left
  // the L2 dropdown stale.
  renderRcaCol();
  renderReviewCol();
});

function renderRcaCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('rca-col').innerHTML = '';
    return;
  }

  const col = document.getElementById('rca-col');

  // The RCA runs against a specific booking, so an unconfirmed candidate set
  // gets a gate rather than a half-built workspace: editing an analysis that
  // is about to be regenerated against a different booking wastes the work.
  // Closed out with no analysis. Without this the Sent tab draws the full RCA
  // workspace over an empty draft — twelve blank sections and a Send button —
  // which reads as an RCA that came back empty rather than one that was never
  // written. The reason is the whole content of the card.
  if (r.closedAt && !((r.rca || {}).issueL1)) {
    col.innerHTML = `
      <div class="rca-head">
        <div>
          <div class="rca-title">RCA &amp; response</div>
          <div class="rca-sub">Closed out — no analysis was written</div>
        </div>
      </div>
      <div class="rca-gate">
        <div class="rca-gate-title">This review was closed, not answered</div>
        <div class="rca-gate-body">${esc(r.closeReason
          || 'No reason was recorded.')} Nothing was posted to Slack and no RCA
          exists for it. Re-run matching from the middle panel if a booking has
          since come to light.</div>
      </div>`;
    return;
  }

  if (r.type === 'candidates') {
    col.innerHTML = `
      <div class="rca-head">
        <div>
          <div class="rca-title">RCA &amp; response</div>
          <div class="rca-sub">Locked until a booking is confirmed</div>
        </div>
      </div>
      <div class="rca-gate">
        <div class="rca-gate-title">Confirm the booking first</div>
        <div class="rca-gate-body">The RCA runs against a specific booking. Pick the
          correct candidate in the middle panel — the full analysis fills in here
          once confirmed. If none of them is this guest's booking, the picker
          offers Untraceable and Close out.</div>
      </div>`;
    return;
  }

  // A review with no draft row. It used to fall through to the full RCA
  // layout, whose Send ↑ button calls an endpoint that needs a draft — so the
  // one bucket guaranteed not to have one was offered the one button
  // guaranteed to 404 on it. It gets the same gate as candidates, and the
  // route to Sent that actually works.
  if (r.type === 'processing') {
    col.innerHTML = `
      <div class="rca-head">
        <div>
          <div class="rca-title">RCA &amp; response</div>
          <div class="rca-sub">Nothing has been analysed yet</div>
        </div>
      </div>
      <div class="rca-gate">
        <div class="rca-gate-title">${r.processingState === 'stalled'
          ? 'The run stopped before it wrote anything'
          : 'The run has not finished'}</div>
        <div class="rca-gate-body">${esc(r.processingReason
          || 'This review has no draft row yet.')}</div>
        <div class="untraceable-actions" style="margin-top:12px">
          <button class="btn" data-rerun-match>↻ Re-run</button>
          <button class="btn" data-close-out
                  data-close-reason="Closed before the pipeline produced a draft."
                  title="Finish this review. Nothing is posted to Slack.">Close out → Sent</button>
        </div>
      </div>`;
    return;
  }

  if (r.type === 'untraceable') {
    col.innerHTML = `
      <div class="untr-wrap">
      <div class="col-label">Untraceable — ask the guest</div>
      <div class="untr-card">
        <!-- One statement of the situation, not four. The facts pane already
             carries the trail; repeating "no booking" in three more sentences
             told the reader nothing they had not just read. -->
        <div class="untr-lead">No booking matched this review. Ask the guest for a booking
          reference; it stays in this tab until it matches.</div>
        <!-- IN THE GUEST'S LANGUAGE, when the pipeline put it there. The
             server already selects this approved macro AND translates it to
             the review's language (server/pipeline.py step 13b), storing it as
             the draft's reply. This card used to throw that away and render a
             hardcoded ENGLISH macro, so a Spanish guest got an English "ask
             for your booking reference" note with no way to reach Spanish —
             the exact complaint. It now shows the stored, translated reply
             when there is one, and falls back to the English macro only when
             no reply was stored (nothing ran, or Zendesk/translation was
             offline). Only the first name is still filled in either way. -->
        ${(() => {
          const _stored = (r.rca && (r.rca.reply || '')).trim();
          const _lang = (r.lang || '').toUpperCase();
          const _foreign = _lang && _lang !== 'EN';
          const _reply = _stored || UNTRACEABLE_REPLY(r.firstName);
          const _langNote = (_foreign && _stored)
            ? `<div class="hint" style="font-size:11px;color:var(--dim);margin-bottom:4px">Reply in the guest's language (${esc(r.lang)}) — copy this. The English is below.</div>`
            : (_foreign && !_stored)
              ? `<div class="hint" style="font-size:11px;color:var(--warn,#c93);margin-bottom:4px">This guest wrote in ${esc(r.lang)}, but the reply below is the English macro — re-run so it is translated, or translate before sending.</div>`
              : '';
          const _englishBox = (_foreign && _stored && (r.rca.englishView || {}).text)
            ? `<div class="hint" style="font-size:11px;color:var(--dim);margin:8px 0 4px">English working copy — not sent</div>
               <div class="untr-template editable-text" contenteditable="true" spellcheck="false" style="opacity:.85">${esc(r.rca.englishView.text)}</div>`
            : '';
          return _langNote
               + `<div class="untr-template editable-text" contenteditable="true" spellcheck="false"
                    data-untraceable-template>${esc(_reply)}</div>`
               + _englishBox;
        })()}
        <div class="untraceable-actions">
          <!-- Copy, not send: this reply is pasted into the Slack thread by
               hand like every other response in this app. -->
          <button class="btn primary" data-copy-untraceable>Copy reply</button>
          <button class="btn" data-rerun-match>↻ Re-run matching</button>
          <!-- Closing out is its own action, deliberately not "Send ↑".
               There is no RCA and no reply to post here — the reply above is
               pasted into the Slack thread by hand — so "send" would be a
               verb for something that does not happen. This finishes the
               review and posts nothing. -->
          <button class="btn" data-close-out
                  data-close-reason="Untraceable — asked the guest for a booking reference; there is no RCA and no reply to post."
                  title="Finish this review. Nothing is posted to Slack.">Close out → Sent</button>
        </div>
      </div>


    `;
    const vBtn = col.querySelector('[data-copy-untraceable]');
    if (vBtn) {
      vBtn.addEventListener('click', async () => {
        const tpl = col.querySelector('[data-untraceable-template]');
        const text = (tpl ? tpl.textContent : '').trim();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          vBtn.textContent = '✓ Copied';
        } catch (e) {
          // Clipboard can be blocked by the browser; select the text so it can
          // still be copied by hand rather than leaving a dead button.
          try {
            const range = document.createRange();
            range.selectNodeContents(tpl);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
            vBtn.textContent = '✗ Clipboard blocked — text selected';
          } catch (_) {
            vBtn.textContent = '✗ Copy failed';
          }
        }
        setTimeout(() => { vBtn.textContent = 'Copy reply'; }, 2500);
      });
    }
    return;
  }

  const rca = r.rca;
  const actions = rca.actionsTaken[state.actionTab] || [];
  // Which teams this card actually flagged. Actions Taken is the AND of two
  // things - the DSS guidelines prescribe the step, and a flag says this team
  // got it wrong - so an empty tab has two possible meanings and they are not
  // the same news. Saying which is the difference between "nobody raised
  // anything with Content" and "Content was never at fault here".
  const _flaggedTeams = new Set(((rca.v3 || {}).flags || [])
    .map(f => actionTeamKey(String((f || {}).team || ''))).filter(Boolean));

  // v3 new-shape data + shared helpers (used by interactions and v3 sections)
  const v3d = rca.v3 || {};
  // READ THE STORE THE BOX WRITES. The stated-issue box saves into
  // rca.v3.stated_issue; rendering r.statedIssue — a snapshot taken at load —
  // meant the very next renderRcaCol() put the old sentence back over the one
  // just typed. Saved to the server, reverted on screen, which is
  // indistinguishable from a save that never happened. Presence, not
  // truthiness, so a deliberately cleared box stays cleared instead of the
  // load-time value reappearing.
  const _statedIssue = String(
    ('stated_issue' in v3d && v3d.stated_issue != null)
      ? v3d.stated_issue : (r.statedIssue || ''));
  const _zdB = (r.zendeskSubdomain || 'headout');
  const zdLink = ref => {
    const id = String(ref || '').replace(/^ZD-?/i, '').trim();
    if (!id) return '';
    return `<a class="tl-tid" href="https://${_zdB}.zendesk.com/agent/tickets/${id}" target="_blank" rel="noopener" title="open ZD-${id}">ZD-${id}</a>`;
  };

  // Pointer fields arrive as arrays now, but older drafts hold one long
  // string - normalise both to a list so the renderer never prints "[object]"
  // or a wall of prose.

  const points = (v, cls = 'chk-ev') => asPoints(v)
    .map(p => `<div class="${cls}">• ${esc(p)}</div>`).join('');
  // Editable variants. Every fact in the RCA must be correctable in place -
  // the person signing it owns the words, not the model. data-v3p is a dot
  // path into rca.v3; one delegated blur handler persists all of them.
  // An empty field renders its placeholder AS the text, so focusing and
  // blurring it without typing would otherwise save "click to write" as the
  // value. data-ph carries the placeholder so the saver can tell the two
  // apart, and the class greys it so it does not read as content.
  const edPoints = (path, v, cls = 'chk-ev') => asPoints(v)
    .map((p, i) => `<div class="${cls}">• ${edSpan(`${path}.${i}`, p)}</div>`).join('');

  // ── Guest ↔ support: facts from Zendesk, interpretation from the model ──
  // The rows are CONTACTS, not events. The Events timeline is the per-event
  // view; one row per frame here would make the contact count report events,
  // and a count nobody trusts is worse than none.
  const _zdKey = v => { const m = String(v == null ? '' : v).match(/\d+/); return m ? m[0] : ''; };
  const _noteFor = key => key
    ? (rca.supportNotes || []).find(n => n && _zdKey(n.zd_ref) === key) || null : null;
  // Frames group by ticket; untracked ones fall back to a 30-minute window,
  // because consecutive messages minutes apart are one exchange however they
  // were logged. The grouping is a judgement, and the pipeline says so in the
  // trail when it fires.
  const _contacts = (frames) => {
    const out = []; let lastAt = null;
    (frames || []).forEach(fr => {
      const key = _zdKey(fr.ticket_id);
      if (key) {
        const hit = out.find(g => g.key === key);
        if (hit) hit.rows.push(fr); else out.push({key, rows: [fr]});
        lastAt = null; return;
      }
      const at = Date.parse(fr.time_sort || '') || null;
      const near = at && lastAt && Math.abs(at - lastAt) <= 30 * 60 * 1000;
      if (near && out.length && !out[out.length - 1].key) out[out.length - 1].rows.push(fr);
      else out.push({key: '', rows: [fr]});
      lastAt = at;
    });
    return out;
  };

  // §4 CONVERSATIONS ONLY. A contact is an exchange a PERSON took part in:
  // chat, call, email, web form, in-app. Everything else on this booking is
  // machinery wearing a contact's clothes - the booking thread Zendesk files as
  // a task, the API posts and bot notes, the review itself - and each one it
  // used to render raised the contact count, so a guest nobody spoke to read as
  // a guest who was handled.
  //
  // They are not dropped. They are already on the timelines this booking
  // renders: booking-created in the Booking timeline (facts column), API and
  // system notes in the Events timeline marked internal, the review as its
  // closing bookend. Moving them is the point, so the count SAYS how many
  // moved - a filtered list and a guest who never wrote in must not look the
  // same, and a bare "0 contacts" is exactly what makes them look the same.
  //
  // Named as what MOVES rather than as what stays, deliberately: an allowlist
  // would drop a thread nobody has classified yet, silently, on the reasoning
  // that we cannot prove it is a conversation. Same list as
  // server/services/zendesk.py::NON_CONTACT_THREADS, which Slack filters on.
  // THE SERVER DECIDES THIS, and this file no longer has an opinion.
  //
  // What was here was a SECOND IMPLEMENTATION: the thread list and
  // `is_internal`, and none of the server's actor check, its
  // `promoted_from_internal` marker, or its guest-took-part rule. So every fix
  // that landed in Python left this page rendering from the weaker copy, and
  // an agent's internal NAR note kept appearing as "contact 01" across three
  // rounds of being told it was fixed.
  //
  // `is_contact` is stamped by _marked_frames() in api.py from the same
  // `split_contact_frames` Slack composes with. A frame that predates the
  // field has no verdict on it — those fall back to the old thread test rather
  // than vanishing, because emptying the panel for an older draft is the
  // louder failure.
  const NON_CONTACT_THREADS = ['booking', 'review', 'api', 'sp'];
  const isConversation = fr => !!fr && (
    typeof fr.is_contact === 'boolean'
      ? fr.is_contact
      : NON_CONTACT_THREADS.indexOf(String(fr.thread || '').trim().toLowerCase()) < 0
        && !fr.is_internal);
  const _allFrames    = rca.supportFrames || [];
  const _convoFrames  = _allFrames.filter(isConversation);
  const _movedFrames  = _allFrames.filter(f => !isConversation(f));

  const _groups = _contacts(_convoFrames);
  const _used = new Set(_groups.map(g => g.key).filter(Boolean).filter(k => _noteFor(k)));
  // A note whose ticket has no frame still renders, marked. A zd_ref that
  // matched nothing is a failed join; no zd_ref at all is an off-Zendesk
  // contact the model saw. Different facts, so they read differently.
  const _orphans = (rca.supportNotes || []).filter(n => n && !_used.has(_zdKey(n.zd_ref)));
  const _rows = [
    ..._groups.map((g, i) => ({kind: 'frame', g, note: _noteFor(g.key), i})),
    ..._orphans.map((n, k) => ({kind: 'orphan', note: n, i: _groups.length + k})),
  ];

  // The distinct gap labels across a contact's frames, in order — the mirror
  // of _contact_gaps in server/services/slack.py. A gap is recorded per FRAME,
  // but this row is a CONTACT, so the same label on four messages was four
  // identical red boxes stacked down the card. Deduped rather than counted:
  // how many messages carried the label says more about how chatty the guest
  // was than about the failure.
  const _contactGaps = (rows) => {
    const out = [];
    for (const fr of (rows || [])) {
      const g = String((fr && fr.gap) || '').trim();
      if (g && out.indexOf(g) < 0) out.push(g);
    }
    return out;
  };

  const _contactRow = (row) => {
    const i = row.i;
    const open = !!state.ixOpen[i];
    const note = row.note || {};
    if (row.kind === 'orphan') {
      // The index into the REAL notes list, not into _orphans. The save path
      // writes to rca_v3.support_interaction_notes[n], so a position in a
      // filtered view sent every orphan's edit to a different note: orphan 0
      // and note 0 are only the same row when nothing was filtered out, and
      // the moment one note matched a frame they diverged. Editing an
      // unmatched contact then silently rewrote a matched one, and both
      // rendered as if nothing had happened.
      const why = _zdKey(note.zd_ref) ? 'unmatched ZD reference' : "guest's account, unverified";
      const oIdx = (rca.supportNotes || []).indexOf(note);
      // No frame means no fact to take a time or channel from, so the model's
      // are all there is. Rendering a dash instead - which is what this row
      // did - showed an off-Zendesk contact the same way it shows a lookup
      // that broke. The row is already badged unverified; the badge covers
      // these two as much as it covers the summary.
      const oCh = String(note.channel || '').trim();
      const oTime = String(note.time || '').trim();
      return `
        <div class="convo-frame ${open ? 'open' : ''}">
          <div class="convo-frame-head" data-ix-toggle="${i}">
            <span class="convo-num">${String(i + 1).padStart(2, '0')}</span>
            ${oCh ? `<span class="convo-type-pill">${esc(oCh)}</span>` : ''}
            <span class="convo-time${oTime ? '' : ' dim'}">${esc(oTime || '—')}</span>
            <span class="interaction-summary-line">${edSpan(`support_interaction_notes.${oIdx}.summary`, note.summary)}</span>
            <span class="convo-unverified" title="no Zendesk frame backs this contact">${esc(why)}</span>
            ${note.zd_ref ? zdLink(note.zd_ref) : ''}
            <span class="convo-chevron">${open ? '▾' : '▸'}</span>
          </div>
          <div class="convo-body">
            ${note.detail ? `<div class="convo-detail">${edSpan(`support_interaction_notes.${oIdx}.detail`, note.detail)}</div>` : ''}
            ${note.ce_miss ? `<div class="convo-gap">⚠ CE miss: ${edSpan(`support_interaction_notes.${oIdx}.ce_miss`, note.ce_miss)}</div>` : ''}
          </div>
        </div>`;
    }
    const rows = row.g.rows, first = rows[0] || {};
    const nIdx = (rca.supportNotes || []).indexOf(row.note);
    // Precedence, not exclusion. The frame's channel and time are verifiable
    // and win; the model's stand in only where the frame has none, which is
    // why the model is asked for them at all. Letting the model's value
    // override a frame is the mistake that struck these fields from the
    // schema in the first place - "chat at 15:41" in the prose beside two
    // nulls - and precedence fixes that without the blank.
    const ch = (first.thread || '').trim() || String((row.note || {}).channel || '').trim();
    const tm = (first.time || '').trim() || String((row.note || {}).time || '').trim();
    const summary = (row.note && row.note.summary) || first.guest_words || first.guestSaid || first.guestReply || '';
    return `
      <div class="convo-frame ${open ? 'open' : ''}">
        <div class="convo-frame-head" data-ix-toggle="${i}">
          <span class="convo-num">${String(i + 1).padStart(2, '0')}</span>
          ${ch ? `<span class="convo-type-pill">${esc(ch)}</span>` : ''}
          <span class="convo-time${tm ? '' : ' dim'}">${esc(tm || '—')}</span>
          <span class="interaction-summary-line">${nIdx >= 0
            ? edSpan(`support_interaction_notes.${nIdx}.summary`, summary)
            : esc(summary)}</span>
          ${rows.length > 1 ? `<span class="convo-count">${rows.length} events</span>` : ''}
          ${row.g.key ? zdLink(row.g.key) : ''}
          <span class="convo-chevron">${open ? '▾' : '▸'}</span>
        </div>
        <div class="convo-body">
          ${row.note && row.note.detail ? `<div class="convo-detail">${
            edSpan(`support_interaction_notes.${nIdx}.detail`, row.note.detail)}</div>` : ''}
          ${_contactGaps(rows).map(g => `<div class="convo-gap">⚠ ${esc(g)}</div>`).join('')}
          ${row.note && row.note.ce_miss ? `<div class="convo-gap">⚠ CE miss: ${
            edSpan(`support_interaction_notes.${nIdx}.ce_miss`, row.note.ce_miss)}</div>` : ''}
          ${rows.map(fr => `
            <div class="convo-line">
              <span class="convo-ev-time">${esc(fr.time || '—')}</span>
              <span class="convo-ev-body">${esc(fr.guest_words || fr.guestSaid || fr.guestReply || '')}${
                fr.weDid ? ` <span class="convo-ev-we">we: ${esc(fr.weDid)}</span>` : ''}</span>
            </div>`).join('')}
        </div>
      </div>`;
  };

  // Defect 4: "01 · UNKNOWN · Unknown · No guest contact found" was a
  // nothing-found message dressed as a numbered data row. An absence gets the
  // neutral empty state - no number, no channel pill, no time.
  //
  // The empty state reports the TICKET LOOKUP OUTCOME, not the internal
  // machinery it used to describe ("3 system events moved to the timeline…"),
  // and it obeys rule 1. Three states used to collapse into "so nobody spoke to
  // the guest. Not a lookup that failed" — a claim the card had not
  // established. Now:
  //   - tickets matched and held no guest conversation → THE ONLY case where
  //     "nobody spoke to the guest" is true; the ticket ids are linked so the
  //     reader can open them.
  //   - no ticket ids recorded → we do NOT claim nobody spoke. The client
  //     carries only `zendeskTicketIds`, and an empty list cannot tell "none
  //     matched" from "the lookup never ran" (the server writes [] for both),
  //     so the card says exactly that rather than picking one.
  const _tids = r.zendeskTicketIds || [];
  const _tidLinks = _tids.map(zdLink).filter(Boolean).join(', ') || _tids.join(', ');
  const sup = _rows.length
    ? `<div class="interactions">${_rows.map(_contactRow).join('')}
        <button class="row-add" data-contact-add>+ Add contact</button></div>`
    : `<div class="interactions">
        <div class="interactions-empty">${_tids.length
          ? `${_tids.length} Zendesk ticket${_tids.length === 1 ? '' : 's'} matched this booking (${_tidLinks}) and none carried a guest conversation — so nobody spoke to the guest here. Open ${_tids.length === 1 ? 'it' : 'them'} above, or add a contact by hand.`
          : `No Zendesk ticket ids are recorded for this booking, so there is no support record to read. This card cannot tell whether no ticket matched or the lookup did not run, so it makes no claim about whether the guest was contacted — add a contact by hand if you know of one.`}</div>
        <button class="row-add" data-contact-add>+ Add contact</button></div>`;

  // SP interaction — the same facts/interpretation split as guest ↔ support.
  // The records come from the pipeline's sp_interaction_frames; the model's
  // account joins by zd_ref under sp_interaction_notes. Reading the pre-split
  // key left this section rendering nothing at all after the rename, which is
  // exactly the failure mode of a lookup that cannot say it found nothing.
  // Defaulted, never null. The whole SP block used to disappear when the model
  // said nothing about the supply partner — and it took "+ Add SP record" with
  // it, so an operator could not record an SP contact on exactly the drafts
  // where they are most likely to know of one the pipeline missed. A button
  // that does not render is more inert than one that does nothing. Guest ↔
  // support already keeps its "+ Add" beside an empty state (defect 4); this
  // is the same treatment, and it gives the "Raised with SP" select somewhere
  // to live so the answer can be entered by hand.
  //
  // "N/A" here is the default the select already shows for a missing value, so
  // an unanswered section still reads as unanswered rather than as "No".
  const spV3 = v3d.sp_interaction_notes || v3d.sp_interaction || {raised: 'N/A', records: []};
  const spNoteFor = key => key
    ? ((spV3 && spV3.records) || []).find(x => x && _zdKey(x.zd_ref) === key) || null : null;
  const spGroups = _contacts(rca.spFrames);
  const spUsed = new Set(spGroups.map(g => g.key).filter(k => k && spNoteFor(k)));
  const spOrphans = ((spV3 && spV3.records) || [])
    .filter(x => x && !spUsed.has(_zdKey(x.zd_ref)));
  const spLegacyText = spV3 && !((spV3.records || []).length)
    ? (asPoints(spV3.detail).join(' ') || spV3.reason_if_not || '') : '';
  const spRowCount = spGroups.length + spOrphans.length;
  const spInter = spV3
    ? `<div class="interactions">
        <div class="sp-frame">
          <div class="sp-frame-head">
            <span class="convo-num sp">SP</span>
            <span class="convo-label">Raised with SP:</span>
            <select class="chip-sel chip-sop-sel ${spV3.raised === 'Yes' ? 'ok' : spV3.raised === 'No' ? 'bad' : 'unk'}"
                    data-v3sel="sp_interaction_notes.raised">
              ${['Yes','No','N/A'].map(o => `<option${(spV3.raised || 'N/A') === o ? ' selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
          <!-- "N/A" with no records and no reason is indistinguishable from a
               section that was skipped. A blocked escalation - non-partnered
               vendor, opted-out contact - is a FACT about this booking, not a
               miss, and it is worth stating. -->
          ${spV3.raised !== 'Yes' ? `
          <div class="sp-frame-body" style="padding-left:14px">
            <div class="sp-frame-summary">${edSpan('sp_interaction_notes.reason', spV3.reason,
              'why escalation did not happen')}</div>
          </div>` : ''}
        </div>
        ${spGroups.map((g, i) => {
          const note = spNoteFor(g.key), first = g.rows[0] || {};
          const nIdx = ((spV3.records) || []).indexOf(note);
          return `
        <div class="sp-frame">
          <div class="sp-frame-head">
            <span class="convo-num sp">${String(i + 1).padStart(2, '0')}</span>
            <span class="convo-time${first.time ? '' : ' dim'}">${esc(first.time || '—')}</span>
            <span style="margin-left:auto">${g.key ? zdLink(g.key) : ''}</span>
          </div>
          <div class="sp-frame-body">
            <div class="sp-frame-summary">${nIdx >= 0
              ? edSpan(`sp_interaction_notes.records.${nIdx}.summary`, (note || {}).summary)
              : esc(first.guest_words || first.guestSaid || first.guestReply || first.summary || '')}</div>
          </div>
        </div>`; }).join('')}
        ${spOrphans.map((rec) => {
          const nIdx = ((spV3.records) || []).indexOf(rec);
          const why = _zdKey(rec.zd_ref) ? 'unmatched ZD reference' : 'unverified';
          return `
        <div class="sp-frame">
          <div class="sp-frame-head">
            <span class="convo-num sp">${String(spGroups.length + spOrphans.indexOf(rec) + 1).padStart(2, '0')}</span>
            <span class="convo-time dim">—</span>
            <span class="convo-unverified">${esc(why)}</span>
            <span style="margin-left:auto">${rec.zd_ref ? zdLink(rec.zd_ref) : ''}</span>
          </div>
          <div class="sp-frame-body">
            <div class="sp-frame-summary">${edSpan(`sp_interaction_notes.records.${nIdx}.summary`, rec.summary)}</div>
          </div>
        </div>`; }).join('')}
        ${spLegacyText ? `
        <div class="sp-frame"><div class="sp-frame-body" style="padding-left:14px">
          <div class="sp-frame-summary">${esc(spLegacyText)}</div>
        </div></div>` : ''}
        ${(!spRowCount && !spLegacyText && !spV3.reason) ? `
        <div class="interactions-empty">No SP contact on record for this case.</div>` : ''}
        <button class="row-add" data-sp-rec-add>+ Add SP record</button>
      </div>`
    : rca.spInteraction && rca.spInteraction.length > 0
    ? `<div class="interactions">
        ${rca.spInteraction.map((s, i) => `
          <div class="sp-frame">
            <div class="sp-frame-head">
              <span class="convo-num sp">${i + 1}</span>
              <span class="convo-time">${s.time}</span>
              <span class="convo-label">${s.label}</span>
            </div>
            <div class="sp-frame-body">
              <div class="sp-frame-summary editable-text" contenteditable="true" spellcheck="false">${s.summary}</div>
              ${s.comp ? `<div class="convo-comp">✓ ${s.comp}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>`
    : null;

  // Slack post preview — editable plain-text that mirrors format_rca_slack
  const b = r.booking;
  function _genSlackText() {
    const nl = '\n';
    const div = '_'.repeat(61);
    const stars = '★'.repeat(parseInt(r.rating) || 0);
    const header = 'RCA — @reviewteam' + nl + 'BID ' + (b.bid || '—') + ' · ' + (r.author || '—') + ' · ' + (stars || '—');
    const l1 = rca.issueL1 || '—', l2 = rca.issueL2 || '—';
    const sub = rca.subTheme || '';
    const scenAll = [rca.primaryScenario, ...(rca.overlayScenarios || [])].filter(Boolean);
    let cls = 'Issue: ' + l1 + ' / ' + l2 + (sub ? ' / ' + sub : '');
    if (scenAll.length) cls += nl + 'Scenarios: ' + scenAll.join(', ');
    // Defect 6: a line whose every value is empty must not be posted.
    // "Issue: — / —" reached the thread on an unclassified review and read as
    // a broken generator rather than as an unclassified review.
    const _line = (label, ...vals) => {
      const kept = vals.map(v => String(v == null ? '' : v).trim())
                       .filter(v => v && v !== '—' && v !== '?');
      return kept.length ? label + ': ' + kept.join(' / ') : '';
    };
    let cls2 = _line('Issue', l1 === '—' ? '' : l1, l2 === '—' ? '' : l2, sub);
    if (scenAll.length) cls2 += (cls2 ? nl : '') + 'Scenarios: ' + scenAll.join(', ');
    cls = cls2;

    // The what-went-wrong section is composed by the SERVER and rendered
    // here verbatim. This function used to build it from rca.v3 in JavaScript
    // while server/services/wwr_post.py built it again in Python: two
    // composers for one block of text, which is exactly how the client once
    // stringified the fix object and put "Fix: [object Object]" on a real
    // post while the server's copy of the same section was correct.
    //
    // wwrSlackText is refreshed from the PATCH response on every inline edit,
    // so the preview follows an edit without this page needing to know the
    // five-heading format at all.
    const wwrText = rca.wwrSlackText || '';
    const fmtFrames = (frames, label) => {
      if (!frames || !frames.length) return label + ': —';
      const lines = [label + ':'];
      for (const f of frames) {
        let row = '• ' + (f.time || '?') + ' — ' + (f.guest_words || f.guestSaid || f.guestReply || f.summary || '');
        if (f.weDid) row += ' | we: ' + f.weDid;
        if (f.gap)   row += ' | ⚠ ' + f.gap;
        lines.push(row);
      }
      return lines.join(nl);
    };
    // COMPOSED BY THE SERVER and rendered verbatim, like wwrText above and
    // bookingDetailsText below.
    //
    // THE BUG THIS REPLACES. This built the section here, reading
    // `v3d.support_interaction` — a key the notes/frames split had renamed to
    // `support_interaction_notes`. A missing key is undefined, undefined is
    // falsy, so the ternary took its fallback arm on EVERY v4 draft and dumped
    // `rca.supportInteraction`: one bullet per Zendesk frame, with no
    // conversation filter, so the booking thread went out as something the
    // guest said. The v3 arm was wrong too — it read note fields (channel,
    // zd_ref, ce_miss) off frame-shaped objects that carry none of them.
    //
    // Neither arm announced anything. That is why this is server-side now:
    // one composer cannot disagree with itself, and contacts_section groups by
    // ticket and says when a contact had no summary instead of going quiet.
    // An ABSENT key is not an empty section. The server always sends this, so
    // a missing one means the payload is older than this page — which must not
    // look like a guest who never wrote in. That confusion is the whole bug
    // above, and a blank body would have `if (!body) continue` drop the
    // section from the post entirely, silently, one more time.
    const supportText = typeof rca.contactsSlackText === 'string'
      ? (rca.contactsSlackText || 'No guest contact found on this booking')
      : 'Customer / CE interactions were not served by this build — reload the page';

    const spLines = spV3
      ? [ '• raised with SP: ' + (spV3.raised || '—'),
          ...(spV3.records || []).map(rec => '• ' + (rec.time ? rec.time + ' — ' : '') +
              (rec.summary || '') + (rec.zd_ref ? ' (' + rec.zd_ref + ')' : '')),
          ...(!(spV3.records || []).length ? asPoints(spV3.detail).map(d => '• ' + d) : []),
          ...(!(spV3.records || []).length && !asPoints(spV3.detail).length && spV3.reason_if_not
              ? ['• ' + spV3.reason_if_not] : []) ]
      : (rca.spInteraction || []).map(f => '• ' + (f.time || '?') + ' — ' + (f.summary || ''));
    const spText = spLines.join(nl) || 'No SP contact on record';

    const at = rca.actionsTaken || {};
    const actionLines = [];
    for (const team of ['sp','customer','business','ce','product']) {
      for (const a of (at[team] || [])) {
        const txt = typeof a === 'string' ? a : (a.context || a.with || '');
        if (txt) actionLines.push('• ' + txt + ' (' + team.toUpperCase() + ')');
      }
    }
    const actionsText = actionLines.join(nl) || '—';

    // Flags only from v3 - the legacy checklist's "No" meant "no error", so
    // reusing it here posted flags that contradicted their own evidence.
    const flagLines = (v3d.flags || []).map(f =>
      '• [' + String(f.team || 'other').toUpperCase() + '] ' + (f.flag || '') +
      (f.evidence ? ' — ' + f.evidence : '') + (f.zd_ref ? ' (' + f.zd_ref + ')' : ''));
    const flagsText = flagLines.join(nl) || 'No flags raised';

    // Area of improvement, from the same list the RCA column edits. An empty
    // one says so rather than dropping the section: "nothing to change here"
    // and "nobody wrote one" are different, and only the second is a gap.
    const aoiLines = (Array.isArray(rca.areaOfImproving) ? rca.areaOfImproving
                      : String(rca.areaOfImproving || '').split('\n'))
                     .map(a => String(a || '').trim()).filter(Boolean);
    const aoiText = aoiLines.length ? aoiLines.map(a => '• ' + a).join(nl)
                                    : 'No area of improvement recorded';

    const takedownText = (() => {
      const td = v3d.takedown || {};
      const v = td.verdict || (td.recommended === true ? 'Yes' : td.recommended === false ? 'No' : '');
      return v ? '• ' + v : '';
    })();

    // Insights as an aligned block so Slack's monospace renders it as a table.
    //
    // FROM liveInsights, THE REAL NUMBERS. This read `r.insights`, which is
    // the placeholder view-model seeded to '—' for EVERY field (see the row
    // built in refreshInbox). The real figures arrive in `r.liveInsights` —
    // snake_case, the same shape the card tiles render and the server's
    // format_rca_slack reads. Reading the placeholder meant every row filtered
    // out, insText was always '—', and the Experience-insights section of the
    // Slack post went out empty on every review. Same camelCase-vs-payload
    // mismatch the CSV export had; this is the third place it lived.
    //
    // Keys mirror server/services/slack.py::format_rca_slack so the client
    // preview and the server's own composer cannot disagree about the numbers.

      ['wwr',       'What went wrong',       wwrText],

      ['sp',        'SP interaction',        spText],

    _genSlackText.div = div;

  // same discipline _sectionsFromText uses — so a heading worded one way here
  // and another there can never silently match none. A section the parser does
  // not find simply falls back to the composer body at the call site.
  function _bodiesFromText(text) {

  // than add a second store to drift against the text, the text is the store

  // that section is not empty. An empty section is skipped by the composer
  // too, so it must not be read back as a deselection.
  function _sectionsFromText(text) {

  // any one section destroyed every manual edit. Only ↻ Regenerate rebuilds.
  //
  // The composed post is `header\ncls` then, per section, `____\n*Label*\n\n

  // *L1*…, *L2*…], each section part beginning with its own `*Label*` marker.

  //  - remove a section whose marker is absent (empty, or the user renamed or
  //    deleted the heading by hand): nothing to cut, the text is returned
  //    unchanged — a toggle never resurrects or rewrites a line it did not own.
  //  - add a section already present: returned unchanged, so a re-check never
  //    clobbers an edit or duplicates the block.
  //  - add reinstates the section's CANONICAL body at its ordered position;
  //    checking a box the associate had emptied by hand puts the generated body
  //    back, because that is what asking for the section again means.
  function _spliceSlackSection(text, key, include) {
    const sections = _genSlackText.sections || [];
    const nl = '\n';
    const DIV = nl + '_'.repeat(61) + nl;

    if (!triple) return text;

    const marker = '*' + label + '*';
    const order = sections.map(s => s[0]);

    const head = parts.slice(0, 1);
    const secs = parts.slice(1);           // each begins with its *Label*

  // can act on it: the issue's operational failure or its SOP gap. It is not a
  // trail line and it is not a count.
  const isaBlock = '';

                <span class="wwr-claim wwr-claim-q">“${edSpan(`${bp}.claim`, claim)}”</span>
                <button class="x-del" data-claim-del="${i}" title="remove the claim">×</button>
              </div>`
            /* An absent claim is not a blank quote with quote marks around
               nothing - that reads as a guest who said "". It is either the
               review not stating it in their words, or our own finding filed
               as a complaint, and the empty state says which. */
            : `<div class="rca-empty">The review does not state this in the guest's own words.</div>
               <button class="row-add wwr-add" data-claim-add="${i}">+ Claim</button>`}
          </div>
          <!-- EVIDENCE MOVED TO §1 CASE FINDINGS. It was per-issue, so a fact
               cited by two claims rendered twice — the single biggest source
               of repeated text on this card. The rows keep their claim
               association in the data; only the rendering moved. -->
          <div class="wwr-blk">
            <span class="wwr-blk-label">Analysis — what actually happened?</span>
            <div class="wwr-analysis">
              <div class="wwr-analysis-head">
                ${chipSel(`${bp}.claim_accuracy`, acc, ACC, accCls(acc), 'chip-acc-sel', rawAcc)}
                ${chipSel(`${bp}.fix.owner`, owner, OWNS, 'unk', 'chip-owner-sel', owner || 'unassigned')}
              </div>
              ${tail ? `<div class="wwr-analysis-note">${esc(tail)}</div>` : ''}
              <div class="wwr-aline">
                <span class="wwr-aline-key">Root cause:</span>
                <span class="wwr-aline-val">${
                  causeText ? edSpan(causePath, causeText)
                            : edSpan(`${bp}.root_cause`, '', 'click to write the failing step')}</span>
                <!-- no ×: an issue with no root cause is not an RCA -->
              </div>
              ${present.map(([k, label]) => `
              <div class="wwr-aline">
                <span class="wwr-aline-key">${esc(label)}:</span>
                <span class="wwr-aline-val">${edSpan(`${bp}.${k}`, gi[k])}</span>
                <button class="x-del" data-aline-del="${i}:${k}" title="remove this line">×</button>
              </div>`).join('')}
              ${absent.length ? `<div class="wwr-addrow">${absent.map(([k, label]) =>
                `<button class="row-add wwr-add" data-aline-add="${i}:${k}">+ ${esc(label)}</button>`
              ).join('')}</div>` : ''}
              ${(() => {
                // The fix, as its own block. `because` is the gap and `action`
                // closes it — shown together because that pairing is the only
                // way to tell a derived fix from an invented one. The count
                // that justifies a structural change lives in `pattern` and
                // only there: it used to be repeated here as `sized_by`, which
                // put one number in two places and let them disagree.
                const fx = gi.fix;
                if (!fx || typeof fx !== 'object') return '';
                const rows = [
                  ['action',   'Fix'],
                  ['because',  'Closes'],
                ].filter(([k]) => String(fx[k] || '').trim());
                if (!rows.length) return '';
                // THE SAME × AS EVERY OTHER LINE IN THIS BLOCK. Operational
                // failure and SOP gap are removable and these two were not,
                // so a fix the model invented could be edited into something
                // else but never taken off the card — and an empty string is
                // not the same as no fix: `actions_from_fixes` still routes a
                // blank row, which lands in Unrouted for nobody to pick up.
                return `<div class="wwr-fix">${rows.map(([k, label]) => `
                  <div class="wwr-aline">
                    <span class="wwr-aline-key">${label}:</span>
                    <span class="wwr-aline-val">${edSpan(`${bp}.fix.${k}`, fx[k])}</span>
                    <button class="x-del" data-fix-del="${i}:${k}" title="remove this line">×</button>
                  </div>`).join('')}</div>`;
              })()}
            </div>
          </div>
        </div>` : ''}
      </div>`;
    }).join('') + `
      <button class="wwr-addissue" data-wwr-issue-add>
        <span class="wwr-addissue-circle">+</span><span>Add issue</span>
      </button>`;

    // A systemic cause that belongs to no single issue keeps its own row.
    const orphanCauses = legacyPaired ? [] : causesList;
    const orphanHtml = orphanCauses.length ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">Cross-cutting root causes</span>
        ${orphanCauses.map((rc, i) => `
          <div class="chk-row">
            <span class="chk-mark">→</span>
            <div class="chk-item">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.issue`, rc.issue)}
              <div class="chk-ev">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.cause`, rc.cause)}</div>
            </div>
          </div>`).join('')}
      </div>` : '';

    // §2 removes the card-level Operational failure / SOP gap / Pattern /
    // Fixes blocks - those fields live on the issue they explain now. A draft
    // written before that still holds them at card level, and dropping them
    // would delete analysis someone wrote. They render as extra rows under the
    // LAST issue, at their own v3 paths so an edit still saves where the value
    // actually lives, and labelled so nobody reads them as issue-scoped.
    const _legacyRows = [
      ['what_went_wrong.what_happened.operational_failure', 'Operational failure', wh.operational_failure],
      ['what_went_wrong.what_happened.sop_gap',             'SOP / process gap',   wh.sop_gap],
      ['what_went_wrong.what_happened.pattern',             'Pattern',             wh.pattern],
      ['what_went_wrong.fixes.actions',                     'Fix',                 fx.actions],
    ].filter(([, , v]) => asPoints(v).length);
    const _spLegacy = asPoints(spx.detail).length || spx.escalated;
    const legacyExtras = (_legacyRows.length || _spLegacy) ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">From an earlier draft — not yet attached to an issue</span>
        ${_legacyRows.map(([path, label, v]) => asPoints(v).map((pt, n) => `
          <div class="wwr-aline">
            <span class="wwr-aline-key">${esc(label)}:</span>
            <span class="wwr-aline-val">${edSpan(
              Array.isArray(v) || asPoints(v).length > 1 ? `${path}.${n}` : path, pt)}</span>
          </div>`).join('')).join('')}
        ${_spLegacy ? `
          <div class="wwr-aline">
            <span class="wwr-aline-key">SP escalation:</span>
            <span class="wwr-aline-val">${edSpan('what_went_wrong.sp_escalation.escalated', spx.escalated || '—')}</span>

          </div>`).join('')}` : ''}
      </div>` : '';

    const wwrOpenAll = rowCount > 0 && Array.from({length: rowCount}, (_, i) => state.wwrOpen[i] !== false).every(Boolean);
    const wwrHtml = v3d.what_went_wrong ? `
    <div class="section" id="rca-wwr5-section">
      <div class="section-label">
        <span>What went wrong</span>
        <span class="hint">${rowCount} issue${rowCount === 1 ? '' : 's'} · ${
          (legacyPaired ? causesList.length
                        : gIssues.filter(g => g.root_cause).length + causesList.length)
        } root cause${((legacyPaired ? causesList.length : gIssues.filter(g => g.root_cause).length + causesList.length)) === 1 ? '' : 's'}</span>
        <button class="btn" style="margin-left:auto;font-size:11px;padding:2px 9px" data-wwr-all>${wwrOpenAll ? 'Collapse all' : 'Expand all'}</button>
        <span class="section-chev">▾</span>
      </div>
      ${wwrRows || '<div class="rca-empty">No guest issues were identified — re-run the RCA if the review names one.</div>'}
      ${orphanHtml}
      ${legacyExtras}
    </div>` : '';

    // Numbered stepper, same shape as the WWR chain - a reader follows the
    // case down the left rail. Strings from older drafts still render: the
    // leading "1." is stripped so the badge does not repeat it.
    // "Unknown" is the model's way of saying it could not date an event. It
    // is not a timestamp, so it should not be printed as one - an em-dash
    // says the same thing without looking like data.
    const flags = v3d.flags || [];
    // Grouped by owning team with counts, because a flat list of a dozen
    // flags on a complex case gives a reader no idea who has to act. Each
    // group collapses; each row is editable and removable, since a flag the
    // AI got wrong must be correctable by the person signing the RCA.
    // The same nine teams Actions Taken uses, because the two are joined on
    // this value. A flag written under the old vocabulary (CE, RO, Customer,
    // Business) is folded onto the nine rather than left to fall through the
    // select as an unrecognised value - which renders the first option as
    // selected and files a real flag against the wrong team.
    const FLAG_TEAMS = ACTION_TEAMS.map(([t]) => t.toUpperCase()).concat(['OTHER']);
    const flagTeamCanon = t => {
      const raw = String(t || '').trim().toLowerCase();
      const key = actionTeamKey(raw);
      return key ? key.toUpperCase() : 'OTHER';
    };
    const flagGroups = {};
    flags.forEach((f, i) => {
      const t = flagTeamCanon(f.team);
      (flagGroups[t] = flagGroups[t] || []).push({...f, _i: i});
    });
    const flagOrder = FLAG_TEAMS;
    const flagSecs = Object.keys(flagGroups).sort((a, b) => {
      const ia = flagOrder.indexOf(a), ib = flagOrder.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const flagsHtml = `
    <div class="section" id="rca-flags-section">
      <div class="section-label">Flags
        ${flags.length ? `<span class="sec-count">${flagSecs.map(t => flagGroups[t].length + ' ' + t).join(' · ')}</span>` : ''}
      <span class="section-chev">▾</span></div>
      ${flags.length === 0
        ? `<div class="field-block rca-empty affirm">✓ Every QA area was checked and none needed raising.</div>`
        : `<div class="chk-groups">${flagSecs.map(t => `
            <div class="chk-group has-flags open" data-chk-section="${t}">
              <div class="chk-group-head" data-chk-group-toggle>
                <span class="chk-chevron">▸</span>
                <span>${t}</span>
                <span class="chk-gtag">${flagGroups[t].length} flag${flagGroups[t].length === 1 ? '' : 's'}</span>
              </div>
              <div class="chk-group-body">
                ${flagGroups[t].map(f => `
                  <div class="chk-row chk-flag">
                    <span class="chk-mark">⚠</span>
                    <div class="chk-item">
                      <!-- §8 the team is a closed list, so an invented value
                           cannot become a stray option on the control. -->
                      <select class="chip-sel chip-team-sel part"
                              data-v3sel="flags.${f._i}.team"
                              title="${esc(f.team_raw || f.team || 'OTHER')}">
                        ${FLAG_TEAMS.map(o =>
                          `<option${flagTeamCanon(f.team) === o ? ' selected' : ''}>${o}</option>`).join('')}
                      </select>
                      <span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag text"
