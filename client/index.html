    if (state.filter === 'candidates') return r.type === 'candidates';
    if (state.filter === 'untraceable') return r.type === 'untraceable';
    if (state.filter === 'sent') return r.status === 'sent';
    return false;
  });

  document.getElementById('cnt-all').textContent = REVIEWS.length;
  document.getElementById('cnt-identified').textContent = REVIEWS.filter(r => r.type === 'identified' && r.status !== 'sent').length;
  document.getElementById('cnt-candidates').textContent = REVIEWS.filter(r => r.type === 'candidates').length;
  document.getElementById('cnt-untraceable').textContent = REVIEWS.filter(r => r.type === 'untraceable').length;
  document.getElementById('cnt-sent').textContent = REVIEWS.filter(r => r.status === 'sent').length;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No reviews in this tab.</div>`;
    return;
  }

  // One stage chip per card, coloured by what it asks of the reader:
  // green = nothing to do, amber = a human must confirm, red = stuck.
  const stageOf = (r) => r.status === 'sent'          ? ['Sent', 'ok']
                       : r.type === 'candidates'      ? ['Confirm match', 'warn']
                       : r.type === 'untraceable'     ? ['Untraceable', 'bad']
                       :                                ['Draft ready', 'ok'];
  list.innerHTML = filtered.map(r => {
    const [stage, kind] = stageOf(r);
    const body = r.english || r.original || '';
    return `
    <div class="review-item ${r.id === state.selected ? 'active' : ''}" data-id="${r.id}">
      <div class="review-item-top">
        <span class="review-author">${esc(r.author)}</span>
        <span class="review-time">${esc(r.time)}</span>
      </div>
      <div class="review-stars-line">
        <span class="review-stars">${r.stars}</span>
        <span class="review-exp">${esc(r.booking?.experience || '—')}</span>
      </div>
      <div class="review-preview">${esc(body.substring(0, 120))}${body.length > 120 ? '…' : ''}</div>
      <div class="review-tags">
        <span class="tag stage-${kind}">${stage}</span>
        <span class="tag tag-lang">${esc(r.lang || '')}</span>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.review-item').forEach(el => {
    el.addEventListener('click', () => {
      state.selected = el.dataset.id;
      renderInbox();
      renderReviewCol();
      renderRcaCol();
    });
  });
}

// The translation belongs on every card, not just the matched ones: the
// reply goes out in the guest's language, so whoever writes it needs the
// English beside the original whatever tier the review sits in. Absent
// English on a foreign review is itself worth saying - it means the
// translation step never ran, not that the review needs none.
function translationCard(r) {
  const foreign = (r.lang || '').toUpperCase() !== 'EN';
  if (r.english) {
    return `<div class="translation-card">
      <div class="translation-label">English translation · AI</div>
      <div class="translation-body">${esc(r.english)}</div>
    </div>`;
  }
  if (!foreign) return '';
  return `<div class="translation-card">
    <div class="translation-label">English translation · AI</div>
    <div class="rca-empty">Not translated yet — re-run this review to generate it.</div>
  </div>`;
}

// §13 the booking timeline lives in the FACTS column now: it is
// system-of-record data (created / fulfilment / sent / refunded), which is
// what that column is for. No treatment change - same 88px mono grid,
// same editable rows, same + Add event. Top-level because the column that
// renders it is no longer the one that built it.
// §5 "Unknown" / "N/A" / "TBD" from the model are not timestamps. Hoisted
// with the booking timeline it serves, which now renders from the facts
// column - the same rule applies to convo and action times.
function _tlTime(t) {
  const v = String(t || '').trim();
  return (!v || /^(unknown|n\/?a|none|null|tbd|-)$/i.test(v)) ? '' : v;
}

function bookingTimelineHtml(r, v3d) {
  const logRows = (v3d.booking_logs || []).map(l => (typeof l === 'string'
    ? {time: '', what: l.replace(/^\s*\d+[.)]\s*/, ''), detail: ''}
    : {time: _tlTime(l.time), what: l.what || '', detail: l.detail || ''}));
  // The section renders even with nothing in it. It used to collapse to ''
  // on an empty list, which took the "+ Add event" button with it - so the
  // one case where a human most needs to write the timeline by hand was the
  // one case with no way to do it, and the RCA simply had no such heading.
  const logsEmptyWhy = (r.booking && r.booking.bid)
    ? 'The model returned no events for this booking. Re-run the RCA, or add them by hand below.'
    : (r.candidateState
        ? 'No booking is confirmed yet, so there is no system timeline to draw from. Confirm a candidate above and re-run the RCA, or add the events by hand below.'
        : 'No booking was matched, so there is no system timeline to draw from. Add the events by hand below.');
  const logsHtml = `
  <div class="section" id="rca-booking-logs-section">
    <div class="section-label"><span>Booking timeline</span>
      <span class="hint">times in IST</span>
      ${logRows.length ? `<span class="sec-count">${logRows.length} event${logRows.length === 1 ? '' : 's'}</span>` : ''}
    <span class="section-chev">▾</span></div>
    ${logRows.length ? '' : `<div class="rca-empty">${logsEmptyWhy}</div>`}
    ${logRows.map((l, i) => `
      <div class="tl-row">
        <span class="tl-time editable-text${l.time ? '' : ' is-placeholder'}"
              contenteditable="true" spellcheck="false"
              ${l.time ? '' : 'data-ph="—"'}
              data-log-idx="${i}" data-log-field="time">${esc(l.time) || '—'}</span>
        <div class="tl-body">
          <span class="tl-what editable-text" contenteditable="true" spellcheck="false"
                data-log-idx="${i}" data-log-field="what">${esc(l.what)}</span><span class="tl-detail"> — <span
                class="editable-text" contenteditable="true" spellcheck="false"
                data-log-idx="${i}" data-log-field="detail">${esc(l.detail) || 'no detail'}</span></span>
        </div>
        <button class="row-del" data-log-del="${i}" title="Remove event">×</button>
      </div>`).join('')}
    <button class="row-add" data-log-add>+ Add event</button>
  </div>`;
  return logsHtml;
}

// §13 the events timeline moves to the RCA column, taking the slot the
// booking timeline held (after TL;DR, before What went wrong). It is the
// interpreted guest journey - channel pills, actors, ZD links, hidden
// machinery, narrative summary - so it sits beside the analysis that cites it.
// No treatment change; only position.
function eventsTimelineHtml(r) {
  function _normTlEvent(e) {
    // Bookends carry actor creation/review and thread booking/review. They
    // frame the timeline and belong to no conversation, so no channel pill.
    const isBookend = e.actor === 'creation' || e.actor === 'review';
    const isElided  = /comments elided/.test(e.label || '');
    return { ...e, _isBookend: isBookend, _isElided: isElided,
             time: e.time || '', label: (e.label || '').trim() };
  }

  const _allEvents = (r.events || []).map(_normTlEvent);
  const _internal  = _allEvents.filter(e => e.is_internal);
  const _shown     = state.tlShowInternal ? _allEvents
                                          : _allEvents.filter(e => !e.is_internal);

  const _zdBase = (r.zendeskSubdomain || 'headout');
  const events = _shown.map(e => `
    <div class="tl-event${e.is_internal ? ' tl-internal' : ''}">
      <div class="tl-time" title="${e.time_sort || ''}">${(e.time || '').replace(/ IST$/, '')}</div>
      <div class="tl-content">
        <div class="tl-header">
          ${(!e._isBookend && !e._isElided && e.thread)
              ? `<span class="tl-thread ${e.thread}">${e.thread}</span>` : ''}
          <div class="tl-actor ${e.actor}">${e.label}</div>
          ${e.is_internal
              ? `<span class="tl-flag" title="Headout machinery, not part of the guest&#39;s story">${e.internal_reason || 'internal'}</span>`
              : ''}
          ${e.ticket_id
              ? `<a class="tl-tid" href="https://${_zdBase}.zendesk.com/agent/tickets/${e.ticket_id}" target="_blank" rel="noopener" title="open ZD-${e.ticket_id}">ZD-${e.ticket_id}</a>`
              : ''}
        </div>
        <div class="tl-summary">${e.summary || ''}</div>
      </div>
    </div>
  `).join('')
  + (_internal.length && !state.tlShowInternal
      ? `<div class="tl-hidden-note" data-tl-toggle>${_internal.length} internal event${_internal.length === 1 ? '' : 's'} hidden · show</div>`
      : _internal.length
        ? `<div class="tl-hidden-note" data-tl-toggle>showing ${_internal.length} internal event${_internal.length === 1 ? '' : 's'} · hide</div>`
        : '');

  return `
    <div class="section" id="rca-events-timeline-section">
      <div class="section-label"><span>Events timeline</span>
        <span class="hint">times in IST</span>
        ${_shown.length ? `<span class="sec-count">${_shown.length} event${_shown.length === 1 ? '' : 's'}</span>` : ''}
      <span class="section-chev">▾</span></div>
      ${_shown.length
        ? `<div class="tl-events">${events}</div>
           ${r.timelineSummary ? `<div class="timeline-summary">${esc(r.timelineSummary)}</div>` : ''}`
        : `<div class="rca-empty">No Zendesk events were found for this booking.</div>`}
    </div>`;
}

function renderReviewCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('review-col').innerHTML = `<div class="empty-state" style="padding: 60px 20px;">Select a review from the inbox.</div>`;
    return;
  }

  const col = document.getElementById('review-col');

  if (r.type === 'untraceable') {
    col.innerHTML = `
      <div class="col-label">The facts</div>

      <div class="review-card">
        <div class="review-card-head">
          <div class="review-author-line">${esc(r.author)}</div>
          <div class="review-meta">${esc(r.lang)} · no reference</div>
        </div>
        <span class="review-stars">${r.stars}</span>
        <div class="review-body-original">${esc(r.original)}</div>
        ${translationCard(r)}
      </div>

      <div class="facts-block">
        <div class="facts-head"><span class="facts-head-title">Booking match</span>
          <button class="rerun-btn" data-rerun-match title="Re-run the booking search for this review">↻ Re-run</button>
        </div>
        <div class="match-card">
          <div class="match-top">
            <span class="match-tier-badge untr">—</span>
            <div>
              <div class="match-title">No booking found</div>
              <div class="match-method">No venue, date or name usable for search</div>
            </div>
          </div>
          <div class="match-warn">${r.untraceableReason
            || 'No trail was recorded — the pipeline never reached matching. Re-run the match; if it stays empty the run fails before matching.'}</div>
        <!-- Reads r.confidenceTrail, the trail the pipeline actually writes.
             This panel used to read r.untraceableChecks, which nothing in the
             client ever assigns - so it was empty on every untraceable review
             no matter what matching had done, and an empty panel got read as
             "matching never ran". Each step keeps its own mark instead of a
             hardcoded ✗: a warn and a fail are different findings. -->
          ${(r.confidenceTrail || []).length ? `
          <div class="confidence-trail">
            <div class="confidence-trail-label">How we built this match</div>
            ${(r.confidenceTrail || []).map((st, n) => trailStep(st, 'a' + n)).join('')}
          </div>` : ''}
        </div>
      </div>
    `;
    return;
  }

  const b = r.booking;

  // The pipeline now settles thread, actor, timestamp, machinery and ticket
  // id where the event is built. This used to redo all of it here: filtering
  // machinery by regex over rendered text, converting a second timestamp
  // format, and INFERRING the thread pill from whether a Claude-written
  // summary happened to contain the word "chat". Every one of those was a
  // repair applied after the wrong data had been stored, in the one place it
  // could not be tested - and each one hid the upstream bug it was covering.
  //
  // What is left is a display decision: machinery is hidden by default and
  // counted, so an associate reads the guest's story and can still get at the
  // rest. Nothing is dropped silently.

  const ins = r.insights;
  const similarSupport = ins.similarSupport || [];
  const similarReviews = ins.similarReviews || [];
  const totalSimilar = similarSupport.length + similarReviews.length;
  const summaryLine = totalSimilar === 0
    ? 'No similar complaints found in window'
    : `Found <strong>${similarSupport.length}</strong> in support · <strong>${similarReviews.length}</strong> in reviews on the same issue`;
  const similar = `<div class="insight-tile full">
       <div class="insight-tile-label">Similar complaints — TID·VID</div>
       <div class="similar-summary-line">${summaryLine}</div>
       ${similarSupport.length > 0 ? `
         <div class="similar-sub-label">In support (Zendesk chats / calls / emails)</div>
         <div class="similar-list">
           ${similarSupport.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
       ${similarReviews.length > 0 ? `
         <div class="similar-sub-label">In reviews (Trustpilot)</div>
         <div class="similar-list">
           ${similarReviews.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
     </div>`;

  // What the AI pulled out of the review — the inputs every search and score
  // downstream is built from. Shown plainly so a wrong match is traceable to a
  // wrong indicator rather than looking like a mystery.
  const _sig = r.extractedSignals || {};
  const _ind = _sig.match_indicators || {};
  const _sigRows = [
    ['Venue / experience', _ind.experience_or_venue],
    ['City / country',     _ind.city_or_country],
    ['Guest name',         _ind.guest_name],
    ['Visit date hint',    _ind.visit_date_hint],
    ['Pax',                _ind.pax || _sig.pax_hint],
    ['Searched Zendesk as', [_sig.author_first, _sig.author_last].filter(Boolean).join(' ')],
    ['Venue hints used',   (_sig.venue_hints || []).join(' · ')],
  ].filter(([, v]) => v != null && String(v).trim() !== '');

  const signalsBox = _sigRows.length
    ? `<div class="section">
         <div class="section-label">Extracted from review<span class="section-chev">▾</span></div>
         <div class="details-grid">
           ${_sigRows.map(([k, v]) => `
             <div class="detail-row">
               <span class="k">${k}</span>
               <span class="v">${String(v)}</span>
             </div>`).join('')}
         </div>
       </div>`
    : (() => {
        // When the booking was found by its id, no indicators were ever needed
        // and their absence is not a problem. Rendering an amber "Matching has
        // no indicators to search on" next to a green "Direct match · BID
        // confirmed" reads as a contradiction and makes a healthy match look
        // broken.
        //
        // Derived here rather than trusting the server to have set
        // matching_skipped: the client already knows the match tier, and a
        // draft written before that field existed would still show the alarm.
        const _bidMatched = !!(r.booking && (r.booking.bid || r.booking.id))
                            && (r.matchTier === 1 || r.match_tier === 1
                                || _sig.matching_skipped);
        const _msg = _sig.matching_skipped
          || (_bidMatched
              ? `Not needed — the review carried its booking id, so the booking was
                 found directly rather than by searching on indicators.`
              : `Nothing extracted — no venue, city, date or name found in the review
                 text. Matching has no indicators to search on.`);
        return `<div class="section">
         <div class="section-label">Extracted from review<span class="section-chev">▾</span></div>
         <div class="chk-none" style="font-size:12px;color:${_bidMatched ? 'var(--muted-2)' : 'var(--amber)'}">
           ${_msg}
         </div>
       </div>`;
      })();

  // Slack pings referencing this BID — ops/escalation/SP chatter that never
  // reaches Zendesk but is part of what actually happened to the booking.
  //
  // Three states, not two. search_mentions returns a sentinel row when it
  // could not search at all - no user token, or the API refused for want of
  // search:read - and rendering that as "No Slack messages found" states
  // something about the workspace that nobody looked at. An unsearched
  // workspace and an empty one lead to opposite conclusions during an RCA.
  const _mentions = r.slackMentions || [];
  const _searchDead = !!(_mentions.length && _mentions[0].search_unavailable);
  const slackPings = r.booking && r.booking.bid
    ? `<div class="section">
         <div class="section-label">Slack mentions of this BID<span class="section-chev">▾</span></div>
         ${_searchDead ? `
         <div class="chk-none" style="font-size:12px;color:var(--amber)">
           ${(_mentions[0].text || 'Slack could not be searched.').replace(/</g,'&lt;')}
         </div>` : _mentions.length ? `
         <div class="details-grid">
           ${_mentions.map(m => `
             <div class="detail-row" style="grid-template-columns:130px 1fr">
               <span class="k">#${m.channel || '—'}${m.user ? ' · ' + m.user : ''}</span>
               <span class="v" style="white-space:normal">${(m.text || '').replace(/</g,'&lt;')}${m.permalink ? ` <a href="${m.permalink}" target="_blank" style="color:var(--accent)">open</a>` : ''}</span>
             </div>`).join('')}
         </div>` : `
         <div class="chk-none" style="font-size:12px">Slack was searched — no messages mention this booking.</div>`}
       </div>`
    : '';

  const confTrail = r.confidenceTrail
    ? `<div class="confidence-trail">
         <div class="confidence-trail-label">How we built this match</div>
         ${r.confidenceTrail.map((st, n) => trailStep(st, 'b' + n)).join('')}
       </div>`
    : '';

  col.innerHTML = `
    <div class="col-label">The facts</div>

    <div class="review-card">
      <div class="review-card-head">
        <div class="review-author-line">${esc(r.author)}</div>
        <div class="review-meta">${esc(r.lang)}${r.type === 'identified' ? ' · BID ' + esc(b.bid) : ' · no BID in text'}</div>
      </div>
      <span class="review-stars">${r.stars}</span>
      <div class="review-body-original">${esc(r.original)}</div>
      ${translationCard(r)}
    </div>

    <div class="facts-block">
      <div class="facts-head"><span class="facts-head-title">Booking match</span>
        <button class="rerun-btn" data-rerun-match title="Re-run the booking search + full analysis for this review">↻ Re-run</button>
      </div>
      <div class="match-card">
        <div class="match-top">
          <span class="match-tier-badge ${r.matchTier}">${r.tier}</span>
          <!-- The method line used to sit here, spelling out "BID extracted
               via attachment: X · BQ: BID X confirmed · Tier 1 confirmed via
               attachment" — which is the confidence trail below, rebuilt as
               one run-on sentence and printed twice on the same card. The
               trail says it properly, tick by tick. -->
          <div><div class="match-title">${r.matchTitle}</div></div>
        </div>
        ${signalsBox}
        ${confTrail}
        ${slackPings}
      ${r.candidateState && r.candidatesList ? `
        <div class="candidates-picker">
          <div class="candidates-picker-label">Pick the correct booking to continue</div>
          ${r.candidatesList.some(c => c.scoreVenue != null) && !r.candidatesList.some(c => c.venueSignal) ? `
          <div class="candidates-picker-label" style="color:var(--amber);text-transform:none;letter-spacing:0">

          </div>` : ''}
          ${r.candidatesList.map((c, i) => {
            const hasScore = typeof c.score === 'number' && c.score > 0;
            const pct = hasScore ? Math.min(100, Math.round(c.score / 5 * 100)) : 0;
            const metaParts = [
              c.guestName,
              c.vendorName,
              c.experienceDate,
              c.contactCount ? `${c.contactCount} support contact${c.contactCount > 1 ? 's' : ''}`
                             + (c.contactTags ? ` · ${c.contactTags}` : '') : '',
              (c.tgid || c.tid) ? `TGID ${c.tgid || '—'} / TID ${c.tid || '—'}` : '',
              c.leadTime ? `lead ${c.leadTime}` : '',

                    ? `venue ${c.scoreVenue} + date ${c.scoreDate}`
                    : `score ${c.score}`}

              <div class="candidate-exp">${c.experience || '—'}</div>
              <div class="candidate-meta">${metaParts.length ? metaParts.join(' · ') : 'Booking details load on confirm'}</div>
              <div class="candidate-reasons">
                ${(c.matchReasons || []).map(r => `<span class="candidate-reason-pill">${r}</span>`).join('')}
              </div>
            </div>`;
          }).join('')}

            <button class="candidate-confirm-btn">Confirm · run full RCA</button>
            <button class="skip-btn" data-mark-untraceable
                    title="None of these is this guest's booking">None → Untraceable</button>
          </div>
        </div>
      ` : ''}
      </div>
    </div>

    ${r.type === 'identified' ? `
    <div class="facts-block">
      <div class="facts-head"><span class="facts-head-title">Booking details</span></div>
      <div class="details-grid">
        <div class="detail-row"><span class="k">Booking ID</span><span class="v mono">${b.bmsLink ? `<a href="${b.bmsLink}" target="_blank" rel="noopener" class="bms-link">${b.bid}</a>` : b.bid}</span></div>
        <div class="detail-row"><span class="k">Experience</span><span class="v">${b.experience || "—"}</span></div>
        <div class="detail-row"><span class="k">TID name</span><span class="v ${b.tidName ? '' : 'placeholder'}">${b.tidName || '—'}</span></div>
        <div class="detail-row"><span class="k">TGID / TID</span><span class="v mono">${b.tgidLink ? `<a href="${b.tgidLink}" target="_blank" rel="noopener" class="tgid-link">${b.tgid || "—"}</a>` : (b.tgid || "—")} / ${b.tid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor ID</span><span class="v mono">${b.vid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor name</span><span class="v">${b.vendorName || "—"}</span></div>
        <div class="detail-row"><span class="k">Fulfilment type</span><span class="v mono">${b.fulfilmentType || '—'}</span></div>
        <div class="detail-row"><span class="k">Primary guest</span><span class="v">${b.primaryGuestName || '—'}</span></div>
        <div class="detail-row"><span class="k">Visit date</span><span class="v mono">${b.experienceDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Booking date</span><span class="v mono">${b.bookingDate || b.creationDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Review date</span><span class="v mono">${b.reviewDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Partnered vendor</span><span class="v">${b.isPartnered == null ? '<span class="placeholder">—</span>' : `<span class="pill-sm ${b.isPartnered ? 'pill-green' : 'pill-grey'}">${b.isPartnered ? 'Yes' : 'No'}</span>`}</span></div>
        <div class="detail-row"><span class="k">Escalation email</span><span class="v">${
          b.escalationEmail
            ? `<a href="mailto:${b.escalationEmail}" style="color:var(--accent)">${b.escalationEmail}</a>`
              + (b.escalationType ? `<span class="tile-n"> · ${b.escalationType}</span>` : '')
            : `<span class="pill-sm pill-grey">No</span>`}</span></div>
        <div class="detail-row"><span class="k">Booking status</span><span class="v">${b.status ? `<span class="booking-status-pill status-${b.status}">${b.status}</span>` : '—'}</span></div>
        <div class="detail-row"><span class="k">Lead time</span><span class="v mono">${b.leadTime || '—'}</span></div>
      </div>
    </div>` : ''}

    <div class="facts-block">
      <!-- Every timestamp is IST, so the suffix said nothing per-row while its
           16 characters overflowed the 80px time column - "IST" wrapped onto
           its own line on every timed row, next to one-line date-only
           bookends, which read as three different date formats. Stated once
           here instead; the stored string keeps its suffix and time_sort
           stays UTC. -->
      <!-- §13 the two timelines trade columns. This slot holds the BOOKING
           timeline now - system-of-record data, which is what the facts column
           is for. The events timeline is the interpreted guest journey and has
           moved beside the analysis that cites it. -->
      ${bookingTimelineHtml(r, (r.rca && r.rca.v3) || {})}
    </div>

    <div class="facts-block">
      <!-- Picker lives outside the branch on purpose: it used to sit only in
           the fallback arm, so the moment real insights arrived it vanished
           and the window could not be changed at all. -->
      <div class="insights-header">
        <span class="insights-title">Experience insights</span>
        <div class="window-picker">
          <button class="window-btn ${state.insightsWindow === '7d' ? 'active' : ''}" data-window="7d">7d</button>
          <button class="window-btn ${state.insightsWindow === '30d' ? 'active' : ''}" data-window="30d">30d</button>
          <button class="window-btn ${state.insightsWindow === '90d' ? 'active' : ''}" data-window="90d">90d</button>
        </div>
      </div>
      <div class="insights-wrap">
        ${r.liveInsights ? (() => {
          const li = r.liveInsights;
          // rating_15d / rating_30d are back-compat aliases: the server sends
          // TGID in the first and TID.VID in the second. They are SCOPES, not
          // windows - the window is whatever the picker above is set to.
          const _ratTgid = li.rating_tgid || li.rating_15d || {};
          const _ratTv   = li.rating_tidvid || li.rating_30d || {};
          // Ops thumb rule: under 95%, and only over ~100 bookings, because the
          // rate is noise below that - one unfulfilled booking out of two is
          // 50%. The server applies both halves; needs_attention is the answer.
          const _ffAttn  = li.ff_vid ? !!li.ff_vid.needs_attention
                                     : (li.vid_completion_rate != null
                                        && li.vid_completion_rate < 0.95);
          const _ffAttnT = li.ff_tgid ? !!li.ff_tgid.needs_attention
                                      : (li.tgid_completion_rate != null
                                         && li.tgid_completion_rate < 0.95);
          // Sample size, shown only when it changes how the number should be
          // read. Over 100 bookings the rate stands on its own; under it, the
          // ops rule says the rate is noise and the count is the honest
          // caveat. Zero is not a dash - "no bookings in this window" is a
          // fact about the vendor, and a dash reads as a broken query.
          // Which queries BROKE. A tile backed by one of these has no
          // number, and the affirmative wording below - "no bookings", "no
          // negative reviews" - would state a warehouse failure as a fact
          // about the vendor. _broken() marks those tiles instead.
          const _failed = new Set(li._failed_queries || []);
          const _broken = (...names) => names.some(n => _failed.has(n));
          const _err = '<span class="tile-empty" title="the query for this '
            + 'tile failed - this is not a zero">could not load</span>';

          const _rate = (r, n, ...q) =>
            _broken(...q) ? _err
            : n === 0 ? 'no bookings'
            : r == null ? '—'
            : `${(r * 100).toFixed(1)}%` +
              (n < 100 ? ` <span class="tile-n">of ${n} booking${n === 1 ? '' : 's'}</span>` : '');
          const _rr = li.review_ratio || 0;
          const _sr = li.support_ratio || 0;

          // Why a tile has no number. The server says so - _zeroed_because when
          // nothing could be computed, _partial_because when only the
          // vendor-level half ran. The subtitles used to read "no visit date"
          // no matter what the actual reason was, which is worse than silence:
          // it sends you looking for a missing date that was never the problem.
          const _why = li._zeroed_because || li._partial_because || '';
          const _n = (v) => (v == null ? '—' : v);
          const _pair = (a, b) =>
            (a == null || b == null) ? '—' : `${a} / ${b}`;

          // Grouped by the question each answers, because a flat grid of ten
          // equal tiles gives no clue which two matter for an RCA and which
          // are background. Ratio and counts were also two tiles showing one
          // fact - "12.5%" and "1 / 8" - so they are now one line each.
          // What the shortfall was. "57.1% of 7" leaves the obvious question
          // unanswered - three did not complete, why - and cancelled by the
          // vendor points somewhere different from a fulfilment backlog.
          // The booking ids behind the count. A number is something to note;
          // an id is something to open.
          const _ids = (list) => {
            if (!Array.isArray(list) || !list.length) return '';
            const shown = list.slice(0, 6).join(' · ');
            return `<div class="tile-why">${shown}` +
                   (list.length > 6 ? ` <span class="why-n">+${list.length - 6}</span>` : '') +
                   '</div>';
          };
          const _why_not = (rows) => {
            if (!Array.isArray(rows) || !rows.length) return '';
            return '<div class="tile-why">' + rows.slice(0, 3).map(r =>
              `<span class="why-n">${r.count}</span> ${r.reason}`).join(' · ')
              + '</div>';
          };
          // Headings carry the title only. Repeating the range on every
          // group put a date next to numbers that had not been recomputed for
          // it yet, so a stale label read as fact - and the picker at the top
          // already states the window for the whole panel.
          const _grp = (t) => `<div class="insight-group">${t}</div>`;

               <div class="insight-tile-value">${value}</div>

          // how much weight to put on it - a mean over one review reads the
          // same as a mean over a thousand without it.

            if (_broken(...q)) return _err;
            if (r.avg == null) return '<span class="tile-empty">no ratings</span>';
            const n = r.n || 0;
            return `${r.avg} ★ ` +
              `<span class="tile-n">from ${n.toLocaleString()} ` +
              `rating${n === 1 ? '' : 's'}</span>`;
          };
          const _share = (hit, tot, none, ...q) =>
            _broken(...q) ? _err
            : !tot ? `<span class="tile-empty">${none}</span>`
                 : `${hit} <span class="tile-n">of ${tot}</span>` +
                   ` <span class="tile-pct">${((hit / tot) * 100).toFixed(1)}%</span>`;
          const sd = li.same_day || {};

          return `<div class="insights-grid">
            ${_why ? `<div class="insight-note">${_why}</div>` : ''}

            ${_grp('Is this issue recurring here?')}
            ${_tile('Reviews', _share(li.similar_reviews_30d, li.total_reviews_30d,
                                      'no negative reviews',
                                      'reviews', 'reviews_total'),
                    _rr > 0.15 ? 'red' : '')}
            ${_tile('Support contacts', _share(li.similar_support_queries_30d,
                                               li.total_support_queries_30d,
                                               'no contacts',
                                               'support', 'support_total'),
                    _sr > 0.15 ? 'red' : '')}

            ${_grp('Same visit date, same issue')}
            ${_tile('Reviews', _broken('same_day_reviews') ? _err
                                : (li.same_day ? _n(sd.reviews) : '—')
                                  + _ids(sd.review_ids),
                    (sd.reviews > 0) ? 'red' : '')}
            ${_tile('Support contacts', _broken('same_day_support') ? _err
                                        : (li.same_day ? _n(sd.support) : '—')
                                          + _ids(sd.support_ids),
                    (sd.support > 0) ? 'red' : '')}

            ${_grp('Experience &amp; vendor')}
            ${_tile('Average rating · TGID', _avgRating(_ratTgid, 'rating_tgid'),
                    _ratTgid.avg == null ? 'grey' : '')}
            ${_tile('Average rating · TID · VID', _avgRating(_ratTv, 'rating_tidvid'),
                    _ratTv.avg == null ? 'grey' : '')}
            ${_tile('Completion · TGID',
                    _rate(li.tgid_completion_rate, (li.ff_tgid || {}).total ?? null,
                          'completion_tgid')
                    + _why_not(li.tgid_incomplete_why),
                    _ffAttnT ? 'red' : '')}
            ${_tile('Completion · VID',
                    _rate(li.vid_completion_rate, (li.ff_vid || {}).total ?? null,
                          'completion_vid')
                    + _why_not(li.vid_incomplete_why),
                    _ffAttn ? 'red' : '')}
            ${_ffAttnT || _ffAttn
              ? '<button class="flag-biz-btn full" data-flag-biz>⚑ Flag to Biz · draft message</button>'
              : ''}
          </div>`;
        })() : `
        <div class="insights-grid">
          <div class="insight-tile ${ins.tgidRating.tone}">
            <div class="insight-tile-label">TGID Rating</div>
            <div class="insight-tile-value">${ins.tgidRating.value}</div>
            <div class="insight-tile-sub">${ins.tgidRating.sub} · ${state.insightsWindow}</div>
          </div>
          <div class="insight-tile ${ins.tidVidRating.tone}">
            <div class="insight-tile-label">TID · VID Rating</div>
            <div class="insight-tile-value">${ins.tidVidRating.value}</div>
            <div class="insight-tile-sub">${ins.tidVidRating.sub} · ${state.insightsWindow}</div>
          </div>
          ${(() => {
            const _li = r.liveInsights;
            const _cr = _li ? _li.vid_completion_rate : null;
            const _crStr = _li ? (_li.vidCompletionRate || 'N/A') : ins.completion.value;
            const _ffv = _li ? _li.ff_vid : null;
            const _crTone = _cr != null && _cr < 0.95 ? 'red' : _cr == null && !_li ? ins.completion.tone : _cr == null ? 'grey' : '';
            const _crFlagToBiz = _ffv ? _ffv.needs_attention : (_cr != null ? _cr < 0.95 : ins.completion.flagToBiz);
            // The server records this and sends it on every load. Reading it
            // only out of the in-memory object meant a reload re-armed the
            // button and a second click sent a duplicate to #biz-supply-ops.
            const _crFlagged = r.flagToBizState === 'sent' || ins.completion.flagged;
            const _sdi = _li ? _li.sameDaySameVidIssues : ins.sameDayIssues.value;
            const _sdObj = _li ? _li.same_day_same_vid : null;

    </div>
    ${(() => {
      const rc = r.rca || {};
      const chipRow = (label, values, addAttr, options, removeAttr) => `

      const subOpts = SUB_THEME_OPTIONS[rc.issueL1 + '::' + rc.issueL2] || [];
      return `

        ${chipRow('Scenarios', rc.scenarios || [], 'data-scenario-add', SCENARIO_OPTIONS, 'data-scenario-remove')}
        ${chipRow('Overlays', rc.overlayScenarios || [], 'data-overlay-add',

        <span data-scenario-regen-status style="font-size:11px;color:var(--muted-2)"></span>
      </div>`;
    })()}

  `;

  // Machinery toggle. Hiding is a display choice, so it is reversible and it
  // says how many it hid - a filter that silently removes rows is how the
  // regex in the old renderer went unnoticed for so long.
  const tlToggle = col.querySelector('[data-tl-toggle]');
  if (tlToggle) {
    tlToggle.addEventListener('click', () => {
      state.tlShowInternal = !state.tlShowInternal;
      renderReviewCol();
    });
  }

  // Window picker — recompute against the chosen range. This used to only set
  // state and re-render, so the caption changed ("· 90d") while the number
  // underneath stayed on whatever window the pipeline had hardcoded.
  col.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const w = btn.dataset.window;
      state.insightsWindow = w;
      renderReviewCol();
      // The server recomputes for this window - it is not a client-side
      // filter. Until it answers, the tiles show the previous window's
      // numbers under the new label, so say so rather than letting them read
      // as the answer.
      col.querySelectorAll('.insight-tile-value').forEach(el => {
        el.style.opacity = '0.45';
      });
      const r = REVIEWS.find(x => x.id === state.selected);
      // No booking-id guard. It used to check r.booking.bid, which is not the
      // key the pipeline writes - it writes id - so for every review the guard
      // returned early: state moved to the new window, the panel re-rendered
      // with the OLD numbers, the tiles stayed dimmed, and no request was ever
      // sent. The picker looked stuck on one window's data forever.
      //
      // There is nothing to guard anyway. The server resolves the booking
      // itself and answers with _zeroed_because when it cannot, which is a
      // result worth rendering rather than a reason not to ask.
      if (!r) return;
      try {
        const resp = await fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(w)}`);
        if (resp.ok) {
          const ins = unwrapInsights(await resp.json());
          if (ins) r.liveInsights = ins;
        }
      } catch (e) {
        // Say something. A bare "keep what is on screen" catch is what let a
        // ReferenceError in this block masquerade as a broken window picker
        // for as long as it did: the request worked, the reply was dropped on
        // the floor, and the only visible effect was numbers that would not
        // change. A swallowed exception here has no other symptom, so it has
        // to announce itself.
        console.error('[insights] window switch failed:', e);

  col.querySelectorAll('.candidate-card').forEach(card => {
    card.addEventListener('click', () => {
      col.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');

  const confirmBtn = col.querySelector('.candidate-confirm-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {

      if (!selectedCard) return;
      const idx = parseInt(selectedCard.dataset.candidateIdx);
      const candidate = r.candidatesList && r.candidatesList[idx];
      if (!candidate) return;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '⟳ Confirming…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/select-candidate`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({bid: candidate.bid}),
        });
        if (!res.ok) throw new Error(await res.text());
        confirmBtn.textContent = '✓ Confirmed · pipeline running…';
        r.candidateState = false;
        // Poll every 3 s until the pipeline finishes (candidate_state clears)
        let polls = 0;
        const poll = setInterval(async () => {
          polls++;
          try {
            const check = await fetch(`/api/reviews/${r.id}`);
            if (!check.ok) return;
            const payload = await check.json();
            const d = payload.draft;
            if (d && !d.candidate_state) {
              clearInterval(poll);
              await loadDraftOverlays();
              renderInbox();
              renderReviewCol();
              renderRcaCol();
            }
          } catch (_) {}
          if (polls > 20) clearInterval(poll); // give up after 60 s
        }, 3000);

        confirmBtn.disabled = false;
      }
    });

}

// The window these numbers were actually computed for. The picker is a
// button someone may have clicked after the numbers were fetched, so labelling
// a cached 7-day count "90d" because 90d is highlighted is how a Slack post
// tells leadership the wrong scope. The data carries its own window.
function _insightsWindowLabel(r) {
  const raw = (r && r.insightsRaw) || {};
  if (typeof raw._window_days === 'number' && raw._window_days > 0) return raw._window_days + 'd';
  if (raw._window_label) return String(raw._window_label);
  return (typeof state !== 'undefined' && state.insightsWindow)
    ? state.insightsWindow + ' (picker — data carried no window)'
    : 'unknown';
}

// Shared by every branch of the RCA column, including the untraceable one,
// which returns before the main renderer's locals exist - a helper defined
// down there is a ReferenceError up here.
const esc = s => String(s == null ? '' : s).replace(/</g, '&lt;').replace(/>/g, '&gt;');

// One save path for every RCA edit.
//
// Nine handlers did this inline with `catch (e) { /* keep local edit */ }` and
// no res.ok check. fetch only rejects on a network failure, so a 400 or a 500
// resolved and was treated as a successful save: the edit stayed on screen,
// the tick appeared, and the change was gone on reload with nothing said.
// Anything that cannot be saved has to say so while the words are still on
// the screen to copy.
async function saveDraft(reviewId, patch, el) {
  try {
    const res = await fetch(`/api/reviews/${reviewId}/draft-v2`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(patch),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`.slice(0, 200));
    if (el && typeof el.dataset === 'object') _saveMark(el, true);
    return true;
  } catch (e) {
    console.warn('draft save failed', patch, e);
    if (el && typeof el.dataset === 'object') _saveMark(el, false);
    _saveToast(String(e.message || e));
    return false;
  }
}

function _saveMark(el, ok) {
  const host = el.parentElement || el;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  let tick = host.querySelector(':scope > .save-tick');
  if (!tick) {
    tick = document.createElement('span');
    tick.className = 'save-tick';
    host.appendChild(tick);
  }
  tick.textContent = ok ? '✓ saved' : '✗ not saved';
  tick.style.color = ok ? '' : '#e5534b';
  tick.classList.add('on');
  setTimeout(() => tick.classList.remove('on'), ok ? 1400 : 6000);
}

// Not every save is tied to an element on screen, and a save that failed with
// nowhere to show it is the failure mode this is fixing.
function _saveToast(msg) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);'
      + 'background:#e5534b;color:#fff;padding:9px 14px;border-radius:8px;z-index:9999;'
      + 'font-size:12.5px;max-width:80vw;box-shadow:0 4px 16px rgba(0,0,0,.25)';
    document.body.appendChild(t);
  }
  t.textContent = 'Not saved — ' + msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, 7000);
}

// "14:02" today, "3 Jul" before that. Used on buttons whose action already
// happened, so the label says when rather than inviting a repeat.
function _shortWhen(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})
    : d.toLocaleDateString([], {day: 'numeric', month: 'short'});
}
// Pointer fields are lists in the v3 shape; older drafts hold one string.
// "Frau Nicole Liebschner" is not called Frau. Taking the first word of the
// author name put a German honorific into a guest-facing greeting - "Hey
// Frau,". Titles are stripped before the first real name is taken.
const _TITLES = new Set(['mr','mrs','ms','miss','mx','dr','prof','sir','madam',
  'herr','frau','fraulein','fräulein','monsieur','madame','mademoiselle','m',
  'sr','sra','srta','don','dona','doña','dott','ing','sig','sig.ra','signora',
  'signore','heer','mevrouw','pan','pani','hr','fru','herra','rouva']);
// Approved untraceable reply. Kept in one place so the copy button, the
// panel and anything else that needs it cannot drift apart.
const UNTRACEABLE_REPLY = (first) =>
`Hey ${first},

I'm sorry things didn't go as planned, and I'd love to fix this for you right away. Please share your booking ID (if available) or the email address used for your booking at https://bit.ly/hedout. Once we have your details, our team will dive right in to resolve it ASAP.

Thank you so much for your understanding and patience. I'll make sure we turn this around for you!

Best,
[Your Name], Headout`;

const _firstName = (author) => {
  const parts = String(author || '').trim().split(/\s+/).filter(Boolean);
  for (const p of parts) {
    const bare = p.replace(/\.$/, '').toLowerCase();
    if (_TITLES.has(bare)) continue;
    return p;
  }
  return 'there';
};
const asPoints = v => (Array.isArray(v) ? v : (v ? [v] : [])).filter(Boolean)
  .map(p => String(p).replace(/^\s*[•·\-–▪]\s*/, ''));

// Delegated once: the toggle appears in both columns and both re-render from
// scratch, so a per-element binding would have to be re-attached in every
// place that touches innerHTML - which is how a control ends up live in one
// column and dead in the other.
// §13 the booking timeline renders from the facts column now, so its controls
// are delegated: a per-render binding inside renderRcaCol left them dead the
// moment the markup moved. Same reason as the raw-error toggle.
document.addEventListener('click', async ev => {
  const t = ev.target.closest && ev.target.closest('[data-log-del], [data-log-add]');
  if (!t) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  if (t.hasAttribute('data-log-del')) {
    v3.booking_logs = (v3.booking_logs || []).filter((_, i) => i !== parseInt(t.dataset.logDel));
  } else {
    v3.booking_logs = [...(v3.booking_logs || []),
      {time: '', what: 'New event — click to edit', detail: ''}];
  }
  await saveDraft(r.id, {rca_v3: v3});
  renderReviewCol(); if (state.selected) renderRcaCol();
});

document.addEventListener('blur', async ev => {
  const el = ev.target.closest && ev.target.closest('[data-log-idx]');
  if (!el) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const v3 = r.rca.v3 = r.rca.v3 || {};
  const l = (v3.booking_logs || [])[parseInt(el.dataset.logIdx)];
  if (!l || typeof l === 'string') return;
  l[el.dataset.logField] = el.textContent.trim();
  await saveDraft(r.id, {rca_v3: v3});
}, true);

document.addEventListener('click', ev => {
  const btn = ev.target.closest && ev.target.closest('[data-raw-err]');
  if (!btn) return;
  ev.stopPropagation();
  state.rawErrOpen[btn.dataset.rawErr] = !state.rawErrOpen[btn.dataset.rawErr];

function renderRcaCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('rca-col').innerHTML = '';
    return;
  }

  const col = document.getElementById('rca-col');

  // The RCA runs against a specific booking, so an unconfirmed candidate set
  // gets a gate rather than a half-built workspace: editing an analysis that
  // is about to be regenerated against a different booking wastes the work.
  if (r.type === 'candidates') {
    col.innerHTML = `
      <div class="rca-head">
        <div>
          <div class="rca-title">RCA &amp; response</div>
          <div class="rca-sub">Locked until a booking is confirmed</div>
        </div>
      </div>
      <div class="rca-gate">
        <div class="rca-gate-title">Confirm the booking first</div>
        <div class="rca-gate-body">The RCA runs against a specific booking. Pick the
          correct candidate in the middle panel — the full analysis fills in here
          once confirmed.</div>
      </div>`;
    return;
  }

  if (r.type === 'untraceable') {
    col.innerHTML = `
      <div class="untr-wrap">
      <div class="col-label">Untraceable — ask the guest</div>
      <div class="untr-card">
        <!-- One statement of the situation, not four. The facts pane already
             carries the trail; repeating "no booking" in three more sentences
             told the reader nothing they had not just read. -->
        <div class="untr-lead">No booking matched this review. Ask the guest for a booking
          reference; it stays in this tab until it matches.</div>
        <!-- Approved copy, sent unchanged. There is nothing case-specific to
             say until the guest gives us a reference, so nothing here is
             generated - only the name is filled in. -->
        <div class="untr-template editable-text" contenteditable="true" spellcheck="false"
             data-untraceable-template>${esc(UNTRACEABLE_REPLY(r.firstName))}</div>
        <div class="untraceable-actions">
          <!-- Copy, not send: this reply is pasted into the Slack thread by
               hand like every other response in this app. -->
          <button class="btn primary" data-copy-untraceable>Copy reply</button>
          <button class="btn" data-rerun-match>↻ Re-run matching</button>
        </div>
      </div>


    `;
    const vBtn = col.querySelector('[data-copy-untraceable]');
    if (vBtn) {
      vBtn.addEventListener('click', async () => {
        const tpl = col.querySelector('[data-untraceable-template]');
        const text = (tpl ? tpl.textContent : '').trim();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          vBtn.textContent = '✓ Copied';
        } catch (e) {
          // Clipboard can be blocked by the browser; select the text so it can
          // still be copied by hand rather than leaving a dead button.
          try {
            const range = document.createRange();
            range.selectNodeContents(tpl);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
            vBtn.textContent = '✗ Clipboard blocked — text selected';
          } catch (_) {
            vBtn.textContent = '✗ Copy failed';
          }
        }
        setTimeout(() => { vBtn.textContent = 'Copy reply'; }, 2500);
      });
    }
    return;
  }

  const rca = r.rca;
  const actions = rca.actionsTaken[state.actionTab] || [];

  // v3 new-shape data + shared helpers (used by interactions and v3 sections)
  const v3d = rca.v3 || {};
  const _zdB = (r.zendeskSubdomain || 'headout');
  const zdLink = ref => {
    const id = String(ref || '').replace(/^ZD-?/i, '').trim();
    if (!id) return '';
    return `<a class="tl-tid" href="https://${_zdB}.zendesk.com/agent/tickets/${id}" target="_blank" rel="noopener" title="open ZD-${id}">ZD-${id}</a>`;
  };

  // Pointer fields arrive as arrays now, but older drafts hold one long
  // string - normalise both to a list so the renderer never prints "[object]"
  // or a wall of prose.

  const points = (v, cls = 'chk-ev') => asPoints(v)
    .map(p => `<div class="${cls}">• ${esc(p)}</div>`).join('');
  // Editable variants. Every fact in the RCA must be correctable in place -
  // the person signing it owns the words, not the model. data-v3p is a dot
  // path into rca.v3; one delegated blur handler persists all of them.
  // An empty field renders its placeholder AS the text, so focusing and
  // blurring it without typing would otherwise save "click to write" as the
  // value. data-ph carries the placeholder so the saver can tell the two
  // apart, and the class greys it so it does not read as content.
  const edPoints = (path, v, cls = 'chk-ev') => asPoints(v)
    .map((p, i) => `<div class="${cls}">• ${edSpan(`${path}.${i}`, p)}</div>`).join('');

  // §11 v4 sends an array of {question, verdict, evidence, source, ref}; a
  // draft written before that holds {question: answer}. Both normalise to the
  // array here so the renderer has one shape - and an old answer that opens
  // with a fact keeps its text as evidence instead of being lost to a pill.
  const _isaRaw = rca.issueSpecificAnswers;
  const _isaRows = Array.isArray(_isaRaw)
    ? _isaRaw.filter(a => a && a.question).map(a => ({
        question: a.question,
        verdict: ['Yes','No','Unknown'].indexOf(a.verdict) >= 0 ? a.verdict : 'Unknown',
        evidence: a.evidence || '', source: a.source || null, ref: a.ref || null}))
    : Object.entries(_isaRaw || {}).map(([q, v]) => {
        const raw = String(v == null ? '' : v);
        const m = raw.match(/^\s*(Yes|No|Unknown)\b[:\s—-]*/i);
        return {question: q,
                verdict: m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : 'Unknown',
                evidence: (m ? raw.slice(m[0].length) : raw).trim(),
                source: null, ref: null};
      });
  const _isaNo = _isaRows.filter(a => a.verdict === 'No').length;
  const _isaCls = v => v === 'Yes' ? 'ok' : v === 'No' ? 'bad' : 'unk';


  // ── Guest ↔ support: facts from Zendesk, interpretation from the model ──
  // The rows are CONTACTS, not events. The Events timeline is the per-event
  // view; one row per frame here would make the contact count report events,
  // and a count nobody trusts is worse than none.
  const _zdKey = v => { const m = String(v == null ? '' : v).match(/\d+/); return m ? m[0] : ''; };
  const _noteFor = key => key
    ? (rca.supportNotes || []).find(n => n && _zdKey(n.zd_ref) === key) || null : null;
  // Frames group by ticket; untracked ones fall back to a 30-minute window,
  // because consecutive messages minutes apart are one exchange however they
  // were logged. The grouping is a judgement, and the pipeline says so in the
  // trail when it fires.
  const _contacts = (frames) => {
    const out = []; let lastAt = null;
    (frames || []).forEach(fr => {
      const key = _zdKey(fr.ticket_id);
      if (key) {
        const hit = out.find(g => g.key === key);
        if (hit) hit.rows.push(fr); else out.push({key, rows: [fr]});
        lastAt = null; return;
      }
      const at = Date.parse(fr.time_sort || '') || null;
      const near = at && lastAt && Math.abs(at - lastAt) <= 30 * 60 * 1000;
      if (near && out.length && !out[out.length - 1].key) out[out.length - 1].rows.push(fr);
      else out.push({key: '', rows: [fr]});
      lastAt = at;
    });
    return out;
  };

  const _groups = _contacts(rca.supportFrames);
  const _used = new Set(_groups.map(g => g.key).filter(Boolean).filter(k => _noteFor(k)));
  // A note whose ticket has no frame still renders, marked. A zd_ref that
  // matched nothing is a failed join; no zd_ref at all is an off-Zendesk
  // contact the model saw. Different facts, so they read differently.
  const _orphans = (rca.supportNotes || []).filter(n => n && !_used.has(_zdKey(n.zd_ref)));
  const _rows = [
    ..._groups.map((g, i) => ({kind: 'frame', g, note: _noteFor(g.key), i})),
    ..._orphans.map((n, k) => ({kind: 'orphan', note: n, i: _groups.length + k})),
  ];

  const _contactRow = (row) => {
    const i = row.i;
    const open = !!state.ixOpen[i];
    const note = row.note || {};
    if (row.kind === 'orphan') {
      const why = _zdKey(note.zd_ref) ? 'unmatched ZD reference' : "guest's account, unverified";
      return `
        <div class="convo-frame ${open ? 'open' : ''}">
          <div class="convo-frame-head" data-ix-toggle="${i}">
            <span class="convo-num">${String(i + 1).padStart(2, '0')}</span>
            <span class="convo-time dim">—</span>

    // paired with root_cause i and any surplus causes are appended as
    // unpaired rows rather than dropped.
    // The chip shows the VERDICT only. A model that returns
    // "Partially True - booking status shows ..." would otherwise claim the
    // whole row; the tail is kept in the title attribute, not dropped.
    const accShort = (a) => {
      const t = String(a || '').trim();
      const m = t.match(/^(partially true|partly accurate|accurate|yes|no|unknown|true|false)/i);
      return m ? m[1] : t.split(/[\s\u2014-]/)[0];
    };
    const accClass = (a) => { const t = String(a || '').toLowerCase();
      return t.startsWith('yes') || t.startsWith('accur') ? 'ok'
           : t.startsWith('no') ? 'no'
           : t ? 'part' : ''; };
    // Root cause, claim and owner now live ON each issue. Drafts written
    // before that carry a parallel root_causes list instead, so issue i
    // falls back to root_causes[i]; the claim falls back to the issue text,
    // and the owner to that cause's classification. Any cause with no issue
    // to sit on still renders as its own row, so nothing is dropped.
    // §1 closed vocabularies. The chip is a select, so the only values that
    // can reach the screen are these - a sentence-length verdict cannot.
    const ACC  = ['Accurate', 'Partly accurate', 'Inaccurate', 'Unknown'];
    const OWNS = ['Content', 'CE', 'SP', 'RO', 'Product', 'Biz', 'Ops'];
    const accCls = a => { const t = String(a || '').toLowerCase();
      return t.startsWith('accur') ? 'ok' : t.startsWith('part') ? 'part'
           : t.startsWith('inacc') ? 'bad' : 'unk'; };
    // A select renders only its options, so an unrecognised value has to be
    // mapped onto one - the raw string stays in title, never in the chip.
    const accCanon = a => {
      const t = String(a || '').trim().toLowerCase();
      if (t.startsWith('accur') || t.startsWith('yes') || t.startsWith('true')) return 'Accurate';
      if (t.startsWith('part')) return 'Partly accurate';
      if (t.startsWith('inacc') || t.startsWith('no') || t.startsWith('false')) return 'Inaccurate';
      return 'Unknown';
    };
    const chipSel = (path, value, opts, cls, extraCls, raw) => {
      const v = value || opts[opts.length - 1];
      return `<select class="chip-sel ${extraCls} ${cls}" data-v3sel="${path}"
        title="${esc(raw || v)}">${opts.map(o =>
        `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    };
    // §2b one evidence row: 62px source rail | text | ×. The rail is the row
    // marker, so no leading em-dash; a legacy string renders with a "—" rail.
    const evRow = (i, j, e) => {
      const o = (e && typeof e === 'object') ? e : {text: e, source: null, ref: null};
      const src = o.source ? String(o.source) : '';
      const rail = src
        ? (o.ref ? `<a href="${esc(o.ref)}" target="_blank" rel="noopener" title="${esc(o.ref)}">${esc(src)}</a>` : esc(src))
        : '—';
      return `<div class="ev-row">
        <span class="ev-src${src ? '' : ' none'}" title="${esc(src || 'no source recorded')}">${rail}</span>
        <span class="ev-text">${edSpan(`what_went_wrong.guest_issues.${i}.evidence.${j}.text`, o.text || '', 'click to write the finding')}</span>
        <button class="x-del" data-ev-del="${i}:${j}" title="remove this evidence row">×</button>
      </div>`;
    };
    // §2 the four optional analysis lines. Present ones render as an editable
    // key-value row with a ×; absent ones become a "+" button in the wrap row.
    const ALINES = [
      ['operational_failure', 'Operational failure', 'what a person or system did wrong'],
      ['sop_gap',             'SOP / process gap',   'the missing or deficient process step'],
      ['pattern',             'Pattern',             'recurrence evidence, with counts and window'],
      ['fix',                 'Fix',                 'Team: action (owner: Team)'],
    ];

    const causesList = wh.root_causes || [];
    const gIssues = w.guest_issues || [];
    const legacyPaired = gIssues.some(g => !g.root_cause && !g.owner);
    const rowCount = Math.max(gIssues.length, legacyPaired ? causesList.length : 0);
    const wwrRows = Array.from({length: rowCount}, (_, i) => {
      const gi = gIssues[i] || {};
      const rcLegacy = causesList[i] || {};
      const open = state.wwrOpen[i] !== false;
      const title = gi.issue || rcLegacy.issue || 'Untitled issue';
      const evidence = Array.isArray(gi.evidence) ? gi.evidence : asPoints(gi.evidence);
      const hasOwnCause = !!gi.root_cause;
      const causeText  = hasOwnCause ? gi.root_cause : (rcLegacy.cause || '');
      const causePath  = hasOwnCause
        ? `what_went_wrong.guest_issues.${i}.root_cause`
        : `what_went_wrong.what_happened.root_causes.${i}.cause`;
      const owner = gi.owner || rcLegacy.classification || '';
      const claim = gi.claim;
      const acc   = accCanon(gi.claim_accuracy);
      // The legacy tail parser is a net, not a path: claim_accuracy_note is a
      // real field now, and it is what renders when present.
      const rawAcc = gi.claim_accuracy_raw || gi.claim_accuracy || '';
      const tail = gi.claim_accuracy_note ||
        (String(rawAcc).match(/^[^—:-]+[—:-]\s*(.+)$/) || [])[1] || '';
      const bp = `what_went_wrong.guest_issues.${i}`;
      const present = ALINES.filter(([k]) => String(gi[k] || '').trim());
      const absent  = ALINES.filter(([k]) => !String(gi[k] || '').trim());
      return `
      <div class="wwr-issue">
        <div class="wwr-issue-head">
          <span class="wwr-n" data-wwr-toggle="${i}">${String(i + 1).padStart(2, '0')}</span>
          <span class="wwr-issue-title">${edSpan(`${bp}.issue`, title, 'click to name the issue')}</span>
          ${chipSel(`${bp}.claim_accuracy`, acc, ACC, accCls(acc), 'chip-acc-sel', rawAcc)}
          <span class="wwr-issue-chev" data-wwr-toggle="${i}">${open ? '▾' : '▸'}</span>
        </div>
        ${open ? `
        <div class="wwr-issue-body">
          <div class="wwr-blk">
            <span class="wwr-blk-label">Claim</span>
            ${claim && String(claim).trim() ? `
              <div class="wwr-claim-row">
                <span class="wwr-claim wwr-claim-q">“${edSpan(`${bp}.claim`, claim)}”</span>
                <button class="x-del" data-claim-del="${i}" title="remove the claim">×</button>
              </div>`
            /* An absent claim is not a blank quote with quote marks around
               nothing - that reads as a guest who said "". It is either the
               review not stating it in their words, or our own finding filed
               as a complaint, and the empty state says which. */
            : `<div class="rca-empty">The review does not state this in the guest's own words.</div>
               <button class="row-add wwr-add" data-claim-add="${i}">+ Claim</button>`}
          </div>
          <div class="wwr-blk">
            <span class="wwr-blk-label">Evidence
              <button class="row-add wwr-add" data-wwr-ev-add="${i}">+ add</button></span>
            ${evidence.length ? evidence.map((e, j) => evRow(i, j, e)).join('')
              : '<div class="rca-empty">No evidence recorded.</div>'}
          </div>
          <div class="wwr-blk">
            <span class="wwr-blk-label">Analysis — what actually happened?</span>
            <div class="wwr-analysis">
              <div class="wwr-analysis-head">
                ${chipSel(`${bp}.claim_accuracy`, acc, ACC, accCls(acc), 'chip-acc-sel', rawAcc)}
                ${chipSel(`${bp}.owner`, owner, OWNS, 'unk', 'chip-owner-sel', owner || 'unassigned')}
              </div>
              ${tail ? `<div class="wwr-analysis-note">${esc(tail)}</div>` : ''}
              <div class="wwr-aline">
                <span class="wwr-aline-key">Root cause:</span>
                <span class="wwr-aline-val">${
                  causeText ? edSpan(causePath, causeText)
                            : edSpan(`${bp}.root_cause`, '', 'click to write the failing step')}</span>
                <!-- no ×: an issue with no root cause is not an RCA -->
              </div>
              ${present.map(([k, label]) => `
              <div class="wwr-aline">
                <span class="wwr-aline-key">${esc(label)}:</span>
                <span class="wwr-aline-val">${edSpan(`${bp}.${k}`, gi[k])}</span>
                <button class="x-del" data-aline-del="${i}:${k}" title="remove this line">×</button>
              </div>`).join('')}
              ${absent.length ? `<div class="wwr-addrow">${absent.map(([k, label]) =>
                `<button class="row-add wwr-add" data-aline-add="${i}:${k}">+ ${esc(label)}</button>`
              ).join('')}</div>` : ''}
            </div>
          </div>
        </div>` : ''}
      </div>`;
    }).join('') + `
      <button class="wwr-addissue" data-wwr-issue-add>
        <span class="wwr-addissue-circle">+</span><span>Add issue</span>
      </button>`;

    // A systemic cause that belongs to no single issue keeps its own row.
    const orphanCauses = legacyPaired ? [] : causesList;
    const orphanHtml = orphanCauses.length ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">Cross-cutting root causes</span>
        ${orphanCauses.map((rc, i) => `
          <div class="chk-row">
            <span class="chk-mark">→</span>
            <div class="chk-item">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.issue`, rc.issue)}
              <div class="chk-ev">${edSpan(`what_went_wrong.what_happened.root_causes.${i}.cause`, rc.cause)}</div>
            </div>
          </div>`).join('')}
      </div>` : '';

    // §2 removes the card-level Operational failure / SOP gap / Pattern /
    // Fixes blocks - those fields live on the issue they explain now. A draft
    // written before that still holds them at card level, and dropping them
    // would delete analysis someone wrote. They render as extra rows under the
    // LAST issue, at their own v3 paths so an edit still saves where the value
    // actually lives, and labelled so nobody reads them as issue-scoped.
    const _legacyRows = [
      ['what_went_wrong.what_happened.operational_failure', 'Operational failure', wh.operational_failure],
      ['what_went_wrong.what_happened.sop_gap',             'SOP / process gap',   wh.sop_gap],
      ['what_went_wrong.what_happened.pattern',             'Pattern',             wh.pattern],
      ['what_went_wrong.fixes.actions',                     'Fix',                 fx.actions],
    ].filter(([, , v]) => asPoints(v).length);
    const _spLegacy = asPoints(spx.detail).length || spx.escalated;
    const legacyExtras = (_legacyRows.length || _spLegacy) ? `
      <div class="wwr-blk" style="margin-top:10px">
        <span class="wwr-blk-label">From an earlier draft — not yet attached to an issue</span>
        ${_legacyRows.map(([path, label, v]) => asPoints(v).map((pt, n) => `
          <div class="wwr-aline">
            <span class="wwr-aline-key">${esc(label)}:</span>
            <span class="wwr-aline-val">${edSpan(
              Array.isArray(v) || asPoints(v).length > 1 ? `${path}.${n}` : path, pt)}</span>
          </div>`).join('')).join('')}
        ${_spLegacy ? `
          <div class="wwr-aline">
            <span class="wwr-aline-key">SP escalation:</span>
            <span class="wwr-aline-val">${edSpan('what_went_wrong.sp_escalation.escalated', spx.escalated || '—')}</span>
          </div>
          ${asPoints(spx.detail).map((d, n) => `
          <div class="wwr-aline">
            <span class="wwr-aline-key"></span>
            <span class="wwr-aline-val">${edSpan(`what_went_wrong.sp_escalation.detail.${n}`, d)}</span>
          </div>`).join('')}` : ''}
      </div>` : '';

    const wwrOpenAll = rowCount > 0 && Array.from({length: rowCount}, (_, i) => state.wwrOpen[i] !== false).every(Boolean);
    const wwrHtml = v3d.what_went_wrong ? `
    <div class="section" id="rca-wwr5-section">
      <div class="section-label">
        <span>What went wrong</span>
        <span class="hint">${rowCount} issue${rowCount === 1 ? '' : 's'} · ${
          (legacyPaired ? causesList.length
                        : gIssues.filter(g => g.root_cause).length + causesList.length)
        } root cause${((legacyPaired ? causesList.length : gIssues.filter(g => g.root_cause).length + causesList.length)) === 1 ? '' : 's'}</span>
        <button class="btn" style="margin-left:auto;font-size:11px;padding:2px 9px" data-wwr-all>${wwrOpenAll ? 'Collapse all' : 'Expand all'}</button>
        <span class="section-chev">▾</span>
      </div>
      ${wwrRows || '<div class="rca-empty">No guest issues were identified — re-run the RCA if the review names one.</div>'}
      ${orphanHtml}
      ${legacyExtras}
    </div>` : '';

    // Numbered stepper, same shape as the WWR chain - a reader follows the
    // case down the left rail. Strings from older drafts still render: the
    // leading "1." is stripped so the badge does not repeat it.
    // "Unknown" is the model's way of saying it could not date an event. It
    // is not a timestamp, so it should not be printed as one - an em-dash
    // says the same thing without looking like data.
    const flags = v3d.flags || [];
    // Grouped by owning team with counts, because a flat list of a dozen
    // flags on a complex case gives a reader no idea who has to act. Each
    // group collapses; each row is editable and removable, since a flag the
    // AI got wrong must be correctable by the person signing the RCA.
    const flagGroups = {};
    flags.forEach((f, i) => {
      const t = String(f.team || 'other').toUpperCase();
      (flagGroups[t] = flagGroups[t] || []).push({...f, _i: i});
    });
    const flagOrder = ['CE','RO','SP','CONTENT','TECH','OTHER'];
    const flagSecs = Object.keys(flagGroups).sort((a, b) => {
      const ia = flagOrder.indexOf(a), ib = flagOrder.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const flagsHtml = `
    <div class="section" id="rca-flags-section">
      <div class="section-label">Flags
        ${flags.length ? `<span class="sec-count">${flagSecs.map(t => flagGroups[t].length + ' ' + t).join(' · ')}</span>` : ''}
      <span class="section-chev">▾</span></div>
      ${flags.length === 0
        ? `<div class="field-block rca-empty">✓ Every QA area was checked and none needed raising.</div>`
        : `<div class="chk-groups">${flagSecs.map(t => `
            <div class="chk-group has-flags open" data-chk-section="${t}">
              <div class="chk-group-head" data-chk-group-toggle>
                <span class="chk-chevron">▸</span>
                <span>${t}</span>
                <span class="chk-gtag">${flagGroups[t].length} flag${flagGroups[t].length === 1 ? '' : 's'}</span>
              </div>
              <div class="chk-group-body">
                ${flagGroups[t].map(f => `
                  <div class="chk-row chk-flag">
                    <span class="chk-mark">⚠</span>
                    <div class="chk-item">
                      <!-- §8 the team is a closed list, so an invented value
                           cannot become a stray option on the control. -->
                      <select class="chip-sel chip-team-sel part"
                              data-v3sel="flags.${f._i}.team"
                              title="${esc(f.team_raw || f.team || 'OTHER')}">
                        ${['CE','RO','SP','CONTENT','PRODUCT','BIZ','TECH','OTHER'].map(o =>
                          `<option${String(f.team || 'OTHER').toUpperCase() === o ? ' selected' : ''}>${o}</option>`).join('')}
                      </select>
                      <span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag text"
                            data-flag-idx="${f._i}" data-flag-field="flag">${esc(f.flag)}</span>
                      <div class="chk-ev"><span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag evidence"
                            data-flag-idx="${f._i}" data-flag-field="evidence">${esc(f.evidence) || 'No evidence — click to add.'}</span>${f.zd_ref ? ' · ' + zdLink(f.zd_ref) : ''}</div>
                    </div>
                    <button class="row-del" data-flag-del="${f._i}" title="Remove flag">×</button>
                  </div>`).join('')}
              </div>
            </div>`).join('')}</div>`}
      <button class="row-add" data-flag-add>+ Add flag</button>
    </div>`;

    const sop = v3d.sop_compliance || null;
    const sopHtml = sop ? `
    <div class="section" id="rca-sop-section">
      <div class="section-label">SOP Compliance<span class="section-chev">▾</span></div>
      <div class="field-block rca-stack">
        <!-- §9 the same treatment as the WWR accuracy chip: one closed
             vocabulary, recolouring live. A select styled as a form control
             read as a setting; the verdict is a finding. -->
        <div><select class="chip-sel chip-sop-sel ${sop.verdict === 'followed' ? 'ok' : sop.verdict === 'deviated' ? 'bad' : 'unk'}"
              data-v3sel="sop_compliance.verdict">
            ${['followed','deviated','unknown'].map(o => `<option value="${o}"${(sop.verdict || 'unknown') === o ? ' selected' : ''}>${o[0].toUpperCase() + o.slice(1)}</option>`).join('')}
          </select>
          <span style="color:var(--muted-2);font-size:11px;margin-left:6px">${sop.dss_available ? 'DSS needle used' : 'no DSS row matched'}</span>
          ${sop.zd_ref ? ' · ' + zdLink(sop.zd_ref) : ''}</div>
        <div class="chk-ev"><strong>Expected:</strong> ${edSpan('sop_compliance.expected', sop.expected)}</div>
        <div class="chk-ev"><strong>Actual:</strong> ${edSpan('sop_compliance.actual', sop.actual)}</div>
        ${sop.detail ? `<div class="chk-ev">${edSpan('sop_compliance.detail', sop.detail)}</div>` : ''}
      </div>
    </div>` : '';

    _flagsHtml = flagsHtml;
    return tldrHtml + eventsTimelineHtml(r) + wwrHtml + sopHtml;
  })() : '';

  // ── v3 sections (legacy shape, gated on tldr presence) ────────────────────
  const v3Block = newShapeBlock ? newShapeBlock : (rca.tldr || (rca.wwrScenarios || []).length) ? `
    <div class="section" id="rca-wwr-section">
      <div class="section-label">What Went Wrong<span class="section-chev">▾</span></div>
      ${(rca.wwrScenarios || []).length ? `
      <div class="wwr-scenarios">
        ${rca.wwrScenarios.map((sc, i) => `
          <div class="wwr-scn ${sc.is_primary ? 'primary' : ''}" data-scn-idx="${i}">
            <div class="wwr-scn-head">
              <span class="wwr-scn-tag">${sc.is_primary ? 'PRIMARY' : 'overlay'}</span>
              <span class="wwr-scn-name">${sc.scenario_name || ''}</span>
            </div>
            <div class="wwr-scn-row">
              <span class="wwr-scn-k">Accurate?</span>
              <select class="classify-select" style="width:110px" data-scn-idx="${i}" data-scn-field="accuracy">
                ${['Yes','Partially','No'].map(o => `<option${(sc.accuracy||'')===o?' selected':''}>${o}</option>`).join('')}
              </select>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="accuracy_explanation">${sc.accuracy_explanation || ''}</span>
            </div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Why</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="why">${sc.why || ''}</span></div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Fix</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="fix">${sc.fix || ''}</span></div>
          </div>
        `).join('')}
      </div>` : `
      <div class="wwr-stepper">
        ${/* Legacy chain. Suppressed when v3 booking_logs exist: both render as
             the same numbered stepper, so a part-migrated draft showed two
             "what happened" narratives back to back. */
          ((v3d.booking_logs || []).length ? [] : (rca.wwrChain || [])).map((step, i) => `
          <div class="wwr-step" data-step="${i}">
            <div class="wwr-step-num">${step.step || (i + 1)}</div>
            <div class="wwr-step-body">
              <div class="wwr-what editable-text" contenteditable="true" spellcheck="false"
                   data-wwr-idx="${i}" data-wwr-field="what"><strong>${step.what || ''}</strong></div>
              <div class="wwr-why editable-text" contenteditable="true" spellcheck="false"
                   style="color:var(--muted-2)"
                   data-wwr-idx="${i}" data-wwr-field="why">${step.why || ''}</div>
            </div>
            <button class="action-delete-btn" data-wwr-delete="${i}" title="Remove step">×</button>
          </div>
        `).join('<div class="wwr-connector"></div>')}
      </div>
      <button class="action-add-btn" data-wwr-add>+ Add step</button>`}
    </div>



    <!-- The legacy checklist wall is gone. Its answers were "No" for "was
         there a tone problem?", i.e. No = no error, so rendering every No as
         a flag produced flags that contradicted their own evidence. Flags now
         come only from rca_v3.flags, which returns failures only. -->
  ` : '';

  col.innerHTML = `
    <!-- §14 one baseline-aligned row, not a two-line stack: the label and the
         sub-line cost ~34px at the top of every review. The dropped clause is
         not lost - it moves into the row's title, and the Send button's own
         card already says "goes out via Trustpilot on Send ↑". -->
    <div class="rca-head" title="Send marks the review as sent — paste the reply into Trustpilot manually">
      <div class="rca-title-row">
        <div class="rca-title">RCA &amp; response</div>
        <div class="rca-sub">Drafted by AI ${r.time || ''} · every field editable</div>
      </div>
      <div class="rca-head-actions">
        <button class="refresh-slack-btn" data-rca-only-regen
                title="One model call over the stored booking/timeline/insights — no re-matching, no BigQuery, no Zendesk.">↻ RCA only</button>
        <button class="btn copy-response-btn">Copy response</button>
        <button class="send-btn">Send ↑</button>
      </div>
    </div>

    <div class="rca-stack-outer">
    <div class="section">
      <div class="section-label"><span>Guest's stated issue</span><span class="section-chev">▾</span></div>
      <div class="stated-issue">
        <div class="stated-issue-text editable-text" contenteditable="true" spellcheck="false">${r.statedIssue || ''}</div>
