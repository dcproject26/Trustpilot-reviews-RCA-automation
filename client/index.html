        ${(r.statedIssue || '').trim() ? '' : `<div class="rca-empty">Nothing was extracted — click above to write the guest's issue in one line.</div>`}
      </div>
    </div>

    ${v3Block}
    ${isaBlock}

    <div class="section">
      <div class="section-label"><span>Guest ↔ support</span><span class="hint">${(v3d.support_interaction || []).length} contact${(v3d.support_interaction || []).length === 1 ? '' : 's'}</span><span class="section-chev">▾</span></div>
      ${sup}
    </div>

    ${true ? `
    <div class="section">
      <div class="section-label"><span>SP interaction</span><span class="hint">with the supply partner</span><span class="section-chev">▾</span></div>
      ${spInter || `<div class="interactions"><div class="interactions-empty">${spV3 && spV3.possible === false
            ? 'No SP interaction — escalation was not possible (' + esc(spV3.reason_if_not || 'vendor not partnered or opted out') + ').'
            : 'No SP interaction recorded. If escalation was possible, that is itself a gap worth flagging.'}</div></div>`}
    </div>
    ` : ''}

    ${_flagsHtml}

    <div class="section">
      <div class="section-label"><span>Area of improvement</span><span class="section-chev">▾</span></div>
      <!-- One pointer per line, editable in place. A single textarea invited
           the paragraph this section kept coming back as. -->
      <div class="field-block rca-points">
        ${asPoints(rca.areaOfImproving).length
          ? asPoints(rca.areaOfImproving).map((a, i) => `
            <div class="rca-point">
              <span class="rca-bullet">•</span>
              <span class="editable-text rca-ptext" contenteditable="true" spellcheck="false"
                    role="textbox" aria-label="Area of improvement point ${i + 1}"
                    data-aoi-idx="${i}">${esc(a)}</span>
              <button class="row-del" data-aoi-del="${i}" title="Remove">×</button>
            </div>`).join('')
          : `<div class="rca-empty">Nothing recorded yet — add a point, or re-run the RCA.</div>`}
        <button class="row-add" data-aoi-add>+ Add point</button>
      </div>
    </div>

    ${evidenceBlock}

    <div class="section">
      <div class="section-label"><span>Actions taken</span><span class="section-chev">▾</span></div>
      <div class="action-block">
        <div class="action-tabs">
          <button class="action-tab ${state.actionTab === 'sp' ? 'active' : ''}" data-tab="sp">SP <span class="count">${rca.actionsTaken.sp.length}</span></button>
          <button class="action-tab ${state.actionTab === 'customer' ? 'active' : ''}" data-tab="customer">Customer <span class="count">${rca.actionsTaken.customer.length}</span></button>
          <button class="action-tab ${state.actionTab === 'business' ? 'active' : ''}" data-tab="business">Business <span class="count">${rca.actionsTaken.business.length}</span></button>
          <button class="action-tab ${state.actionTab === 'ce' ? 'active' : ''}" data-tab="ce">CE <span class="count">${rca.actionsTaken.ce.length}</span></button>
          <button class="action-tab ${state.actionTab === 'product' ? 'active' : ''}" data-tab="product">Product <span class="count">${rca.actionsTaken.product.length}</span></button>
        </div>
        <div class="action-content">
          ${actions.length === 0
            ? `<div class="action-empty">No actions raised</div>`
            : actions.map((a, i) => `
                <div class="action-item" data-action-idx="${i}">
                  <button class="action-delete-btn" data-action-delete="${i}" title="Remove">×</button>
                  <div class="action-item-head">
                    <div class="action-raised-with">
                      <span class="action-edit" contenteditable="true" spellcheck="false">${a.with}</span>
                      <span class="action-sep"> · </span>
                      <span class="action-edit handle" contenteditable="true" spellcheck="false">${a.handle}</span>
                    </div>
                    <div class="action-time"><span class="action-edit" contenteditable="true" spellcheck="false">${a.time}</span></div>
                  </div>
                  <div class="action-context"><span class="action-edit" contenteditable="true" spellcheck="false">${a.context}</span></div>
                  <a class="action-where action-edit" contenteditable="true" spellcheck="false" href="#">${a.where}</a>
                </div>
              `).join('')}
          <button class="action-add-btn" data-add-action>+ Add action</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span>Resolution &amp; takedown</span><span class="section-chev">▾</span></div>
      <div class="wrapup-grid">
        <label class="wrapup-field">Resolution
          <textarea class="field-textarea" style="min-height:64px"
                    placeholder="Comp / refund / explanation offered to the guest">${esc(rca.resolution || '')}</textarea>
        </label>
        <label class="wrapup-field">Takedown request
          <select data-takedown-rec>
            ${(() => {
              const td = v3d.takedown || {};
              const cur = td.verdict || (td.recommended === true ? 'Yes' : td.recommended === false ? 'No' : 'No');
              return ['No','Yes','Untraceable'].map(o => `<option${cur === o ? ' selected' : ''}>${o}</option>`).join('');
            })()}
          </select>
        </label>
      </div>
      <!-- §12 DSS has a home instead of the "DSS row: — / —" stub. It is
           reference data, not analysis - an operator reads it to check their
           resolution against the playbook - so it is read-only until ✎ Edit.
           Never render "DSS row: — / —": with no classification there is
           nothing to look up, and the neutral empty state says that. -->
      ${(() => {
        const dss = v3d.dss || {};
        const row = [rca.issueL1, rca.issueL2, rca.subTheme].filter(Boolean).join(' / ');
        const src = dss.ref
          ? `<a class="dss-src" href="${esc(dss.ref)}" target="_blank" rel="noopener">dss</a>`
          : `<span class="dss-src">dss</span>`;
        return `<div class="dss-block">
          <div class="dss-head">
            <span class="dss-label">DSS</span>${src}
            <span class="dss-row">${row ? esc(row) : ''}</span>
            <button class="btn" style="font-size:11px;padding:2px 9px" data-dss-edit>${
              state.dssEdit ? '✓ Done' : '✎ Edit'}</button>
          </div>
          ${row ? `<div class="dss-panel"><span class="k">DSS says:</span> ${
            dss.prescribes
              ? (state.dssEdit ? edSpan('dss.prescribes', dss.prescribes) : esc(dss.prescribes))
              : `<span class="rca-empty">No DSS row was matched for this classification.</span>`
          }</div>`
          : `<div class="dss-panel"><span class="rca-empty">The review is not classified yet — there is no DSS row to look up.</span></div>`}
        </div>`;
      })()}
    </div>

    <div class="reply-block" id="rca-reply-section">
      <div class="reply-head">
        <span class="section-label" style="margin:0">Response to guest</span>
        <span class="hint" style="font-size:11px;color:var(--dim)">goes out via Trustpilot on Send ↑</span>
        <div class="reply-head-actions">
          <button data-reply-edit>✎ Edit</button>
          <button data-reply-copy>⧉ Copy</button>
          ${(r.lang || '').toUpperCase() !== 'EN'
            ? `<button data-reply-translate title="Translate the edited English reply into ${esc(r.lang)} — the language the guest wrote in">🌐 ${esc(r.lang)}</button>` : ''}
        </div>
      </div>
      <!-- No "Template: X" line. There is no separate drafting call any more:
           the reply comes from the RCA, written against this case's evidence,
           with the approved replies passed in as VOICE only. Naming one of
           them here would claim the reply was built from it. An old draft
           still carries a template_name in its column; rendering it would put
           that stale claim on a reply it had nothing to do with. -->
      <textarea class="reply-text" placeholder="AI-drafted response — edit as needed">${esc(rca.reply)}</textarea>
      <div class="reply-meta">
        <span>Editable — review before sending${(r.lang || '').toUpperCase() !== 'EN'
          ? ' · goes out in ' + esc(r.lang) : ''}</span>
        <span>${(rca.reply || '').length} chars</span>
      </div>
      ${state.replyTranslation[r.id] ? `
      <div class="translation-card" style="border-top:1px dashed var(--accent-bd)">
        <div class="translation-label" style="color:var(--accent)">${esc(r.lang)} — what the guest receives</div>
        <div class="translation-body" id="reply-translated">${esc(state.replyTranslation[r.id])}</div>
        <button class="btn" style="margin-top:8px;font-size:11px;padding:3px 10px"
                data-copy-translated>⧉ Copy ${esc(r.lang)} reply</button>
      </div>` : ''}
    </div>

    ${slackPost}

    </div>
  `;

  col.querySelectorAll('.action-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.actionTab = tab.dataset.tab;
      renderRcaCol();
    });
  });

  // ── v3 event handlers ──────────────────────────────────────────────────────

  // WWR chain — inline edits on what/why fields
  col.querySelectorAll('[data-wwr-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const idx = parseInt(el.dataset.wwrIdx);
      const field = el.dataset.wwrField;
      if (!rca.wwrChain[idx]) return;
      rca.wwrChain[idx][field] = el.textContent.trim();
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
    });
  });

  // WWR chain — delete step
  col.querySelectorAll('[data-wwr-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.wwrDelete);
      rca.wwrChain.splice(idx, 1);
      rca.wwrChain.forEach((s, i) => { s.step = i + 1; });
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
      renderRcaCol();
    });
  });

  // WWR chain — add step
  const wwrAddBtn = col.querySelector('[data-wwr-add]');
  if (wwrAddBtn) {
    wwrAddBtn.addEventListener('click', async () => {
      rca.wwrChain.push({step: rca.wwrChain.length + 1, what: 'New step', why: ''});
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
      renderRcaCol();
    });
  }

  // WWR scenario blocks — edits persist the whole array
  const persistWwrScenarios = async () => {
    await saveDraft(r.id, {wwr_scenarios: rca.wwrScenarios});
  };
  col.querySelectorAll('span[data-scn-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const sc = (rca.wwrScenarios || [])[parseInt(el.dataset.scnIdx)];
      if (!sc) return;
      sc[el.dataset.scnField] = el.textContent.trim();
      await persistWwrScenarios();
    });
  });
  col.querySelectorAll('select[data-scn-idx]').forEach(el => {
    el.addEventListener('change', async () => {
      const sc = (rca.wwrScenarios || [])[parseInt(el.dataset.scnIdx)];
      if (!sc) return;
      sc[el.dataset.scnField] = el.value;
      await persistWwrScenarios();
    });
  });

  // RCA Checklist — collapsible section groups
  col.querySelectorAll('[data-chk-group-toggle]').forEach(head => {
    head.addEventListener('click', () => {
      head.closest('.chk-group').classList.toggle('open');
    });
  });

  // Slack thread post — editable textarea: blur → persist override
  const slackArea = col.querySelector('[data-slack-edit]');
  if (slackArea) {
    slackArea.addEventListener('blur', async () => {
      const val = slackArea.value.trim();
      rca.slackThreadOverride = val;
      await saveDraft(r.id, {slack_thread_override: val});
    });
  }

  // Slack thread post — regenerate button: clear override, regenerate from RCA fields
  // Ticking a section regenerates the post text. It also clears any manual
  // override - otherwise the checkbox would appear to do nothing, because the
  // saved override wins over the generator.
  // Clearing the manual override is what makes a chip visibly do something:
  // a saved override wins over the generator, so without this the checkbox
  // would appear inert.
  const clearOverrideAndRender = async () => {
    if (rca.slackThreadOverride) {
      rca.slackThreadOverride = '';
      await saveDraft(r.id, {slack_thread_override: ''});
    }
    renderRcaCol();
  };
  const secAll = col.querySelector('[data-slack-sec-all]');
  if (secAll) secAll.addEventListener('click', async () => {
    state.slackSections[r.id] = {};          // {} means every section included
    await clearOverrideAndRender();
  });
  const secNone = col.querySelector('[data-slack-sec-none]');
  if (secNone) secNone.addEventListener('click', async () => {
    const off = {};
    _slackSectionKeys.forEach(([k]) => { off[k] = false; });
    state.slackSections[r.id] = off;
    await clearOverrideAndRender();
  });
  col.querySelectorAll('[data-slack-section]').forEach(cb => {
    cb.addEventListener('change', async () => {
      state.slackSections[r.id] = state.slackSections[r.id] || {};
      state.slackSections[r.id][cb.dataset.slackSection] = cb.checked;
      if (rca.slackThreadOverride) {
        rca.slackThreadOverride = '';
        await saveDraft(r.id, {slack_thread_override: ''});
      }
      renderRcaCol();
    });
  });

  // ── What went wrong: per-issue collapse, expand-all, add rows ──────────
  col.querySelectorAll('[data-wwr-toggle]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[contenteditable="true"], button, a')) return;
      const i = parseInt(el.dataset.wwrToggle);
      state.wwrOpen[i] = state.wwrOpen[i] === false;
      renderRcaCol();
    });
  });
  const wwrAll = col.querySelector('[data-wwr-all]');
  if (wwrAll) wwrAll.addEventListener('click', () => {
    const rows = col.querySelectorAll('[data-wwr-toggle]').length;
    const allOpen = Array.from({length: rows}, (_, i) => state.wwrOpen[i] !== false).every(Boolean);
    for (let i = 0; i < rows; i++) state.wwrOpen[i] = !allOpen;
    renderRcaCol();
  });
  // ── WWR issue internals ──────────────────────────────────────────────────
  // One accessor for every handler below. Nothing here branches on whether a
  // row came from the model or from a click - that was a real bug class: the
  // flag team-select once wrote only to operator-added rows, so on the common
  // case (AI-generated) the choice silently snapped back.
  const _gi = (i) => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    const list = w.guest_issues = w.guest_issues || [];
    return list[i] || (list[i] = {});
  };
  // Evidence is {text, source, ref} now; a legacy string is lifted on touch
  // rather than being left as a shape the row renderer has to special-case.
  const _ev = (gi) => {
    const raw = Array.isArray(gi.evidence) ? gi.evidence : asPoints(gi.evidence);
    return raw.map(e => (e && typeof e === 'object') ? e
                                                    : {text: e, source: null, ref: null});
  };

  col.querySelectorAll('[data-wwr-ev-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gi = _gi(parseInt(btn.dataset.wwrEvAdd));
      // The same field set as an existing row, with placeholder text - never
      // a bare box. A row you cannot tell from an AI one is the point.
      gi.evidence = [..._ev(gi), {text: 'New evidence — click to edit',
                                  source: null, ref: null}];
      await persistV3(); renderRcaCol();
    });
  });

  col.querySelectorAll('[data-ev-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, j] = btn.dataset.evDel.split(':').map(Number);
      const gi = _gi(i);
      gi.evidence = _ev(gi).filter((_, k) => k !== j);
      await persistV3(); renderRcaCol();
    });
  });

  // The claim × persists claim: null immediately - a real removal, not a UI
  // hide. "+ Claim" recreates the field.
  col.querySelectorAll('[data-claim-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      _gi(parseInt(btn.dataset.claimDel)).claim = null;
      await persistV3(); renderRcaCol();
    });
  });
  col.querySelectorAll('[data-claim-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      _gi(parseInt(btn.dataset.claimAdd)).claim = 'Quote the guest’s own words here';
      await persistV3(); renderRcaCol();
    });
  });

  // The four optional analysis lines. Deleting persists null and restores the
  // "+" button; adding creates the field with placeholder text.
  col.querySelectorAll('[data-aline-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, k] = btn.dataset.alineDel.split(':');
      _gi(parseInt(i))[k] = null;
      await persistV3(); renderRcaCol();
    });
  });
  const _APH = {
    operational_failure: 'What a person or system did wrong on this issue',
    sop_gap: 'The missing or deficient process step for this issue',
    pattern: 'Recurrence evidence for this issue, with counts and window',
    fix: 'Team: action (owner: Team)',
  };
  col.querySelectorAll('[data-aline-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, k] = btn.dataset.alineAdd.split(':');
      _gi(parseInt(i))[k] = _APH[k] || 'Click to edit';
      await persistV3(); renderRcaCol();
    });
  });

  // Every chip-select in the RCA column, by its rca_v3 dot path. One handler,
  // so a chip can never be rendered and silently unsaved.
  col.querySelectorAll('select[data-v3sel]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const parts = sel.dataset.v3sel.split('.');
      let obj = rca.v3;
      for (let n = 0; n < parts.length - 1; n++) {
        const key = /^\d+$/.test(parts[n]) ? parseInt(parts[n]) : parts[n];
        const nextIsIdx = /^\d+$/.test(parts[n + 1]);
        if (obj[key] == null) obj[key] = nextIsIdx ? [] : {};
        obj = obj[key];
      }
      const last = parts[parts.length - 1];
      obj[/^\d+$/.test(last) ? parseInt(last) : last] = sel.value;
      await persistV3(sel);
      renderRcaCol();          // the chip recolours live
    });
  });
  const wwrIssueAdd = col.querySelector('[data-wwr-issue-add]');
  if (wwrIssueAdd) wwrIssueAdd.addEventListener('click', async () => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    // §2c a FULL skeleton, not a stub: claim, one evidence row and a root
    // cause, all pre-filled. An added issue must be indistinguishable from an
    // AI-generated one - empty strings would render the add-buttons instead of
    // the rows, so the operator gets a different shape for the same thing.
    w.guest_issues = [...(w.guest_issues || []),
      {issue: 'New issue — click to edit',
       claim: 'Quote the guest’s own words here',
       claim_accuracy: 'Unknown', owner: 'CE',
       root_cause: 'Click to write the failing step',
       evidence: [{text: 'New evidence — click to edit', source: null, ref: null}]}];
    await persistV3(); renderRcaCol();
  });

  // ── Guest <-> support: per-contact expand ──────────────────────────────
  // "+ Add contact" writes a NOTE, not a frame. Frames are Zendesk-derived
  // facts the pipeline owns; an operator-added contact is by definition one
  // the system has no ticket for, so it renders unverified - which is the
  // honest label for it, not a downgrade.
  const contactAdd = col.querySelector('[data-contact-add]');
  if (contactAdd) contactAdd.addEventListener('click', async () => {
    rca.v3.support_interaction_notes = [...(rca.v3.support_interaction_notes || []),
      {zd_ref: null, summary: 'New contact — click to edit', detail: null, ce_miss: null}];
    rca.supportNotes = rca.v3.support_interaction_notes;
    await persistV3(); renderRcaCol();
  });

  const dssEdit = col.querySelector('[data-dss-edit]');
  if (dssEdit) dssEdit.addEventListener('click', () => {
    state.dssEdit = !state.dssEdit; renderRcaCol();
  });

  col.querySelectorAll('[data-ix-toggle]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[contenteditable="true"], button, a')) return;
      const i = parseInt(el.dataset.ixToggle);
      state.ixOpen[i] = !state.ixOpen[i];
      renderRcaCol();
    });
  });

  // ── Response card: Edit focuses the textarea, Copy flips for 1.5s ──────
  const replyArea = col.querySelector('.reply-text');
  const replyEdit = col.querySelector('[data-reply-edit]');
  if (replyEdit && replyArea) replyEdit.addEventListener('click', () => {
    replyArea.focus();
    replyArea.setSelectionRange(replyArea.value.length, replyArea.value.length);
  });
  // Edit in English, translate on the way out. Translating the EDITED text
  // (not the original draft) is the point: whatever the reviewer changed is
  // what the guest receives.
  const replyTr = col.querySelector('[data-reply-translate]');
  if (replyTr && replyArea) replyTr.addEventListener('click', async () => {
    const orig = replyTr.textContent;
    replyTr.disabled = true; replyTr.textContent = 'translating…';
    try {
      // Save the current English first, so the server translates what is
      // on screen rather than the last thing that happened to persist.
      await saveDraft(r.id, {final_response: replyArea.value});
      const resp = await fetch(`/api/reviews/${r.id}/translate-reply`, {method: 'POST'});
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || 'translation failed');
      state.replyTranslation[r.id] = data.text || '';
      renderRcaCol();
    } catch (e) {
      replyTr.textContent = String(e.message || e).slice(0, 40);
      setTimeout(() => { replyTr.disabled = false; replyTr.textContent = orig; }, 3000);
    }
  });

  const replyCopy = col.querySelector('[data-reply-copy]');
  if (replyCopy && replyArea) replyCopy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(replyArea.value); } catch (_) {}
    replyCopy.textContent = '✓ Copied';
    setTimeout(() => { replyCopy.textContent = '⧉ Copy'; }, 1500);
  });

  // Post the RCA into the review's own Slack thread. Separate from Send,
  // which also closes the review - the RCA usually goes to the team while
  // the guest reply is still being edited.
  const slackPostBtn = col.querySelector('[data-slack-post]');
  if (slackPostBtn && r.rcaPostedAt) {
    // Already in the thread. Say so rather than offering a fresh post — the
    // second copy is what people actually see, and nothing warned about it.
    slackPostBtn.textContent = '✓ Posted ' + _shortWhen(r.rcaPostedAt);
    slackPostBtn.classList.add('posted');
  }
  if (slackPostBtn) slackPostBtn.addEventListener('click', async () => {
    const orig = slackPostBtn.textContent;
    if (r.rcaPostedAt && !slackPostBtn.dataset.confirming) {
      slackPostBtn.dataset.confirming = '1';
      slackPostBtn.textContent = 'Post a second copy?';
      setTimeout(() => {
        delete slackPostBtn.dataset.confirming;
        slackPostBtn.textContent = orig;
      }, 4000);
      return;
    }
    const again = !!slackPostBtn.dataset.confirming;
    delete slackPostBtn.dataset.confirming;
    slackPostBtn.disabled = true; slackPostBtn.textContent = 'posting…';
    try {
      const resp = await fetch(`/api/reviews/${r.id}/post-rca${again ? '?force=true' : ''}`,
                               {method: 'POST'});
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || 'post failed');
      r.rcaPostedAt = data.posted_at || new Date().toISOString();
      slackPostBtn.textContent = data.already_posted
        ? '✓ Already posted ' + _shortWhen(r.rcaPostedAt)
        : '✓ Posted to thread';
      setTimeout(() => {
        slackPostBtn.disabled = false;
        slackPostBtn.textContent = '✓ Posted ' + _shortWhen(r.rcaPostedAt);
      }, 2500);
    } catch (e) {
      slackPostBtn.textContent = String(e.message || e).slice(0, 70);
      setTimeout(() => { slackPostBtn.disabled = false; slackPostBtn.textContent = orig; }, 4000);
    }
  });

  const copyTr = col.querySelector('[data-copy-translated]');
  if (copyTr) copyTr.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(state.replyTranslation[r.id] || ''); } catch (_) {}
    const o = copyTr.textContent; copyTr.textContent = '✓ Copied';
    setTimeout(() => { copyTr.textContent = o; }, 1500);
  });

  const rcaOnly = col.querySelector('[data-rca-only-regen]');
  if (rcaOnly) rcaOnly.addEventListener('click', async () => {
    const orig = rcaOnly.textContent;
    rcaOnly.disabled = true; rcaOnly.textContent = 'regenerating…';
    try {
      const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({scenarios: []}),
      });
      if (!resp.ok) throw new Error(await resp.text());
      await fetchInbox(); renderRcaCol();
    } catch (e) {
      rcaOnly.textContent = 'failed — see server log';
      setTimeout(() => { rcaOnly.disabled = false; rcaOnly.textContent = orig; }, 3000);
      return;
    }
  });

  const slackRegen = col.querySelector('[data-slack-regen]');
  if (slackRegen) {
    slackRegen.addEventListener('click', async () => {
      rca.slackThreadOverride = '';
      await saveDraft(r.id, {slack_thread_override: ''});
      // Re-render the whole column: the post must be rebuilt from the RCA
      // as it stands NOW, including edits saved since the last render. The
      // old handler wrote into a textarea the render then replaced, so
      // clicking it appeared to do nothing.
      renderRcaCol();
      const area = document.querySelector('[data-slack-edit]');
      if (area) flashSaved(area, true);
    });
  }

  // Issue-Specific Answers — select change → PATCH
  col.querySelectorAll('[data-isa-key]').forEach(sel => {
    sel.addEventListener('change', async () => {
      // Preserve the evidence - writing just the verdict would delete the
      // sourced proof the section exists to show.
      const _rest = sel.dataset.isaRest || '';
      rca.issueSpecificAnswers[sel.dataset.isaKey] =
        _rest ? `${sel.value} ${_rest}` : sel.value;
      await saveDraft(r.id, {issue_specific_answers: rca.issueSpecificAnswers});
    });
  });

  const subThemeSel = document.querySelector('[data-subtheme-select]');
  if (subThemeSel) {
    subThemeSel.addEventListener('change', async () => {
      const val = subThemeSel.value || null;
      rca.subTheme = val;
      if (await saveDraft(r.id, { sub_theme: val })) {
        fetchInbox().then(() => { renderInbox(); });
      }
    });
  }

  // Any scenario change (primary or overlays) re-runs the RCA against the
  // corrected checklists - the whole point of the field being editable.
  const regenStatus = col.querySelector('[data-scenario-regen-status]');
  // Persist the routing lists, then re-run the RCA against them. Saving
  // first matters: if generation fails the chips still reflect what the
  // person chose, instead of snapping back on the next render.
  const saveRouting = async () => {
    await saveDraft(r.id, {
      sub_themes: rca.subThemes || [],
      scenarios:  rca.scenarios || [],
      overlay_scenarios: rca.overlayScenarios || [],
    });
  };
  const regenRca = async () => {
    const scenarios = [...(rca.scenarios || []), ...(rca.overlayScenarios || [])].filter(Boolean);
    rca.primaryScenario = scenarios[0] || '';
    await saveRouting();
    if (!scenarios.length) { renderReviewCol(); return; }
    if (regenStatus) regenStatus.textContent = '⟳ re-running RCA for new scenarios…';
    try {
      const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarios }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'regen failed');
      rca.v3 = data.rca_v3 || {};
      rca.tldr = data.tldr || rca.tldr;
      rca.prevention = data.prevention || rca.prevention;
      rca.issueSpecificAnswers = data.issue_specific_answers || {};
      if (data.area_of_improving) rca.areaOfImproving = data.area_of_improving;
      rca.checklistAnswers = [];
      rca.primaryScenario = data.primary_scenario || rca.primaryScenario;
      rca.overlayScenarios = data.overlay_scenarios || rca.overlayScenarios;
      if (regenStatus) regenStatus.textContent = '';
      renderReviewCol(); renderRcaCol();
    } catch (e) {
      if (regenStatus) regenStatus.textContent = '✗ RCA re-run failed — scenario saved, try again';
      // Persist the routing itself even when generation failed
      await saveDraft(r.id, { primary_scenario: rca.primaryScenario || null });
    }
  };

  // Sub-themes, scenarios and overlays are all multi-value. Adding or
  // removing any of them saves the list and re-runs the RCA, because the
  // routing decides which scenario checklists and issue questions the model
  // answers - a chip that changed nothing downstream would be decoration.
  const bindChips = (addAttr, removeAttr, key) => {
    const add = document.querySelector(`[${addAttr}]`);
    if (add) add.addEventListener('change', () => {
      const val = add.value;
      if (!val) return;
      rca[key] = [...(rca[key] || []), val];
      regenRca();
    });
    document.querySelectorAll(`[${removeAttr}]`).forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset[removeAttr.replace(/^data-/, '')
          .replace(/-([a-z])/g, (_, c) => c.toUpperCase())]);
        rca[key] = (rca[key] || []).filter((_, i) => i !== idx);
        regenRca();
      });
    });
  };
  bindChips('data-scenario-add', 'data-scenario-remove', 'scenarios');
  bindChips('data-overlay-add',  'data-overlay-remove',  'overlayScenarios');
  // Sub-themes do not change the checklists, so they save without a re-run.
  const stAdd = document.querySelector('[data-subtheme-add]');
  if (stAdd) stAdd.addEventListener('change', async () => {
    if (!stAdd.value) return;
    rca.subThemes = [...(rca.subThemes || []), stAdd.value];
    rca.subTheme = rca.subThemes[0];
    await saveRouting(); renderReviewCol();
  });
  document.querySelectorAll('[data-subtheme-remove]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.subthemeRemove);
      rca.subThemes = (rca.subThemes || []).filter((_, i) => i !== idx);
      rca.subTheme = rca.subThemes[0] || null;
      await saveRouting(); renderReviewCol();
    });
  });

  // Visible confirmation after an inline edit persists. An edit that blurred
  // into silence gave the analyst no way to tell "saved" from "lost".
  const flashSaved = (el, ok = true) => {
    if (!el) return;
    const host = el.parentElement || el;
    // The tick is absolutely positioned, so its host must be a containing
    // block or it escapes to the page corner.
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    let tick = host.querySelector(':scope > .save-tick');
    if (!tick) {
      tick = document.createElement('span');
      tick.className = 'save-tick';
      host.appendChild(tick);
    }
    tick.textContent = ok ? '✓ saved' : '✗ not saved';
    tick.style.color = ok ? '' : '#e5534b';
    tick.classList.add('on');
    setTimeout(() => tick.classList.remove('on'), 1400);
  };

  // ── v3 object edits (flags, booking logs, takedown) ─────────────────────
  // These live inside rca_v3, not in columns of their own, so every edit
  // writes the whole object back. Re-render only on structural change
  // (add/delete); a text edit must NOT re-render or the caret is lost.
  const persistV3 = async (el) => {
    try {
      const resp = await fetch(`/api/reviews/${r.id}/draft-v2`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({rca_v3: rca.v3}),
      });
      flashSaved(el, resp.ok);
    } catch (_) { flashSaved(el, false); }   // keep the local edit; next change retries
  };

  col.querySelectorAll('[data-flag-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const f = (rca.v3.flags || [])[parseInt(el.dataset.flagIdx)];
      if (!f) return;
      f[el.dataset.flagField] = el.textContent.trim();
      await persistV3(el);
    });
  });
  col.querySelectorAll('[data-flag-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      rca.v3.flags = (rca.v3.flags || []).filter((_, i) => i !== parseInt(btn.dataset.flagDel));
      await persistV3(); renderRcaCol();
    });
  });
  const flagAdd = col.querySelector('[data-flag-add]');
  if (flagAdd) flagAdd.addEventListener('click', async () => {
    rca.v3.flags = [...(rca.v3.flags || []),
      {flag: 'New flag — click to edit', team: 'other', evidence: '', zd_ref: ''}];
    await persistV3(); renderRcaCol();
  });

  // The booking-timeline handlers used to live here, scoped to `col`. §13
  // moved the markup to the facts column, so these bound nothing - and a
  // second set of handlers for one control is how an edit gets saved twice.
  // They are delegated at document level now; see the listener near the top.

  const tdRec = col.querySelector('[data-takedown-rec]');
  if (tdRec) tdRec.addEventListener('change', async () => {
    rca.v3.takedown = {verdict: tdRec.value};
    await persistV3(tdRec);
  });

  // Generic path saver: every editable span carries data-v3p, a dot path
  // into rca.v3. One handler, so a field can never be rendered editable but
  // silently unsaved again - that is exactly what happened to TL;DR.
  col.querySelectorAll('[data-v3p]').forEach(el => {
    el.addEventListener('blur', async () => {
      const parts = el.dataset.v3p.split('.');
      let obj = rca.v3;
      for (let i = 0; i < parts.length - 1; i++) {
        const key = /^\d+$/.test(parts[i]) ? parseInt(parts[i]) : parts[i];
        const nextIsIdx = /^\d+$/.test(parts[i + 1]);
        // Old drafts store some list fields as one string; renderers
        // normalise via asPoints, so writes must do the same or the path
        // indexes into a string and the edit corrupts it.
        if (typeof obj[key] === 'string' && nextIsIdx) obj[key] = asPoints(obj[key]);
        if (obj[key] == null) obj[key] = nextIsIdx ? [] : {};
        obj = obj[key];
      }
      const last = parts[parts.length - 1];
      const txt = el.textContent.trim();
      // Untouched placeholder is not a value.
      if (el.dataset.ph && txt === el.dataset.ph) return;
      obj[/^\d+$/.test(last) ? parseInt(last) : last] = txt;
      el.classList.remove('is-placeholder');
      delete el.dataset.ph;
      await persistV3(el);
    });
  });

  const spRaised = col.querySelector('[data-sp-raised]');
  if (spRaised) spRaised.addEventListener('change', async () => {
    rca.v3.sp_interaction = {...(rca.v3.sp_interaction || {}), raised: spRaised.value};
    await persistV3(spRaised);
  });
  const spRecAdd = col.querySelector('[data-sp-rec-add]');
  if (spRecAdd) spRecAdd.addEventListener('click', async () => {
    const sp = rca.v3.sp_interaction || {};
    sp.records = [...(sp.records || []), {time: '', summary: 'New record — click to edit', zd_ref: ''}];
    rca.v3.sp_interaction = sp;
    await persistV3(); renderRcaCol();
  });

  // ── Collapsible sections ────────────────────────────────────────────────
  // Applied after render rather than in each template, so every section gets
  // it and none can be forgotten. Keyed by label text so the open/closed
  // state survives re-renders and review switches.
  col.querySelectorAll('.section').forEach(sec => {
    const label = sec.querySelector('.section-label');
    if (!label || label.querySelector('.section-chev')) return;
    // Key on the section's id, not its label text. The label carries live
    // counts ("What Happened AI 6 events", "Flags AI 1 CE · 1 CONTENT"), so
    // a text key changed whenever the data changed - and because this state
    // is shared across reviews, collapsing a section on one review left it
    // collapsed on all of them. A populated timeline then rendered as a bare
    // heading, which is indistinguishable from having no timeline at all.
    // Only 9 of 32 sections carry an id, so the fallback has to be stable on
    // its own: drop the live count and the AI mark before reading the text.
    const stableLabel = () => {
      const c = label.cloneNode(true);
      c.querySelectorAll('.sec-count, .ai-tag-inline, .section-chev')
       .forEach(n => n.remove());
      return (c.textContent || '').replace(/\s+/g, ' ').trim();
    };
    const key = sec.id || stableLabel();
    if (!key) return;
    const chev = document.createElement('span');
    chev.className = 'section-chev';
    chev.textContent = '▾';
    label.appendChild(chev);
    if (state.collapsed[key]) sec.classList.add('is-collapsed');
    label.addEventListener('click', ev => {
      // Never swallow a click meant for a control inside the head.
      if (ev.target.closest('input, select, button, [contenteditable="true"], a')) return;
      const now = !sec.classList.contains('is-collapsed');
      sec.classList.toggle('is-collapsed', now);
      state.collapsed[key] = now;
    });
  });

  // Issue-answer evidence edits: recombine verdict + evidence and save.
  col.querySelectorAll('[data-isa-evidence]').forEach(el => {
    el.addEventListener('blur', async () => {
      const key = el.dataset.isaEvidence;
      const rest = el.textContent.trim();
      const cur = String(rca.issueSpecificAnswers[key] || '');
      const m = cur.match(/^\s*(Yes|No|Unknown|N\/A)\b[:\s—-]*/i);
      rca.issueSpecificAnswers[key] = m ? `${m[1]} ${rest}` : rest;
      const sel = col.querySelector(`[data-isa-key="${key}"]`);
      if (sel) sel.dataset.isaRest = rest;
      try {
        const resp = await fetch(`/api/reviews/${r.id}/draft-v2`, {
          method: 'PATCH', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({issue_specific_answers: rca.issueSpecificAnswers}),
        });
        flashSaved(el, resp.ok);
      } catch (_) { flashSaved(el, false); }
    });
  });

  const persistAoi = async (list, el) => {
    rca.areaOfImproving = list;
    try {
      const resp = await fetch(`/api/reviews/${r.id}/draft-v2`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({area_of_improving: list}),
      });
      flashSaved(el, resp.ok);
    } catch (_) { flashSaved(el, false); }
  };
  col.querySelectorAll('[data-aoi-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.aoiDel);
      await persistAoi(asPoints(rca.areaOfImproving).filter((_, i) => i !== idx));
      renderRcaCol();
    });
  });
  const aoiAdd = col.querySelector('[data-aoi-add]');
  if (aoiAdd) aoiAdd.addEventListener('click', async () => {
    await persistAoi([...asPoints(rca.areaOfImproving), 'New point — click to edit']);
    renderRcaCol();
  });

  // AOI pointers: save the whole list on blur.
  col.querySelectorAll('[data-aoi-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const list = Array.from(col.querySelectorAll('[data-aoi-idx]'))
        .map(x => x.textContent.trim()).filter(Boolean);
      await persistAoi(list, el);
    });
  });

  // Persist Actions Taken as the objects they are.
  //
  // This used to flatten every action in every tab to a single string -
  // a.context || a.with - and save that. The renderer reads a.with, a.handle,
  // a.time and a.where, and toItems() blanks all four when it reads a string
  // back. So adding, editing or deleting ONE action destroyed who every other
  // action was raised with, when, and its Slack link, across all five tabs,
  // silently and permanently. The Slack permalink that flag-to-biz writes went
  // the same way on the next edit.
  const persistActions = async () => {
    const full = {};
    for (const tab of ['sp', 'customer', 'business', 'ce', 'product']) {
      full[tab] = (rca.actionsTaken[tab] || [])
        .map(a => ({
          with:    (a.with    || '').trim(),
          handle:  (a.handle  || '').trim(),
          time:    (a.time    || '').trim(),
          context: (a.context || '').trim(),
          where:   (a.where   || '').trim(),
        }))
        .filter(a => a.with || a.context);
    }
    try {
      const ok = await saveDraft(r.id, {actions_taken: full});
      if (!ok) throw new Error('rejected');
    } catch (e) {
      // A failed save used to be swallowed, so the edit looked saved and was
      // gone on reload. Say so.
      console.warn('actions_taken save failed', e);
      const tabsEl = col.querySelector('.action-tabs');
      if (tabsEl && !tabsEl.querySelector('.save-failed')) {
        const w = document.createElement('span');
        w.className = 'save-failed';
        w.style.cssText = 'font-size:11px;color:var(--red);margin-left:6px';
        w.textContent = 'not saved — reload before editing further';
        tabsEl.appendChild(w);
      }
    }
  };

  col.querySelectorAll('[data-add-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      rca.actionsTaken[state.actionTab].push({
        with: 'New action',
        handle: '@handle',
        time: 'Today',
        context: 'Click to edit context',
        where: 'link.example.com',
      });
      await persistActions();
      renderRcaCol();
    });
  });

  col.querySelectorAll('[data-action-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.actionDelete);
      rca.actionsTaken[state.actionTab].splice(idx, 1);
      await persistActions();
      renderRcaCol();
    });
  });

  // Inline edits on action fields → update model + persist on blur
  col.querySelectorAll('.action-item .action-edit').forEach(el => {
    el.addEventListener('blur', async () => {
      const item = el.closest('.action-item');
      if (!item) return;
      const idx = parseInt(item.dataset.actionIdx);
      const a = (rca.actionsTaken[state.actionTab] || [])[idx];
      if (!a) return;
      if (el.classList.contains('action-where'))      a.where   = el.textContent.trim();
      else if (el.classList.contains('handle'))       a.handle  = el.textContent.trim();
      else if (el.closest('.action-context'))         a.context = el.textContent.trim();
      else if (el.closest('.action-time'))            a.time    = el.textContent.trim();
      else                                            a.with    = el.textContent.trim();
      await persistActions();
    });
  });

  col.querySelectorAll('[data-toggle-frame]').forEach(btn => {
    btn.addEventListener('click', () => {
      const frame = btn.closest('.convo-frame');
      frame.classList.toggle('open');
    });
  });

  // ── Copy response button ───────────────────────────────────────────────────
  const copyResponseBtn = col.querySelector('.copy-response-btn');
  if (copyResponseBtn) {
    copyResponseBtn.addEventListener('click', () => {
      const replyText = col.querySelector('.reply-text');
      const text = replyText ? replyText.value : (rca.reply || '');
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = copyResponseBtn.textContent;
        copyResponseBtn.textContent = '✓ Copied!';
        copyResponseBtn.disabled = true;
        setTimeout(() => {
          copyResponseBtn.textContent = orig;
          copyResponseBtn.disabled = false;
        }, 2000);
      }).catch(() => {
        copyResponseBtn.textContent = '✗ Failed';
        setTimeout(() => { copyResponseBtn.textContent = 'Copy response'; }, 2000);
      });
    });
  }

  // ── Send button — marks the review sent, and posts the RCA if nothing has ─
  // This comment used to say "no Slack post", which was simply untrue: /send
  // has always posted the RCA into the review's thread. That is why using
  // "Post to thread" and then Send put the same RCA in the thread twice. The
  // server now posts here only when rca_posted_at is unset.
  const sendBtn = col.querySelector('.send-btn');
  if (sendBtn) {
    sendBtn.addEventListener('click', async () => {
      if (sendBtn.disabled) return;
      sendBtn.disabled = true;
      sendBtn.textContent = '⟳ Sending…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/send`, { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        sendBtn.textContent = '✓ Sent';
        r.status = 'sent';
        renderInbox();
      } catch (e) {
        sendBtn.textContent = '✗ Error';
        sendBtn.disabled = false;
        setTimeout(() => {
          sendBtn.textContent = 'Send ↑';
          sendBtn.disabled = false;
        }, 3000);
      }
    });
  }

}

function openFlagDraftModal(r) {
  // Remove any existing modal
  const existing = document.getElementById('flag-modal');
  if (existing) existing.remove();

  // The four facts Biz acts on are their own fields now, prefilled from the
  // booking and editable before sending. They used to be baked into the
  // message text, where correcting a wrong TGID meant editing prose and the
  // numbers that actually went out were whatever survived that edit.
  const _pctFromInsights = () => {
    const v = String((r.insights?.completion?.value) ?? '').replace('%', '').trim();
    return v && !isNaN(parseFloat(v)) ? parseFloat(v) : '';
  };
  const defaultMsg = `Flagging low completion rate for review.\n\nFlagged from review BID ${r.booking.bid} — guest reported ${(r.rca.issueL2 || '').toLowerCase()}. Window: ${state.insightsWindow}. Please review supply allocation and consider raising completion to market rate.`;

  const modal = document.createElement('div');
  modal.id = 'flag-modal';
  modal.className = 'flag-modal-backdrop';
  modal.innerHTML = `
    <div class="flag-modal">
      <div class="flag-modal-head">
        <div class="flag-modal-title">Draft Slack message to Biz team</div>
        <button class="flag-modal-close" data-close-modal>×</button>
      </div>
      <div class="flag-modal-body">
        <!-- One destination, always: the review's own Slack thread, the same
             thread the RCA goes into. There was a channel field here defaulting
             to #biz-supply-ops, a channel that does not exist in the workspace,
             so anything that ever fell back to it went nowhere while the UI
             reported success. -->
        <div class="flag-modal-row">
          <label>Goes to</label>
          <div class="flag-dest">This review's Slack thread — same place as the RCA</div>
        </div>
        <div class="flag-modal-row">
          <label>Tag</label>
          <input type="text" class="flag-input" id="flag-tag" placeholder="who to tag" />
        </div>
        <div class="flag-modal-row">
          <label>Completion rate</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" class="flag-input" id="flag-completion"
                   step="0.1" min="0" max="100" style="width:110px"
                   value="${_pctFromInsights()}" />
            <span style="font-family:var(--mono);color:var(--dim)">%</span>
          </div>
        </div>
        <div class="flag-modal-row">
          <label>TGID · TID · VID</label>
          <div style="display:flex;gap:6px">
            <input type="text" class="flag-input" id="flag-tgid" placeholder="TGID"
                   style="flex:1;min-width:0" value="${esc(r.booking.tgid || '')}" />
            <input type="text" class="flag-input" id="flag-tid" placeholder="TID"
                   style="flex:1;min-width:0" value="${esc(r.booking.tid || '')}" />
            <input type="text" class="flag-input" id="flag-vid" placeholder="VID"
                   style="flex:1;min-width:0" value="${esc(r.booking.vid || '')}" />
          </div>
          <div class="flag-hint">Prefilled from the matched booking — correct them here if wrong.</div>
        </div>
        <div class="flag-modal-row">
          <label>Message</label>
          <textarea class="flag-textarea" id="flag-message">${defaultMsg}</textarea>
        </div>
      </div>
      <div class="flag-modal-actions">
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn primary" id="flag-send-btn">Send to Slack ↑</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => modal.remove());
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
  // This used to build a local actions_taken entry, set flagged = true in
  // memory and close — without ever calling the server. The button said
  // "✓ Flagged · sent to Slack" and no Slack message was ever posted by it.
  // The endpoint existed and worked the whole time; nothing called it.
  const flagSend = modal.querySelector('#flag-send-btn');
  flagSend.addEventListener('click', async () => {
    const tag = modal.querySelector('#flag-tag').value;
    const message = modal.querySelector('#flag-message').value;
    const completion_rate = modal.querySelector('#flag-completion').value;
    const tgid = modal.querySelector('#flag-tgid').value.trim();
    const tid  = modal.querySelector('#flag-tid').value.trim();
    const vid  = modal.querySelector('#flag-vid').value.trim();
    if (!message.trim()) { flagSend.textContent = 'Write a message first'; return; }
    const orig = flagSend.textContent;
    flagSend.disabled = true; flagSend.textContent = 'sending…';
    try {
      const res = await fetch(`/api/reviews/${r.id}/flag-to-biz`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tag, message, send: true,
                              completion_rate: completion_rate === '' ? null
                                               : parseFloat(completion_rate),
                              tgid, tid, vid}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Slack rejected the post');
      // The server owns this now — actions_taken.business gets its entry
      // there, so it survives a reload instead of living in this tab.
      r.flagToBizState = 'sent';
      modal.remove();
      state.actionTab = 'business';
      await fetchInbox();
      renderRcaCol();
      renderReviewCol();
    } catch (e) {
      flagSend.disabled = false;
      flagSend.textContent = String(e.message || e).slice(0, 60);
      setTimeout(() => { flagSend.textContent = orig; }, 4000);
    }
  });
}


// ── Add review manually ───────────────────────────────────────────────────────
function openManualReviewModal() {
  const existing = document.getElementById('manual-review-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'manual-review-modal';
  modal.className = 'flag-modal-backdrop';
  modal.innerHTML = `
    <div class="flag-modal" style="max-width:520px">
      <div class="flag-modal-head">
        <div class="flag-modal-title">Add review manually</div>
        <button class="flag-modal-close" data-close-modal>×</button>
      </div>
      <div class="flag-modal-body">
        <div class="flag-modal-row">
          <label>Review text <span style="color:var(--red)">*</span></label>
          <textarea class="flag-textarea" id="mr-body" rows="5"
            placeholder="Paste the Trustpilot review here…" style="min-height:110px"></textarea>
        </div>
        <div class="flag-modal-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label>Author name</label>
            <input type="text" class="flag-input" id="mr-author" placeholder="e.g. Marcus T." />
          </div>
          <div>
            <label>Booking ref (BID)</label>
            <input type="text" class="flag-input" id="mr-ref" placeholder="e.g. 31055920" />
          </div>
        </div>
        <div class="flag-modal-row">
          <label>Rating</label>
          <div style="display:flex;gap:6px;align-items:center;margin-top:4px" id="mr-stars-row">
            ${[1,2,3,4,5].map(n => `
              <button data-star="${n}" style="
                background:transparent;border:none;cursor:pointer;
                font-size:20px;color:var(--dim);padding:2px;
                transition:color 0.1s ease;line-height:1
              ">★</button>
            `).join('')}
            <span id="mr-stars-label" style="font-size:11px;color:var(--muted-2);margin-left:4px;font-family:var(--mono)">1 star</span>
          </div>
        </div>
        <div id="mr-error" style="display:none;color:var(--red);font-size:11.5px;padding:6px 0"></div>
      </div>
      <div class="flag-modal-actions">
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn primary" id="mr-submit-btn">Submit · run pipeline</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  // Star picker logic
  let selectedRating = 1;
  const starBtns = modal.querySelectorAll('[data-star]');
  const starsLabel = modal.querySelector('#mr-stars-label');
  function setRating(n) {
    selectedRating = n;
    starsLabel.textContent = n === 1 ? '1 star' : `${n} stars`;
    starBtns.forEach(b => {
      const v = parseInt(b.dataset.star);
      b.style.color = v <= n ? 'var(--amber)' : 'var(--dim)';
    });
  }
  setRating(1);
  starBtns.forEach(b => {
    b.addEventListener('mouseenter', () => {
      starBtns.forEach(x => {
        x.style.color = parseInt(x.dataset.star) <= parseInt(b.dataset.star)
          ? 'var(--amber)' : 'var(--dim)';
      });
    });
    b.addEventListener('mouseleave', () => setRating(selectedRating));
    b.addEventListener('click', () => setRating(parseInt(b.dataset.star)));
  });

  // Close handlers
  modal.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => modal.remove());
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

  // Submit
  const submitBtn = modal.querySelector('#mr-submit-btn');
  submitBtn.addEventListener('click', async () => {
    const body = modal.querySelector('#mr-body').value.trim();
    const author = modal.querySelector('#mr-author').value.trim() || null;
    const ref = modal.querySelector('#mr-ref').value.trim() || null;
    const errEl = modal.querySelector('#mr-error');

    if (!body) {
      errEl.textContent = 'Review text is required.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '⟳ Submitting…';

    try {
      const res = await fetch('/api/reviews/manual', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          body,
          author,
          rating: selectedRating,
          reference_number: ref,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      submitBtn.textContent = '✓ Submitted · pipeline running…';

      // Refresh inbox after a short delay, then keep polling until the new review appears
      await fetchInbox();
      await loadDraftOverlays();
      renderInbox();

      // Switch to the correct tab and select the new review
      const newId = data.review_id;
      if (newId) {
        const rev = REVIEWS.find(r => r.id === newId);
        if (rev) {
          state.filter = rev.type === 'identified' ? 'identified'
            : rev.type === 'candidates' ? 'candidates'
            : rev.type === 'untraceable' ? 'untraceable'
            : 'identified';
          state.selected = newId;
          document.querySelectorAll('.inbox-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.tab === state.filter));
          renderInbox();
          renderReviewCol();
          renderRcaCol();
        }
      }

      setTimeout(() => modal.remove(), 800);
    } catch (e) {
      errEl.textContent = `Error: ${e.message}`;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit · run pipeline';
    }
  });

  // Focus the textarea
  setTimeout(() => modal.querySelector('#mr-body').focus(), 50);
}

document.querySelector('.add-manual-btn').addEventListener('click', openManualReviewModal);

document.querySelectorAll('.inbox-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.filter = tab.dataset.tab;
    document.querySelectorAll('.inbox-tab').forEach(t => t.classList.toggle('active', t === tab));
    // Auto-select first in tab
    const inTab = REVIEWS.filter(r => {
      if (state.filter === 'identified') return r.type === 'identified' && r.status !== 'sent';
      if (state.filter === 'candidates') return r.type === 'candidates';
      if (state.filter === 'untraceable') return r.type === 'untraceable';
      if (state.filter === 'sent') return r.status === 'sent';
      return false;
    });
    state.selected = inTab[0]?.id || null;
    renderInbox();
    renderReviewCol();
    renderRcaCol();
  });
});

// "None of these → Untraceable" — the candidate list was wrong. Clears the
// candidates server-side and moves the review to the Untraceable tab, so nobody
// confirms a wrong booking later.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-mark-untraceable]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Moving…';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/mark-untraceable`, {method: 'POST'});
    if (!resp.ok) throw new Error('mark-untraceable failed');
    r.type            = 'untraceable';
    r.matchTier       = null;
    r.tier            = 'T—';
    r.candidatesList  = [];
    r.booking         = r.booking || {};
    r.booking.bid     = '';
    r.matchTitle      = 'Untraceable — no booking matched';
    r.matchMethod     = 'Marked untraceable by associate';
    await fetchInbox();
    await loadDraftOverlays();
    renderInbox(); renderReviewCol(); renderRcaCol();
  } catch (e) {
    btn.textContent = 'Failed — retry';
    btn.disabled = false;
    return;
  }
  btn.textContent = orig;
  btn.disabled = false;
});



// ⟳ Fix incomplete — re-run every review missing a match or an RCA.
// The job runs on the server and its progress is polled, so closing this tab
// or reloading does not lose the run; the bar reattaches to whatever is
// already in flight.
let _bulkTimer = null;

function _bulkRender(st) {
  const bar = document.getElementById('bulk-bar');
  const fill = document.getElementById('bulk-fill');
  const text = document.getElementById('bulk-text');
  if (!bar || !fill || !text) return;
  const total = st.total || 0;
  const done = st.done || 0;
  if (!total || (!st.running && !st.finished_at)) { bar.hidden = true; return; }
  bar.hidden = false;
  fill.style.width = total ? `${Math.round((done / total) * 100)}%` : '0%';
  const eta = (st.eta_s != null && st.running)
    ? ` · ~${st.eta_s < 60 ? st.eta_s + 's' : Math.ceil(st.eta_s / 60) + 'm'} left` : '';
  const failed = st.failed ? ` · <span class="err">${st.failed} failed</span>` : '';
  text.innerHTML = st.running
    ? `re-running ${done}/${total}${eta} · ${st.current ? st.current.slice(0, 22) : 'starting'}${failed}`
    : `finished ${done}/${total}${failed}`;
  const cancel = document.getElementById('bulk-cancel');
  if (cancel) cancel.style.display = st.running ? '' : 'none';
}

async function pollBulk(reloadInbox) {
  try {
    const st = await (await fetch('/api/reviews/bulk-status')).json();
    _bulkRender(st);
    if (st.running) {
      if (!_bulkTimer) _bulkTimer = setInterval(() => pollBulk(true), 4000);
      if (reloadInbox) {
        await fetchInbox(); await loadDraftOverlays(); renderInbox();
      }
    } else if (_bulkTimer) {
      clearInterval(_bulkTimer);
      _bulkTimer = null;
      // One last reload so finished work is on screen. The summary stays up
      // for a while rather than vanishing from under the reader.
      await fetchInbox(); await loadDraftOverlays();
      renderInbox(); renderReviewCol(); renderRcaCol();
      const failed = (st.results || []).filter(x => !x.ok);
      if (failed.length) console.warn('[bulk] failures:', failed);
      setTimeout(() => {
        const b = document.getElementById('bulk-bar');
        if (b && !_bulkTimer) b.hidden = true;
      }, 20000);
    }
  } catch (e) { /* a failed poll is not a reason to tear the bar down */ }
}

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-rerun-all]');
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⟳ starting…';
  try {
    const resp = await fetch('/api/reviews/reprocess-all?tab=incomplete',
                             {method: 'POST'});
    const data = await resp.json();
    btn.textContent = data.already_running ? '⟳ already running'
                    : !data.queued          ? '⟳ nothing to fix'
                    : `⟳ ${data.queued} queued`;
    _bulkRender(data);
    pollBulk(false);
  } catch (e) {
    btn.textContent = '⟳ failed — retry';
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
});

document.addEventListener('click', async (ev) => {
  if (!ev.target.closest('#bulk-cancel')) return;
  try {
    await fetch('/api/reviews/bulk-cancel', {method: 'POST'});
    const t = document.getElementById('bulk-text');
    if (t) t.textContent = 'cancelling after the running reviews finish…';
  } catch (e) { /* the next poll shows the true state */ }
});

// ↻ Refresh — pull Trustpilot reviews from Slack that never reached the
// webhook, and pipeline them. Delegated so it survives inbox re-renders.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-refresh-slack]');
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '↻ checking Slack…';
  try {
    const resp = await fetch('/api/reviews/refresh-slack?hours=72', {method: 'POST'});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'refresh failed');
    if (data.queued > 0) {
      btn.textContent = `↻ ${data.queued} new — processing…`;
      // Each queued review runs its pipeline in the background; poll a few
      // times so cards appear as their runs land rather than on next reload.
      for (let i = 0; i < 10; i++) {
        await new Promise(res => setTimeout(res, 3000));
        await fetchInbox();
        await loadDraftOverlays();
        renderInbox();
      }
      btn.textContent = `↻ ${data.queued} added`;
    } else {
      btn.textContent = data.trustpilot_found
        ? `↻ up to date (${data.trustpilot_found} found)`
        : '↻ nothing new in Slack';
    }
  } catch (e) {
    btn.textContent = '↻ failed — retry';
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
});

// ↻ Re-run matching — one delegated handler covers the Booking Match header
// button and the Untraceable panel button. Re-runs the FULL pipeline for the
// selected review, then reloads when the fresh result lands.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-rerun-match]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⟳ Re-running…';
  let before = null;
  try {
    const pre = await fetch(`/api/reviews/${r.id}`);
    if (pre.ok) before = ((await pre.json()).draft || {}).generated_at || null;
  } catch (_) {}
  try {
    const resp = await fetch(`/api/reviews/${r.id}/reprocess`, {method: 'POST'});
    if (!resp.ok) throw new Error('reprocess failed');
  } catch (e) {
    btn.disabled = false; btn.textContent = '✗ Failed — try again';
    return;
  }
  let polls = 0;
  const poll = setInterval(async () => {
    polls++;
    try {
      const check = await fetch(`/api/reviews/${r.id}`);
      if (check.ok) {
        const d = (await check.json()).draft;
        if (d && d.generated_at && d.generated_at !== before) {
          clearInterval(poll);
          await fetchInbox();
          await loadDraftOverlays();
          renderInbox(); renderReviewCol(); renderRcaCol();
          return;
        }
      }
    } catch (_) {}
    // Name the stage on the button. generated_at stays the completion signal
    // (it survives a server restart; the in-process progress entry does not),
    // so this is display only - if the progress endpoint has nothing, keep
    // the generic spinner rather than concluding anything from its silence.
    try {
      const pr = await fetch(`/api/reviews/${r.id}/progress`);
      if (pr.ok) {
        const p = await pr.json();
        if (p.running) {
          const m = String(Math.floor(p.elapsed_s / 60));
          const sec = String(p.elapsed_s % 60).padStart(2, '0');
          btn.textContent = `⟳ ${p.step}/${p.total} ${p.stage} · ${m}:${sec}`;
        }
      }
    } catch (_) {}
    // A full run is matching + Zendesk + insights + RCA generation + response
    // draft, which is a dozen sequential Claude calls. Three minutes was often
    // shorter than the run, so the poll gave up while the pipeline was still
    // working -- the result landed in the database and the dashboard never
    // showed it, which reads exactly like "re-run did nothing".
    if (polls > 200) {  // ~10 min
      clearInterval(poll);
      // Refresh anyway. Giving up used to just re-enable the button, so a run
      // that finished slightly after the deadline left the old result on screen
      // with nothing to say the data underneath had changed.
      try {
        await fetchInbox();
        await loadDraftOverlays();
        renderInbox(); renderReviewCol(); renderRcaCol();
      } catch (_) {}
      btn.disabled = false; btn.textContent = orig;
    }
  }, 3000);
});

renderInbox();
renderReviewCol();
renderRcaCol();
</script>
<div id="build-stamp" title="build the page and server are running"></div>
<script>
// Which build is on screen. Several hours were lost to a cached page talking
// to a new server and to a new page talking to an old server, both of which
// look exactly like a broken feature. If these two disagree, or either is
// stale, that is the answer and nothing else needs debugging.
(async () => {
  try {
    const r = await fetch('/api/version', {cache: 'no-store'});
    if (!r.ok) return;
    const v = await r.json();
    const el = document.getElementById('build-stamp');
    if (!el) return;
    // Say which server this page is talking to, not just which commit. A
    // deployment is a frozen snapshot that a git pull does not touch, so
    // reading one while pulling into the repl looks like every fix failing.
    const env = v.environment || '?';
    // v.stale is the server comparing the code it LOADED against the files on
    // disk. Do not recompute it here from anything this page knows - the page
    // is as old as the server that sent it.
    el.textContent = 'build ' + (v.short || '?') + ' · ' + env
                   + (v.stale ? ' · STALE' : '');
    if (v.stale) el.classList.add('is-stale');
    el.title = 'server ' + (v.commit || '') + '\nenvironment: ' + env
             + '\nreload: ' + (v.reload ? 'on' : 'off')
             + '\nup ' + (v.uptime_s || 0) + 's'
             + (env === 'deployment'
                ? '\n\nThis is a PUBLISHED DEPLOYMENT. It only changes when you '
                  + 'press Deploy - a git pull in the repl does not affect it.'
                : '');
    if (env === 'deployment') el.classList.add('is-deploy');
  } catch (e) { /* not worth surfacing */ }
})();
</script>
