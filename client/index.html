<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORM RCA — Stakeholder Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E12;
    --bg-elev: #15151C;
    --bg-elev-2: #1C1C26;
    --bg-elev-3: #22222F;
    --border: #2A2A38;
    --border-lit: #3A3A4A;
    --text: #ECECF0;
    --text-mute: #9696A5;
    --text-dim: #65657A;
    --accent: #C4F25B;
    --green: #5DCC8C;
    --green-bg: rgba(93, 204, 140, 0.12);
    --amber: #F2B544;
    --amber-bg: rgba(242, 181, 68, 0.12);
    --red: #F26B6B;
    --red-bg: rgba(242, 107, 107, 0.12);
    --blue: #6BA4F2;
    --blue-bg: rgba(107, 164, 242, 0.12);
    --purple: #B57DF2;
    --purple-bg: rgba(181, 125, 242, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar {
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #FF6B35, #F7B731);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white;
  }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-sub { font-size: 12px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
  .topbar-status { display: flex; gap: 14px; margin-left: auto; align-items: center; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .status-pill.off .dot { background: var(--text-dim); }

  .main {
    display: grid;
    grid-template-columns: 260px 360px 1fr;
    overflow: hidden;
    height: calc(100vh - 56px);
  }

  /* === COLUMN 1 — INBOX === */
  .inbox {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .inbox-head {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg-elev);
    z-index: 2;
  }
  .inbox-title {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px; font-weight: 600;
  }
  .inbox-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .inbox-tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    padding: 5px 10px;
    border-radius: 14px;
    font-size: 11.5px; font-family: inherit; cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; gap: 5px;
  }
  .inbox-tab:hover { color: var(--text); }
  .inbox-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .inbox-tab .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--border-lit);
    padding: 0 5px; border-radius: 8px;
    color: var(--text-mute);
  }
  .inbox-tab.active .num { background: var(--bg); color: var(--text); }
  .inbox-list { padding: 8px; overflow-y: auto; flex: 1; }
  .review-item {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: all 0.12s ease;
  }
  .review-item:hover { background: var(--bg-elev-2); }
  .review-item.selected { background: var(--bg-elev-2); border-color: var(--border-lit); }
  .review-item-top {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 4px; gap: 8px;
  }
  .review-author-line {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .review-stars-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 11px;
  }
  .review-exp {
    color: var(--text-mute);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .review-stars { color: var(--red); font-size: 11px; letter-spacing: 1px; }
  .review-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-dim); flex-shrink: 0;
  }
  .review-preview {
    font-size: 12px; color: var(--text);
    line-height: 1.4; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .review-tags { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag {
    font-size: 9.5px; padding: 2px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tag-lang { background: var(--blue-bg); color: var(--blue); }
  .tag-new { background: var(--red-bg); color: var(--red); }
  .tag-draft { background: var(--amber-bg); color: var(--amber); }
  .tag-sent { background: var(--green-bg); color: var(--green); }
  .tag-t1 { background: var(--green-bg); color: var(--green); }
  .tag-t2 { background: var(--amber-bg); color: var(--amber); }
  .tag-untr { background: var(--red-bg); color: var(--red); }
  .tag-ch1 { background: rgba(125, 181, 242, 0.1); color: #7DB5F2; }
  .tag-ch2 { background: rgba(242, 125, 181, 0.1); color: #F27DB5; }
  .inbox-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .add-manual-btn, .reporting-link {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border-lit);
    color: var(--text-mute);
    padding: 8px;
    border-radius: 8px;
    font-family: inherit; font-size: 11.5px;
    cursor: pointer; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: all 0.12s ease;
  }
  .add-manual-btn:hover, .reporting-link:hover {
    color: var(--text); border-color: var(--text-mute);
  }
  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
  }

  /* === COLUMN 2 === */
  .review-col {
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 22px 22px 80px;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--text-mute);
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .breadcrumb .sep { color: var(--text-dim); }
  .breadcrumb .current { color: var(--text); }

  .section { margin-bottom: 22px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim);
    font-weight: 600; margin-bottom: 8px;
  }
  .section-label .marker {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }

  .review-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    border-left: 3px solid var(--red);
  }
  .review-card-head {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 8px; gap: 10px;
  }
  .review-author { font-size: 15px; font-weight: 600; }
  .review-meta {
    font-size: 11.5px; color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
  }
  .review-body-original {
    font-size: 13px; color: var(--text);
    line-height: 1.55; white-space: pre-wrap;
  }
  .translation-card {
    margin-top: 8px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    border-left: 3px solid var(--blue);
  }
  .translation-label {
    font-size: 9.5px; color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px; font-weight: 600;
  }
  .translation-body { font-size: 13px; color: var(--text); line-height: 1.55; }

  .match-card {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .match-tier-badge {
    width: 34px; height: 34px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .match-tier-badge.t1 { background: var(--green-bg); color: var(--green); }
  .match-tier-badge.t2 { background: var(--amber-bg); color: var(--amber); }
  .match-info { flex: 1; }
  .match-title { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .match-method { font-size: 11px; color: var(--text-mute); }

  .candidates-picker {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 10px;
  }
  .candidates-picker-label {
    font-size: 10px;
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .candidate-card {
    background: var(--bg-elev-3);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .candidate-card:last-child { margin-bottom: 0; }
  .candidate-card:hover { border-color: var(--text-mute); }
  .candidate-card.selected {
    border-color: var(--accent);
    background: rgba(196, 242, 91, 0.04);
  }
  .candidate-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }
  .candidate-bid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--blue);
  }
  .candidate-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
  }
  .candidate-score-bar {
    display: inline-block;
    width: 50px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
    overflow: hidden;
  }
  .candidate-score-fill {
    height: 100%;
    background: var(--accent);
  }
  .candidate-exp {
    font-size: 12.5px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .candidate-meta {
    font-size: 11px;
    color: var(--text-mute);
    margin-bottom: 6px;
  }
  .candidate-reasons {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .candidate-reason-pill {
    font-size: 9.5px;
    background: var(--green-bg);
    color: var(--green);
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 500;
  }
  .candidate-confirm-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 9px 14px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  .confidence-trail {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .confidence-trail-label {
    font-size: 10px;
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 600; margin-bottom: 8px;
  }
  .conf-step {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 10px;
    padding: 4px 0;
    font-size: 11.5px;
    align-items: baseline;
  }
  .conf-step .mark {
    color: var(--green);
    font-weight: 700;
    font-size: 10.5px;
  }
  .conf-step .mark.fail { color: var(--red); }
  .conf-step .mark.warn { color: var(--amber); }
  .conf-step .label-text { color: var(--text-mute); }
  .conf-step .label-text strong { color: var(--text); font-weight: 600; }

  .details-grid {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .detail-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    align-items: center;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-mute); font-size: 11px; }
  .detail-row .v { color: var(--text); font-weight: 500; }
  .detail-row .v.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
  .detail-row .v.placeholder { color: var(--text-dim); font-style: italic; }
  .booking-status-pill {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
  }
  .status-cancelled { background: var(--red-bg); color: var(--red); }
  .status-complete { background: var(--green-bg); color: var(--green); }
  .status-pending { background: var(--amber-bg); color: var(--amber); }
  .pill-sm {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .pill-green { background: var(--green-bg); color: var(--green); }
  .pill-grey  { background: var(--bg-elev-3, #2a2a2a); color: var(--text-mute); }
  .pill-red   { background: var(--red-bg); color: var(--red); }
  .bms-link, .tgid-link {
    color: var(--accent, #7c93ff);
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .bms-link:hover, .tgid-link:hover { text-decoration-style: solid; }

  .timeline {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .tl-event {
    display: grid;
    grid-template-columns: 80px 1fr;
    padding: 7px 0;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
    font-size: 12px;
  }
  .tl-event:last-of-type { border-bottom: none; }
  .tl-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--text-dim);
    padding-top: 1px;
  }
  .tl-content { display: flex; flex-direction: column; gap: 4px; }
  .tl-header { display: flex; align-items: center; gap: 8px; }
  .tl-thread {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    flex-shrink: 0;
  }
  .tl-thread.chat { background: rgba(124, 138, 245, 0.15); color: #7C8AF5; }
  .tl-thread.email { background: rgba(95, 170, 240, 0.15); color: #5FAAF0; }
  .tl-thread.sp { background: rgba(160, 122, 234, 0.15); color: #A07AEA; }
  .tl-thread.booking { background: rgba(93, 204, 140, 0.15); color: var(--green); }
  .tl-thread.review { background: rgba(242, 107, 107, 0.15); color: var(--red); }
  .tl-actor {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tl-actor.creation { color: var(--blue); }
  .tl-actor.support { color: var(--amber); }
  .tl-actor.sp { color: var(--purple); }
  .tl-actor.review { color: var(--red); }
  .tl-actor.ai { color: #FA8BFF; }
  .tl-summary { color: var(--text); line-height: 1.5; }
  .timeline-summary {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-mute);
    line-height: 1.5;
  }
  .timeline-summary strong { color: var(--text); font-weight: 600; }

  .insights-wrap {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .insights-header {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-elev-3);
  }
  .insights-title { font-size: 11px; color: var(--text-mute); font-weight: 600; }
  .window-picker {
    display: flex;
    gap: 2px;
    background: var(--bg-elev);
    border-radius: 5px;
    padding: 2px;
  }
  .window-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 3px 8px;
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    border-radius: 3px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.12s ease;
  }
  .window-btn:hover { color: var(--text); }
  .window-btn.active { background: var(--text); color: var(--bg); }
  .insights-grid {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .insight-tile {
    background: var(--bg-elev-3);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 0;
    overflow: hidden;
  }
  #build-stamp.is-stale {
    color: var(--red, #ff5c5c); opacity: 1; font-weight: 700;
  }
  #build-stamp.is-deploy {
    color: var(--amber); opacity: .95; font-weight: 600;
  }
  .insight-group {
    grid-column: 1 / -1;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 10px 0 -2px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .insight-group:first-of-type { margin-top: 0; }
  .insight-group { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .group-range {
    font-weight: 500; letter-spacing: .02em; text-transform: none;
    color: var(--text-mute); font-size: 10px; white-space: nowrap;
  }
  .tile-empty {
    font-size: 12px; font-weight: 400; color: var(--text-mute);
    font-family: inherit; letter-spacing: .01em;
  }
  .tile-pct {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    margin-left: 4px;
  }
  .flag-biz-btn.full { grid-column: 1 / -1; }
  .tile-why {
    font-size: 10.5px; font-weight: 400; color: var(--text-mute);
    font-family: system-ui, sans-serif; letter-spacing: 0;
    margin-top: 5px; line-height: 1.45;
  }
  .why-n { color: var(--text-dim); font-weight: 700; }
  .tile-n {
    font-size: 11px; font-weight: 400; color: var(--text-mute);
    letter-spacing: 0; margin-left: 2px;
  }
  #build-stamp {
    position: fixed; right: 8px; bottom: 6px; z-index: 40;
    font-size: 10px; font-family: var(--mono, monospace);
    color: var(--text-mute); opacity: .5; pointer-events: none;
    letter-spacing: .3px;
  }
  .insight-note {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--amber);
    background: rgba(255,176,32,.07);
    border: 1px solid rgba(255,176,32,.18);
    border-radius: 6px;
    padding: 7px 10px;
    margin-bottom: 2px;
    line-height: 1.45;
  }
  .insight-tile-label {
    font-size: 10px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .insight-tile-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);

<body>

<div class="app">
  <header class="topbar">
    <div class="logo-block">
      <div class="logo">OR</div>
      <div>
        <div class="brand-name">ORM RCA</div>
        <div class="brand-sub">Headout · CX</div>
      </div>
    </div>
    <div class="topbar-status">
      <span class="status-pill"><span class="dot"></span>anthropic</span>
      <span class="status-pill"><span class="dot"></span>slack_inbound</span>
      <span class="status-pill"><span class="dot"></span>slack_outbound</span>
      <span class="status-pill"><span class="dot"></span>bigquery</span>
      <span class="status-pill"><span class="dot"></span>zendesk</span>
      <span class="status-pill off"><span class="dot"></span>dss</span>
      <span class="status-pill"><span class="dot"></span>canned</span>
    </div>
  </header>

  <div class="main">
    <aside class="inbox">
      <div class="inbox-head">
        <div class="inbox-title">Inbox</div>
        <div class="inbox-tabs">
          <button class="inbox-tab active" data-tab="identified">Reviews with BID <span class="num" id="cnt-identified">3</span></button>
          <button class="inbox-tab" data-tab="candidates">Reviews with possible matches <span class="num" id="cnt-candidates">0</span></button>
          <button class="inbox-tab" data-tab="untraceable">Untraceable <span class="num" id="cnt-untraceable">1</span></button>
          <button class="inbox-tab" data-tab="sent">Sent <span class="num" id="cnt-sent">0</span></button>
        </div>
      </div>
      <div class="inbox-list" id="inbox-list"></div>
      <div class="inbox-footer">
        <button class="add-manual-btn">+ Add review manually</button>
        <button class="reporting-link">⌘ Reporting</button>
      </div>
    </aside>

    <section class="review-col" id="review-col"></section>
    <section class="rca-col" id="rca-col"></section>
  </div>
</div>

<script>
// L2 placeholder catalogue per L1 — to be replaced with real list from CX team
const L2_OPTIONS = {
  'SP issue': ['Venue closure', 'Did not receive tickets', 'Redemption denied at venue', 'SP did not pick up calls', 'SP cancelled last-minute', 'Wrong tickets issued', 'SP system outage'],
  'CO miss': ['Wrong canned response', 'No response within SLA', 'Wrong info given', 'Minded AI wrong guidance', 'Failed escalation'],
  'Fulfilment': ['Voucher not delivered', 'QR code missing', 'Wrong booking details on voucher'],
  'Product/UX': ['Misleading listing name', 'Unclear inclusions', 'Confusing checkout', 'Time slot UX'],
  'Customer error': ['Wrong date booked', 'No-show', 'Misread voucher', 'Misunderstood inclusions'],
  'Pricing': ['Price mismatch vs competitor', 'Hidden fees', 'Currency confusion'],
  'Other': ['(placeholder)'],
};

// Keyed "L1::L2" -> ["A. Name", …, "N. Irrelevant"].
// Populated from /api/taxonomy (which already returns `sub_theme_frameworks`
// in exactly this "L1::L2" key form) so the frontend never duplicates taxonomy.
// Empty is safe: the row still shows the classified sub_theme; the editable
// options simply fill in once the taxonomy loads.
const SUB_THEME_OPTIONS = {};

async function loadSubThemeOptions() {
  try {
    const t = await (await fetch('/api/taxonomy')).json();
    const fw = t.sub_theme_frameworks || {};
    for (const key in fw) {
      const f = fw[key];
      const opts = (f.sub_themes || []).map(([code, name]) => `${code}. ${name}`);
      if (f.exclusion_label) opts.push(f.exclusion_label);
      SUB_THEME_OPTIONS[key] = opts;
    }
  } catch (e) { /* leave empty — row still shows the assigned sub_theme */ }
  // re-render so the sub-theme row appears once options are available
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
}
// call once on load; re-render picks up options after taxonomy resolves
loadSubThemeOptions();

// ── Inbox wiring ─────────────────────────────────────────────────────────────
// Did the booking id come from the review itself, or did we infer it?
// attachment / manual / regex all mean the review carried it. Anything else
// (a Zendesk requester match, a venue search) is inferred, however confident.
function _bidFromReview(row) {
  if (!row) return false;
  // The review carried a booking id: either the pipeline recorded where it came
  // from, or the review row itself still holds the reference number. Falling
  // back to reference_number matters for rows drafted before bid_source existed.
  if (['attachment', 'manual', 'regex'].includes(row.bid_source)) return true;
  return !!(row.reference_number && String(row.reference_number).trim());
}

async function fetchInbox() {
  try {
    const rows = await (await fetch('/api/reviews')).json();
    const byId = new Map(REVIEWS.map(r => [r.id, r]));
    const merged = rows.map(row => {
      const demo = byId.get(row.id);
      if (demo) {
        // Recompute type/tier/title from the FRESH row — a re-run can move a
        // review between tabs (untraceable -> candidates -> identified).
        const t = row.match_tier ?? demo.matchTier;
        const c = row.candidate_state ?? demo.candidateState;
        return {
          ...demo,
          receivedAt:     row.received_at || demo.receivedAt,
          status:         row.status      || demo.status,
          matchTier:      t,
          candidateState: c,
          type:           (t === 1 && _bidFromReview(row)) ? 'identified'
                          : (c ? 'candidates' : (t == null ? 'untraceable' : 'candidates')),
          tier:           t ? `T${t}` : '—',
          matchTitle:     (t === 1 && _bidFromReview(row)) ? 'Direct match'
                          : t === 1 ? 'Matched from Zendesk — confirm to continue'
                          : c ? 'Possible matches — associate to confirm' : 'Untraceable',
        };
      }
      // New API-only review (manual / Slack): minimal template
      const tier = row.match_tier;
      return {
        id:             row.id,
        author:         row.author || 'Unknown',
        firstName:      (row.author || 'Unknown').split(' ')[0],
        rating:         row.rating || 1,
        stars:          '★'.repeat(row.rating || 1) + '☆'.repeat(5 - (row.rating || 1)),
        language:       row.language || 'en',
        lang:           (row.language || 'en').toUpperCase(),
        receivedAt:     row.received_at,
        time:           row.received_at ? new Date(row.received_at).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '',
        status:         row.status || 'new',
        matchTier:      tier,
        matchTitle:     (tier === 1 && _bidFromReview(row)) ? 'Direct match'
                        : tier === 1 ? 'Matched from Zendesk — confirm to continue'
                        : tier === 2 ? 'Possible matches — associate to confirm' : 'Untraceable',
        candidateState: row.candidate_state || false,
        type:           (tier === 1 && _bidFromReview(row)) ? 'identified'
                        : (row.candidate_state ? 'candidates' : (tier == null ? 'untraceable' : 'candidates')),
        tier:           tier ? `T${tier}` : '—',
        experience:     row.experience || '',
        channel:        'orm',
        original:       row.snippet || '',
        english:        null,
        originalText:   row.snippet || '',
        englishText:    row.snippet || '',
        booking:        {},
        rca:            {
          issueL1: '', issueL2: '', subTheme: null,
          whatWentWrong: '', statedIssue: '',
          supportInteraction: [], supportSummary: '', spInteraction: [],
          areaOfImproving: '',
          actionsTaken: {sp:[],customer:[],business:[],product:[],ce:[]},
          resolution: '',
          tldr: '', wwrChain: [], wwrScenarios: [], prevention: '',
          evidence: [], issueSpecificAnswers: {}, checklistAnswers: [],
          checks: [], reply: '', reasoning: '',
          primaryScenario: '', templateName: '',
          slackThreadOverride: '',
        },
        insights: {
          tgidRating: {value:'—',sub:'',tone:''},
          tidVidRating: {value:'—',sub:'',tone:''},
          completion: {value:'—',sub:'',tone:''},
          sameDayIssues: {value:'—',sub:'',tone:''},
          similarSupport: [], similarReviews: [],
        },
        events: [],
        timelineSummary: '',
      };
    });
    merged.sort((a, b) => new Date(b.receivedAt || b.time || 0) - new Date(a.receivedAt || a.time || 0));
    REVIEWS.length = 0;
    REVIEWS.push(...merged);
  } catch (e) {
    console.warn('[inbox] fetch failed, keeping last loaded reviews:', e);
  }
}

// Overlay real draft fields onto the demo view-models. Data source only:
// sub_theme, support_interaction_frames (+ sp_interaction_frames) and
// support_summary come from /api/reviews/{id}; markup stays demo-v15.
function mapSupportFrame(f) {
  return {
    type: f.thread || 'email',
    time: f.time || '',
    label: f.label || '',
    guestSaid: f.guestSaid || f.summary || '—',
    weDid: f.weDid || '—',
    guestReply: f.guestReply || '—',
    gap: f.gap || '',
  };
}

// {ok, window, insights} or a bare insights dict - take whichever this server
// speaks. Recognised by a field every insights payload carries.
//
// Top level, because two callers need it: the initial load below and the
// window-picker handler in renderReviewCol. It used to be declared inside
// loadDraftOverlays, so the picker's call threw a ReferenceError into a catch
// that discarded it - the fetch succeeded, the response was thrown away, and
// the panel kept the previous window's numbers under the previous window's
// label. Every symptom of a broken window picker, with a working request
// behind it.
function unwrapInsights(payload) {
  if (!payload || typeof payload !== 'object') return null;
  if (payload.insights && typeof payload.insights === 'object') return payload.insights;
  if ('similar_reviews_30d' in payload || '_computed_for_l2' in payload) return payload;
  return null;
}

async function loadDraftOverlays() {
  await Promise.all(REVIEWS.map(async (r) => {
    if (!r.rca) return;
    try {
      const [draftResp, insightsResp] = await Promise.all([
        fetch(`/api/reviews/${r.id}`),
        // Send the window the picker is displaying. Without it the server
        // applied its own default (30d) while the picker highlighted 90d, so
        // every first load showed one window's numbers under another window's
        // button - and clicking around masked it, because clicking does send
        // the window.
        fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(state.insightsWindow)}`),
      ]);
      if (!draftResp.ok) return;
      const payload = await draftResp.json();
      const draft   = payload.draft;
      const review  = payload.review;
      if (!draft) return;

      // ── Full review text ──────────────────────────────────────────────────
      if (review) {
        r.original     = review.body_original || r.original     || '';
        r.originalText = review.body_original || r.originalText || '';
        r.english      = review.body_english  || r.english      || null;
        r.englishText  = review.body_english  || r.englishText  || '';
      }

      // ── RCA core fields ───────────────────────────────────────────────────
      r.rca.issueL1   = draft.l1        || r.rca.issueL1  || '';
      r.rca.issueL2   = draft.l2        || r.rca.issueL2  || '';
      r.rca.subTheme  = draft.sub_theme || r.rca.subTheme || null;
      r.rca.tldr      = draft.tldr      || '';
      r.rca.wwrChain  = draft.wwr_chain || [];
      r.rca.prevention= draft.prevention|| '';
      r.rca.evidence  = draft.evidence  || [];
      r.rca.checks    = draft.diagnostic_checks || [];

      r.rca.whatWentWrong = Array.isArray(draft.what_went_wrong_bullets)
        ? draft.what_went_wrong_bullets.join('\n')
        : (draft.what_went_wrong_bullets || r.rca.whatWentWrong || '');

      r.rca.areaOfImproving = Array.isArray(draft.area_of_improving)
        ? draft.area_of_improving.join('\n')
        : (draft.area_of_improving || r.rca.areaOfImproving || '');

      r.rca.resolution = draft.resolution || r.rca.resolution || '';
      r.rca.reply      = draft.final_response || draft.suggested_response || r.rca.reply || '';
      r.rca.primaryScenario  = draft.primary_scenario || r.rca.primaryScenario || '';
      r.rca.overlayScenarios = draft.overlay_scenarios || [];
      r.rca.templateName     = draft.template_name    || r.rca.templateName    || '';
      r.rca.wwrScenarios     = draft.wwr_scenarios    || [];

      // actions_taken: API returns {sp: [strings], ce: [strings], …}
      // render expects [{context, with, handle, time, where}]
      if (draft.actions_taken) {
        const toItems = arr => (arr || []).map(s => (typeof s === 'string'
          ? { context: s, with: '', handle: '', time: '', where: '#' }
          : { context: s.context || '', with: s.with || '', handle: s.handle || '',
              time: s.time || '', where: s.where || '#' }));
        r.rca.actionsTaken = {
          sp:       toItems(draft.actions_taken.sp),
          customer: toItems(draft.actions_taken.customer),
          business: toItems(draft.actions_taken.business),
          ce:       toItems(draft.actions_taken.ce),
          product:  toItems(draft.actions_taken.product),
        };
      }

      r.rca.issueSpecificAnswers = draft.issue_specific_answers || {};
      r.rca.checklistAnswers     = draft.checklist_answers      || [];
      r.rca.slackThreadOverride  = draft.slack_thread_override  || '';
      r.rca.supportInteraction   = (draft.support_interaction_frames || []).map(mapSupportFrame);
      r.rca.supportSummary       = draft.support_summary        || '';
      r.rca.spInteraction        = (draft.sp_interaction_frames || []).map(f => ({
        time: f.time || '', label: f.label || '', summary: f.summary || f.weDid || '',
      }));

      // ── Ticket fact extraction ────────────────────────────────────────────
      r.ticketFacts = (draft.ticket_facts && Object.keys(draft.ticket_facts).length)
        ? draft.ticket_facts : null;

      // ── Candidate list (T2) ──────────────────────────────────────────────
      if (Array.isArray(draft.candidates_list) && draft.candidates_list.length) {
        r.candidatesList = draft.candidates_list.map(c => ({
          bid:            c.id || c.bid,
          score:          c.score != null ? c.score : null,
          scoreVenue:     c.score_venue != null ? c.score_venue : null,
          scoreDate:      c.score_date  != null ? c.score_date  : null,
          venueSignal:    c.venue_signal === true,
          matchReasons:   c.matchReasons || c.match_reasons || [],
          experience:     c.experience || c.experienceName || '',
          tgid:           c.tgid || '',
          tid:            c.tid || '',
          vendorName:     c.vendorName || c.partner || '',
          experienceDate: c.experienceDate || c.visitDate || '',
          creationDate:   c.creationDate || c.bookedOn || '',
          status:         c.status || '',
          leadTime:       c.leadTime || '',
        }));
      }

      // ── Stated issue ──────────────────────────────────────────────────────
      r.statedIssue = draft.stated_issue || r.statedIssue || '';

      // ── Timeline → events ─────────────────────────────────────────────────
      if (Array.isArray(draft.timeline) && draft.timeline.length) {
        r.events = draft.timeline.map(t => ({
          time:    t.time    || '',
          thread:  t.thread  || 'email',
          actor:   t.actor   || '',
          label:   t.label   || '',
          summary: t.summary || '',
        }));
      }

      // ── Match title (may be missing on demo stubs) ────────────────────────
      if (!r.matchTitle) {
        const _t = r.matchTier;
        r.matchTitle = _t === 1 ? 'Direct match'
          : _t === 2 ? 'Possible matches — associate to confirm'
          : 'Untraceable';
      }

      // ── Confidence trail + extracted signals ──────────────────────────────
      // Both were read by the renderer but never populated here, so the
      // "How we built this match" box never appeared.
      r.confidenceTrail   = (draft.confidence_trail && draft.confidence_trail.length)
                            ? draft.confidence_trail : null;
      r.extractedSignals  = draft.extracted_signals || {};
      r.slackMentions     = draft.slack_mentions || [];

      // ── Match method from confidence trail ────────────────────────────────
      r.matchMethod = draft.match_method
        || (draft.confidence_trail && draft.confidence_trail.length
            ? draft.confidence_trail.map(c => c.text.replace(/<[^>]+>/g, '')).join(' · ')
            : r.matchMethod || '—');

      // ── Wire booking fields from draft.booking ────────────────────────────
      if (draft.booking) {
        const db = draft.booking;
        r.booking = r.booking || {};
        // Fresh draft data ALWAYS wins over whatever is on screen — a re-run
        // can change the matched booking entirely; stale values must not stick.
        r.booking.bid              = db.id                                || r.booking.bid;
        r.booking.experience       = db.experienceName || db.experience_name || r.booking.experience;
        r.booking.tgid             = db.tgid                              || r.booking.tgid;
        r.booking.tid              = db.tid                               || r.booking.tid;
        r.booking.vid              = db.vid || db.vendor_id               || r.booking.vid;
        r.booking.vendorName       = db.vendorName || db.vendor_name      || r.booking.vendorName;
        r.booking.fulfilmentType   = db.fulfilmentType || db.fulfilment_type || r.booking.fulfilmentType;
        r.booking.experienceDate   = db.visitDate || db.date_of_visit     || r.booking.experienceDate;
        r.booking.creationDate     = db.date_of_booking       || r.booking.creationDate || '';
        r.booking.bookingDate      = db.date_of_booking       || r.booking.bookingDate;
        r.booking.bmsLink          = db.bms_link;
        r.booking.tgidLink         = db.tgid_link;
        r.booking.ticketMailSeen   = !!db.ticket_mail_seen;

        // booking_status and tid_name from BigQuery enrichment
        r.booking.status  = db.booking_status || db.status || r.booking.status || '';
        r.booking.tidName = db.tid_name || db.tour_name || r.booking.tidName || '';

        // Guest name: use plaintext BQ name, then Zendesk requester, then fallback
        const rawGuest    = db.primary_guest_name || r.booking.primaryGuestName || '';
        const zdRequester = r.booking.zendesk_requester_name || db.zendesk_requester_name || '';
        if (rawGuest && (rawGuest.length <= 20 || /\s/.test(rawGuest))) {
          r.booking.primaryGuestName = rawGuest;
        } else if (zdRequester) {
          r.booking.primaryGuestName = zdRequester;
        } else {
          r.booking.primaryGuestName = '[Guest name in Zendesk ticket]';
        }
      }

      // ── Review date ───────────────────────────────────────────────────────
      if (review && review.received_at) {
        r.booking = r.booking || {};
        r.booking.reviewDate = review.received_at.split('T')[0];
      }

      // ── Lead time: days between booking date and visit date ───────────────
      {
        const bookingStr = (r.booking.bookingDate || r.booking.creationDate || '').split('T')[0];
        const visitStr   = (r.booking.experienceDate || '').split('T')[0];
        if (bookingStr && visitStr) {
          const bookingMs = new Date(bookingStr).getTime();
          const visitMs   = new Date(visitStr).getTime();
          const diffDays  = Math.round((visitMs - bookingMs) / 86400000);
          r.booking.leadTime = diffDays >= 2 ? `${diffDays} days`
                             : diffDays === 1 ? '1 day'
                             : diffDays === 0 ? '0 days'
                             : '—';
        } else {
          r.booking.leadTime = '—';
        }
      }

      // ── Live insights from API ────────────────────────────────────────────
      if (insightsResp.ok) {
        // Accept either shape. The endpoint returns {ok, window, insights};
        // older builds returned the insights dict bare. Unwrapping defensively
        // means a page cached from before a deploy still renders numbers
        // instead of "undefined / undefined", which is what an envelope read
        // one level too shallow looks like on every tile.
        const payload = await insightsResp.json();
        r.liveInsights = unwrapInsights(payload) || r.liveInsights;
      }
    } catch (e) { /* keep demo data for this review if the API is unreachable */ }
  }));
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
  renderReviewCol();
  renderInbox();
}

let REVIEWS = [];   // populated live from /api/reviews — no demo/placeholder rows

const state = {
  selected: 'tp_001',
  filter: 'identified',
  actionTab: 'sp',
  insightsWindow: '90d',
};

// fire once REVIEWS + state exist; fetchInbox merges API rows then loads drafts
(async () => {
  await fetchInbox();
  await loadSubThemeOptions();
  await loadDraftOverlays();
  renderInbox();
  if (state.selected) renderRcaCol();
})();

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const filtered = REVIEWS.filter(r => {
    if (state.filter === 'identified') return r.type === 'identified' && r.status !== 'sent';
    if (state.filter === 'candidates') return r.type === 'candidates';
    if (state.filter === 'untraceable') return r.type === 'untraceable';
    if (state.filter === 'sent') return r.status === 'sent';
    return false;
  });

  document.getElementById('cnt-identified').textContent = REVIEWS.filter(r => r.type === 'identified' && r.status !== 'sent').length;
  document.getElementById('cnt-candidates').textContent = REVIEWS.filter(r => r.type === 'candidates').length;
  document.getElementById('cnt-untraceable').textContent = REVIEWS.filter(r => r.type === 'untraceable').length;
  document.getElementById('cnt-sent').textContent = REVIEWS.filter(r => r.status === 'sent').length;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No reviews in this tab.</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="review-item ${r.id === state.selected ? 'selected' : ''}" data-id="${r.id}">
      <div class="review-item-top">
        <span class="review-author-line">${r.author}</span>
        <span class="review-time">${r.time}</span>
      </div>
      <div class="review-stars-line"><span class="review-stars">${r.stars}</span>${r.booking?.experience ? `<span class="review-exp">· ${r.booking.experience.length > 40 ? r.booking.experience.substring(0, 40) + '…' : r.booking.experience}</span>` : ''}</div>
      <div class="review-preview">${(r.english || r.original).substring(0, 100)}${(r.english || r.original).length > 100 ? '…' : ''}</div>
      <div class="review-tags">
        <span class="tag tag-lang">${r.lang}</span>
        <span class="tag tag-${r.status}">${r.status}</span>
        <span class="tag tag-${r.tier === 'T1' ? 't1' : r.tier === 'T2' ? 't2' : 'untr'}">${r.tier}</span>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.review-item').forEach(el => {
    el.addEventListener('click', () => {
      state.selected = el.dataset.id;
      renderInbox();
      renderReviewCol();
      renderRcaCol();
    });
  });
}

function renderReviewCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('review-col').innerHTML = `<div class="empty-state" style="padding: 60px 20px;">Select a review from the inbox.</div>`;
    return;
  }

  const col = document.getElementById('review-col');

  if (r.type === 'untraceable') {
    col.innerHTML = `
      <div class="breadcrumb">
        <span>Untraceable</span>
        <span class="sep">›</span>
        <span class="current">${r.author}</span>
      </div>

      <div class="section">
        <div class="section-label"><span class="marker"></span>Trustpilot Review</div>
        <div class="review-card">
          <div class="review-card-head">
            <div class="review-author">${r.author}</div>
            <div class="review-meta">${r.stars} · ${r.lang} · No ref</div>
          </div>
          <div class="review-body-original">${r.original}</div>
        </div>
      </div>

      <div class="section">
        <div class="section-label"><span class="marker"></span>Identifier Checks</div>
        <div class="confidence-trail">
          ${(r.untraceableChecks || []).map(s => `
            <div class="conf-step">
              <span class="mark fail">✗</span>
              <span class="label-text">${s.text}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    return;
  }

  const b = r.booking;

  function _normTlEvent(e) {
    // 1. Filter internal noise rows
    const raw = ((e.label || '') + ' ' + (e.summary || '')).toLowerCase();
    if (/pseudo.?email|credential|passwo|interaction.?tag|transcript.?log|ai.?resolved|bot.?tag|chat session|conversation opened/.test(raw)) return null;

    // 2. Normalize ISO date-only times → "DD Mon"
    let time = e.time || '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(time.trim())) {
      try {
        const d = new Date(time.trim() + 'T00:00:00Z');
        time = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' });
      } catch (_) { /* keep as-is */ }
    }

    // 3. Strip "(×N)" artifacts from labels
    const label = (e.label || '').replace(/\s*\(×\d+\)\s*$/, '').trim();

    // 4. Infer correct thread pill from label + summary; suppress pill on bookends
    let thread = e.thread || '';
    const isBookend = thread === 'system';
    if (!isBookend && (!thread || thread === 'email')) {
      const lsLow = (label + ' ' + (e.summary || '')).toLowerCase();
      if (/\bchat\b|\bwhatsapp\b|\bmessage\b/.test(lsLow)) thread = 'chat';
      else if (/\bcall\b|\bphone\b|\bvoice\b/.test(lsLow))  thread = 'call';
      else if (/\bsp\b|\bsupply.?partner\b|\boperator\b/.test(lsLow)) thread = 'sp';
      else thread = e.thread || 'email';
    }

    return { ...e, time, label, thread, _isBookend: isBookend };
  }

  const events = (r.events || [])
    .map(_normTlEvent)
    .filter(Boolean)
    .map(e => `
    <div class="tl-event">
      <div class="tl-time">${e.time}</div>
      <div class="tl-content">
        <div class="tl-header">
          ${(!e._isBookend && e.thread) ? `<span class="tl-thread ${e.thread}">${e.thread}</span>` : ''}
          <div class="tl-actor ${e.actor}">${e.label}</div>
        </div>
        <div class="tl-summary">${e.summary}</div>
      </div>
    </div>
  `).join('');

  const ins = r.insights;
  const similarSupport = ins.similarSupport || [];
  const similarReviews = ins.similarReviews || [];
  const totalSimilar = similarSupport.length + similarReviews.length;
  const summaryLine = totalSimilar === 0
    ? 'No similar complaints found in window'
    : `Found <strong>${similarSupport.length}</strong> in support · <strong>${similarReviews.length}</strong> in reviews on the same issue`;
  const similar = `<div class="insight-tile full">
       <div class="insight-tile-label">Similar complaints — TID·VID</div>
       <div class="similar-summary-line">${summaryLine}</div>
       ${similarSupport.length > 0 ? `
         <div class="similar-sub-label">In support (Zendesk chats / calls / emails)</div>
         <div class="similar-list">
           ${similarSupport.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
       ${similarReviews.length > 0 ? `
         <div class="similar-sub-label">In reviews (Trustpilot)</div>
         <div class="similar-list">
           ${similarReviews.map(s => `
             <div class="similar-item">
               <span class="ref">${s.ref}</span>
               <span class="desc">${s.desc}</span>
               <span class="date">${s.date}</span>
             </div>
           `).join('')}
         </div>
       ` : ''}
     </div>`;

  // What the AI pulled out of the review — the inputs every search and score
  // downstream is built from. Shown plainly so a wrong match is traceable to a
  // wrong indicator rather than looking like a mystery.
  const _sig = r.extractedSignals || {};
  const _ind = _sig.match_indicators || {};
  const _sigRows = [
    ['Venue / experience', _ind.experience_or_venue],
    ['City / country',     _ind.city_or_country],
    ['Guest name',         _ind.guest_name],
    ['Visit date hint',    _ind.visit_date_hint],
    ['Pax',                _ind.pax || _sig.pax_hint],
    ['Searched Zendesk as', [_sig.author_first, _sig.author_last].filter(Boolean).join(' ')],
    ['Venue hints used',   (_sig.venue_hints || []).join(' · ')],
  ].filter(([, v]) => v != null && String(v).trim() !== '');

  const signalsBox = _sigRows.length
    ? `<div class="section">
         <div class="section-label"><span class="marker"></span>Extracted from review<span class="ai-tag-inline">AI</span></div>
         <div class="details-grid">
           ${_sigRows.map(([k, v]) => `
             <div class="detail-row">
               <span class="k">${k}</span>
               <span class="v">${String(v)}</span>
             </div>`).join('')}
         </div>
       </div>`
    : (() => {
        // When the booking was found by its id, no indicators were ever needed
        // and their absence is not a problem. Rendering an amber "Matching has
        // no indicators to search on" next to a green "Direct match · BID
        // confirmed" reads as a contradiction and makes a healthy match look
        // broken.
        //
        // Derived here rather than trusting the server to have set
        // matching_skipped: the client already knows the match tier, and a
        // draft written before that field existed would still show the alarm.
        const _bidMatched = !!(r.booking && (r.booking.bid || r.booking.id))
                            && (r.matchTier === 1 || r.match_tier === 1
                                || _sig.matching_skipped);
        const _msg = _sig.matching_skipped
          || (_bidMatched
              ? `Not needed — the review carried its booking id, so the booking was
                 found directly rather than by searching on indicators.`
              : `Nothing extracted — no venue, city, date or name found in the review
                 text. Matching has no indicators to search on.`);
        return `<div class="section">
         <div class="section-label"><span class="marker"></span>Extracted from review<span class="ai-tag-inline">AI</span></div>
         <div class="chk-none" style="font-size:12px;color:${_bidMatched ? 'var(--text-mute)' : 'var(--amber)'}">
           ${_msg}
         </div>
       </div>`;
      })();

  // Slack pings referencing this BID — ops/escalation/SP chatter that never
  // reaches Zendesk but is part of what actually happened to the booking.
  const _mentions = r.slackMentions || [];
  const slackPings = r.booking && r.booking.bid
    ? `<div class="section">
         <div class="section-label"><span class="marker"></span>Slack mentions of this BID</div>
         ${_mentions.length ? `
         <div class="details-grid">
           ${_mentions.map(m => `
             <div class="detail-row" style="grid-template-columns:130px 1fr">
               <span class="k">#${m.channel || '—'}${m.user ? ' · ' + m.user : ''}</span>
               <span class="v" style="white-space:normal">${(m.text || '').replace(/</g,'&lt;')}${m.permalink ? ` <a href="${m.permalink}" target="_blank" style="color:var(--accent)">open</a>` : ''}</span>
             </div>`).join('')}
         </div>` : `
         <div class="chk-none" style="font-size:12px">No Slack messages found for this booking.</div>`}
       </div>`
    : '';

  const confTrail = r.confidenceTrail
    ? `<div class="confidence-trail">
         <div class="confidence-trail-label">How we built this match</div>
         ${r.confidenceTrail.map(s => `
           <div class="conf-step">
             <span class="mark ${s.mark === 'fail' ? 'fail' : s.mark === 'warn' ? 'warn' : ''}">${s.mark === 'pass' ? '✓' : s.mark === 'warn' ? '!' : '✗'}</span>
             <span class="label-text">${s.text}</span>
           </div>
         `).join('')}
       </div>`
    : '';

  col.innerHTML = `
    <div class="breadcrumb">
      <span>${r.type === 'identified' ? 'Reviews with BID' : 'Reviews with possible matches'}</span>
      <span class="sep">›</span>
      <span class="current">${r.type === 'identified' ? 'BID ' + b.bid : r.author}</span>
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Trustpilot Review</div>
      <div class="review-card">
        <div class="review-card-head">
          <div class="review-author">${r.author}</div>
          <div class="review-meta">${r.stars} · ${r.lang}${r.type === 'identified' ? ' · BID ' + b.bid : ' · No BID in text'}</div>
        </div>
        <div class="review-body-original">${r.original}</div>
      </div>
      ${r.english ? `
        <div class="translation-card">
          <div class="translation-label">English · Claude</div>
          <div class="translation-body">${r.english}</div>
        </div>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Booking Match
        <button class="rerun-btn" data-rerun-match title="Re-run the booking search + full analysis for this review">↻ Re-run</button>
      </div>
      <div class="match-card">
        <div class="match-tier-badge ${r.matchTier}">${r.tier}</div>

          ${r.candidatesList.some(c => c.scoreVenue != null) && !r.candidatesList.some(c => c.venueSignal) ? `

            ⚠ No venue agreement — none of these match the venue in the review.

          ${r.candidatesList.map((c, i) => {
            const hasScore = typeof c.score === 'number' && c.score > 0;

            const metaParts = [
              c.vendorName,

              (c.tgid || c.tid) ? `TGID ${c.tgid || '—'} / TID ${c.tid || '—'}` : '',

            return `
            <div class="candidate-card ${i === 0 ? 'selected' : ''}" data-candidate-idx="${i}">
              <div class="candidate-top">
                <div class="candidate-bid">#${c.bid}</div>
                ${hasScore ? `
                <div class="candidate-score" title="${c.scoreVenue != null ? `venue ${c.scoreVenue} + date ${c.scoreDate}` : ''}">
                  <span class="candidate-score-bar"><span class="candidate-score-fill" style="width: ${pct}%"></span></span>
                  ${c.scoreVenue != null
                    ? `venue ${c.scoreVenue} + date ${c.scoreDate}`
                    : `score ${c.score}`}
                </div>` : ''}
              </div>
              <div class="candidate-exp">${c.experience || '—'}</div>
              <div class="candidate-meta">${metaParts.length ? metaParts.join(' · ') : 'Booking details load on confirm'}</div>
              <div class="candidate-reasons">
                ${(c.matchReasons || []).map(r => `<span class="candidate-reason-pill">${r}</span>`).join('')}
              </div>
            </div>`;
          }).join('')}
          <button class="candidate-confirm-btn">Confirm selection · run full RCA</button>
        </div>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Experience Details</div>
      <div class="details-grid">
        <div class="detail-row"><span class="k">Booking ID</span><span class="v mono">${b.bmsLink ? `<a href="${b.bmsLink}" target="_blank" rel="noopener" class="bms-link">${b.bid}</a>` : b.bid}</span></div>
        <div class="detail-row"><span class="k">Experience</span><span class="v">${b.experience || "—"}</span></div>
        <div class="detail-row"><span class="k">TID name</span><span class="v ${b.tidName ? '' : 'placeholder'}">${b.tidName || '—'}</span></div>
        <div class="detail-row"><span class="k">TGID / TID</span><span class="v mono">${b.tgidLink ? `<a href="${b.tgidLink}" target="_blank" rel="noopener" class="tgid-link">${b.tgid || "—"}</a>` : (b.tgid || "—")} / ${b.tid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor ID</span><span class="v mono">${b.vid || "—"}</span></div>
        <div class="detail-row"><span class="k">Vendor name</span><span class="v">${b.vendorName || "—"}</span></div>
        <div class="detail-row"><span class="k">Fulfilment type</span><span class="v mono">${b.fulfilmentType || '—'}</span></div>
        <div class="detail-row"><span class="k">Primary guest</span><span class="v">${b.primaryGuestName || '—'}</span></div>
        <div class="detail-row"><span class="k">Visit date</span><span class="v mono">${b.experienceDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Booking date</span><span class="v mono">${b.bookingDate || b.creationDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Review date</span><span class="v mono">${b.reviewDate || '—'}</span></div>
        <div class="detail-row"><span class="k">Ticket mail seen</span><span class="v">${b.ticketMailSeen != null ? `<span class="pill-sm ${b.ticketMailSeen ? 'pill-green' : 'pill-grey'}">${b.ticketMailSeen ? 'Yes' : 'No'}</span>` : '—'}</span></div>
        <div class="detail-row"><span class="k">Booking status</span><span class="v">${b.status ? `<span class="booking-status-pill status-${b.status}">${b.status}</span>` : '—'}</span></div>
        <div class="detail-row"><span class="k">Lead time</span><span class="v mono">${b.leadTime || '—'}</span></div>
      </div>
    </div>

    ${r.ticketFacts ? (() => {
      const tf = r.ticketFacts;
      const refund = tf.refund || {};
      const hasRefund = refund.issued != null || refund.amount || refund.reference_id || refund.out_of_policy != null;
      const ceActions = Array.isArray(tf.ce_actions) ? tf.ce_actions : [];
      const tags = Array.isArray(tf.interaction_tags) ? tf.interaction_tags : [];
      const rows = [];
      if (tf.guest_full_name) rows.push(`<div class="detail-row"><span class="k">Guest name</span><span class="v">${tf.guest_full_name}</span></div>`);
      if (tf.booking_status) rows.push(`<div class="detail-row"><span class="k">Booking status</span><span class="v"><span class="pill-sm pill-grey">${tf.booking_status}</span></span></div>`);
      if (tf.primary_issue) rows.push(`<div class="detail-row"><span class="k">Primary issue</span><span class="v">${tf.primary_issue}</span></div>`);
      if (tf.delay_or_issue_reason) rows.push(`<div class="detail-row"><span class="k">Issue reason</span><span class="v">${tf.delay_or_issue_reason}</span></div>`);
      if (hasRefund) {
        const refParts = [];
        if (refund.issued === true) refParts.push(`<span class="pill-sm pill-green">Issued</span>`);
        else if (refund.issued === false) refParts.push(`<span class="pill-sm pill-grey">Not issued</span>`);
        if (refund.amount) refParts.push(`<strong>${refund.amount}</strong>`);
        if (refund.reference_id) refParts.push(`ref: <span class="mono">${refund.reference_id}</span>`);
        if (refund.out_of_policy === true) refParts.push(`<span class="pill-sm pill-red">Out of policy</span>`);
        rows.push(`<div class="detail-row"><span class="k">Refund</span><span class="v">${refParts.join(' · ')}</span></div>`);
      }
      const bools = [];
      if (tf.sla_breached === true) bools.push(`<span class="pill-sm pill-red">SLA breached</span>`);
      if (tf.is_same_day_booking === true) bools.push(`<span class="pill-sm pill-grey">Same-day</span>`);
      if (tf.is_cancellable === false) bools.push(`<span class="pill-sm pill-grey">Non-cancellable</span>`);
      if (tf.is_reschedulable === false) bools.push(`<span class="pill-sm pill-grey">Non-reschedule</span>`);
      if (bools.length) rows.push(`<div class="detail-row"><span class="k">Flags</span><span class="v" style="display:flex;flex-wrap:wrap;gap:4px">${bools.join('')}</span></div>`);
      if (tf.resolution_summary) rows.push(`<div class="detail-row"><span class="k">Resolution</span><span class="v">${tf.resolution_summary}</span></div>`);
      if (ceActions.length) rows.push(`<div class="detail-row" style="align-items:flex-start"><span class="k" style="padding-top:2px">CE actions</span><span class="v"><ul style="margin:0;padding-left:16px;list-style:disc">${ceActions.map(a => `<li style="margin-bottom:2px">${a}</li>`).join('')}</ul></span></div>`);
      if (tags.length) rows.push(`<div class="detail-row"><span class="k">Tags</span><span class="v" style="display:flex;flex-wrap:wrap;gap:4px">${tags.map(t => `<span class="pill-sm pill-grey" style="font-size:9px">${t}</span>`).join('')}</span></div>`);
      if (!rows.length) return '';
      return `
    <div class="section">
      <div class="section-label"><span class="marker"></span>Ticket Facts <span style="font-size:9.5px;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px">extracted from Zendesk</span></div>
      <div class="details-grid">${rows.join('')}</div>
    </div>`;
    })() : ''}

    <div class="section">
      <div class="section-label"><span class="marker"></span>Events Timeline</div>
      <div class="timeline">
        ${events}
        <div class="timeline-summary">${r.timelineSummary}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span class="marker"></span>Experience Insights</div>
      <div class="insights-wrap">
        <!-- Outside the branch on purpose. This used to live only in the
             fallback arm, so the moment real insights arrived the picker
             vanished and the window could not be changed at all. -->
        <div class="insights-header">
          <div class="insights-title">Window:</div>
          <div class="window-picker">
            <button class="window-btn ${state.insightsWindow === '7d' ? 'active' : ''}" data-window="7d">7d</button>
            <button class="window-btn ${state.insightsWindow === '30d' ? 'active' : ''}" data-window="30d">30d</button>
            <button class="window-btn ${state.insightsWindow === '90d' ? 'active' : ''}" data-window="90d">90d</button>
          </div>
        </div>
        ${r.liveInsights ? (() => {
          const li = r.liveInsights;
          // rating_15d / rating_30d are back-compat aliases: the server sends
          // TGID in the first and TID.VID in the second. They are SCOPES, not
          // windows - the window is whatever the picker above is set to.
          const _ratTgid = li.rating_tgid || li.rating_15d || {};
          const _ratTv   = li.rating_tidvid || li.rating_30d || {};
          // Ops thumb rule: under 95%, and only over ~100 bookings, because the
          // rate is noise below that - one unfulfilled booking out of two is
          // 50%. The server applies both halves; needs_attention is the answer.
          const _ffAttn  = li.ff_vid ? !!li.ff_vid.needs_attention
                                     : (li.vid_completion_rate != null
                                        && li.vid_completion_rate < 0.95);
          const _ffAttnT = li.ff_tgid ? !!li.ff_tgid.needs_attention
                                      : (li.tgid_completion_rate != null
                                         && li.tgid_completion_rate < 0.95);
          // Sample size, shown only when it changes how the number should be
          // read. Over 100 bookings the rate stands on its own; under it, the
          // ops rule says the rate is noise and the count is the honest
          // caveat. Zero is not a dash - "no bookings in this window" is a
          // fact about the vendor, and a dash reads as a broken query.
          // Which queries BROKE. A tile backed by one of these has no
          // number, and the affirmative wording below - "no bookings", "no
          // negative reviews" - would state a warehouse failure as a fact
          // about the vendor. _broken() marks those tiles instead.
          const _failed = new Set(li._failed_queries || []);
          const _broken = (...names) => names.some(n => _failed.has(n));
          const _err = '<span class="tile-empty" title="the query for this '
            + 'tile failed - this is not a zero">could not load</span>';

          const _rate = (r, n, ...q) =>
            _broken(...q) ? _err
            : n === 0 ? 'no bookings'
            : r == null ? '—'
            : `${(r * 100).toFixed(1)}%` +
              (n < 100 ? ` <span class="tile-n">of ${n} booking${n === 1 ? '' : 's'}</span>` : '');
          const _rr = li.review_ratio || 0;
          const _sr = li.support_ratio || 0;

          // Why a tile has no number. The server says so - _zeroed_because when
          // nothing could be computed, _partial_because when only the
          // vendor-level half ran. The subtitles used to read "no visit date"
          // no matter what the actual reason was, which is worse than silence:
          // it sends you looking for a missing date that was never the problem.
          const _why = li._zeroed_because || li._partial_because || '';
          const _n = (v) => (v == null ? '—' : v);
          const _pair = (a, b) =>
            (a == null || b == null) ? '—' : `${a} / ${b}`;

          // Grouped by the question each answers, because a flat grid of ten
          // equal tiles gives no clue which two matter for an RCA and which
          // are background. Ratio and counts were also two tiles showing one
          // fact - "12.5%" and "1 / 8" - so they are now one line each.
          // What the shortfall was. "57.1% of 7" leaves the obvious question
          // unanswered - three did not complete, why - and cancelled by the
          // vendor points somewhere different from a fulfilment backlog.
          // The booking ids behind the count. A number is something to note;
          // an id is something to open.
          const _ids = (list) => {
            if (!Array.isArray(list) || !list.length) return '';
            const shown = list.slice(0, 6).join(' · ');
            return `<div class="tile-why">${shown}` +
                   (list.length > 6 ? ` <span class="why-n">+${list.length - 6}</span>` : '') +
                   '</div>';
          };
          const _why_not = (rows) => {
            if (!Array.isArray(rows) || !rows.length) return '';
            return '<div class="tile-why">' + rows.slice(0, 3).map(r =>
              `<span class="why-n">${r.count}</span> ${r.reason}`).join(' · ')
              + '</div>';
          };
          // Headings carry the title only. Repeating the range on every
          // group put a date next to numbers that had not been recomputed for
          // it yet, so a stale label read as fact - and the picker at the top
          // already states the window for the whole panel.
          const _grp = (t) => `<div class="insight-group">${t}</div>`;
          const _tile = (label, value, cls) =>
            `<div class="insight-tile ${cls || ''}">
               <div class="insight-tile-label">${label}</div>
               <div class="insight-tile-value">${value}</div>
             </div>`;
          // Average rating over the picked window, with the count that decides
          // how much weight to put on it - a mean over one review reads the
          // same as a mean over a thousand without it.
          const _avgRating = (r, ...q) => {
            if (_broken(...q)) return _err;
            if (r.avg == null) return '<span class="tile-empty">no ratings</span>';
            const n = r.n || 0;
            return `${r.avg} ★ ` +
              `<span class="tile-n">from ${n.toLocaleString()} ` +
              `rating${n === 1 ? '' : 's'}</span>`;
          };
          const _share = (hit, tot, none, ...q) =>
            _broken(...q) ? _err
            : !tot ? `<span class="tile-empty">${none}</span>`
                 : `${hit} <span class="tile-n">of ${tot}</span>` +
                   ` <span class="tile-pct">${((hit / tot) * 100).toFixed(1)}%</span>`;
          const sd = li.same_day || {};

          return `<div class="insights-grid">
            ${_why ? `<div class="insight-note">${_why}</div>` : ''}

            ${_grp('Is this issue recurring here?')}
            ${_tile('Reviews', _share(li.similar_reviews_30d, li.total_reviews_30d,
                                      'no negative reviews',
                                      'reviews', 'reviews_total'),
                    _rr > 0.15 ? 'red' : '')}
            ${_tile('Support contacts', _share(li.similar_support_queries_30d,
                                               li.total_support_queries_30d,
                                               'no contacts',
                                               'support', 'support_total'),
                    _sr > 0.15 ? 'red' : '')}

            ${_grp('Same visit date, same issue')}
            ${_tile('Reviews', _broken('same_day_reviews') ? _err
                                : (li.same_day ? _n(sd.reviews) : '—')
                                  + _ids(sd.review_ids),
                    (sd.reviews > 0) ? 'red' : '')}
            ${_tile('Support contacts', _broken('same_day_support') ? _err
                                        : (li.same_day ? _n(sd.support) : '—')
                                          + _ids(sd.support_ids),
                    (sd.support > 0) ? 'red' : '')}

            ${_grp('Experience &amp; vendor')}
            ${_tile('Average rating · TGID', _avgRating(_ratTgid, 'rating_tgid'),
                    _ratTgid.avg == null ? 'grey' : '')}
            ${_tile('Average rating · TID · VID', _avgRating(_ratTv, 'rating_tidvid'),
                    _ratTv.avg == null ? 'grey' : '')}
            ${_tile('Completion · TGID',
                    _rate(li.tgid_completion_rate, (li.ff_tgid || {}).total ?? null,
                          'completion_tgid')
                    + _why_not(li.tgid_incomplete_why),
                    _ffAttnT ? 'red' : '')}
            ${_tile('Completion · VID',
                    _rate(li.vid_completion_rate, (li.ff_vid || {}).total ?? null,
                          'completion_vid')
                    + _why_not(li.vid_incomplete_why),
                    _ffAttn ? 'red' : '')}
            ${_ffAttnT || _ffAttn
              ? '<button class="flag-biz-btn full" data-flag-biz>⚑ Flag to Biz · draft message</button>'
              : ''}
          </div>`;
        })() : `
        <div class="insights-grid">
          <div class="insight-tile ${ins.tgidRating.tone}">
            <div class="insight-tile-label">TGID Rating</div>
            <div class="insight-tile-value">${ins.tgidRating.value}</div>
            <div class="insight-tile-sub">${ins.tgidRating.sub} · ${state.insightsWindow}</div>
          </div>
          <div class="insight-tile ${ins.tidVidRating.tone}">
            <div class="insight-tile-label">TID · VID Rating</div>
            <div class="insight-tile-value">${ins.tidVidRating.value}</div>
            <div class="insight-tile-sub">${ins.tidVidRating.sub} · ${state.insightsWindow}</div>
          </div>
          ${(() => {
            const _li = r.liveInsights;
            const _cr = _li ? _li.vid_completion_rate : null;
            const _crStr = _li ? (_li.vidCompletionRate || 'N/A') : ins.completion.value;
            const _ffv = _li ? _li.ff_vid : null;
            const _crTone = _cr != null && _cr < 0.95 ? 'red' : _cr == null && !_li ? ins.completion.tone : _cr == null ? 'grey' : '';
            const _crFlagToBiz = _ffv ? _ffv.needs_attention : (_cr != null ? _cr < 0.95 : ins.completion.flagToBiz);
            const _crFlagged = ins.completion.flagged;
            const _sdi = _li ? _li.sameDaySameVidIssues : ins.sameDayIssues.value;
            const _sdObj = _li ? _li.same_day_same_vid : null;
            const _sdiTone = _li ? (_sdObj && _sdObj.issues > 0 ? 'red' : _sdObj == null ? 'grey' : '') : ins.sameDayIssues.tone;
            return `
          <div class="insight-tile ${_crTone}">
            <div class="insight-tile-label">Completion %</div>
            <div class="insight-tile-value">${_crStr}</div>
            <div class="insight-tile-sub">${_li ? (_cr != null ? 'VID' : 'no data') : ins.completion.sub} · ${state.insightsWindow}</div>
            ${_crFlagToBiz
              ? '<button class="flag-biz-btn' + (_crFlagged ? ' flagged' : '') + '" data-flag-biz' + (_crFlagged ? ' disabled' : '') + '>' + (_crFlagged ? '✓ Flagged · sent to Slack' : '⚑ Flag to Biz · draft message') + '</button>'
              : ''}
          </div>
          <div class="insight-tile ${_sdiTone}">
            <div class="insight-tile-label">Same-Day Issues</div>
            <div class="insight-tile-value">${_sdi || '—'}</div>
            <div class="insight-tile-sub">${_li ? (_sdObj ? 'same-day VID bookings' : 'no visit date') : ins.sameDayIssues.sub}</div>
          </div>`;
          })()}
          ${similar}
        </div>`}
      </div>
    </div>
  `;

  // Window picker — recompute against the chosen range. This used to only set
  // state and re-render, so the caption changed ("· 90d") while the number
  // underneath stayed on whatever window the pipeline had hardcoded.
  col.querySelectorAll('.window-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const w = btn.dataset.window;
      state.insightsWindow = w;
      renderReviewCol();
      // The server recomputes for this window - it is not a client-side
      // filter. Until it answers, the tiles show the previous window's
      // numbers under the new label, so say so rather than letting them read
      // as the answer.
      col.querySelectorAll('.insight-tile-value').forEach(el => {
        el.style.opacity = '0.45';
      });
      const r = REVIEWS.find(x => x.id === state.selected);
      // No booking-id guard. It used to check r.booking.bid, which is not the
      // key the pipeline writes - it writes id - so for every review the guard
      // returned early: state moved to the new window, the panel re-rendered
      // with the OLD numbers, the tiles stayed dimmed, and no request was ever
      // sent. The picker looked stuck on one window's data forever.
      //
      // There is nothing to guard anyway. The server resolves the booking
      // itself and answers with _zeroed_because when it cannot, which is a
      // result worth rendering rather than a reason not to ask.
      if (!r) return;
      try {
        const resp = await fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(w)}`);
        if (resp.ok) {
          const ins = unwrapInsights(await resp.json());
          if (ins) r.liveInsights = ins;
        }
      } catch (e) {
        // Say something. A bare "keep what is on screen" catch is what let a
        // ReferenceError in this block masquerade as a broken window picker
        // for as long as it did: the request worked, the reply was dropped on
        // the floor, and the only visible effect was numbers that would not
        // change. A swallowed exception here has no other symptom, so it has
        // to announce itself.
        console.error('[insights] window switch failed:', e);
      }
      // Always, on every path. Leaving the dimming on is what made a failed
      // fetch look like a loaded one.
      renderReviewCol();
    });
  });

  const flagBtn = col.querySelector('[data-flag-biz]');
  if (flagBtn) {
    flagBtn.addEventListener('click', () => {
      const r = REVIEWS.find(x => x.id === state.selected);
      if (!r) return;
      // Open the draft modal
      openFlagDraftModal(r);
    });
  }

  col.querySelectorAll('.candidate-card').forEach(card => {
    card.addEventListener('click', () => {
      col.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  const confirmBtn = col.querySelector('.candidate-confirm-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      const selectedCard = col.querySelector('.candidate-card.selected');
      if (!selectedCard) return;
      const idx = parseInt(selectedCard.dataset.candidateIdx);
      const candidate = r.candidatesList && r.candidatesList[idx];
      if (!candidate) return;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '⟳ Confirming…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/select-candidate`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({bid: candidate.bid}),
        });
        if (!res.ok) throw new Error(await res.text());
        confirmBtn.textContent = '✓ Confirmed · pipeline running…';
        r.candidateState = false;
        // Poll every 3 s until the pipeline finishes (candidate_state clears)
        let polls = 0;
        const poll = setInterval(async () => {
          polls++;
          try {
            const check = await fetch(`/api/reviews/${r.id}`);
            if (!check.ok) return;
            const payload = await check.json();
            const d = payload.draft;
            if (d && !d.candidate_state) {
              clearInterval(poll);
              await loadDraftOverlays();
              renderInbox();
              renderReviewCol();
              renderRcaCol();
            }
          } catch (_) {}
          if (polls > 20) clearInterval(poll); // give up after 60 s
        }, 3000);
      } catch (e) {
        confirmBtn.textContent = '✗ Error — try again';
        confirmBtn.disabled = false;
      }
    });
  }
}

function renderRcaCol() {
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) {
    document.getElementById('rca-col').innerHTML = '';
    return;
  }

  const col = document.getElementById('rca-col');

    const vBtn = col.querySelector('.verify-btn');

            vBtn.textContent = '✓ Reply sent to Slack thread';
          } else {
            try { await navigator.clipboard.writeText(data.template); } catch (_) {}
            vBtn.textContent = '✓ No Slack thread — reply copied, paste to guest';

          vBtn.disabled = false;

  const rca = r.rca;
  const actions = rca.actionsTaken[state.actionTab] || [];
  const sup = rca.supportInteraction.length === 0
    ? `<div class="interactions"><div class="interactions-empty">No support interactions on this booking</div></div>`
    : `<div class="interactions">
        ${rca.supportInteraction.map((s, i) => `
          <div class="convo-frame ${i === 0 ? 'open' : ''}" data-frame-idx="${i}">
            <button class="convo-frame-head" data-toggle-frame="${i}">

  // SP Interaction — separate frame
  const spInter = rca.spInteraction && rca.spInteraction.length > 0

  // Slack post preview — editable plain-text that mirrors format_rca_slack
  const b = r.booking;
  function _genSlackText() {
    const nl = '\n';
    const div = '_'.repeat(61);
    const stars = '★'.repeat(parseInt(r.rating) || 0);
    const header = 'RCA — @reviewteam' + nl + 'BID ' + (b.bid || '—') + ' · ' + (r.author || '—') + ' · ' + (stars || '—');
    const l1 = rca.issueL1 || '—', l2 = rca.issueL2 || '—';
    const sub = rca.subTheme || '';
    const scenAll = [rca.primaryScenario, ...(rca.overlayScenarios || [])].filter(Boolean);
