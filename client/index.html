                      <div class="chk-ev"><span class="editable-text rca-wrap" contenteditable="true" spellcheck="false"
                            role="textbox" aria-label="Flag evidence"
                            data-flag-idx="${f._i}" data-flag-field="evidence">${esc(f.evidence) || 'No evidence — click to add.'}</span>${f.zd_ref ? ' · ' + zdLink(f.zd_ref) : ''}</div>
                    </div>
                    <button class="row-del" data-flag-del="${f._i}" title="Remove flag">×</button>
                  </div>`).join('')}
              </div>
            </div>`).join('')}</div>`}
      <button class="row-add" data-flag-add>+ Add flag</button>
    </div>`;

    // ── §1 CASE FINDINGS — the booking's story, evidenced ─────────────────
    // NOT a support-chat summary: "Support interactions" already covers
    // contact by contact. This is what the RECORDS show happened, starting at
    // the booking rather than at the first contact. `source` and `time` are
    // carried for ordering and export and are deliberately NOT rendered.
    const cfRows = Array.isArray(w.case_findings) ? w.case_findings : [];
    const cfHtml = `
    <div class="section" id="rca-casefindings-section">
      <div class="section-label">
        <span>Case findings</span>
        <span class="hint">${cfRows.length} finding${cfRows.length === 1 ? '' : 's'}</span>
        <span class="section-chev">▾</span>
      </div>
      ${cfRows.length ? cfRows.map((f, i) => `
        <div class="cf-row">
          <span class="cf-text">${edSpan(`what_went_wrong.case_findings.${i}.text`,
            (f && f.text) || '', 'click to write what the record shows')}${
            /* ref, not source or time. A bare ZD-nnnn went into href verbatim
               and resolved against the dashboard's own path, so a reference
               the model DID supply looked exactly like one it had not. */
            (() => {
              const ref = (f && f.ref) ? String(f.ref).trim() : '';
              if (!ref) return '';
              const zd = /^ZD-?(\d+)$/i.exec(ref);
              if (zd) return ` <a class="cf-ref" target="_blank" rel="noopener" href="https://${
                (r.zendeskSubdomain || 'headout')}.zendesk.com/agent/tickets/${zd[1]}">${esc(ref)}</a>`;
              if (/^https?:\/\//i.test(ref)) return ` <a class="cf-ref" target="_blank" rel="noopener" href="${esc(ref)}">source</a>`;
              return ` <span class="cf-ref">${esc(ref)}</span>`;
            })()}</span>
          <button class="x-del" data-cf-del="${i}" title="remove this finding">×</button>
        </div>`).join('')
        /* "We read the case and it showed nothing beyond the review" is a
           RESULT. A blank block reads as a case nobody opened. */
        : '<div class="rca-empty">The case history was read and shows nothing beyond the review.</div>'}
      <button class="row-add" data-cf-add>+ Add finding</button>
    </div>`;

    // ── §3 FIXES — each naming the one team that must do it ───────────────
    const fxRows = Array.isArray(w.fixes) ? w.fixes : [];
    const fxUnrouted = fxRows.filter(f => !(f && f.owner)).length;
    const fxHtml = `
    <div class="section" id="rca-fixes-section">
      <div class="section-label">
        <span>Fixes</span>
        <span class="hint">${fxRows.length} fix${fxRows.length === 1 ? '' : 'es'}${
          fxUnrouted ? ` · ${fxUnrouted} unrouted` : ''}</span>
        <span class="section-chev">▾</span>
      </div>
      ${fxRows.length ? fxRows.map((f, i) => {
        const fo = (f && f.owner) || '';
        return `
        <div class="fx-row">
          <div class="fx-head">
            <span class="fx-action">${edSpan(`what_went_wrong.fixes.${i}.action`,
              (f && f.action) || '', 'click to write what gets done')}</span>
            ${chipSel(`what_went_wrong.fixes.${i}.owner`, fo, OWNS,
                      fo ? 'chip-owner' : 'warn', 'chip-owner-sel',
                      fo || 'Unrouted')}
            <button class="x-del" data-fx-del="${i}" title="remove this fix">×</button>
          </div>
          ${(f && f.because) ? `<div class="fx-because">${edSpan(
              `what_went_wrong.fixes.${i}.because`, f.because)}</div>` : ''}
          ${!fo ? `<div class="fx-unrouted">Unrouted — no team owns this yet, so nobody will pick it up.</div>` : ''}
        </div>`;
      }).join('')
        : '<div class="rca-empty">Nothing to fix — the findings above need no action from us.</div>'}
      <button class="row-add" data-fx-add>+ Add fix</button>
    </div>`;

    _flagsHtml = flagsHtml;
    // The events timeline no longer renders here. It merged into "Booking
    // timeline" in the facts column, which is where the booking's own story
    // already lived — two lists of one story, in two columns, each missing
    // what the other had. Nothing is lost: the actor, the channel pill and
    // the ZD link all moved with it.
    // FIXES (§3) IS NOT RENDERED FOR NOW, by request, to be brought back
    // later. `fxHtml` is still BUILT above and simply not appended, so
    // restoring it is putting it back in this line.
    //
    // NOTHING UNDER IT IS REMOVED. `what_went_wrong.fixes` is still validated
    // and stored, and Actions Taken is a VIEW over exactly that array — the
    // team tabs, the Unrouted tab and the saver that regroups on every patch
    // all keep working off data this card is no longer drawing. Deleting the
    // data would have taken Actions Taken with it.
    return cfHtml + wwrHtml;
  })() : '';

  // ── v3 sections (legacy shape) ─────────────────────────────────────────
  const v3Block = newShapeBlock ? newShapeBlock : (rca.wwrScenarios || []).length ? `
    <div class="section" id="rca-wwr-section">
      <div class="section-label">What Went Wrong<span class="section-chev">▾</span></div>
      ${(rca.wwrScenarios || []).length ? `
      <div class="wwr-scenarios">
        ${rca.wwrScenarios.map((sc, i) => `
          <div class="wwr-scn ${sc.is_primary ? 'primary' : ''}" data-scn-idx="${i}">
            <div class="wwr-scn-head">
              <span class="wwr-scn-tag">${sc.is_primary ? 'PRIMARY' : 'overlay'}</span>
              <span class="wwr-scn-name">${sc.scenario_name || ''}</span>
            </div>
            <div class="wwr-scn-row">
              <span class="wwr-scn-k">Accurate?</span>
              <select class="classify-select" style="width:110px" data-scn-idx="${i}" data-scn-field="accuracy">
                ${['Yes','Partially','No'].map(o => `<option${(sc.accuracy||'')===o?' selected':''}>${o}</option>`).join('')}
              </select>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="accuracy_explanation">${sc.accuracy_explanation || ''}</span>
            </div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Why</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="why">${sc.why || ''}</span></div>
            <div class="wwr-scn-row"><span class="wwr-scn-k">Fix</span>
              <span class="editable-text wwr-scn-v" contenteditable="true" spellcheck="false"
                    data-scn-idx="${i}" data-scn-field="fix">${sc.fix || ''}</span></div>
          </div>
        `).join('')}
      </div>` : `
      <div class="wwr-stepper">
        ${/* Legacy chain. Suppressed when v3 booking_logs exist: both render as
             the same numbered stepper, so a part-migrated draft showed two
             "what happened" narratives back to back. */
          ((v3d.booking_logs || []).length ? [] : (rca.wwrChain || [])).map((step, i) => `
          <div class="wwr-step" data-step="${i}">
            <div class="wwr-step-num">${step.step || (i + 1)}</div>
            <div class="wwr-step-body">
              <div class="wwr-what editable-text" contenteditable="true" spellcheck="false"
                   data-wwr-idx="${i}" data-wwr-field="what"><strong>${step.what || ''}</strong></div>
              <div class="wwr-why editable-text" contenteditable="true" spellcheck="false"
                   style="color:var(--muted-2)"
                   data-wwr-idx="${i}" data-wwr-field="why">${step.why || ''}</div>
            </div>
            <button class="action-delete-btn" data-wwr-delete="${i}" title="Remove step">×</button>
          </div>
        `).join('<div class="wwr-connector"></div>')}
      </div>
      <button class="action-add-btn" data-wwr-add>+ Add step</button>`}
    </div>



    <!-- The legacy checklist wall is gone. Its answers were "No" for "was
         there a tone problem?", i.e. No = no error, so rendering every No as
         a flag produced flags that contradicted their own evidence. Flags now
         come only from rca_v3.flags, which returns failures only. -->
  ` : '';

  // ── Six-tab bar (handoff §1): the slide-over is six tabs, not one scroll ──
  // Every badge is the number of rows its tab renders; no badge when zero
  // (handoff: counts are derived from the rows, never hand-written), so the
  // badge cannot drift from what the panel shows.
  const _wwr5 = v3d.what_went_wrong || {};
  // Every badge counts the rows/parts its tab actually renders — no badge when
  // zero. Read the SAME variables the panels render from, not the raw model
  // lists: the Interactions panel draws `_rows` (guest↔support frame-groups and
  // orphan notes) and `spRowCount` (SP groups + orphan records), and its header
  // says "N contacts" off `_rows.length` — a badge counting the model's note
  // list instead read 0 over rows that were on screen (the drift the header
  // comment below already had to fix once). Resolution renders one section with
  // three parts (DSS / Resolution / Takedown); its badge counts the parts that
  // carry content, so a brand-new review shows no "3".
  const _td5 = v3d.takedown || {};
  const _res5 = (rca.resolution || '').trim();
  const _rcaCounts = {
    diag: (_wwr5.guest_issues || []).length + (_wwr5.case_findings || []).length,
    inter: _rows.length + spRowCount + (v3d.flags || []).length,
    actions: Object.values(rca.actionsTaken || {}).reduce((a, x) => a + (x || []).length, 0),
    res: [
      !!(v3d.dss || {}).prescribes,
      !!(_res5 && _res5 !== '—'),
      !!(_td5.verdict || _td5.recommended != null),
    ].filter(Boolean).length,
    reply: (rca.reply || '').trim() ? 1 : 0,
    slack: 0,
  };
  const _RCA_TABS = [['diag', 'Diagnosis'], ['inter', 'Interactions'],
    ['actions', 'Actions'], ['res', 'Resolution'], ['reply', 'Reply'], ['slack', 'Slack']];
  const _rcaTabBar = `<div class="rca-tabbar">` + _RCA_TABS.map(([k, label]) => {
    const n = _rcaCounts[k] || 0;
    return `<button class="rca-tab${state.rcaTab === k ? ' active' : ''}" data-rca-tab="${k}">`
      + label + (n > 0 ? `<span class="tab-n">${n}</span>` : '') + `</button>`;
  }).join('') + `</div>`;

  col.innerHTML = `
    <!-- §14 one baseline-aligned row, not a two-line stack: the label and the
         sub-line cost ~34px at the top of every review. The dropped clause is
         not lost - it moves into the row's title, and the Send button's own
         card already says "goes out via Trustpilot on Send ↑". -->
    <div class="rca-head" title="Send marks the review as sent — paste the reply into Trustpilot manually">
      <div class="rca-title-row">
        <div class="rca-title">RCA &amp; response</div>
        <div class="rca-sub">Drafted by AI ${r.time || ''} · every field editable</div>
      </div>
      <div class="rca-head-actions">
        <button class="refresh-slack-btn" data-rca-only-regen
                title="One model call over the stored booking/timeline/insights — no re-matching, no BigQuery, no Zendesk.">↻ RCA only</button>
        <button class="btn copy-response-btn">Copy response</button>
        <button class="send-btn">Send ↑</button>
      </div>
    </div>

    <div class="rca-stack-outer">
    ${_rcaTabBar}
    <div class="rca-tab-panel${state.rcaTab === 'diag' ? ' active' : ''}" data-tab="diag">
    <div class="section">
      <div class="section-label"><span>Guest's stated issue</span><span class="section-chev">▾</span></div>
      <div class="stated-issue">
        <!-- data-v3p, or this box is a dead control. It rendered editable,
             took the text, flashed nothing and saved nothing: the generic
             path saver binds on [data-v3p] and this was the one editable in
             the column without it, so the edit survived until the next
             render and then reverted. Same failure as "+ Add" and the section
             chevrons — a bound control and an unbound one look identical. -->
        <div class="stated-issue-text editable-text" contenteditable="true" spellcheck="false"
             data-v3p="stated_issue">${esc(_statedIssue)}</div>
        ${_statedIssue.trim() ? '' : `<div class="rca-empty">${
          // "Nothing was extracted" is a claim about the review, and it was
          // made for a call that threw just as readily as for a review with
          // nothing in it. When the RCA below is full, the claim is provably
          // false: the model had plenty to say about the same text.

            // neutral chip AND a sentence rather than a blank or a dash: the

            const FOLLOWED = {

                'The prescribed path was open and we took it.'],
              not_followed:  ['No', 'bad',
                'The path was open and we did not take it — this is a finding, not a note.'],

        const lang = lv.language || r.lang || '';
        const isEn = lv.state === 'english';
        // An English review draws ONE box. No translate control, no English

        // So both boxes are drawn here too. The English one is where the

        // rather than sending the reader elsewhere.
        // THE LANGUAGE IS NOT SOMETHING TO TYPE. The guest wrote the review

        </div>

        }

        return head + outBox + `

        </div>` : ''}

        </div>` : ''}
        <textarea class="reply-text" data-english-reply
          placeholder="English working copy">${esc(engText)}</textarea>
        <div class="reply-meta">
          <span data-english-status>${stale
            ? `Behind the ${esc(lang)} reply`
            : (ev.state === 'current' ? `Matches the ${esc(lang)} reply` : '')}</span>

                  data-apply-english>Apply to ${esc(lang)}</button>

      })()}

  `;

  col.querySelectorAll('.action-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.actionTab = tab.dataset.tab;
      renderRcaCol();
    });
  });

  // ── v3 event handlers ──────────────────────────────────────────────────────

  // WWR chain — inline edits on what/why fields
  col.querySelectorAll('[data-wwr-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const idx = parseInt(el.dataset.wwrIdx);
      const field = el.dataset.wwrField;
      if (!rca.wwrChain[idx]) return;
      rca.wwrChain[idx][field] = el.textContent.trim();
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
    });
  });

  // WWR chain — delete step
  col.querySelectorAll('[data-wwr-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.wwrDelete);
      rca.wwrChain.splice(idx, 1);
      rca.wwrChain.forEach((s, i) => { s.step = i + 1; });
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
      renderRcaCol();
    });
  });

  // WWR chain — add step
  const wwrAddBtn = col.querySelector('[data-wwr-add]');
  if (wwrAddBtn) {
    wwrAddBtn.addEventListener('click', async () => {
      rca.wwrChain.push({step: rca.wwrChain.length + 1, what: 'New step', why: ''});
      await saveDraft(r.id, {wwr_chain: rca.wwrChain});
      renderRcaCol();
    });
  }

  // WWR scenario blocks — edits persist the whole array
  const persistWwrScenarios = async () => {
    await saveDraft(r.id, {wwr_scenarios: rca.wwrScenarios});
  };
  col.querySelectorAll('span[data-scn-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const sc = (rca.wwrScenarios || [])[parseInt(el.dataset.scnIdx)];
      if (!sc) return;
      sc[el.dataset.scnField] = el.textContent.trim();
      await persistWwrScenarios();
    });
  });
  col.querySelectorAll('select[data-scn-idx]').forEach(el => {
    el.addEventListener('change', async () => {
      const sc = (rca.wwrScenarios || [])[parseInt(el.dataset.scnIdx)];
      if (!sc) return;
      sc[el.dataset.scnField] = el.value;
      await persistWwrScenarios();
    });
  });

  // RCA Checklist — collapsible section groups
  col.querySelectorAll('[data-chk-group-toggle]').forEach(head => {
    head.addEventListener('click', () => {
      head.closest('.chk-group').classList.toggle('open');
    });
  });

  // Slack thread post — one editable row per section. The store is unchanged:
  // the hidden [data-slack-edit] mirror still holds the composed text that the
  // post button and regenerate read. Editing a row recomposes the WHOLE post
  // from the rows (same header, seam and order the composer uses) and writes it
  // back — folks edit these bodies by hand every day, so the blur-to-save path
  // is load-bearing and must not be lost. Recomposing from the rows rather than
  // patching the blob means an edit can never land under the wrong heading.
  const slackArea = col.querySelector('[data-slack-edit]');
  const _recomposeSlack = () => {
    const sections = _genSlackText.sections || [];
    const chosen = state.slackSections[r.id] || {};
    const div = _genSlackText.div || '_'.repeat(61);
    const parts = [...(_genSlackText.header || [])];
    for (const [key, label, body] of sections) {
      if (chosen[key] === false) continue;          // left out
      const cell = col.querySelector(`[data-slack-sec-body="${key}"]`);
      const bt = cell
        ? cell.innerText.replace(/ /g, ' ').replace(/[ \t]+$/gm, '').replace(/\s+$/, '')
        : body;
      if (!bt || !bt.trim()) continue;              // empty / nothing to post
      parts.push(div, '*' + label + '*', '', bt);
    }
    return parts.join('\n');
  };
  const _saveRecomposed = async (flashEl) => {
    const text = _recomposeSlack();
    rca.slackThreadOverride = text;
    if (slackArea) slackArea.value = text;           // keep the hidden store in sync
    const ok = await saveDraft(r.id, {slack_thread_override: text});
    flashSaved(flashEl, ok);
  };
  col.querySelectorAll('[data-slack-sec-body]').forEach(cell => {
    cell.addEventListener('blur', () => _saveRecomposed(cell));
  });

  // leave out / put back — splice ONE section, leaving every other row (and its
  // edits) byte-for-byte. Re-renders because which rows exist changes.
  //
  // Slack regenerate: clear the override, rebuild from the RCA as it stands now.
  //
  // The store is still the override text — what is saved is what is shown is
  // what is sent. `_spliceSlackSection` edits that text; the derived selection
  // (`_sectionsFromText`) follows from it.
  const _spliceSave = async (mutate) => {
    const base = rca.slackThreadOverride || _genSlackText();
    const text = mutate(base);
    rca.slackThreadOverride = text;
    state.slackSections[r.id] = _sectionsFromText(text) || {};
    await saveDraft(r.id, {slack_thread_override: text});
    renderRcaCol();
  };
  // all / none flash the rows (65px below the button and always in view), NOT
  // the hidden mirror at the foot — a confirmation nobody can see is a mechanism
  // that runs while producing no visible effect.
  const _flashRows = () => flashSaved(col.querySelector('[data-slack-rows]'), true);
  const secAll = col.querySelector('[data-slack-sec-all]');
  if (secAll) secAll.addEventListener('click', async () => {
    // add every missing section; sections already present keep their edits
    await _spliceSave(t => _slackSectionKeys.reduce(
      (acc, [k]) => _spliceSlackSection(acc, k, true), t));
    _flashRows();
  });
  const secNone = col.querySelector('[data-slack-sec-none]');
  if (secNone) secNone.addEventListener('click', async () => {
    await _spliceSave(t => _slackSectionKeys.reduce(
      (acc, [k]) => _spliceSlackSection(acc, k, false), t));
    _flashRows();
  });
  col.querySelectorAll('[data-slack-drop]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await _spliceSave(t => _spliceSlackSection(t, btn.dataset.slackDrop, false));
    });
  });
  col.querySelectorAll('[data-slack-restore]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await _spliceSave(t => _spliceSlackSection(t, btn.dataset.slackRestore, true));
    });
  });

  // ── What went wrong: per-issue collapse, expand-all, add rows ──────────
  col.querySelectorAll('[data-wwr-toggle]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[contenteditable="true"], button, a')) return;
      const i = parseInt(el.dataset.wwrToggle);
      state.wwrOpen[i] = state.wwrOpen[i] === false;
      renderRcaCol();
    });
  });
  const wwrAll = col.querySelector('[data-wwr-all]');
  if (wwrAll) wwrAll.addEventListener('click', () => {
    const rows = col.querySelectorAll('[data-wwr-toggle]').length;
    const allOpen = Array.from({length: rows}, (_, i) => state.wwrOpen[i] !== false).every(Boolean);
    for (let i = 0; i < rows; i++) state.wwrOpen[i] = !allOpen;
    renderRcaCol();
  });
  // ── WWR issue internals ──────────────────────────────────────────────────
  // One accessor for every handler below. Nothing here branches on whether a
  // row came from the model or from a click - that was a real bug class: the
  // flag team-select once wrote only to operator-added rows, so on the common
  // case (AI-generated) the choice silently snapped back.
  const _gi = (i) => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    const list = w.guest_issues = w.guest_issues || [];
    return list[i] || (list[i] = {});
  };
  // Evidence is {text, source, ref} now; a legacy string is lifted on touch
  // rather than being left as a shape the row renderer has to special-case.
  // THE EVIDENCE HANDLERS WENT WITH THEIR ROWS. `data-wwr-ev-add` and
  // `data-ev-del` were bound here and nothing rendered either attribute once
  // `evRow` turned out to have no callers — three pieces of a control that
  // could not be reached, held together by a census that only ever asked
  // whether a RENDERED control has a test.
  //
  // Adding and removing a claim-backing fact is `data-cf-add` / `data-cf-del`
  // on §1 now, where the facts actually render.

  // The claim × persists claim: null immediately - a real removal, not a UI
  // hide. "+ Claim" recreates the field.
  col.querySelectorAll('[data-claim-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      _gi(parseInt(btn.dataset.claimDel)).claim = null;
      await persistV3(); renderRcaCol();
    });
  });
  col.querySelectorAll('[data-claim-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      _gi(parseInt(btn.dataset.claimAdd)).claim = 'Quote the guest’s own words here';
      await persistV3(); renderRcaCol();
    });
  });

  // The four optional analysis lines. Deleting persists null and restores the
  // "+" button; adding creates the field with placeholder text.
  col.querySelectorAll('[data-aline-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, k] = btn.dataset.alineDel.split(':');
      _gi(parseInt(i))[k] = null;
      await persistV3(); renderRcaCol();
    });
  });
  // Fix / Closes. One level deeper than the lines above — they are fields on
  // the issue, these are fields on `issue.fix` — so the path differs and the
  // handler cannot be shared, but the SAVE PATH is the same `persistV3` and
  // the control is the same ×.
  //
  // Removing the last populated key drops the whole `fix` object rather than
  // leaving `{action: null, because: null}` behind.
  //
  // NOT because Actions Taken would route it — that is built from the
  // DOCUMENT-level `what_went_wrong.fixes` array, and `issue.fix` is a
  // different store that only feeds it through `_fix_rows`'s migration of
  // pre-restructure drafts. The husk is dropped because storing one means the
  // next reader has to know that `fix` being present says nothing about
  // whether there is a fix, and `_fix_rows` already treats "no action" and
  // "no fix" as the same thing on the way in.
  col.querySelectorAll('[data-fix-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, k] = btn.dataset.fixDel.split(':');
      const gi = _gi(parseInt(i));
      if (!gi || !gi.fix || typeof gi.fix !== 'object') return;
      gi.fix[k] = null;
      const left = ['action', 'because'].some(f => String(gi.fix[f] || '').trim());
      if (!left) gi.fix = null;
      await persistV3(); renderRcaCol();
    });
  });

  const _APH = {
    operational_failure: 'What a person or system did wrong on this issue',
    sop_gap: 'The missing or deficient process step for this issue',
    pattern: 'Recurrence evidence for this issue, with counts and window',
    fix: 'Team: action (owner: Team)',
  };
  col.querySelectorAll('[data-aline-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [i, k] = btn.dataset.alineAdd.split(':');
      _gi(parseInt(i))[k] = _APH[k] || 'Click to edit';
      await persistV3(); renderRcaCol();
    });
  });

  // Every chip-select in the RCA column, by its rca_v3 dot path. One handler,
  // so a chip can never be rendered and silently unsaved.
  col.querySelectorAll('select[data-v3sel]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const parts = sel.dataset.v3sel.split('.');
      let obj = rca.v3;
      for (let n = 0; n < parts.length - 1; n++) {
        const key = /^\d+$/.test(parts[n]) ? parseInt(parts[n]) : parts[n];
        const nextIsIdx = /^\d+$/.test(parts[n + 1]);
        if (obj[key] == null) obj[key] = nextIsIdx ? [] : {};
        obj = obj[key];
      }
      const last = parts[parts.length - 1];
      obj[/^\d+$/.test(last) ? parseInt(last) : last] = sel.value;
      await persistV3(sel);
      renderRcaCol();          // the chip recolours live
    });
  });
  const wwrIssueAdd = col.querySelector('[data-wwr-issue-add]');
  if (wwrIssueAdd) wwrIssueAdd.addEventListener('click', async () => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    // §2c a FULL skeleton, not a stub: claim, one evidence row and a root
    // cause, all pre-filled. An added issue must be indistinguishable from an
    // AI-generated one - empty strings would render the add-buttons instead of
    // the rows, so the operator gets a different shape for the same thing.
    w.guest_issues = [...(w.guest_issues || []),
      {issue: 'New issue — click to edit',
       claim: 'Quote the guest’s own words here',
       claim_accuracy: 'Unknown', owner: 'CE',
       root_cause: 'Click to write the failing step',
       evidence: [{text: 'New evidence — click to edit', source: null, ref: null}]}];
    await persistV3(); renderRcaCol();
  });

  col.querySelectorAll('[data-wwr-issue-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.wwrIssueDel;
      const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
      const gone = (w.guest_issues || [])[i];
      // CONFIRM, because this is the one control on the card that destroys
      // analysis rather than a field. Everything else here is a value someone
      // can retype; an issue carries its claim, its verdict, its root cause
      // and its evidence, and a mis-click loses all of it with no undo.
      const name = (gone && gone.issue) || 'this issue';
      if (!window.confirm(`Delete ${name}? Its claim, verdict, root cause and evidence go with it.`))
        return;
      w.guest_issues = (w.guest_issues || []).filter((_, n) => n !== i);
      // The open/shut state is keyed by INDEX, so every issue after the
      // deleted one would inherit the wrong one. Rebuilt rather than patched:
      // an off-by-one here silently collapses the wrong block.
      state.wwrOpen = {};
      await persistV3(); renderRcaCol();
    });
  });

  // ── §1 case findings, §3 fixes ────────────────────────────────────────
  // AT THE SAME LEVEL as the handler above, not nested inside it. A handler
  // spliced into another handler's body is syntactically valid, parses clean,
  // and never binds — the fourth such failure in this file, and the reason
  // the parse check alone is not enough.
  const cfAdd = col.querySelector('[data-cf-add]');
  if (cfAdd) cfAdd.addEventListener('click', async () => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    // A full row, not a stub: `source` and `time` are carried unrendered, and
    // an added finding must round-trip the same shape the model writes.
    w.case_findings = [...(w.case_findings || []),
      {text: 'New finding — click to write what the record shows',
       source: null, time: null}];
    await persistV3(); renderRcaCol();
  });
  col.querySelectorAll('[data-cf-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.cfDel;
      const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
      w.case_findings = (w.case_findings || []).filter((_, n) => n !== i);
      await persistV3(); renderRcaCol();
    });
  });
  const fxAdd = col.querySelector('[data-fx-add]');
  if (fxAdd) fxAdd.addEventListener('click', async () => {
    const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
    // owner null ON PURPOSE. A new fix pre-assigned to a plausible team is a
    // row attributed to people who never agreed to it; unrouted is visible,
    // and the Unrouted tab is where it waits.
    w.fixes = [...(w.fixes || []),
      {action: 'New fix — click to write what gets done',
       owner: null, because: ''}];
    await persistV3(); renderRcaCol();
  });
  col.querySelectorAll('[data-fx-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.fxDel;
      const w = rca.v3.what_went_wrong = rca.v3.what_went_wrong || {};
      w.fixes = (w.fixes || []).filter((_, n) => n !== i);
      await persistV3(); renderRcaCol();
    });
  });

  // ── Guest <-> support: per-contact expand ──────────────────────────────
  // "+ Add contact" writes a NOTE, not a frame. Frames are Zendesk-derived
  // facts the pipeline owns; an operator-added contact is by definition one
  // the system has no ticket for, so it renders unverified - which is the
  // honest label for it, not a downgrade.
  const contactAdd = col.querySelector('[data-contact-add]');
  if (contactAdd) contactAdd.addEventListener('click', async () => {
    rca.v3.support_interaction_notes = [...(rca.v3.support_interaction_notes || []),
      {zd_ref: null, summary: 'New contact — click to edit', detail: null, ce_miss: null}];
    rca.supportNotes = rca.v3.support_interaction_notes;
    await persistV3(); renderRcaCol();
  });

  const dssEdit = col.querySelector('[data-dss-edit]');
  if (dssEdit) dssEdit.addEventListener('click', () => {
    state.dssEdit = !state.dssEdit; renderRcaCol();
  });

  col.querySelectorAll('[data-ix-toggle]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[contenteditable="true"], button, a')) return;
      const i = parseInt(el.dataset.ixToggle);
      state.ixOpen[i] = !state.ixOpen[i];
      renderRcaCol();
    });
  });

  // ── Response card ─────────────────────────────────────────────────────
  // ONE STORE. `data-outgoing-reply` is the reply that goes to the guest, in
  // the guest's language, and it is what Edit, Copy and Send all act on. The
  // English box is `data-english-reply` and is never read by any of them.
  const replyArea = col.querySelector('[data-outgoing-reply]');
  const replyEdit = col.querySelector('[data-reply-edit]');
  if (replyEdit && replyArea) replyEdit.addEventListener('click', () => {
    replyArea.focus();
    replyArea.setSelectionRange(replyArea.value.length, replyArea.value.length);
  });

  // Editing the outgoing reply directly persists it as the human answer, and
  // leaves the English projection BEHIND — which the server works out from the
  // digest and the card then says out loud. Nothing here quietly re-translates:
  // a direct edit is the associate's own words and must survive.
  if (replyArea) replyArea.addEventListener('blur', async () => {
    const val = replyArea.value;
    if (val.trim() === (rca.reply || '').trim()) return;
    rca.reply = val;
    const ok = await saveDraft(r.id, {final_response: val}, replyArea);
    if (ok) renderRcaCol();     // re-read english_view: it may now be stale
  });

  // Apply an English edit by TRANSLATING it into the outgoing reply.
  //
  // On blur or on this button, never per keystroke. While the call is in
  // flight the two boxes disagree — the English shows the edit and the
  // outgoing reply does not — and the card says so rather than letting the
  // pair look settled. On failure the outgoing reply is untouched and the
  // status line says the English edit was NOT applied, and why.
  const engArea  = col.querySelector('[data-english-reply]');
  const applyEng = col.querySelector('[data-apply-english]');
  // AUTO-RESOLVE THE GUEST'S LANGUAGE. Present only in the unknown case, and
  // fired once: the server reads the review's ORIGINAL text, records the
  // language, and — when the reply is still sitting in English — translates
  // it, so the pair of boxes arrives in the state it should already have been
  // in. Nothing is typed by hand.
  //
  // `rca._langResolved` is set whichever way it goes, so a second render does
  // not re-fire it, and so the panel can say we looked and could not tell
  // rather than showing the same "working it out…" line forever.
  const langPanel = col.querySelector('[data-resolve-lang="1"]');
  if (langPanel) {
    const stat = langPanel.querySelector('[data-lang-status]');
    (async () => {
      try {
        const resp = await fetch(`/api/reviews/${r.id}/resolve-reply-language`,
                                 {method: 'POST'});
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || `${resp.status}`);
        rca._langResolved = data.note || '';
        if (data.outcome === 'detected') {
          rca.responseLanguage = data.response_language || rca.responseLanguage;
          rca.englishView      = data.english_view || rca.englishView;
          if (data.outgoing) rca.reply = data.outgoing;
          // The re-render draws the two-box panel, which has no place for
          // this response's note — and the note is the only thing that
          // distinguishes "translated into French" from "the language is
          // French but the translation failed and this is still English".
          rca._langNote = data.translated ? '' : (data.note || '');
          renderRcaCol();
          return;
        }
        // Looked and could not tell, or the review really is English. Said in
        // the panel, because an unchanged card is how "did not run" looks.
        if (stat) { stat.textContent = data.note || 'The language could not be named.';
                    stat.style.color = 'var(--warn,#c93)'; }
      } catch (e) {
        rca._langResolved = 'The language check failed: ' + String(e.message || e).slice(0, 120)
                          + ' — the reply is unchanged and still in English.';
        if (stat) { stat.textContent = rca._langResolved;
                    stat.style.color = 'var(--warn,#c93)'; }
      }
    })();
  }
  const engStat  = col.querySelector('[data-english-status]');
  const _applyEnglish = async () => {
    if (!engArea || !applyEng) return;
    const english = engArea.value.trim();
    if (!english) {
      if (engStat) engStat.textContent = 'Nothing to apply — the English box is empty.';
      return;
    }
    const orig = applyEng.textContent;
    applyEng.disabled = true;
    applyEng.textContent = 'translating…';
    if (engStat) {
      engStat.textContent = 'IN FLIGHT — the boxes disagree: this English is not '
                          + 'in the outgoing reply yet.';
      engStat.style.color = 'var(--warn,#c93)';
    }
    try {
      const resp = await fetch(`/api/reviews/${r.id}/apply-english-reply`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({english}),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || `${resp.status} — translation failed`);
      // The server is what decided the outgoing text; take it back rather
      // than assuming what it wrote.
      rca.reply = data.outgoing || rca.reply;
      rca.englishView = {state: data.english_state || 'current',
                         text: data.english || english,
                         outgoing: rca.reply, why: data.note || ''};
      renderRcaCol();
    } catch (e) {
      // The outgoing reply was NOT changed. Say that, not just "failed" —
      // an edit that looks saved and is not is the thing this guards.
      applyEng.disabled = false;
      applyEng.textContent = orig;
      if (engStat) {
        engStat.textContent = 'NOT APPLIED — the outgoing reply is unchanged. '
                            + String(e.message || e).slice(0, 160);
        engStat.style.color = 'var(--warn,#c93)';
      }
    }
  };
  if (applyEng) applyEng.addEventListener('click', _applyEnglish);
  // Blur applies too, but only when the text actually changed — otherwise
  // clicking away from an untouched box would spend a translation call.
  if (engArea) {
    engArea._engBefore = engArea.value;
    engArea.addEventListener('blur', () => {
      if (engArea.value.trim() === (engArea._engBefore || '').trim()) return;
      engArea._engBefore = engArea.value;
      _applyEnglish();
    });
  }

  const replyCopy = col.querySelector('[data-reply-copy]');
  if (replyCopy && replyArea) replyCopy.addEventListener('click', async () => {
    // The OUTGOING reply, always. Copying the English box is how an English
    // reply ends up pasted onto a review written in another language.
    try { await navigator.clipboard.writeText(replyArea.value); } catch (_) {}
    replyCopy.textContent = '✓ Copied';
    setTimeout(() => { replyCopy.textContent = '⧉ Copy'; }, 1500);
  });

  // Post the RCA into the review's own Slack thread. Separate from Send,
  // which also closes the review - the RCA usually goes to the team while
  // the guest reply is still being edited.

  // ── when Slack refuses ────────────────────────────────────────────────
  //
  // The review STAYS WHERE IT IS. Nothing was posted, so nothing is marked
  // sent — a Sent row for a refused post is a lie told in the one tab that
  // exists to say what still needs doing.
  //
  // The server sends {message, slack_error, verdict, retryable}. It used to
  // send a bare string and the client did `new Error(data.detail)`, so a
  // structured detail would render as "[object Object]" — the same defect
  // that put "• Fix: [object Object]" into a real Slack post. Both shapes are
  // handled: an older server, or a FastAPI validation error, still says
  // something a person can read.
  function postError(detail) {
    const d = (detail && typeof detail === 'object') ? detail : {};
    const e = new Error(d.message || (typeof detail === 'string' && detail) ||
                        'The post did not go through, and no reason came back.');
    e.slackError = d.slack_error || '';
    e.retryable  = !!d.retryable;
    return e;
  }

  function clearPostError(col) {
    const box = col.querySelector('[data-slack-post-err]');
    if (box) box.innerHTML = '';
  }

  function showPostError(col, e) {
    const box = col.querySelector('[data-slack-post-err]');
    if (!box) return;
    const code = e && e.slackError
      ? ` <span class="code">Slack said: ${esc(e.slackError)}</span>` : '';
    // "Still in Matched" is the reassurance that matters and is the thing a
    // reader cannot otherwise verify without switching tabs.
    box.innerHTML =
      `<div class="slack-post-err"><b>Not posted.</b> ` +
      `${esc(String((e && e.message) || e))} ` +
      `This review has not moved — it is still here.${code}</div>`;
  }

  const slackPostBtn = col.querySelector('[data-slack-post]');
  if (slackPostBtn && r.rcaPostedAt) {
    // Already in the thread. Say so rather than offering a fresh post — the
    // second copy is what people actually see, and nothing warned about it.
    slackPostBtn.textContent = '✓ Posted ' + _shortWhen(r.rcaPostedAt);
    slackPostBtn.classList.add('posted');
  }
  if (slackPostBtn) slackPostBtn.addEventListener('click', async () => {
    const orig = slackPostBtn.textContent;
    if (r.rcaPostedAt && !slackPostBtn.dataset.confirming) {
      slackPostBtn.dataset.confirming = '1';
      slackPostBtn.textContent = 'Post a second copy?';
      setTimeout(() => {
        delete slackPostBtn.dataset.confirming;
        slackPostBtn.textContent = orig;
      }, 4000);
      return;
    }
    const again = !!slackPostBtn.dataset.confirming;
    delete slackPostBtn.dataset.confirming;
    slackPostBtn.disabled = true; slackPostBtn.textContent = 'posting…';
    try {
      // Send the post that is ON SCREEN. This used to send no body, so the
      // server rebuilt the full RCA from the draft and every section the
      // associate had switched off went to Slack regardless. Reading the
      // textarea rather than the saved override also covers the case where
      // the button is clicked before the edit has blurred.
      const area = col.querySelector('[data-slack-edit]');
      // Recompose from the rows first: clicking Post blurs the focused row in
      // most browsers, but reading the rows directly guarantees an in-progress
      // hand edit is captured — folks edit these bodies constantly and a lost
      // edit here is a wrong post to the whole team.
      if (area && col.querySelector('[data-slack-sec-body]')) area.value = _recomposeSlack();
      const text = area ? area.value : '';
      if (area && text.trim() !== (rca.slackThreadOverride || '').trim()) {
        rca.slackThreadOverride = text.trim();
        await saveDraft(r.id, {slack_thread_override: text.trim()});
      }
      const resp = await fetch(`/api/reviews/${r.id}/post-rca${again ? '?force=true' : ''}`,
                               {method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({text: text.trim() || null})});
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw postError(data.detail);
      clearPostError(col);
      r.rcaPostedAt = data.posted_at || new Date().toISOString();

      // POSTING FINISHES THE REVIEW. The RCA is in the thread, which is the
      // work; leaving the review in Matched afterwards meant every posted
      // review had to be marked sent by hand as a second, separate step, and
      // one forgotten click left finished work sitting in the queue.
      //
      // /send, not a second code path — it is the same endpoint the Send ↑
      // button calls, and it refuses to post when rca_posted_at is already
      // set, which it now is. So nothing reaches the thread twice: the guard
      // is reused rather than re-implemented.
      //
      // A FAILURE HERE DOES NOT UNDO THE POST. The RCA has gone out; that is
      // a fact and the card keeps saying so. Only the move to Sent is
      // reported as not having happened, with the button beside it left in
      // the state that completes it by hand.
      let _sentOk = true, _sentWhy = '';
      try {
        const sres = await fetch(`/api/reviews/${r.id}/send`, {method: 'POST'});
        if (!sres.ok) throw new Error(`${sres.status} ${await sres.text()}`.slice(0, 160));
        const sout = await sres.json().catch(() => ({}));
        r.status    = 'sent';
        r.sentRoute = sout.sent_route || 'rca_posted';
      } catch (e2) {
        _sentOk  = false;
        _sentWhy = String(e2.message || e2);
      }

      // The button beside this one. With the RCA in the thread it can only
      // ever be "mark sent" — never the /close route, which would record a
      // review whose RCA went out as closed without posting.
      const _sentBtn = col.querySelector('[data-mark-sent]');
      if (_sentBtn) {
        _sentBtn.disabled = false;
        _sentBtn.dataset.sentMode = 'send';
        _sentBtn.textContent = _sentOk ? '✓ Sent' : 'Mark sent →';
        _sentBtn.title = 'Finish this review. The RCA is already in the '
                       + 'thread, so nothing is posted again.';
      }
      if (!_sentOk) {
        // Counted and said. "Posted" alone would leave the reader to notice
        // for themselves that the review is still in Matched.
        showPostError(col, {message: 'The RCA IS in the thread — that part '
                                     + 'worked. Moving the review to Sent did '
                                     + 'not: ' + _sentWhy
                                     + ' Use the button beside this one.',
                            retryable: true});
      }
      slackPostBtn.textContent = data.already_posted
        ? '✓ Already posted ' + _shortWhen(r.rcaPostedAt)
        : (_sentOk ? '✓ Posted & sent' : '✓ Posted to thread');
      // REFRESH NOW, NOT ON A TIMER. A delayed reload re-renders this column
      // two and a half seconds after the click and replaces the button under
      // whoever is still looking at it — and the review moving to Sent is the
      // confirmation, so there is nothing to wait for. The transient label
      // above is a courtesy; the card leaving the queue is the answer.
      if (_sentOk) {
        await reloadFromServer();
      } else {
        setTimeout(() => {
          slackPostBtn.disabled = false;
          slackPostBtn.textContent = '✓ Posted ' + _shortWhen(r.rcaPostedAt);
        }, 2500);
      }
    } catch (e) {
      // The button says only that it did not go. The REASON goes in the
      // notice, because it is two sentences and a button label is not.
      showPostError(col, e);
      slackPostBtn.disabled = false;
      slackPostBtn.textContent = e && e.retryable ? 'Try posting again' : orig;
    }
  });

  const rcaOnly = col.querySelector('[data-rca-only-regen]');
  if (rcaOnly) rcaOnly.addEventListener('click', async () => {
    const orig = rcaOnly.textContent;
    rcaOnly.disabled = true; rcaOnly.textContent = 'regenerating…';
    try {
      const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({scenarios: []}),
      });
      if (!resp.ok) throw new Error(await resp.text());
      await fetchInbox(); renderRcaCol();
    } catch (e) {
      rcaOnly.textContent = 'failed — see server log';
      setTimeout(() => { rcaOnly.disabled = false; rcaOnly.textContent = orig; }, 3000);
      return;
    }
  });

  const slackRegen = col.querySelector('[data-slack-regen]');
  if (slackRegen) {
    slackRegen.addEventListener('click', async () => {
      rca.slackThreadOverride = '';
      await saveDraft(r.id, {slack_thread_override: ''});
      // Re-render the whole column: the post must be rebuilt from the RCA
      // as it stands NOW, including edits saved since the last render. The
      // old handler wrote into a textarea the render then replaced, so
      // clicking it appeared to do nothing.
      renderRcaCol();
      // Flash the rows, which are in view — not the hidden [data-slack-edit]
      // mirror at the foot. Flashing an element with display:none puts the tick
      // nowhere, so a successful regenerate would look like a dead button.
      flashSaved(document.querySelector('[data-slack-rows]'), true);
    });
  }

  const subThemeSel = document.querySelector('[data-subtheme-select]');
  if (subThemeSel) {
    subThemeSel.addEventListener('change', async () => {
      const val = subThemeSel.value || null;
      rca.subTheme = val;
      if (await saveDraft(r.id, { sub_theme: val })) {
        fetchInbox().then(() => { renderInbox(); });
      }
    });
  }

  // Any scenario change (primary or overlays) re-runs the RCA against the
  // corrected checklists - the whole point of the field being editable.
  const regenStatus = col.querySelector('[data-scenario-regen-status]');
  // Persist the routing lists, then re-run the RCA against them. Saving
  // first matters: if generation fails the chips still reflect what the
  // person chose, instead of snapping back on the next render.
  const saveRouting = async () => {
    await saveDraft(r.id, {
      sub_themes: rca.subThemes || [],
      scenarios:  rca.scenarios || [],
      overlay_scenarios: rca.overlayScenarios || [],
    });
  };
  const regenRca = () => regenerateForScenarios(r.id);

  // Sub-themes, scenarios and overlays are all multi-value. Adding or
  // removing any of them saves the list and re-runs the RCA, because the
  // routing decides which scenario checklists and issue questions the model
  // answers - a chip that changed nothing downstream would be decoration.
  // Scenario, overlay and sub-theme chips are all delegated near
  // regenerateForScenarios. They are drawn by renderReviewCol, and binding
  // them from here - which is renderRcaCol - left them dead after any render
  // that did not also call renderRcaCol. There are eight such callers.

  // Visible confirmation after an inline edit persists. An edit that blurred
  // into silence gave the analyst no way to tell "saved" from "lost".
  const flashSaved = (el, ok = true) => {
    if (!el) return;
    const host = el.parentElement || el;
    // The tick is absolutely positioned, so its host must be a containing
    // block or it escapes to the page corner.
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    let tick = host.querySelector(':scope > .save-tick');
    if (!tick) {
      tick = document.createElement('span');
      tick.className = 'save-tick';
      host.appendChild(tick);
    }
    tick.textContent = ok ? '✓ saved' : '✗ not saved';
    tick.style.color = ok ? '' : '#e5534b';
    tick.classList.add('on');
    setTimeout(() => tick.classList.remove('on'), 1400);
  };

  // ── v3 object edits (flags, booking logs, takedown) ─────────────────────
  // These live inside rca_v3, not in columns of their own, so every edit
  // writes the whole object back. Re-render only on structural change
  // (add/delete); a text edit must NOT re-render or the caret is lost.
  const persistV3 = async (el) => {
    try {
      const resp = await fetch(`/api/reviews/${r.id}/draft-v2`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({rca_v3: rca.v3}),
      });
      // Take the recomposed what-went-wrong back off the save response. The
      // server is the only thing that knows the five-heading format, so an
      // edit to a root cause has to come back FROM it or the Slack preview
      // would keep showing the text composed before the edit — stale in a way
      // nothing on screen would admit to.
      if (resp.ok) {
        const data = await resp.json().catch(() => null);
        if (data && data.draft && typeof data.draft.wwr_slack_text === 'string') {
          rca.wwrSlackText = data.draft.wwr_slack_text;
        }
        // Same for the contacts section: a ce_miss / summary / detail is edited
        // inline, and the section is composed server-side, so the edited text
        // has to come back from the composer or the preview keeps the pre-edit
        // wording with nothing on screen saying so.
        if (data && data.draft && typeof data.draft.contacts_slack_text === 'string') {
          rca.contactsSlackText = data.draft.contacts_slack_text;
        }
      }
      flashSaved(el, resp.ok);
    } catch (_) { flashSaved(el, false); }   // keep the local edit; next change retries
  };

  col.querySelectorAll('[data-flag-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      const f = (rca.v3.flags || [])[parseInt(el.dataset.flagIdx)];
      if (!f) return;
      f[el.dataset.flagField] = el.textContent.trim();
      await persistV3(el);
    });
  });
  col.querySelectorAll('[data-flag-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      rca.v3.flags = (rca.v3.flags || []).filter((_, i) => i !== parseInt(btn.dataset.flagDel));
      await persistV3(); renderRcaCol();
    });
  });
  const flagAdd = col.querySelector('[data-flag-add]');
  if (flagAdd) flagAdd.addEventListener('click', async () => {
    rca.v3.flags = [...(rca.v3.flags || []),
      {flag: 'New flag — click to edit', team: 'other', evidence: '', zd_ref: ''}];
    await persistV3(); renderRcaCol();
  });

  // The booking-timeline handlers used to live here, scoped to `col`. §13
  // moved the markup to the facts column, so these bound nothing - and a
  // second set of handlers for one control is how an edit gets saved twice.
  // They are delegated at document level now; see the listener near the top.

  const tdRec = col.querySelector('[data-takedown-rec]');
  if (tdRec) tdRec.addEventListener('change', async () => {
    // Keep the rest of the object. This used to REPLACE it, which was
    // harmless while `verdict` was the only key and silently dropped the
    // reason the moment there was one to drop - switch Yes to No and back and
    // the ground was gone, with the control showing "pick a reason" as though
    // nobody had.
    const td = {...(rca.v3.takedown || {}), verdict: tdRec.value};
    // A reason only means anything on a Yes. Leaving a stale one behind on a
    // No stores a ground for a takedown we are not requesting.
    if (td.verdict !== 'Yes') delete td.reason;
    rca.v3.takedown = td;
    await persistV3(tdRec);
    // The reason control appears and disappears with the verdict, so the
    // section has to be redrawn - without this, picking Yes saves fine and
    // shows no way to say why until the next load.
    renderRcaCol();
  });

  const tdWhy = col.querySelector('[data-takedown-reason]');
  if (tdWhy) tdWhy.addEventListener('change', async () => {
    const td = {...(rca.v3.takedown || {})};
    if (tdWhy.value) td.reason = tdWhy.value; else delete td.reason;
    rca.v3.takedown = td;
    await persistV3(tdWhy);
  });

  // ── the compensation pair ───────────────────────────────────────────────
  // Type and amount are the record of what the guest received. The old
  // Resolution control was a textarea that rendered, accepted typing, and was
  // saved by NOTHING - type in it, click away, reload, gone. Every control
  // here saves on change or blur.
  const resType = col.querySelector('[data-res-type]');
  if (resType) resType.addEventListener('change', async () => {
    const res = {...(_resObj(rca.v3.resolution))};
    res.compensation_type = resType.value;
    // "None" means nothing was given, so an amount left behind would say
    // otherwise. Cleared deliberately rather than hidden.
    if (resType.value === 'None') res.amount = null;
    rca.v3.resolution = res;
    await persistV3(resType);
    renderRcaCol();          // the unit and the amount field follow the type
  });

  const resAmt = col.querySelector('[data-res-amount]');
  if (resAmt) resAmt.addEventListener('blur', async () => {
    const res = {...(_resObj(rca.v3.resolution))};
    const v = resAmt.value.trim();
    // Empty stays NULL, never 0. "0%" is a compensation decision somebody
    // made; blank is "we know a HOC went out and not how much", and the card
    // says so in words.
    res.amount = v === '' ? null : v;
    rca.v3.resolution = res;
    await persistV3(resAmt);
    renderRcaCol();
  });

  // Generic path saver: every editable span carries data-v3p, a dot path
  // into rca.v3. One handler, so a field can never be rendered editable but
  // silently unsaved again - that is exactly what happened to TL;DR.
  col.querySelectorAll('[data-v3p]').forEach(el => {
    el.addEventListener('blur', async () => {
      const parts = el.dataset.v3p.split('.');
      let obj = rca.v3;
      for (let i = 0; i < parts.length - 1; i++) {
        const key = /^\d+$/.test(parts[i]) ? parseInt(parts[i]) : parts[i];
        const nextIsIdx = /^\d+$/.test(parts[i + 1]);
        // Old drafts store some list fields as one string; renderers
        // normalise via asPoints, so writes must do the same or the path
        // indexes into a string and the edit corrupts it.
        if (typeof obj[key] === 'string' && nextIsIdx) obj[key] = asPoints(obj[key]);
        // The same problem one shape over. `resolution` used to be a bare
        // string and is now an object with `text` alongside the compensation
        // type and amount. Writing `resolution.text` on an old draft assigned
        // a property to a STRING PRIMITIVE, which is a silent no-op - the
        // field took the edit, showed a green tick, and saved nothing. The
        // string is the text, exactly as _resObj reads it.
        else if (typeof obj[key] === 'string' && !nextIsIdx) obj[key] = {text: obj[key]};
        if (obj[key] == null) obj[key] = nextIsIdx ? [] : {};
        obj = obj[key];
      }
      const last = parts[parts.length - 1];
      const txt = el.textContent.trim();
      // Untouched placeholder is not a value.
      if (el.dataset.ph && txt === el.dataset.ph) return;
      obj[/^\d+$/.test(last) ? parseInt(last) : last] = txt;
      // Mark it as a person's answer, if this field asked to be marked. Done
      // here rather than at the call site so a field can never be rendered
      // with a marker that nothing ever sets.
      if (el.dataset.v3pMark) {
        const mp = el.dataset.v3pMark.split('.');
        let mo = rca.v3;
        for (let i = 0; i < mp.length - 1; i++) {
          if (mo[mp[i]] == null || typeof mo[mp[i]] !== 'object') mo[mp[i]] = {};
          mo = mo[mp[i]];
        }
        mo[mp[mp.length - 1]] = true;
      }
      el.classList.remove('is-placeholder');
      delete el.dataset.ph;
      await persistV3(el);
    });
  });

  const spRaised = col.querySelector('[data-sp-raised]');
  if (spRaised) spRaised.addEventListener('change', async () => {
    rca.v3.sp_interaction = {...(rca.v3.sp_interaction || {}), raised: spRaised.value};
    await persistV3(spRaised);
  });
  const spRecAdd = col.querySelector('[data-sp-rec-add]');
  // The notes key, not the frames key. This wrote to `sp_interaction` — the
  // facts side, which the pipeline owns and the renderer no longer reads for
  // records — so the record was saved to a key nothing displays and the button
  // appeared to do nothing. The renderer reads sp_interaction_notes.records
  // (with sp_interaction as a fallback for drafts written before the split),
  // so an operator-added record has to land there or it is written and lost.
  if (spRecAdd) spRecAdd.addEventListener('click', async () => {
    const sp = rca.v3.sp_interaction_notes
            || (rca.v3.sp_interaction && !Array.isArray(rca.v3.sp_interaction)
                  ? rca.v3.sp_interaction : null)
            || {};
    sp.records = [...(sp.records || []),
                  {time: '', summary: 'New record — click to edit', zd_ref: ''}];
    rca.v3.sp_interaction_notes = sp;
    await persistV3(); renderRcaCol();
  });

  // ── Collapsible sections ────────────────────────────────────────────────
  // Applied after render rather than in each template, so every section gets
  // it and none can be forgotten. Keyed by label text so the open/closed
  // state survives re-renders and review switches.
  // document, not col. BOTH halves of this were root-limited: the pass
  // stamps the key AND re-applies the collapsed state after a render, so
  // scoping it to one column meant a section in another column collapsed
  // once and sprang open on the next render — the toggle working and
  // then apparently forgetting, which reads as a different bug entirely.
  // Idempotent, so running it over the whole document is safe.
  document.querySelectorAll('.section').forEach(sec => {
    const label = sec.querySelector('.section-label');
    if (!label) return;
    // The early return used to be `|| label.querySelector('.section-chev')`,
    // which conflated two jobs this pass does: draw the chevron, and bind the
    // click. Step 5 put a hardcoded chevron into most section templates, so
    // that guard started firing on every one of them and the binding never
    // ran. Every section that had been given its own chevron silently stopped
    // collapsing — a control that renders, looks right, and does nothing.
    // Drawing is what needs the guard; binding does not.
    //
    // Key on the section's id, not its label text. The label carries live
    // counts ("What Happened AI 6 events", "Flags AI 1 CE · 1 CONTENT"), so
    // a text key changed whenever the data changed - and because this state
    // is shared across reviews, collapsing a section on one review left it
    // collapsed on all of them. A populated timeline then rendered as a bare
    // heading, which is indistinguishable from having no timeline at all.
    // Only 9 of 32 sections carry an id, so the fallback has to be stable on
    // its own: drop the live count and the AI mark before reading the text.
    const stableLabel = () => {
      const c = label.cloneNode(true);
      c.querySelectorAll('.sec-count, .ai-tag-inline, .section-chev')
       .forEach(n => n.remove());
      return (c.textContent || '').replace(/\s+/g, ' ').trim();
    };
    const key = sec.id || stableLabel();
    if (!key) return;
    if (!label.querySelector('.section-chev')) {
      const chev = document.createElement('span');
      chev.className = 'section-chev';
      chev.textContent = '▾';
      label.appendChild(chev);
    }
    if (state.collapsed[key]) sec.classList.add('is-collapsed');
    // The key is stamped on the element; the CLICK is handled by one
    // delegated listener below. Binding here only reached sections inside
    // this pass's root, and §13 moved the booking timeline into the FACTS
    // column — so its chevron was drawn by the template, looked identical to
    // every other one, and did nothing. That is the third time a control in
    // this file has been dead because the markup and the handler were owned
    // by different render passes.
    sec.dataset.secKey = key;
  });

  const persistAoi = async (list, el) => {
    rca.areaOfImproving = list;
    try {
      const resp = await fetch(`/api/reviews/${r.id}/draft-v2`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({area_of_improving: list}),
      });
      flashSaved(el, resp.ok);
    } catch (_) { flashSaved(el, false); }
  };
  col.querySelectorAll('[data-aoi-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.aoiDel);
      await persistAoi(aoiRows(rca.areaOfImproving).filter((_, i) => i !== idx));
      renderRcaCol();
    });
  });
  const aoiAdd = col.querySelector('[data-aoi-add]');
  if (aoiAdd) aoiAdd.addEventListener('click', async () => {
    // from/source null, and the row says "by hand". A point somebody types is
    // theirs; dressing it in a provenance it does not have would make the one
    // marker that means "checked against a finding" mean nothing.
    await persistAoi([...aoiRows(rca.areaOfImproving),
                      {point: 'New point — click to edit', from: null, source: null}]);
    renderRcaCol();
  });

  // AOI pointers: save the whole list on blur.
  col.querySelectorAll('[data-aoi-idx]').forEach(el => {
    el.addEventListener('blur', async () => {
      // Rewrite the TEXT of each row and keep everything else it carries.
      // Collecting the textContent into a list of strings threw the derivation
      // away on the first edit, and a point that has lost its source is
      // indistinguishable from one that never had one.
      const rows = aoiRows(rca.areaOfImproving);
      Array.from(col.querySelectorAll('[data-aoi-idx]')).forEach(x => {
        const i = parseInt(x.dataset.aoiIdx);
        if (rows[i]) rows[i] = {...rows[i], point: x.textContent.trim()};
      });
      await persistAoi(rows.filter(a => a.point), el);
    });
  });

  // Persist Actions Taken as the objects they are.
  //
  // This used to flatten every action in every tab to a single string -
  // a.context || a.with - and save that. The renderer reads a.with, a.handle,
  // a.time and a.where, and toItems() blanks all four when it reads a string
  // back. So adding, editing or deleting ONE action destroyed who every other
  // action was raised with, when, and its Slack link, across all five tabs,
  // silently and permanently. The Slack permalink that flag-to-biz writes went
  // the same way on the next edit.
  const persistActions = async () => {
    const full = {};
    for (const [tab] of ACTION_TEAMS) {
      full[tab] = (rca.actionsTaken[tab] || [])
        .map(a => ({
          with:    (a.with    || '').trim(),
          handle:  (a.handle  || '').trim(),
          time:    (a.time    || '').trim(),
          context: (a.context || '').trim(),
          where:   (a.where   || '').trim(),
        }))
        .filter(a => a.with || a.context);
    }
    try {
      const ok = await saveDraft(r.id, {actions_taken: full});
      if (!ok) throw new Error('rejected');
    } catch (e) {
      // A failed save used to be swallowed, so the edit looked saved and was
      // gone on reload. Say so.
      console.warn('actions_taken save failed', e);
      const tabsEl = col.querySelector('.action-tabs');
      if (tabsEl && !tabsEl.querySelector('.save-failed')) {
        const w = document.createElement('span');
        w.className = 'save-failed';
        w.style.cssText = 'font-size:11px;color:var(--red);margin-left:6px';
        w.textContent = 'not saved — reload before editing further';
        tabsEl.appendChild(w);
      }
    }
  };

  col.querySelectorAll('[data-add-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      rca.actionsTaken[state.actionTab].push({
        with: 'New action',
        handle: '@handle',
        time: 'Today',
        context: 'Click to edit context',
        where: 'link.example.com',
      });
      await persistActions();
      renderRcaCol();
    });
  });

  col.querySelectorAll('[data-action-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.actionDelete);
      rca.actionsTaken[state.actionTab].splice(idx, 1);
      await persistActions();
      renderRcaCol();
    });
  });

  // Inline edits on action fields → update model + persist on blur
  col.querySelectorAll('.action-item .action-edit').forEach(el => {
    el.addEventListener('blur', async () => {
      const item = el.closest('.action-item');
      if (!item) return;
      const idx = parseInt(item.dataset.actionIdx);
      const a = (rca.actionsTaken[state.actionTab] || [])[idx];
      if (!a) return;
      if (el.classList.contains('action-where'))      a.where   = el.textContent.trim();
      else if (el.classList.contains('handle'))       a.handle  = el.textContent.trim();
      else if (el.closest('.action-context'))         a.context = el.textContent.trim();
      else if (el.closest('.action-time'))            a.time    = el.textContent.trim();
      else                                            a.with    = el.textContent.trim();
      await persistActions();
    });
  });

  col.querySelectorAll('[data-toggle-frame]').forEach(btn => {
    btn.addEventListener('click', () => {
      const frame = btn.closest('.convo-frame');
      frame.classList.toggle('open');
    });
  });

  // ── Copy response button ───────────────────────────────────────────────────
  const copyResponseBtn = col.querySelector('.copy-response-btn');
  if (copyResponseBtn) {
    copyResponseBtn.addEventListener('click', () => {
      // The OUTGOING box by name, not `.reply-text` by position. The English
      // working copy carries the same class, so a positional lookup is one
      // DOM reorder away from copying the text that must never be sent.
      const replyText = col.querySelector('[data-outgoing-reply]');
      const text = replyText ? replyText.value : (rca.reply || '');
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = copyResponseBtn.textContent;
        copyResponseBtn.textContent = '✓ Copied!';
        copyResponseBtn.disabled = true;
        setTimeout(() => {
          copyResponseBtn.textContent = orig;
          copyResponseBtn.disabled = false;
        }, 2000);
      }).catch(() => {
        copyResponseBtn.textContent = '✗ Failed';
        setTimeout(() => { copyResponseBtn.textContent = 'Copy response'; }, 2000);
      });
    });
  }

  // ── Send button — marks the review sent, and posts the RCA if nothing has ─
  // This comment used to say "no Slack post", which was simply untrue: /send
  // has always posted the RCA into the review's thread. That is why using
  // "Post to thread" and then Send put the same RCA in the thread twice. The
  // server now posts here only when rca_posted_at is unset.
  const sendBtn = col.querySelector('.send-btn');
  if (sendBtn) {
    sendBtn.addEventListener('click', async () => {
      if (sendBtn.disabled) return;
      sendBtn.disabled = true;
      sendBtn.textContent = '⟳ Sending…';
      try {
        const res = await fetch(`/api/reviews/${r.id}/send`, { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        sendBtn.textContent = '✓ Sent';
        r.status = 'sent';
        renderInbox();
      } catch (e) {
        sendBtn.textContent = '✗ Error';
        sendBtn.disabled = false;
        setTimeout(() => {
          sendBtn.textContent = 'Send ↑';
          sendBtn.disabled = false;
        }, 3000);
      }
    });
  }

}

function openFlagDraftModal(r) {
  // Remove any existing modal
  const existing = document.getElementById('flag-modal');
  if (existing) existing.remove();

  // The four facts Biz acts on are their own fields now, prefilled from the
  // booking and editable before sending. They used to be baked into the
  // message text, where correcting a wrong TGID meant editing prose and the
  // numbers that actually went out were whatever survived that edit.
  const _pctFromInsights = () => {
    // THE REAL KEY IS vid_completion_rate, a 0–1 FRACTION. This read
    // vidCompletionRate (camelCase — a phantom nothing on the payload ever
    // sets) and completion_rate (also absent), then fell back to r.insights,
    // the placeholder view-model seeded to '—'. So the field the associate
    // flags from was always blank even when the tile beside it showed a real
    // low rate. Convert the fraction to the percentage this field expects.
    const li = r.liveInsights || {};
    if (typeof li.vid_completion_rate === 'number') {
      return Math.round(li.vid_completion_rate * 1000) / 10;   // 0–1 → percent, 1dp
    }
    // Fall back to any pre-formatted string, but never to the '—' placeholder.
    const raw = li.vidCompletionRate;
    const v = String(raw ?? '').replace('%', '').trim();
    return v && !isNaN(parseFloat(v)) ? parseFloat(v) : '';
  };
  const _issue = (r.rca.issueL2 || '').trim().toLowerCase();
  // Window that the NUMBERS were computed for, not the global picker. The data
  // carries its own window (_insightsWindowLabel reads it); labelling a figure
  // with whatever the picker happens to show is how a supply flag tells Biz the
  // wrong scope — the exact thing _insightsWindowLabel exists to prevent.
  const defaultMsg = `Flagging low completion rate for review.\n\nFlagged from review BID ${r.booking.bid}`
    + (_issue ? ` — guest reported ${_issue}` : '')
    + `. Window: ${_insightsWindowLabel(r)}. Please review supply allocation and `
    + `consider raising completion to market rate.`;

  const modal = document.createElement('div');
  modal.id = 'flag-modal';
  // .flag-modal is the fixed, centred backdrop and .flag-modal-body is the
  // card. This said 'flag-modal-backdrop', a class with no rule behind it,
  // so the backdrop never positioned and the head and actions rendered
  // outside the card.
  modal.className = 'flag-modal';
  modal.innerHTML = `
    <div class="flag-modal-body">
      <div class="flag-modal-head">
        <div class="flag-modal-title">Draft Slack message to Biz team</div>
        <button class="flag-modal-close" data-close-modal>×</button>
      </div>
        <!-- One destination, always: the review's own Slack thread, the same
             thread the RCA goes into. There was a channel field here defaulting
             to #biz-supply-ops, a channel that does not exist in the workspace,
             so anything that ever fell back to it went nowhere while the UI
             reported success. -->
        <div class="flag-modal-row">
          <label>Goes to</label>
          <div class="flag-dest">This review's Slack thread — same place as the RCA</div>
        </div>
        <div class="flag-modal-row">
          <label>Tag</label>
          <input type="text" class="flag-input" id="flag-tag" placeholder="who to tag" />
        </div>
        <div class="flag-modal-row">
          <label>Completion rate</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" class="flag-input" id="flag-completion"
                   step="0.1" min="0" max="100" style="width:110px"
                   value="${_pctFromInsights()}" />
            <span style="font-family:var(--mono);color:var(--dim)">%</span>
          </div>
        </div>
        <div class="flag-modal-row">
          <label>TGID · TID · VID</label>
          <div style="display:flex;gap:6px">
            <input type="text" class="flag-input" id="flag-tgid" placeholder="TGID"
                   style="flex:1;min-width:0" value="${esc(r.booking.tgid || '')}" />
            <input type="text" class="flag-input" id="flag-tid" placeholder="TID"
                   style="flex:1;min-width:0" value="${esc(r.booking.tid || '')}" />
            <input type="text" class="flag-input" id="flag-vid" placeholder="VID"
                   style="flex:1;min-width:0" value="${esc(r.booking.vid || '')}" />
          </div>
          <div class="flag-hint">Prefilled from the matched booking — correct them here if wrong.</div>
        </div>
        <div class="flag-modal-row">
          <label>Message</label>
          <textarea class="flag-textarea" id="flag-message">${defaultMsg}</textarea>
        </div>
      <div class="flag-modal-actions">
        <button class="btn" data-close-modal>Cancel</button>
        <button class="btn primary" id="flag-send-btn">Send to Slack ↑</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => modal.remove());
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
  // This used to build a local actions_taken entry, set flagged = true in
  // memory and close — without ever calling the server. The button said
  // "✓ Flagged · sent to Slack" and no Slack message was ever posted by it.
  // The endpoint existed and worked the whole time; nothing called it.
  const flagSend = modal.querySelector('#flag-send-btn');
  flagSend.addEventListener('click', async () => {
    const tag = modal.querySelector('#flag-tag').value;
    const message = modal.querySelector('#flag-message').value;
    const completion_rate = modal.querySelector('#flag-completion').value;
    const tgid = modal.querySelector('#flag-tgid').value.trim();
    const tid  = modal.querySelector('#flag-tid').value.trim();
    const vid  = modal.querySelector('#flag-vid').value.trim();
    if (!message.trim()) { flagSend.textContent = 'Write a message first'; return; }
    const orig = flagSend.textContent;
    flagSend.disabled = true; flagSend.textContent = 'sending…';
    try {
      const res = await fetch(`/api/reviews/${r.id}/flag-to-biz`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tag, message, send: true,
                              completion_rate: completion_rate === '' ? null
                                               : parseFloat(completion_rate),
                              tgid, tid, vid}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Slack rejected the post');
      // The server owns this now — actions_taken.business gets its entry
      // there, so it survives a reload instead of living in this tab.
      r.flagToBizState = 'sent';
      modal.remove();
      state.actionTab = 'business';
      await fetchInbox();
      renderRcaCol();
      renderReviewCol();
    } catch (e) {
      flagSend.disabled = false;
      flagSend.textContent = String(e.message || e).slice(0, 60);
      setTimeout(() => { flagSend.textContent = orig; }, 4000);
    }
  });
}

  function setRating(n) {
    selectedRating = n;

    starBtns.forEach(b => {
      const v = parseInt(b.dataset.star);
      b.style.color = v <= n ? 'var(--amber)' : 'var(--dim)';
    });
  }
  setRating(1);
  starBtns.forEach(b => {
    b.addEventListener('mouseenter', () => {
      starBtns.forEach(x => {
        x.style.color = parseInt(x.dataset.star) <= parseInt(b.dataset.star)
          ? 'var(--amber)' : 'var(--dim)';
      });
    });
    b.addEventListener('mouseleave', () => setRating(selectedRating));
    b.addEventListener('click', () => setRating(parseInt(b.dataset.star)));
  });

  // Close handlers
  modal.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => modal.remove());
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

  // Submit
  const submitBtn = modal.querySelector('#mr-submit-btn');
  submitBtn.addEventListener('click', async () => {
    const body = modal.querySelector('#mr-body').value.trim();
    const author = modal.querySelector('#mr-author').value.trim() || null;
    const ref = modal.querySelector('#mr-ref').value.trim() || null;

    if (!body) {
      errEl.textContent = 'Review text is required.';

    errEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '⟳ Submitting…';

      const res = await fetch('/api/reviews/manual', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          body,
          author,
          rating: selectedRating,
          reference_number: ref,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      submitBtn.textContent = '✓ Submitted · pipeline running…';

      // Refresh inbox after a short delay, then keep polling until the new review appears
      await fetchInbox();
      await loadDraftOverlays();
      renderInbox();

      // Switch to the correct tab and select the new review
      const newId = data.review_id;
      if (newId) {
