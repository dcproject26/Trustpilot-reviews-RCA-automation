          state.filter = _tabForNewReview(rev.type);

            t.classList.toggle('active', t.dataset.tab === state.filter));
          renderInbox();
          renderReviewCol();
          renderRcaCol();
        }
      }

      setTimeout(() => modal.remove(), 800);
    } catch (e) {
      errEl.textContent = `Error: ${e.message}`;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit · run pipeline';
    }
  });

  // Focus the textarea
  setTimeout(() => modal.querySelector('#mr-body').focus(), 50);
}

// ── (Column resizing removed) ───────────────────────────────────────────────
//
// The workbench has no draggable column boundary any more. The inbox became a
// full-width page (Stage 2) and the RCA became a fixed-width slide-over that
// overlays the facts rather than sharing an edge with it (Stage 4), so the
// facts fill the case body on their own. The old inbox|facts and facts|RCA
// drag handles, their CSS variables, and the localStorage width store are gone
// with them — a resize subsystem bound to no handle is exactly the phantom
// mechanism CLAUDE.md rule 1 warns about, so it is deleted rather than left to
// look like a working feature.

// ── Inbox search ────────────────────────────────────────────────────────────
//
// Bound once, at the top level: the box lives outside the list that
// renderInbox redraws, so it cannot be un-bound by a re-render — and it must
// not be, or typing would stop working after the first keystroke.
(function wireInboxSearch() {
  const box = document.getElementById('inbox-search');
  const clear = document.getElementById('inbox-search-clear');
  if (!box) return;
  let t = null;
  const apply = () => {
    state.search = box.value;
    renderInbox();
  };
  box.addEventListener('input', () => {
    // Debounced: renderInbox rebuilds every card, and doing that per
    // keystroke on a few hundred reviews makes the box feel broken.
    clearTimeout(t);
    t = setTimeout(apply, 120);
  });
  box.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { box.value = ''; clearTimeout(t); apply(); }
  });
  if (clear) clear.addEventListener('click', () => {
    box.value = ''; clearTimeout(t); apply(); box.focus();
  });
  // "3 elsewhere: Untraceable (2)" — jumping there is the point of saying it.
  document.addEventListener('click', ev => {
    const b = ev.target.closest && ev.target.closest('[data-goto-tab]');
    if (!b) return;
    state.filter = b.dataset.gotoTab;
    document.querySelectorAll('.inbox-tab').forEach(x =>
      x.classList.toggle('active', x.dataset.tab === state.filter));
    renderInbox();
  });
})();

function _tabLabel(tab) {
  // These name the jump-to-tab links in the "N elsewhere" line, so they must
  // read as the TAB the click lands on — 'Possible matches', the button's own
  // text, not 'Confirm' (which is the stage chip, a different thing).
  return {all: 'All', identified: 'Matched', candidates: 'Possible matches',
          processing: 'Processing', untraceable: 'Untraceable',
          sent: 'Sent'}[tab] || tab;
}

document.querySelectorAll('.inbox-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.filter = tab.dataset.tab;
    document.querySelectorAll('.inbox-tab').forEach(t => t.classList.toggle('active', t === tab));
    // Auto-select first in tab
    // The shared rule, not a third copy of it. This one had no 'processing'
    // branch and returned false, so clicking the new tab selected nothing and
    // the panel went blank — a tab that looks broken on the day it ships.
    // It also silently disagreed with the count above it, which is exactly
    // how confirmed candidates ended up in the wrong tab for weeks.
    const hits = REVIEWS.filter(r => state.filter !== 'all' && inTab(r, state.filter));
    state.selected = hits[0]?.id || null;
    renderInbox();
    renderReviewCol();
    renderRcaCol();
  });
});

// "None of these → Untraceable" — the candidate list was wrong. Clears the
// candidates server-side and moves the review to the Untraceable tab, so nobody
// confirms a wrong booking later.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-mark-untraceable]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Moving…';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/mark-untraceable`, {method: 'POST'});
    if (!resp.ok) throw new Error('mark-untraceable failed');
    r.type            = 'untraceable';
    r.matchTier       = null;
    r.tier            = 'T—';
    r.candidatesList  = [];
    r.booking         = r.booking || {};
    r.booking.bid     = '';
    r.matchTitle      = 'Untraceable — no booking matched';
    r.matchMethod     = 'Marked untraceable by associate';
    await fetchInbox();
    await loadDraftOverlays();
    renderInbox(); renderReviewCol(); renderRcaCol();
  } catch (e) {
    btn.textContent = 'Failed — retry';
    btn.disabled = false;
    return;
  }
  btn.textContent = orig;
  btn.disabled = false;
});



// ⟳ Fix incomplete — re-run every review missing a match or an RCA.
// The job runs on the server and its progress is polled, so closing this tab
// or reloading does not lose the run; the bar reattaches to whatever is
// already in flight.
let _bulkTimer = null;

function _bulkRender(st) {
  const bar = document.getElementById('bulk-bar');
  const fill = document.getElementById('bulk-fill');
  const text = document.getElementById('bulk-text');
  if (!bar || !fill || !text) return;
  const total = st.total || 0;
  const done = st.done || 0;
  if (!total || (!st.running && !st.finished_at)) { bar.hidden = true; return; }
  bar.hidden = false;
  fill.style.width = total ? `${Math.round((done / total) * 100)}%` : '0%';
  const eta = (st.eta_s != null && st.running)
    ? ` · ~${st.eta_s < 60 ? st.eta_s + 's' : Math.ceil(st.eta_s / 60) + 'm'} left` : '';
  const failed = st.failed ? ` · <span class="err">${st.failed} failed</span>` : '';
  text.innerHTML = st.running
    ? `re-running ${done}/${total}${eta} · ${st.current ? st.current.slice(0, 22) : 'starting'}${failed}`
    : `finished ${done}/${total}${failed}`;
  const cancel = document.getElementById('bulk-cancel');
  if (cancel) cancel.style.display = st.running ? '' : 'none';
}

async function pollBulk(reloadInbox) {
  try {
    const st = await (await fetch('/api/reviews/bulk-status')).json();
    _bulkRender(st);
    if (st.running) {
      if (!_bulkTimer) _bulkTimer = setInterval(() => pollBulk(true), 4000);
      if (reloadInbox) {
        await fetchInbox(); await loadDraftOverlays(); renderInbox();
      }
    } else if (_bulkTimer) {
      clearInterval(_bulkTimer);
      _bulkTimer = null;
      // One last reload so finished work is on screen. The summary stays up
      // for a while rather than vanishing from under the reader.
      await fetchInbox(); await loadDraftOverlays();
      renderInbox(); renderReviewCol(); renderRcaCol();
      const failed = (st.results || []).filter(x => !x.ok);
      if (failed.length) console.warn('[bulk] failures:', failed);
      setTimeout(() => {
        const b = document.getElementById('bulk-bar');
        if (b && !_bulkTimer) b.hidden = true;
      }, 20000);
    }
  } catch (e) { /* a failed poll is not a reason to tear the bar down */ }
}

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-rerun-all]');
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⟳ starting…';
  try {
    const resp = await fetch('/api/reviews/reprocess-all?tab=incomplete',
                             {method: 'POST'});
    const data = await resp.json();
    btn.textContent = data.already_running ? '⟳ already running'
                    : !data.queued          ? '⟳ nothing to fix'
                    : `⟳ ${data.queued} queued`;
    _bulkRender(data);
    pollBulk(false);
  } catch (e) {
    btn.textContent = '⟳ failed — retry';
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
});

document.addEventListener('click', async (ev) => {
  if (!ev.target.closest('#bulk-cancel')) return;
  try {
    await fetch('/api/reviews/bulk-cancel', {method: 'POST'});
    const t = document.getElementById('bulk-text');
    if (t) t.textContent = 'cancelling after the running reviews finish…';
  } catch (e) { /* the next poll shows the true state */ }
});

// ↻ Refresh — pull Trustpilot reviews from Slack that never reached the
// webhook, and pipeline them. Delegated so it survives inbox re-renders.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-refresh-slack]');
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '↻ checking Slack…';
  try {
    const resp = await fetch('/api/reviews/refresh-slack?hours=72', {method: 'POST'});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'refresh failed');
    if (data.queued > 0) {
      btn.textContent = `↻ ${data.queued} new — processing…`;
      // Each queued review runs its pipeline in the background; poll a few
      // times so cards appear as their runs land rather than on next reload.
      for (let i = 0; i < 10; i++) {
        await new Promise(res => setTimeout(res, 3000));
        await fetchInbox();
        await loadDraftOverlays();
        renderInbox();
      }
      btn.textContent = `↻ ${data.queued} added`;
    } else {
      btn.textContent = data.trustpilot_found
        ? `↻ up to date (${data.trustpilot_found} found)`
        : '↻ nothing new in Slack';
    }
  } catch (e) {
    btn.textContent = '↻ failed — retry';
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
});

// ↓ CSV — every review and its RCA as a file.
//
// IT ASKS FOR NOTHING FIRST. RCA_EXPORT_KEY is optional server-side, and when
// it is unset the file is simply served — like /api/reviews and the dashboard
// itself, none of which authenticate. Prompting up front would have demanded
// a key from everyone to protect a door in a building with no walls. So the
// download is tried bare, and the prompt appears ONLY if the server answers
// 401, which it does only when a key really is configured.
//
// The key, once given, lives in sessionStorage — gone when the tab closes.
// Not in the page (devtools would read it) and not in the query string (every
// proxy and access log between here and the server would keep it), which is
// also why the header cannot be put on a plain <a download>.
//
// THE COUNTS ARE READ BACK AND SHOWN. The response carries X-Export-Rows and
// X-Export-Failed, and a file that quietly holds 40 of 45 rows looks exactly
// like a complete one once it is open in Excel. A row that could not be built
// is in the file with export_error set, so the number says whether to go
// looking at that column.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-export-csv]');
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '↓ building…';

  const get = (key) => fetch('/api/export.csv',
                             key ? {headers: {'X-Export-Key': key}} : undefined);
  try {
    let resp = await get(sessionStorage.getItem('rcaExportKey'));
    if (resp.status === 401) {
      // Only now is a key known to be needed. A stored one that is being
      // rejected is cleared first, or the prompt never comes back.
      sessionStorage.removeItem('rcaExportKey');
      const typed = (prompt('This export needs a key (RCA_EXPORT_KEY):') || '').trim();
      if (!typed) {                 // changed their mind — not a failure
        btn.textContent = orig; btn.disabled = false; return;
      }
      resp = await get(typed);
      if (resp.status === 401) { btn.textContent = '↓ key rejected'; return; }
      if (resp.ok) sessionStorage.setItem('rcaExportKey', typed);
    }
    if (!resp.ok) { btn.textContent = '↓ failed'; return; }
    const rows   = resp.headers.get('X-Export-Rows') || '?';
    const failed = parseInt(resp.headers.get('X-Export-Failed') || '0', 10);
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rca_export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    btn.textContent = failed
      ? `↓ ${rows} rows · ${failed} incomplete`
      : `↓ ${rows} rows`;
  } catch (e) { btn.textContent = '↓ failed'; }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
});

// Mark sent, from beside the Post-to-thread button. DELEGATED, because the
// Slack block is re-rendered on every edit to the post and a handler bound
// after one render is dead after the next — the failure mode this file has
// hit three times.
//
// It calls /send, the SAME endpoint Send ↑ calls, deliberately: two code
// paths to one outcome is how the RCA got posted into a thread twice. /send
// already refuses to post when rca_posted_at is set, and the button is
// disabled until it is, so nothing is posted from here — the guard is
// reused, not re-implemented.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest && ev.target.closest('[data-mark-sent]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  const was = btn.textContent;
  // WHICH ENDING THIS IS. /send finishes a review whose RCA is already in the
  // thread; /close finishes one where nothing was posted and never touches
  // Slack. Reading the mode off the button rather than off r.rcaPostedAt so
  // the label the person clicked and the request that goes out cannot
  // disagree — the button is re-rendered on every edit to the post.
  const mode = btn.dataset.sentMode === 'close' ? 'close' : 'send';
  btn.disabled = true; btn.textContent = '⟳ marking…';
  try {
    const res = mode === 'close'
      ? await fetch(`/api/reviews/${r.id}/close`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({reason: 'Finished from the RCA card without '
                                        + 'posting to Slack.'})})
      : await fetch(`/api/reviews/${r.id}/send`, {method: 'POST'});
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`.slice(0, 200));
    const out = await res.json();
    if (mode === 'close') {
      btn.textContent = '✓ Closed out';
      r.status = 'sent';
      r.sentRoute = 'closed';
      r.closedAt = new Date().toISOString();
      await reloadFromServer();
      return;
    }
    if (out.posted) {
      // Should be impossible while the button is gated on rcaPostedAt. Said
      // out loud rather than swallowed: a second copy in the thread is the
      // one outcome this control exists to avoid.
      btn.textContent = '⚠ posted a second copy';
    } else {
      btn.textContent = '✓ Sent';
    }
    r.status = 'sent';
    r.sentRoute = out.sent_route || 'rca_posted';
    await reloadFromServer();
  } catch (e) {
    btn.disabled = false; btn.textContent = was;
    alert('Could not mark sent: ' + e.message);
  }
});

// Set the booking id by hand. DELEGATED, like every other control in this
// file that survives a re-render — a handler bound after one render is dead
// after the next, which is the failure this codebase has hit three times.
//
// The button is disabled until the box holds something that could be a
// booking id, so a click never round-trips to a certain 400. What counts as
// "could be" is deliberately loose (7-12 digits after stripping): the server
// is what decides whether the id is real, and a client-side rule that is
// stricter than the server's silently blocks ids the server would accept.
function _bidSetSync(box) {
  const input = box.querySelector('[data-bid-set-input]');
  const btn   = box.querySelector('[data-bid-set]');
  if (!input || !btn) return;
  const digits = (input.value || '').replace(/\D/g, '');
  btn.disabled = !(digits.length >= 7 && digits.length <= 12);
  btn.title = btn.disabled
    ? 'A booking id is 7-12 digits — this is not one yet.'
    : 'Set ' + digits + ' as this review\u2019s booking and rebuild everything below.';
}

document.addEventListener('input', (ev) => {
  const input = ev.target.closest && ev.target.closest('[data-bid-set-input]');
  if (input) _bidSetSync(input.closest('.bid-set-block'));
});

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest && ev.target.closest('[data-bid-set]');
  if (!btn || btn.disabled) return;
  const box   = btn.closest('.bid-set-block');
  const input = box && box.querySelector('[data-bid-set-input]');
  const note  = box && box.querySelector('[data-bid-set-note]');
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !input) return;
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = 'setting…';
  if (note) { note.className = 'bid-set-note'; note.textContent = ''; }
  try {
    const res = await fetch(`/api/reviews/${r.id}/set-booking-id`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({bid: input.value}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // The server sends {message, kind}. Older shapes send a string; both
      // are handled, because rendering an object here would print
      // "[object Object]" — the defect this file has already shipped once.
      const d = data.detail;
      throw new Error((d && typeof d === 'object' && d.message)
                      || (typeof d === 'string' && d)
                      || `${res.status} — the booking id was not set`);
    }
    if (note) {
      note.className = 'bid-set-note ok';
      note.textContent = 'Booking ' + data.bid + ' set'
        + (data.replaced ? ', replacing ' + data.replaced : '')
        + (data.verified ? ' and verified against BigQuery.'
                         : '. ' + (data.note || 'It was not verified.'))
        + ' Rebuilding everything below — this takes a minute.';
    }
    await reloadFromServer();
  } catch (e) {
    // The booking was NOT changed. Say that, not just "failed" — a set that
    // looks applied and is not is what this guards.
    btn.disabled = false; btn.textContent = was;
    if (note) {
      note.className = 'bid-set-note';
      note.textContent = 'Not set — the booking on this review is unchanged. '
                       + String(e.message || e);
    }
  }
});

// Close out → Sent. One delegated handler for every bucket that has no reply
// to post: the untraceable panel, the candidate picker, and the
// nothing-analysed-yet gate.
//
// Deliberately NOT the Send button. Send posts the RCA into the review's Slack
// thread and means "the analysis and the reply have gone out". These reviews
// have neither, and overloading one verb with both is how the Sent tab stops
// telling anyone anything.
//
// Two clicks, not a confirm() dialog: this moves the card out of every working
// tab, and a mis-click on a one-shot button is a review that quietly leaves
// the queue. Arming is visible, reversible by doing nothing, and testable —
// a native dialog is none of the three.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-close-out]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    const was = btn.textContent;
    btn.textContent = 'Click again to close out';
    setTimeout(() => {
      if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = was; }
    }, 4000);
    return;
  }
  btn.dataset.armed = '';
  btn.disabled = true;
  btn.textContent = '⟳ Closing…';
  try {
    const res = await fetch(`/api/reviews/${r.id}/close`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reason: btn.dataset.closeReason || null}),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`.slice(0, 200));
    const out = await res.json();
    r.status = 'sent';
    r.closedAt = new Date().toISOString();
    r.closeReason = out.reason || '';
    btn.textContent = '✓ Closed out';
    // The whole screen, not just this button: the review has left every
    // working tab and the counts above it are now wrong.
    await reloadFromServer();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✗ Could not close — try again';
    _saveToast(String(e.message || e));
  }
});

// ↻ Re-run matching — one delegated handler covers the Booking Match header
// button and the Untraceable panel button. Re-runs the FULL pipeline for the
// selected review, then reloads when the fresh result lands.
document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-rerun-match]');
  if (!btn || btn.disabled) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r) return;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⟳ Re-running…';
  let before = null;
  try {
    const pre = await fetch(`/api/reviews/${r.id}`);
    if (pre.ok) before = ((await pre.json()).draft || {}).generated_at || null;
  } catch (_) {}
  try {
    const resp = await fetch(`/api/reviews/${r.id}/reprocess`, {method: 'POST'});
    if (!resp.ok) throw new Error('reprocess failed');
  } catch (e) {
    btn.disabled = false; btn.textContent = '✗ Failed — try again';
    return;
  }
  let polls = 0;
  const poll = setInterval(async () => {
    polls++;
    try {
      const check = await fetch(`/api/reviews/${r.id}`);
      if (check.ok) {
        const d = (await check.json()).draft;
        if (d && d.generated_at && d.generated_at !== before) {
          clearInterval(poll);
          await reloadFromServer();
          return;
        }
      }
    } catch (_) {}
    // Name the stage on the button. generated_at stays the completion signal
    // (it survives a server restart; the in-process progress entry does not),
    // so this is display only - if the progress endpoint has nothing, keep
    // the generic spinner rather than concluding anything from its silence.
    try {
      const pr = await fetch(`/api/reviews/${r.id}/progress`);
      if (pr.ok) {
        const p = await pr.json();
        if (p.state === 'queued') {
          btn.textContent = p.queue_size > 1
            ? `⋯ queued ${p.queue_position}/${p.queue_size}` : '⋯ queued';
        } else if (p.state === 'stalled') {
          // The entry is still there and has stopped moving. Counting up
          // against a stage that has not advanced for ten minutes is the
          // spinner-over-a-corpse this whole change is about.
          clearInterval(poll);
          btn.disabled = false;
          btn.textContent = `✗ no progress for ${Math.round(p.since_progress_s / 60)}m — try again`;
          return;
        } else if (p.running) {
          const m = String(Math.floor(p.elapsed_s / 60));
          const sec = String(p.elapsed_s % 60).padStart(2, '0');
          btn.textContent = `⟳ ${p.step}/${p.total} ${p.stage} · ${m}:${sec}`;
        }
      }
    } catch (_) {}
    // A full run is matching + Zendesk + insights + RCA generation + response
    // draft, which is a dozen sequential Claude calls. Three minutes was often
    // shorter than the run, so the poll gave up while the pipeline was still
    // working -- the result landed in the database and the dashboard never
    // showed it, which reads exactly like "re-run did nothing".
    if (polls > 200) {  // ~10 min
      clearInterval(poll);
      // Refresh anyway. Giving up used to just re-enable the button, so a run
      // that finished slightly after the deadline left the old result on screen
      // with nothing to say the data underneath had changed.
      await reloadFromServer();
      btn.disabled = false; btn.textContent = orig;
    }
  }, 3000);
});

// ← Inbox lives in the case header now and is bound when that header renders
// (renderCaseHeader), so there is nothing to wire here.

// Closing the RCA slide-over: the × control and Escape do the same thing.
// (Non-modal — no backdrop to click; the facts beside it stay live.) Bound
// once — these elements are static.
function _closeRca() { state.rcaOpen = false; applyRca(); }
document.getElementById('rca-close')?.addEventListener('click', _closeRca);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.rcaOpen) _closeRca();
});

// RCA tab switching. Delegated (bound once) and CSS-only: all six panels stay
// in the DOM, so switching tabs just toggles which is visible — no re-render,
// so per-render control bindings and any in-progress edit survive the switch.
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-rca-tab]');
  if (!t) return;
  const tab = t.dataset.rcaTab;
  state.rcaTab = tab;
  const col = document.getElementById('rca-col');
  if (!col) return;
  col.querySelectorAll('.rca-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.rcaTab === tab));
  col.querySelectorAll('.rca-tab-panel').forEach(pnl =>
    pnl.classList.toggle('active', pnl.dataset.tab === tab));
});

applyScreen();          // default screen is 'inbox' — set the class before first paint
renderInbox();
renderReviewCol();
renderRcaCol();
</script>
<div id="build-stamp" title="build the page and server are running"></div>
<script>
// Which build is on screen. Several hours were lost to a cached page talking
// to a new server and to a new page talking to an old server, both of which
// look exactly like a broken feature. If these two disagree, or either is
// stale, that is the answer and nothing else needs debugging.
(async () => {
  try {
    const r = await fetch('/api/version', {cache: 'no-store'});
    if (!r.ok) return;
    const v = await r.json();
    const el = document.getElementById('build-stamp');
    if (!el) return;
    // Say which server this page is talking to, not just which commit. A
    // deployment is a frozen snapshot that a git pull does not touch, so
    // reading one while pulling into the repl looks like every fix failing.
    const env = v.environment || '?';
    // v.stale is the server comparing the code it LOADED against the files on
    // disk. Do not recompute it here from anything this page knows - the page
    // is as old as the server that sent it.
    // null is "could not read the commit", not "current". The stamp says so:
    // "build unknown" beside a fingerprint is actionable; a clean-looking
    // build line on a deployment that is 24 commits behind is not.
    const st = buildState(v);
    el.textContent = 'build ' + (v.short || '?') + ' · ' + env
                   + (st === 'stale' ? ' · STALE'
                      : st === 'unknown' ? ' · BUILD UNKNOWN' : '');
    if (st !== 'current') el.classList.add('is-stale');
    el.title = 'server ' + (v.commit || '') + '\nenvironment: ' + env
             + '\nreload: ' + (v.reload ? 'on' : 'off')
             + '\nup ' + (v.uptime_s || 0) + 's'
             + (env === 'deployment'
                ? '\n\nThis is a PUBLISHED DEPLOYMENT. It only changes when you '
                  + 'press Deploy - a git pull in the repl does not affect it.'
                : '');
    if (env === 'deployment') el.classList.add('is-deploy');
  } catch (e) { /* not worth surfacing */ }
})();
</script>
