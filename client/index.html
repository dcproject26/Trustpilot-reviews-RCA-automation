    background: none; border: none; padding: 0 0 0 6px; cursor: pointer;
    font: inherit; font-size: 11.5px; color: var(--accent); text-decoration: underline;
  }
  .slack-customize:hover { color: var(--accent-hov); }
  .slack-sec-chip {
    border: 1px solid var(--input-bd); border-radius: 999px; padding: 2px 9px;
    font-size: 11px; color: var(--muted-2); cursor: pointer;
  }
  .slack-sec-chip.on {
    background: var(--accent-bg); color: var(--chip-fg); border-color: var(--accent-bd);
  }
  .slack-sec-chip input { display: none; }

  /* Amber, because it is the "broken / act on this" meaning - the same role
     .rca-empty.err has, and deliberately not either empty-state treatment. */
  .stale-bar {
    background: var(--amber-bg); color: var(--amber); font-size: 12px;
    padding: 6px 16px; border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="logo-block">
      <div class="logo">R</div>
      <div class="brand-name">Reviews RCA</div>
      <div class="brand-sub">Headout · CX</div>
    </div>
    <div class="topbar-status">
      <!-- The environment and service chips were removed on request. They
           read "dev · b75c5e0 · postgresql:helium/heliumdb · 30 reviews ·
           8 services live" across the top of a page CX uses all day - a
           commit hash and a database name are for whoever is deploying,
           not for whoever is answering a guest. Both are still at
           /api/health if either is ever wanted back. -->
      <button class="refresh-slack-btn" data-refresh-slack
              title="Pull Trustpilot reviews from Slack that aren't here yet">↻ Refresh from Slack</button>
      <button class="refresh-slack-btn" data-rerun-all
              title="Re-run every review missing a match or an RCA">⟳ Fix incomplete</button>
      <button class="refresh-slack-btn" data-export-csv
              title="Download every review and its RCA as a CSV">↓ CSV</button>
      <button class="reporting-link">Reporting</button>
    </div>
  </header>

  <div class="main">
    <aside class="inbox">
      <div class="inbox-head">
        <!-- Job progress. The state lives on the server, so closing the tab or
             reloading does not lose the run - this bar reattaches to whatever
             is already going. -->
        <div class="bulk-bar" id="bulk-bar" hidden>
          <div class="bulk-track"><div class="bulk-fill" id="bulk-fill"></div></div>
          <div class="bulk-meta">
            <span id="bulk-text">…</span>
            <button class="bulk-cancel" id="bulk-cancel">cancel</button>
          </div>
        </div>
        <div class="inbox-search-row">
          <!-- type=text, not type=search. Chromium clears a search input on
               Escape by itself, which made our own Escape handler redundant
               there and load-bearing everywhere else — a behaviour difference
               no test would catch, because the test runs in Chromium. It also
               draws a second native clear button next to ours. -->
          <input id="inbox-search" class="inbox-search" type="text"
                 autocomplete="off" spellcheck="false"
                 placeholder="Search name, BID, ZD-…, review text, L1/L2">
          <button class="inbox-search-clear" id="inbox-search-clear"
                  title="Clear the search" hidden>×</button>
          <!-- + Add review sits beside the search, per the handoff, not in a
               footer strip. The manual-add flow is unchanged; only its place is. -->
          <button class="add-manual-btn">+ Add review</button>
        </div>
        <div class="inbox-tabs">
          <button class="inbox-tab active" data-tab="all">All <span class="num" id="cnt-all">0</span></button>
          <button class="inbox-tab" data-tab="identified">Matched <span class="num" id="cnt-identified">0</span></button>
          <button class="inbox-tab" data-tab="candidates">Possible matches <span class="num" id="cnt-candidates">0</span></button>
          <button class="inbox-tab" data-tab="processing">Processing <span class="num" id="cnt-processing">0</span></button>
          <button class="inbox-tab" data-tab="untraceable">Untraceable <span class="num" id="cnt-untraceable">0</span></button>
          <button class="inbox-tab" data-tab="sent">Sent <span class="num" id="cnt-sent">0</span></button>
        </div>
      </div>
      <!-- The queue is a table now. One column header row, then one row per
           review — Guest, Review, Booking, State, Picked up by, Received. -->
      <div class="inbox-thead">
        <div>Guest</div>
        <div>Review</div>
        <div>Booking</div>
        <div>State</div>
        <div>Picked up by</div>
        <div class="r">Received</div>
      </div>
      <div class="inbox-list" id="inbox-list"></div>
    </aside>

    <!-- The case page: a header carrying who is on it and the way back, then
         the columns. Wrapped so the header spans the full width above them.
         The inbox is a full-width page now, so its resize handle is gone. -->
    <div class="case-wrap" id="case-wrap">
      <div class="case-header" id="case-header"></div>
      <div class="case-body" id="case-body">
        <section class="review-col" id="review-col"></section>
        <!-- The RCA & response is a slide-over over the case, not a third
             column. Same DOM as before — every edit/save/delete control is
             unchanged — just presented as a panel that slides in from the
             right, below the case header so ← Inbox stays reachable. It is
             NOT modal: the facts stay visible and worked-with beside it, so
             there is no backdrop over them. -->
        <button class="rca-close" id="rca-close" hidden>Close ✕</button>
        <section class="rca-col" id="rca-col"></section>
      </div>
    </div>
  </div>
</div>

<script>
// The REAL L1/L2 catalogue, from /api/taxonomy — the same source the
// classifier, the macro filing and the support-tag lookup all read.
//
// What was here was a placeholder catalogue written before the taxonomy
// existed, and its own comment said so: "to be replaced with real list from
// CX team". It shipped. Its L1 keys — 'SP issue', 'CO miss', 'Fulfilment',
// 'Product/UX' — are not L1s. There was no entry for 'Operations Issue' or
// any other real one, so the L2 dropdown was EMPTY on every review, and the
// L1 dropdown offered seven categories that would classify a review into a
// bucket nothing downstream can match: no macro, no support tags, no
// sub-themes. The card then reported "no support-tag mapping" and was right.
//
// Empty until it loads, exactly like SUB_THEME_OPTIONS and SCENARIO_OPTIONS
// below — the selects still show the current classification meanwhile.
let L1_CATEGORIES = [];
let L2_OPTIONS = {};

// Keyed "L1::L2" -> ["A. Name", …, "N. Irrelevant"].
// Populated from /api/taxonomy (which already returns `sub_theme_frameworks`
// in exactly this "L1::L2" key form) so the frontend never duplicates taxonomy.
// Empty is safe: the row still shows the classified sub_theme; the editable
// options simply fill in once the taxonomy loads.
const SUB_THEME_OPTIONS = {};
// The scenario vocabulary from /api/taxonomy. Empty until it loads - the row
// still shows the routed scenario; the other options fill in after.
let SCENARIO_OPTIONS = [];
// The grounds for a takedown, from the copy file via /api/taxonomy. Empty
// until it loads, and an empty list draws no control at all rather than an
// empty dropdown - a select with nothing in it reads as a broken lookup.
let TAKEDOWN_REASONS = [];

async function loadSubThemeOptions() {
  try {
    const t = await (await fetch('/api/taxonomy')).json();
    const fw = t.sub_theme_frameworks || {};
    for (const key in fw) {
      const f = fw[key];
      const opts = (f.sub_themes || []).map(([code, name]) => `${code}. ${name}`);
      if (f.exclusion_label) opts.push(f.exclusion_label);
      SUB_THEME_OPTIONS[key] = opts;
    }
    SCENARIO_OPTIONS = t.scenarios || [];
    TAKEDOWN_REASONS = t.takedown_reasons || [];
    // The classification catalogue, from the same call. Everything else in
    // this function was already taxonomy-driven; L1/L2 were the one pair
    // still hardcoded, and they were hardcoded WRONG.
    L1_CATEGORIES = t.l1_categories || [];
    L2_OPTIONS = t.l2_options || {};
  } catch (e) { /* leave empty — row still shows the assigned sub_theme */ }
  // re-render so the sub-theme row appears once options are available
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
}
// call once on load; re-render picks up options after taxonomy resolves
loadSubThemeOptions();

// ── Inbox wiring ─────────────────────────────────────────────────────────────
// Did the booking id come from the review itself, or did we infer it?
// attachment / manual / regex all mean the review carried it. Anything else
// (a Zendesk requester match, a venue search) is inferred, however confident.
// The server decides the bucket (server/tiers.py) and sends it. These exist
// only for rows from an older build that predates the field, and they mirror
// that rule exactly - a second, differently-worded copy of this logic is what
// put confirmed candidates in the wrong tab for weeks.
function _matchBucket(row, tier, candState) {
  // WHAT THE MATCH FOUND, with no opinion about whether the review is sent.
  // Split out of _bucketFallback because "which tab" and "what did the match
  // find" are two different questions and only the first one is answered by
  // `sent` — see _matchTitle.
  //
  // No draft row is NOT untraceable — see server/tiers.py. Untraceable is a
  // result; this is a run that has not produced one yet.
  if (row.has_draft === false) return 'processing';
  const pickerOpen = !!candState && !row.confirmed;
  if (pickerOpen) return 'candidates';
  if (row.has_booking) return 'identified';
  if (row.has_candidates) return 'candidates';
  return 'untraceable';
}

function _bucketFallback(row, tier, candState) {
  // Mirrors server/tiers.py classify() exactly, on the same facts the server
  // sends. Only used for rows from a build that predates the bucket field;
  // kept in lockstep because a second, differently-worded copy of this rule
  // is what misfiled confirmed candidates.
  if (row.status === 'sent') return 'sent';
  return _matchBucket(row, tier, candState);
}

function _matchTitle(row, tier, candState) {
  let bucket = row.bucket || _bucketFallback(row, tier, candState);
  // SENT IS A CLAIM ABOUT THE REVIEW, NOT ABOUT THE BOOKING. `classify()`
  // returns it FIRST, ahead of candidates/identified/untraceable, so that a
  // finished review cannot also appear under a working tab — which is right
  // for filing and useless as a match title. There was no branch for it here,
  // so a sent review fell past all three tests below and out of the bottom
  // into the Tier 1 vocabulary: a review nobody ever matched was headed
  // "Direct match", beside a "T2" badge, purely because the review text
  // contained a reference number.
  //
  // Two reviews that could not be more different — one matched exactly, one
  // never matched at all — rendered the identical title. So the title asks
  // what the MATCH found, and the tab keeps asking what the review is.
  //
  // A sent review is NOT offered the candidate wording even when a shortlist
  // is still on it: "associate to confirm" asks for an action on a review
  // that is closed. It gets the one fact that still means something.
  if (bucket === 'sent') {
    if (!_matchBucket(row, tier, candState).startsWith('identified'))
      return 'Sent without a confirmed booking';
    bucket = 'identified';
  }
  if (bucket === 'candidates') return 'Possible matches — associate to confirm';
  // "Untraceable" is a claim about the booking. This one is a claim about the
  // run, and saying the first when you mean the second sends someone looking
  // for a booking nobody has searched for.
  // Three states, not two. "Queued" is the one the fifteen-review ingest
  // needed and did not have: a review the runner has been handed and has not
  // started is not running, and calling it running is what made thirteen
  // stranded reviews look like thirteen healthy ones.
  if (bucket === 'processing') {
    if (row.processing_state === 'stalled') return 'The run stopped before it searched';
    if (row.processing_state === 'queued')  return 'Queued — the run has not started yet';
    return 'Still running — nothing has been searched yet';
  }
  if (bucket === 'untraceable') return 'Untraceable';
  if (row.unverified) return 'BID from the review — not verified in BigQuery';
  return _bidFromReview(row) ? 'Direct match' : 'Matched from Zendesk';
}

function _bidFromReview(row) {
  if (!row) return false;
  // The review carried a booking id: either the pipeline recorded where it came
  // from, or the review row itself still holds the reference number. Falling
  // back to reference_number matters for rows drafted before bid_source existed.
  if (['attachment', 'manual', 'regex'].includes(row.bid_source)) return true;
  return !!(row.reference_number && String(row.reference_number).trim());
}

// Backend identity chip. Stale code or a different database is the single
// most confusing failure in this app - two dashboards, two answers - so it is
// on screen rather than in a curl command.
async function fetchInbox() {
  try {
    const rows = await (await fetch('/api/reviews')).json();
    const byId = new Map(REVIEWS.map(r => [r.id, r]));
    const merged = rows.map(row => {
      const demo = byId.get(row.id);
      if (demo) {
        // Recompute type/tier/title from the FRESH row — a re-run can move a
        // review between tabs (untraceable -> candidates -> identified).
        const t = row.match_tier ?? demo.matchTier;
        const c = row.candidate_state ?? demo.candidateState;
        return {
          ...demo,
          receivedAt:     row.received_at || demo.receivedAt,
          status:         row.status      || demo.status,
          // Which kind of Sent this is. Carried on BOTH branches below,
          // because a review the API knows about and one the client already
          // had are the same review and must not disagree about it.
          closedAt:       row.closed_at    || null,
          closeReason:    row.close_reason || '',
          sentRoute:      row.sent_route || '',
          matchTier:      t,
          candidateState: c,
          type:           row.bucket || _bucketFallback(row, t, c),
          tier:           row.tier_label || (t ? `T${t}` : '—'),
          unverified:     !!row.unverified,
          // Which kind of not-yet-searched this is: a run in flight, or one
          // that ended without writing a draft. Same blank card, opposite
          // responses — wait, versus re-run and read the log.
          processingState:  row.processing_state || '',
          processingReason: row.processing_reason || '',
          matchTitle:     _matchTitle(row, t, c),
          // WHETHER THE REVIEW ITSELF CARRIED A BOOKING ID. _bidFromReview
          // reads these two, and it is called both on the RAW api row (in
          // _matchTitle, just above) and on this view-model (the header
          // chip). Without them here the helper silently answered false for
          // every review, and the chip said "no BID in text" on cards whose
          // id is named in the trail two panels down.
          bid_source:       row.bid_source || '',
          reference_number: row.reference_number || '',
          // WHO PICKED THIS UP. On the record, never in component state — it
          // is a property of the review, and a global would leak one case's
          // owner onto the next. `??`, not `||`: null (never claimed) and ""
          // (typed then cleared) are different facts the queue renders apart,
          // and `|| null` would fold the empty string into null.
          owner:            row.picked_up_by ?? (demo.owner ?? null),
        };
      }
      // New API-only review (manual / Slack): minimal template
      const tier = row.match_tier;
      return {
        id:             row.id,
        author:         row.author || 'Unknown',
        firstName:      _firstName(row.author),
        rating:         row.rating || 1,
        stars:          '★'.repeat(row.rating || 1) + '☆'.repeat(5 - (row.rating || 1)),
        language:       row.language || 'en',
        lang:           (row.language || 'en').toUpperCase(),
        receivedAt:     row.received_at,
        // A missing date says so. The column has no default any more, so a
        // creation site that forgets one leaves NULL — and an empty cell
        // reads as a formatting bug rather than as an absent fact.
        time:           row.received_at ? new Date(row.received_at).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : 'no date recorded',
        status:         row.status || 'new',
        closedAt:       row.closed_at    || null,
        closeReason:    row.close_reason || '',
        sentRoute:      row.sent_route || '',
        matchTier:      tier,
        matchTitle:     _matchTitle(row, tier, row.candidate_state),
        candidateState: row.candidate_state || false,
        type:           row.bucket || _bucketFallback(row, tier, row.candidate_state),
        tier:           row.tier_label || (tier ? `T${tier}` : '—'),
        unverified:     !!row.unverified,
        // Which kind of not-yet-searched this is: a run in flight, or one
        // that ended without writing a draft. Same blank card, opposite
        // responses — wait, versus re-run and read the log.
        processingState:  row.processing_state || '',
        processingReason: row.processing_reason || '',
        // Same two fields as the branch above, for the same reason: one
        // review must not answer "did it carry a booking id?" differently
        // depending on which branch built it.
        bid_source:       row.bid_source || '',
        reference_number: row.reference_number || '',
        // Same field, same branch-parity reason as everything above it: one
        // review must not carry an owner on one code path and not the other.
        owner:            row.picked_up_by ?? null,
        experience:     row.experience || '',
        channel:        'orm',
        original:       row.snippet || '',
        english:        null,
        originalText:   row.snippet || '',
        englishText:    row.snippet || '',
        booking:        {},
        rca:            {
          issueL1: '', issueL2: '', subTheme: null,
          whatWentWrong: '', statedIssue: '',
          supportInteraction: [], supportSummary: '', spInteraction: [],
          areaOfImproving: '',
          actionsTaken: Object.fromEntries(ACTION_TEAMS.map(([t]) => [t, []])),
          resolution: '',
          v3: {}, wwrChain: [], wwrScenarios: [], prevention: '',
          evidence: [], checklistAnswers: [],
          checks: [], reply: '', reasoning: '',
          primaryScenario: '',
          slackThreadOverride: '',
        },
        insights: {
          tgidRating: {value:'—',sub:'',tone:''},
          tidVidRating: {value:'—',sub:'',tone:''},
          completion: {value:'—',sub:'',tone:''},
          sameDayIssues: {value:'—',sub:'',tone:''},
          similarSupport: [], similarReviews: [],
        },
        events: [],
        timelineSummary: '',
      };
    });
    merged.sort((a, b) => new Date(b.receivedAt || b.time || 0) - new Date(a.receivedAt || a.time || 0));
    REVIEWS.length = 0;
    REVIEWS.push(...merged);
    return true;
  } catch (e) {
    console.warn('[inbox] fetch failed, keeping last loaded reviews:', e);
    // Keeping the old rows on screen is the right call — a blank inbox is
    // worse than a stale one — but the CALLER has to be able to tell. A
    // refresh that could not reach the server and one that reached it and
    // found no change look identical from outside this function, and the
    // difference is whether waiting longer will help.
    return false;
  }
}

// Overlay real draft fields onto the demo view-models. Data source only:
// sub_theme, support_interaction_frames (+ sp_interaction_frames) and
// support_summary come from /api/reviews/{id}; markup stays demo-v15.

// Defect 5: a pipeline exception is never rendered as a trail step. The step
// carries a plain-language sentence; the raw error and its SQL sit behind a
// toggle, in mono, height-capped and scrollable, so a 500-character SELECT
// cannot push the panel apart. Shared by both trail renderers - two copies of
// this drifted once already.
// A trail step's text is written with <strong> in it, so it cannot simply be
// escaped — but it also carries whatever the pipeline put there, and some of
// those values are SQL, error text and quoted fragments. Injected raw, a
// stray '<' silently swallows the rest of the line, and a query with angle
// brackets can take the whole panel with it.
//
// So: escape everything, then put back the ONE tag this text is allowed to
// use. Anything else renders as the characters it is.
// When the booking was created. ONE FACT, THREE NAMES, and this read only the
// first of them:
//
//   bigquery_patch.verify_bid    date_of_booking   (full timestamp)
//   bigquery._row_to_dict        bookedOn
//   pipeline._make_candidate     bookedOn + creationDate
//
// A booking that arrived by either of the last two rendered "Booking date —",
// which is exactly what a booking with no creation date renders. A field that
// moved and a field that is genuinely empty must not print the same thing.
// Which of the three answers /api/version gave: 'stale', 'current', or
// 'unknown' when the commit could not be read at all. Hoisted so the banner
// and the build stamp read ONE rule — they are two renderings of the same
// fact, and a copy of this logic in each is a copy that drifts.
function buildState(v) {
  if (!v || v.stale === null || v.stale === undefined) return 'unknown';
  return v.stale ? 'stale' : 'current';
}

function bookingCreatedAt(db) {
  return normaliseStamp((db && (db.date_of_booking || db.creationDate
                               || db.bookedOn)) || '');
}

// BigQuery hands a TIMESTAMP back as epoch seconds, and a float that large
// str()s into scientific notation. "1.785791592E9" reached the Booking date
// row verbatim, and lead time - which does new Date(booking) - got NaN and
// printed a dash. So the card showed a booking with no computable lead time
// next to a booking date that was plainly a machine number, and neither said
// why. Normalised once, here, because both readers take this value.
//
// Seconds or milliseconds, bounded by a plausible date window rather than by
// digit count: both units are 10-13 digits at different points in history and
// reading one as the other is fifty years out, silently. Anything else is
// returned untouched - an ISO string is already what the callers want, and a
// value we cannot read must not be dressed as a date.
// A stored `time` rendered for a human. Epoch values reach the timeline from
// BigQuery through the model, and printing one verbatim puts "1.785791592E9"
// where a clock belongs - which is what the reader sees on every row built
// from booking metadata rather than from a Zendesk event.
//
// "DD Mon HH:MM", matching what zendesk._to_ist gives real events, so the two
// kinds of row read the same. A value that is not an epoch is returned as it
// was: it is already a formatted time, and reformatting it would be guessing.
// A booking creation stamp for the DETAILS panel. normaliseStamp turns an
// epoch into ISO, and the row then printed that ISO verbatim -
// "2026-06-13T21:20:58.000Z" - beside Visit date and Review date, which are
// plain YYYY-MM-DD. Three date rows, three formats, one of them machine
// output with a T and a Z in it.
//
// Same date shape as its neighbours, plus the TIME, because the time is the
// whole point of this field: it is what tells you a booking was made minutes
// before the slot rather than weeks. IST, matching every other time on the
// card. A value that is not a date is returned untouched rather than dressed
// as one.
function stampDetail(v) {
  const s = normaliseStamp(v);
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  const p = new Intl.DateTimeFormat('en-CA', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
    timeZone: 'Asia/Kolkata'}).formatToParts(d)
    .reduce((a, x) => (a[x.type] = x.value, a), {});
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} IST`;
}

function _candScore(c) {
  // EVERY NON-ZERO TERM, or none of them. This printed "venue X + date Y" for
  // a ranking that sums FIVE — venue, date, ticket-text, name+venue and name
  // (pipeline._score) — so a reader compared two terms, saw 0.02 above 0.33,
  // and concluded the sort was inverted. It was not: the two terms shown were
  // not the ones deciding it.
  //
  // Zero terms are omitted rather than printed as "+ 0", which is noise on a
  // card where most terms are zero most of the time. When every term is zero
  // the total is shown on its own, because "score 0" is a fact and an empty
  // label is not.
  if (c.scoreVenue == null) return `score ${c.score}`;
  const parts = [
    ['venue',  c.scoreVenue],
    ['date',   c.scoreDate],
    ['ticket', c.scoreTicket],
    ['name+venue', c.scoreBoth],
    ['name',   c.scoreName],
  ].filter(([, v]) => typeof v === 'number' && v > 0)
   .map(([k, v]) => `${k} ${v}`);
  return parts.length ? parts.join(' + ') : `score ${c.score}`;
}

function stampText(v) {
  const s = normaliseStamp(v);
  if (!/^\d{4}-\d{2}-\d{2}T/.test(s)) return String(s || '').replace(/ IST$/, '');
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(v || '');
  return d.toLocaleString('en-GB', {day: '2-digit', month: 'short',
                                    hour: '2-digit', minute: '2-digit',
                                    hour12: false, timeZone: 'Asia/Kolkata'})
          .replace(',', '');
}

function normaliseStamp(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (!/^[0-9.eE+]+$/.test(s)) return s;          // not a bare number
  let n = Number(s);
  if (!isFinite(n)) return s;
  if (n > 1e11) n = n / 1000;                     // milliseconds
  if (n > 1e9 && n < 4e9) return new Date(n * 1000).toISOString();
  return s;
}

function trailSafe(text) {
  return esc(String(text == null ? '' : text))
    .replace(/&lt;strong&gt;/g, '<strong>')
    .replace(/&lt;\/strong&gt;/g, '</strong>');
}

function trailStep(st, key) {
  const mark = st.mark === 'pass' ? '✓' : st.mark === 'warn' ? '!' : '✗';
  const cls  = st.mark === 'pass' ? 'pass' : st.mark === 'warn' ? 'warn' : 'fail';
  const raw  = st.raw ? String(st.raw) : '';
  const open = !!state.rawErrOpen[key];
  return `
    <div class="conf-step ${cls}">
      <span class="mark">${mark}</span>
      <span class="label-text">${trailSafe(st.text)}${raw ? `
        <button class="err-raw-toggle" data-raw-err="${key}">${open ? 'hide raw error' : 'show raw error'}</button>
        ${open ? `<div class="err-raw">${esc(raw)}</div>` : ''}` : ''}</span>
    </div>`;
}

// The trail is 40-odd steps of pipeline vocabulary — "Mock BQ", "regex BID",
// "Author parsed: first=…". That is a debugging log, and the people reading
// this card are deciding whether to trust a booking match.
//
// So: show what went WRONG, always, because that is the part that changes what
// they do — and collapse the steps that went right into one line. The full
// trail stays one click away rather than being dropped: a shorter trail must
// not become a trail that hides that a step ran at all.
// "How we built this match" is the MATCH. Steps from every later stage were
// landing in it — "Reply voice — written against 5 approved macro(s)…",
// "RCA — 2 event(s) have no ticket id and were grouped by a 30-minute
// window" — so the section that answers "is this the right booking?" was
// mostly about drafting a reply. A reader looking for the identifiers had to
// find them among steps that could not bear on the question.
//
// Matched on the step's own bold label, which every appender writes. An
// unlabelled step is KEPT: dropping something we cannot classify would hide
// a match step for the sake of tidiness, and the identifiers are the one
// thing this section must never lose.
//
// ANCHORING ON THE FIRST WORD IS WHY THIS LEAKED TWICE. The step
// "<strong>The reply is an approved macro, sent as written</strong> — no
// booking was matched…" is pure reply-drafting and survived every prefix in
// the list, because it leads with "The". A label is a sentence someone wrote,
// not an enum, so the words that identify the STAGE can sit anywhere in it.
// Reply/macro/response labels are therefore matched wherever they appear;
// the rest stay anchored, since "Draft" and "Response" are common enough
// words to swallow a match step if let loose mid-label.
const _NOT_MATCH = /^(RCA|Reply voice|Draft|Response|DSS|Insights|Classification|Macros?|Slack post|Sub-?themes?|Checklist|Scenario)\b|\b(repl(?:y|ies)|macros?)\b/i;

function matchTrail(steps) {
  return (steps || []).filter(st => {
    const m = String(st && st.text || '').match(/^\s*<strong>([^<]*)<\/strong>/i);
    return !m || !_NOT_MATCH.test(m[1].trim());
  });
}

// "How we built this match", COLLAPSED BY DEFAULT.
//
// It is the working-out, not the answer. On a card where the match is
// obvious it is eight lines of pipeline vocabulary above the thing the
// reader came for, and they scroll past it every time; on a card where the
// match is in doubt it is the first thing they open. Shut by default and one
// click from open serves both, which a permanently open panel does not.
//
// The count is on the closed header on purpose: a reader has to be able to
// see there IS working-out without expanding it, or a collapsed section and
// a review with no trail at all look the same.
function trailSection(steps, prefix) {
  const all = matchTrail(steps || []);
  if (!all.length) return '';
  const open = !!state.trailSectionOpen[prefix];
  const notable = all.filter(s => s.mark !== 'pass').length;
  return `
    <div class="confidence-trail${open ? '' : ' is-shut'}">
      <div class="confidence-trail-label" data-trail-sec="${prefix}">
        <span>How we built this match</span>
        <span class="trail-sec-count">${all.length} step${all.length === 1 ? '' : 's'}${
          notable ? ` · ${notable} to read` : ''}</span>
        <span class="section-chev">${open ? '▾' : '▸'}</span>
      </div>
      ${open ? trailView(all, prefix) : ''}
    </div>`;
}

function trailView(steps, prefix) {
  const all = steps || [];
  const notable = all.filter(s => s.mark !== 'pass');
  const passed = all.length - notable.length;
  const open = !!state.trailOpen[prefix];
  if (!all.length) return '';
  if (open) {
    return all.map((st, n) => trailStep(st, prefix + n)).join('')
      + `<button class="trail-toggle" data-trail-toggle="${prefix}">show less</button>`;
  }
  const head = passed
    ? `<div class="conf-step pass"><span class="mark">✓</span>
         <span class="label-text">${passed} check${passed === 1 ? '' : 's'} passed</span></div>`
    : '';
  return head
    + notable.map((st, n) => trailStep(st, prefix + 'n' + n)).join('')
    + `<button class="trail-toggle" data-trail-toggle="${prefix}">show all ${all.length} steps</button>`;
}

// Hoisted so both columns can use it: §13 moves the booking timeline into the
// facts column, and its rows are editable. It closes over nothing but esc().
// Resolution as an object, whatever shape the draft holds. Drafts written
// before the split store it as a bare string; reading `.text` off one would
// return undefined and blank the line on every older review.
// The resolution types an associate can record, in the order they are offered.
// "More time" is an extended validity or a moved date — the remedy this queue
// hands out most often after a ticket problem, and it had no way of being
// recorded, so those cases were logged as "None" and read as a guest who got
// nothing. "More info" is the same gap for a case closed by telling the guest
// something rather than by compensating them. Neither carries an amount; the
// unit logic above keeps the amount box off them.
const RESOLUTION_TYPES = ['HOC', 'Refund to card', 'Discount code',
                          'More time', 'More info', 'None'];

function _resObj(raw) {
  if (raw && typeof raw === 'object') return raw;
  return {text: typeof raw === 'string' ? raw : '',
          compensation_type: null, amount: null};
}

function edSpan(path, text, ph = 'click to write', markPath = '') {
  // `markPath` is a second dot path set to true when this field is EDITED. A
  // value a person corrected and a value the machine produced must not render
  // identically — the same reason area_of_improving marks a hand-added point
  // "by hand" against a derived one.
  const empty = !String(text == null ? '' : text).trim();
  return `<span class="editable-text${empty ? ' is-placeholder' : ''}" contenteditable="true"
    spellcheck="false" data-v3p="${path}"${markPath ? ` data-v3p-mark="${esc(markPath)}"` : ''}${empty ? ` data-ph="${esc(ph)}"` : ''}>${empty ? esc(ph) : esc(text)}</span>`;
}

function mapSupportFrame(f) {
  return {
    type: f.thread || 'email',
    time: f.time || '',
    label: f.label || '',
    // guest_words is the SERVER's pick between guestSaid and guestReply —
    // stamped in _marked_frames beside is_contact, for the same reason.
    // A guest's REPLY lives in guestReply, and reading guestSaid alone
    // drew an empty line under the guest's own name.
    guestSaid: f.guest_words || f.guestSaid || f.guestReply || f.summary || '—',
    weDid: f.weDid || '—',
    guestReply: f.guestReply || '—',
    gap: f.gap || '',
  };
}

// {ok, window, insights} or a bare insights dict - take whichever this server
// speaks. Recognised by a field every insights payload carries.
//
// Top level, because two callers need it: the initial load below and the
// window-picker handler in renderReviewCol. It used to be declared inside
// loadDraftOverlays, so the picker's call threw a ReferenceError into a catch
// that discarded it - the fetch succeeded, the response was thrown away, and
// the panel kept the previous window's numbers under the previous window's
// label. Every symptom of a broken window picker, with a working request
// behind it.
// "90d" -> 90. Mirrors _WINDOWS in server/services/insights.py, and exists so
// the panel can compare the window it ASKED for against the one the payload
// says it got. Unknown strings return null rather than a guess: claiming a
// mismatch on a window we cannot parse would be its own false alarm.
function windowDays(w) {
  const m = /^(\d+)\s*([dwm])$/i.exec(String(w || '').trim());
  if (!m) return null;
  return Number(m[1]) * {d: 1, w: 7, m: 30}[m[2].toLowerCase()];
}

function unwrapInsights(payload) {
  if (!payload || typeof payload !== 'object') return null;
  if (payload.insights && typeof payload.insights === 'object') return payload.insights;
  if ('similar_reviews_30d' in payload || '_computed_for_l2' in payload) return payload;
  return null;
}

// Everything a scenario change invalidates, re-read from the server.
//
// The scenario drives the checklists, the issue questions, the DSS routing and
// the prompt, so changing it makes the RCA on screen an answer to a question
// nobody is asking any more. It also changes `scenario_routing.diverged` and
// the uncovered-scenario list, both computed server-side — guessing those
// locally is how the card and the server end up disagreeing about the same
// scenario.
//
// The insights go too. They are scoped by L1/L2 rather than by scenario, but a
// scenario change usually follows a classification change, and a panel that
// silently keeps the previous classification's figures is the exact complaint
// this dashboard already had once.
// Save the routing lists and re-run the RCA against them, for whichever
// review is selected.
//
// TOP LEVEL, not a closure inside renderRcaCol, because the chip controls it
// serves are DRAWN by renderReviewCol. A closure has to be re-created by a
// render that runs after the markup exists, and eight callers of
// renderReviewCol do not call renderRcaCol afterwards - so changing the
// insights window, among others, left every scenario control on the card
// bound to nothing. Silently: the select still opens, still shows options,
// and does nothing when you pick one.
async function regenerateForScenarios(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r || !r.rca) return;
  const rca = r.rca;
  // DEDUPED. `rca.scenarios` is the whole ordered list and already contains
  // the overlays, so concatenating them appended every overlay a second time —
  // and regenerate-rca writes this list straight back over d.scenarios. That
  // is what multiplied the chips, and what made removing one look dead: the
  // removal was saved and then overwritten by a union that still held it.
  const scenarios = [...new Set([...(rca.scenarios || []),
                                 ...(rca.overlayScenarios || [])].filter(Boolean))];
  rca.primaryScenario = scenarios[0] || '';
  // Save first: if generation fails the chips still reflect what the person
  // chose, instead of snapping back on the next render.
  await saveDraft(r.id, {sub_themes: rca.subThemes || [],
                         scenarios: rca.scenarios || [],
                         overlay_scenarios: rca.overlayScenarios || []});
  if (!scenarios.length) { renderReviewCol(); renderRcaCol(); return; }
  const st = document.querySelector('[data-scenario-regen-status]');
  if (st) st.textContent = '⟳ re-running RCA for new scenarios…';
  let failed = '';
  try {
    const resp = await fetch(`/api/reviews/${r.id}/regenerate-rca`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scenarios}),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'regen failed');
    rca.v3 = data.rca_v3 || {};
    rca.prevention = data.prevention || rca.prevention;
    if (data.area_of_improving) rca.areaOfImproving = data.area_of_improving;
    rca.checklistAnswers = [];
    rca.primaryScenario = data.primary_scenario || rca.primaryScenario;
    rca.overlayScenarios = data.overlay_scenarios || rca.overlayScenarios;
  } catch (e) {
    failed = '✗ RCA re-run failed — scenario saved, try again';
    await saveDraft(r.id, {primary_scenario: rca.primaryScenario || null});
  }
  // Outside the try: the scenario was saved either way, so the routing
  // verdict and the insights panel are stale either way.
  await refreshAfterScenarioChange(r.id);
  renderReviewCol(); renderRcaCol();
  if (failed) {
    const after = document.querySelector('[data-scenario-regen-status]');
    if (after) after.textContent = failed;
  }
}

// The chip controls, delegated. See regenerateForScenarios above for why.
//
// There is no attribute-to-store map any more. There used to be one, pointing
// the scenario controls at `scenarios` and the overlay controls at
// `overlayScenarios` — two arrays for one ordered list, which is what let a
// deleted overlay survive in the list the next save wrote back. Both rows
// edit `scenarios`; the overlays are its tail.
document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest(
    '[data-scenario-add], [data-overlay-add]');
  if (!sel || !sel.value) return;
  const attr = sel.hasAttribute('data-scenario-add')
    ? 'data-scenario-add' : 'data-overlay-add';
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  // One list again. Adding from either row appends to `scenarios`; the first
  // entry is the primary and the rest are the overlays, so which row the add
  // came from decides nothing except where the chip lands on redraw. A value
  // already present is a no-op rather than a second chip.
  const list = [...(r.rca.scenarios || [])];
  if (!list.includes(sel.value)) list.push(sel.value);
  r.rca.scenarios = list;
  r.rca.overlayScenarios = list.slice(1);
  r.rca.primaryScenario = list[0] || '';
  await regenerateForScenarios(r.id);
});
// ONE listener for every collapsible section, in any column, drawn by any
// render pass. Delegated at document level for the reason above: a per-render
// binding is only ever as complete as the root it was given, and this file has
// three separate render functions writing sections.
document.addEventListener('click', ev => {
  const label = ev.target.closest && ev.target.closest('.section-label');
  if (!label) return;
  // Never swallow a click meant for a control inside the head.
  if (ev.target.closest('input, select, button, [contenteditable="true"], a')) return;
  const sec = label.closest('.section');
  if (!sec) return;
  const key = sec.dataset.secKey || sec.id;
  const now = !sec.classList.contains('is-collapsed');
  sec.classList.toggle('is-collapsed', now);
  if (key) state.collapsed[key] = now;
});

document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest(
    '[data-scenario-remove], [data-overlay-remove]');
  if (!btn) return;
  const attr = btn.hasAttribute('data-scenario-remove')
    ? 'data-scenario-remove' : 'data-overlay-remove';
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const idx = parseInt(btn.getAttribute(attr));
  if (Number.isNaN(idx)) return;
  // BOTH ROWS EDIT ONE LIST. The Primary row renders scenarios[0] and the
  // Overlays row renders scenarios[1:], so an overlay's index is offset by
  // one. Removing from a separate overlayScenarios array is what made the ×
  // look dead: the item was still in `scenarios`, and the very next save
  // wrote it back.
  const off = attr === 'data-overlay-remove' ? 1 : 0;
  const list = (r.rca.scenarios || []).filter((_, i) => i !== idx + off);
  r.rca.scenarios = list;
  r.rca.overlayScenarios = list.slice(1);
  r.rca.primaryScenario = list[0] || '';
  await regenerateForScenarios(r.id);
});

// Sub-themes, delegated for the same reason. They do NOT re-run the RCA:
// the sub-theme does not change the checklists, so it saves and redraws.
async function saveSubThemes(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r || !r.rca) return;
  r.rca.subTheme = (r.rca.subThemes || [])[0] || null;
  await saveDraft(r.id, {sub_themes: r.rca.subThemes || [],
                         scenarios: r.rca.scenarios || [],
                         overlay_scenarios: r.rca.overlayScenarios || []});
  renderReviewCol(); renderRcaCol();
}
document.addEventListener('change', async ev => {
  const sel = ev.target.closest && ev.target.closest('[data-subtheme-add]');
  if (!sel || !sel.value) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  r.rca.subThemes = [...(r.rca.subThemes || []), sel.value];
  await saveSubThemes(r.id);
});
document.addEventListener('click', async ev => {
  const btn = ev.target.closest && ev.target.closest('[data-subtheme-remove]');
  if (!btn) return;
  const r = REVIEWS.find(x => x.id === state.selected);
  if (!r || !r.rca) return;
  const idx = parseInt(btn.getAttribute('data-subtheme-remove'));
  if (Number.isNaN(idx)) return;
  r.rca.subThemes = (r.rca.subThemes || []).filter((_, i) => i !== idx);
  await saveSubThemes(r.id);
});

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-trail-toggle]');
  if (!b) return;
  const k = b.dataset.trailToggle;
  state.trailOpen[k] = !state.trailOpen[k];
  renderReviewCol();
  renderRcaCol();
});

// The section header. DELEGATED, like every other control here that survives
// a re-render — a handler bound after one render is dead after the next.
//
// AT TOP LEVEL, which is the whole point of a delegated handler. This was
// spliced INSIDE the listener above, so it registered a new listener each
// time that OTHER control was clicked and never fired on the first click of
// its own. Syntactically valid, so the parse test passed and the control
// looked live — the failure mode this file has hit four times now, and the
// reason there is a test that clicks it.
document.addEventListener('click', (ev) => {
  const h = ev.target.closest && ev.target.closest('[data-trail-sec]');
  if (!h) return;
  const k = h.dataset.trailSec;
  state.trailSectionOpen[k] = !state.trailSectionOpen[k];
  renderReviewCol();
  renderRcaCol();
});

// ── facts-rail resize ───────────────────────────────────────────────────────
// The case page splits into a story column and a facts rail; the rail is
// draggable so an associate can widen the detail rows or give the story more
// room. Deliberately NOT the old three-column resize — that mechanism (_setCol,
// its CSS vars, the width store) was deleted with the slide-over, and this is a
// new, single, case-internal handle with its own names, so its return does not
// resurrect the phantom the slide-over tests guard against.
//
// The width is a per-browser preference held on the document element and in
// localStorage, so it outlives a re-render and a reload. Clamped to 280–560px
// (handoff §2): narrower truncates the detail rows, wider starves the story.
// The clamp is enforced here, not in CSS, so a stored value from a wider build
// or a hand-edited key cannot widen the rail past what the layout can take.
const RAIL_MIN = 280, RAIL_MAX = 560, RAIL_KEY = 'rca.factsRailW';
function _setRailW(px) {
  const w = Math.max(RAIL_MIN, Math.min(RAIL_MAX, Math.round(px)));
  document.documentElement.style.setProperty('--facts-rail-w', w + 'px');
  return w;
}
function _saveRailW(w) {
  try { localStorage.setItem(RAIL_KEY, String(w)); } catch (e) { /* private mode */ }
}
(function _restoreRailW() {
  // A missing or unparseable key is not an error — it is the first visit, and
  // the CSS default (368px) already covers it. Only a real stored number moves
  // the rail off that default.
  let raw = null;
  try { raw = localStorage.getItem(RAIL_KEY); } catch (e) { return; }
  const w = parseInt(raw, 10);
  if (Number.isFinite(w)) _setRailW(w);
})();
document.addEventListener('pointerdown', (ev) => {
  const handle = ev.target.closest && ev.target.closest('[data-rail-drag]');
  if (!handle) return;
  const rail = document.querySelector('.facts-rail');
  if (!rail) return;
  ev.preventDefault();
  const startX = ev.clientX;
  const startW = rail.getBoundingClientRect().width;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  let last = startW;
  // The handle sits on the rail's LEFT edge and the rail is on the right, so
  // dragging left (clientX shrinks) must WIDEN the rail — hence startW minus the
  // signed delta, not plus.
  const onMove = (e) => { last = _setRailW(startW - (e.clientX - startX)); };
  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    _saveRailW(last);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});

async function refreshAfterScenarioChange(reviewId) {
  const r = REVIEWS.find(x => x.id === reviewId);
  if (!r) return;
  try {
    const [draftResp, insResp] = await Promise.all([
      fetch(`/api/reviews/${reviewId}`),
      fetch(`/api/reviews/${reviewId}/insights?window=`
            + encodeURIComponent(state.insightsWindow)),
    ]);
    if (draftResp.ok) {
      const d = (await draftResp.json()).draft;
      if (d) {
        r.rca.scenarioRouting  = d.scenario_routing || null;
        r.rca.primaryScenario  = d.primary_scenario || '';
        r.rca.scenarios        = d.scenarios || [];
        r.rca.overlayScenarios = d.overlay_scenarios || [];
      }
    }
    if (insResp.ok) {
      const ins = unwrapInsights(await insResp.json());
      if (ins) r.liveInsights = ins;
    }
  } catch (e) {
    // Leave what is on screen and say so, rather than blanking the panel:
    // a refresh that failed is not the same as figures that are empty.
    state.insightsError = 'The scenario was saved, but the panel could not be '
      + 'refreshed — the figures below may be for the previous scenario.';
  }
}

// Cap how many overlay fetches are in flight at once. loadDraftOverlays loads
// draft + insights for EVERY review, and firing them all through one
// Promise.all was 2 requests × N reviews at once — 112 for 56 reviews. That
// burst tripped the platform rate limit: requests came back 429 (and the
// backend's own pool 500'd under it), so cards never populated and the RCA
// column would not open. The eager load is kept — it is just PACED, a few
// reviews at a time, which stays well under the limit and still finishes
// quickly. Returns a function that runs `fn` when a slot is free.
function _pLimit(n) {
  let active = 0;
  const queue = [];
  const pump = () => {
    while (active < n && queue.length) {
      active++;
      const { fn, resolve, reject } = queue.shift();
      Promise.resolve().then(fn).then(
        v => { active--; resolve(v); pump(); },
        e => { active--; reject(e); pump(); });
    }
  };
  return fn => new Promise((resolve, reject) => {
    queue.push({ fn, resolve, reject });
    pump();
  });
}

async function loadDraftOverlays() {
  // At most 4 reviews' worth of overlay fetches concurrently (8 requests),
  // shared across every review below.
  const _run = _pLimit(4);
  await Promise.all(REVIEWS.map(async (r) => {
    if (!r.rca) return;
    try {
      const [draftResp, insightsResp] = await _run(() => Promise.all([
        fetch(`/api/reviews/${r.id}`),
        // Send the window the picker is displaying. Without it the server
        // applied its own default (30d) while the picker highlighted 90d, so
        // every first load showed one window's numbers under another window's
        // button - and clicking around masked it, because clicking does send
        // the window.
        fetch(`/api/reviews/${r.id}/insights?window=${encodeURIComponent(state.insightsWindow)}`),
      ]));
      if (!draftResp.ok) return;
      const payload = await draftResp.json();
      const draft   = payload.draft;
      const review  = payload.review;

      // ── Full review text ──────────────────────────────────────────────────
      // BEFORE the no-draft bail-out. The inbox list carries a 120-character
      // snippet, and this is what replaces it with the real body; behind the
      // guard, any review without a draft row (every untraceable one, if the
      // pipeline never saved) was left showing a sentence cut mid-word.
      if (review) {
        // Kept in step with fetchInbox: both endpoints answer about the same
        // review, and a card that learns its text from one and its Sent state
        // from the other is a card that can show a closed review as open.
        r.closedAt     = review.closed_at    || r.closedAt    || null;
        r.closeReason  = review.close_reason || r.closeReason || '';
        r.sentRoute    = review.sent_route || r.sentRoute || '';
        r.original     = review.body_original || r.original     || '';
        r.originalText = review.body_original || r.originalText || '';
        r.english      = review.body_english  || r.english      || null;
        r.englishText  = review.body_english  || r.englishText  || '';
      }
      if (!draft) return;

      // ── RCA core fields ───────────────────────────────────────────────────
      r.rca.issueL1   = draft.l1        || r.rca.issueL1  || '';
      r.rca.issueL2   = draft.l2        || r.rca.issueL2  || '';
      r.rca.subTheme  = draft.sub_theme || r.rca.subTheme || null;
      r.rca.subThemes = draft.sub_themes || (draft.sub_theme ? [draft.sub_theme] : []);
      r.rca.scenarios = draft.scenarios ||
        [draft.primary_scenario, ...(draft.overlay_scenarios || [])].filter(Boolean);
      r.rca.v3        = draft.rca_v3    || {};
      r.insightsRaw   = draft.insights  || {};
      r.untraceableReason  = (draft.extracted_signals || {}).untraceable_reason || '';
      r.extractedSignals   = draft.extracted_signals || {};
      r.narrowingAttempts  = draft.narrowing_attempts || [];
      r.rca.wwrChain  = draft.wwr_chain || [];
      r.rca.prevention= draft.prevention|| '';
      r.rca.evidence  = draft.evidence  || [];
      r.rca.checks    = draft.diagnostic_checks || [];

      r.rca.whatWentWrong = Array.isArray(draft.what_went_wrong_bullets)
        ? draft.what_went_wrong_bullets.join('\n')
        : (draft.what_went_wrong_bullets || r.rca.whatWentWrong || '');

      // Kept as the array it is. Joining it into a string worked while the
      // points were strings and printed "[object Object]" the moment each one
      // started carrying the finding it came from.
      r.rca.areaOfImproving = Array.isArray(draft.area_of_improving)
        ? draft.area_of_improving
        : (draft.area_of_improving || r.rca.areaOfImproving || '');

      r.rca.resolution = draft.resolution || r.rca.resolution || '';
      // THE OUTGOING REPLY, in the guest's language. This is the one store:
      // Copy, Send and the Slack post all read `rca.reply` and nothing else.
      // The English box below is a projection of it and is never sent.
      r.rca.reply      = draft.final_response || draft.suggested_response || r.rca.reply || '';
      // The English working view and how far it can be trusted, both decided
      // server-side. `englishView.state` is one of same | current | stale |
      // absent — `stale` means the outgoing reply was edited directly after
      // this English was made, and the box has to say so rather than show a
      // superseded translation as if it were the reply about to go out.
      r.rca.englishView     = draft.english_view    || null;
      r.rca.responseLanguage = draft.response_language || null;
      r.rca.primaryScenario  = draft.primary_scenario || r.rca.primaryScenario || '';
      r.rca.overlayScenarios = draft.overlay_scenarios || [];
      // Where the primary came from and how it stands against routing NOW.
      // Computed server-side so the card, the regenerate endpoint and the
      // trail cannot each reach a different answer.
      r.rca.scenarioRouting  = draft.scenario_routing || null;
      r.contentMatch         = draft.content_match || null;
      r.indicatorMatch       = draft.indicator_match || null;
      r.rca.wwrScenarios     = draft.wwr_scenarios    || [];

      // actions_taken: API returns {sp: [strings], ce: [strings], …}
      // render expects [{context, with, handle, time, where}]
      if (draft.actions_taken) {
        const toItems = arr => (arr || []).map(s => (typeof s === 'string'
          ? { context: s, with: '', handle: '', time: '', where: '#' }
          : { context: s.context || '', with: s.with || '', handle: s.handle || '',
              time: s.time || '', where: s.where || '#' }));
        // Every key the payload holds, folded onto the nine teams. Reading a
        // fixed five would have dropped every row on a card written under the
        // new vocabulary, and an emptied tab is indistinguishable from a tab
        // with nothing to raise.
        // UNROUTED IS ONE OF THE BUCKETS. The server routes a fix with no
        // owner to `unrouted`, and this built its buckets from the nine teams
        // and dropped anything `actionTeamKey` could not map — so those rows
        // were discarded HERE, on the way in, before the tab strip ever got a
        // chance to draw them. The tab was added first and still read zero,
        // which is how the ingest turned out to be the one eating them.
        const tabs = Object.fromEntries(
          [...ACTION_TAB_ORDER, ...ACTION_TEAMS].map(([t]) => [t, []]));
        Object.keys(draft.actions_taken).forEach(k => {
          const t = (String(k).toLowerCase() === 'unrouted')
            ? 'unrouted' : actionTeamKey(k);
          if (t && tabs[t]) tabs[t] = tabs[t].concat(toItems(draft.actions_taken[k]));
        });
        r.rca.actionsTaken = tabs;
      }

      r.rca.checklistAnswers     = draft.checklist_answers      || [];
      r.rca.slackThreadOverride  = draft.slack_thread_override  || '';
      r.rca.slackOverrideStale   = !!draft.slack_override_stale;
      // The what-went-wrong section, composed by the SERVER. This page used to
      // build it here in JS from the same rca_v3, which made two composers for
      // one block of text and let the client print "Fix: [object Object]" into
      // a real post while the server's version was correct. There is one
      // composer now and this is its output; nothing on this page rebuilds it.
      r.rca.wwrSlackText         = draft.wwr_slack_text || '';
      r.rca.bookingDetailsText   = draft.booking_details_text || '';
      r.rca.contactsSlackText    = draft.contacts_slack_text || '';
      r.rca.supportInteraction   = (draft.support_interaction_frames || []).map(mapSupportFrame);
      // Facts and interpretation arrive separately and are merged at render:
      // the frames are Zendesk-derived rows, the notes are the model's account
      // joined by zd_ref. Keeping the raw frames because grouping needs
      // ticket_id and time_sort, which mapSupportFrame drops.
      r.rca.supportFrames        = draft.support_interaction_frames || [];
      r.rca.supportNotes         = draft.support_interaction_notes  || [];
      r.rca.spFrames             = draft.sp_interaction_frames      || [];
      r.rca.spNotes              = draft.sp_interaction_notes       || {};
      r.rca.supportSummary       = draft.support_summary        || '';
      r.rca.spInteraction        = (draft.sp_interaction_frames || []).map(f => ({
        time: f.time || '', label: f.label || '', summary: f.summary || f.weDid || '',
      }));

      // ── Candidate list (T2) ──────────────────────────────────────────────
      if (Array.isArray(draft.candidates_list) && draft.candidates_list.length) {
        r.candidatesList = draft.candidates_list.map(c => ({
          bid:            c.id || c.bid,
          score:          c.score != null ? c.score : null,
          scoreVenue:     c.score_venue != null ? c.score_venue : null,
          scoreDate:      c.score_date  != null ? c.score_date  : null,
          // THE OTHER THREE TERMS. The ranking is
          // venue + date + ticket + both + name (pipeline._score), and this
          // remap carried two of them — so the card printed "venue 0 + date
          // 0.02" for a sort those two do not decide, and the order looked
          // inverted because the terms doing the deciding were not on screen.
          scoreTicket:    c.score_ticket != null ? c.score_ticket : null,
          scoreBoth:      c.score_both   != null ? c.score_both   : null,
          scoreName:      c.score_name   != null ? c.score_name   : null,
          venueSignal:    c.venue_signal === true,
          matchReasons:   c.matchReasons || c.match_reasons || [],
          experience:     c.experience || c.experienceName || '',
          tgid:           c.tgid || '',
          tid:            c.tid || '',
          vendorName:     c.vendorName || c.partner || '',
          experienceDate: c.experienceDate || c.visitDate || '',
          creationDate:   c.creationDate || c.bookedOn || '',
          status:         c.status || '',
          leadTime:       c.leadTime || '',
          // The guest on the booking, and — when the booking was found through
          // a support contact — what that contact was about. Both are what an
          // associate actually picks between two candidates on.
          guestName:      c.primary_guest_name || c.guestName || '',
          contactCount:   c.contact_count || 0,
          contactTags:    c.contact_tags || '',
          // WHICH PATH FOUND THIS, and WHAT THE WAREHOUSE SAID. This remap
          // builds a fixed shape, so a field not named here is dropped — and
          // a message branching on a dropped field is a branch that never
          // fires.
          //
          // `detailsLookup` is the per-booking answer and it replaces
          // inferring one from the path. The shortlist used to be the path
          // that never asked the warehouse; it asks now, so "no details"
          // there means one of three different things and only the server
          // knows which.
          narrowing_path: c.narrowing_path || '',
          detailsLookup:  c.details_lookup || '',
        }));
      }

      // ── Stated issue ──────────────────────────────────────────────────────
      r.statedIssue = draft.stated_issue || r.statedIssue || '';

      // Which tickets the timeline was built from. An empty events list means
      // something different when tickets matched and yielded nothing than when
      // none matched at all, and the panel could not tell them apart.
      r.zendeskTicketIds = draft.zendesk_ticket_ids || r.zendeskTicketIds || [];

      // ── Timeline → events ─────────────────────────────────────────────────
      if (Array.isArray(draft.timeline) && draft.timeline.length) {
        r.events = draft.timeline.map(t => ({
          time:      t.time    || '',
          // Sortable ISO alongside the display string. Never shown; it is
          // what makes the order checkable rather than assumed.
          time_sort: t.time_sort || '',
          thread:    t.thread  || 'email',
          actor:     t.actor   || '',
          label:     t.label   || '',
          summary:   t.summary || '',
          // Which ticket this came from, so an entry can be opened and
          // verified instead of believed.
          ticket_id: t.ticket_id || '',
          is_internal:     !!t.is_internal,
          internal_reason: t.internal_reason || '',
        }));
      }

      // ── Match title (may be missing on demo stubs) ────────────────────────
      if (!r.matchTitle) {
        const _t = r.matchTier;
        r.matchTitle = _t === 1 ? 'Direct match'
          : _t === 2 ? 'Possible matches — associate to confirm'
          : 'Untraceable';
      }

      // ── Confidence trail + extracted signals ──────────────────────────────
      // Both were read by the renderer but never populated here, so the
      // "How we built this match" box never appeared.
      r.confidenceTrail   = (draft.confidence_trail && draft.confidence_trail.length)
                            ? draft.confidence_trail : null;
      r.extractedSignals  = draft.extracted_signals || {};
      r.slackMentions     = draft.slack_mentions || [];

      // Actions that already went OUT. The server has recorded all three and
      // has been sending them all along; nothing read them, so after a reload
      // every button offered to do it again — and both of these post into a
      // Slack channel people are reading.
      r.rcaPostedAt   = draft.rca_posted_at || null;
      r.flagToBizState = draft.flag_to_biz_state || '';
      r.sentAt        = draft.sent_at || null;

      // ── Match method from confidence trail ────────────────────────────────
      r.matchMethod = draft.match_method
        || (draft.confidence_trail && draft.confidence_trail.length
            ? draft.confidence_trail.map(c => c.text.replace(/<[^>]+>/g, '')).join(' · ')
            : r.matchMethod || '—');

      // ── Wire booking fields from draft.booking ────────────────────────────
      // (bookingCreatedAt is hoisted below — one fact, three names.)
      if (draft.booking) {
        const db = draft.booking;
        r.booking = r.booking || {};
        // A DIFFERENT BOOKING STARTS FROM EMPTY. Every line below keeps the
        // value already on screen when the incoming one is blank
        // (`db.x || r.booking.x`), which is right for a refresh of the SAME
        // booking — a partial payload must not blank a panel — and wrong the
        // moment a re-run or a confirmed candidate matches a different one.
        // The old booking's fulfilment type, vendor and lead time would sit
        // under the new booking's id, and a field belonging to a booking we
        // are no longer looking at is worse than a dash: the dash says we do
        // not know, the stale value asserts something false.
        //
        // Only on a real change of id. Clearing whenever the id is absent
        // would blank the panel on every partial refresh, which is the bug
        // the fallback exists to prevent.
        const _newBid = db.id || '';
        if (_newBid && r.booking.bid && String(r.booking.bid) !== String(_newBid))
          r.booking = {};
        // Fresh draft data ALWAYS wins over whatever is on screen — a re-run
        // can change the matched booking entirely; stale values must not stick.
        r.booking.bid              = db.id                                || r.booking.bid;
        // WHETHER THIS BOOKING'S OWN RECORD WAS EVER READ. Set by
        // select-candidate, which stores the candidate's fields when the
        // warehouse lookup returns nothing or does not complete — and the
        // panel below is otherwise a wall of dashes that reads as a booking
        // with no details rather than as a booking we could not fetch.
        r.booking.detailsLookup    = db.details_lookup                    || r.booking.detailsLookup;
        r.booking.experience       = db.experienceName || db.experience_name || r.booking.experience;
        r.booking.tgid             = db.tgid                              || r.booking.tgid;
        r.booking.tid              = db.tid                               || r.booking.tid;
        r.booking.vid              = db.vid || db.vendor_id               || r.booking.vid;
        r.booking.vendorName       = db.vendorName || db.vendor_name      || r.booking.vendorName;
        r.booking.fulfilmentType   = db.fulfilmentType || db.fulfilment_type || r.booking.fulfilmentType;
        // Both halves. The NOTE is why there is no policy, and without it the
        // row falls back to a generic sentence that cannot say whether the
        // ticket was silent or there were no ticket events at all.
        r.booking.cancellationPolicy     = db.cancellation_policy
          || r.booking.cancellationPolicy || '';
        r.booking.cancellationPolicyNote = db.cancellation_policy_note
          || r.booking.cancellationPolicyNote || '';
        r.booking.experienceDate   = db.visitDate || db.date_of_visit     || r.booking.experienceDate;
        r.booking.creationDate     = bookingCreatedAt(db)     || r.booking.creationDate || '';
        r.booking.bookingDate      = bookingCreatedAt(db)     || r.booking.bookingDate;
        r.booking.bmsLink          = db.bms_link;
        r.booking.tgidLink         = db.tgid_link;
        r.booking.ticketMailSeen   = !!db.ticket_mail_seen;
        // Tri-state on purpose: true, false, and "no fulfilment row said".
        // ?? rather than || so a genuine false is not read as absent.
        r.booking.isPartnered      = db.isPartnered ?? db.is_partnered ?? null;
        r.booking.escalationEmail  = db.escalationEmail || '';
        r.booking.escalationType   = db.escalationType || '';
        // The provenance the server resolved: booking_record / vendor_escalations
        // when an address was found, none_found when both sources were read and
        // empty, not_fetched when a source was never consulted. Kept so the
        // render can tell "the SP has none" from "we did not look" - the two
        // used to render identically as "No".
        r.booking.escalationEmailSource = db.escalationEmailSource || '';
        r.booking.contactCount     = db.contactCount ?? null;
        r.booking.contactTypes     = db.contactTypes || '';

        // booking_status and tid_name from BigQuery enrichment
        r.booking.status  = db.booking_status || db.status || r.booking.status || '';
        r.booking.tidName = db.tid_name || db.tour_name || r.booking.tidName || '';

        // Guest name: use plaintext BQ name, then Zendesk requester, then say
        // WHICH source came up empty.
        //
        // The fallback was '[Guest name in Zendesk ticket]' — a sentence
        // dressed as a value. It sat in the value column looking like data,
        // and it made three different situations identical: the warehouse
        // holds a hash, the linked ticket carries no requester, and no ticket
        // was ever matched. The first two are worth opening Zendesk for; the
        // third is not. The server works out which and sends the reason.
        // ONE RULE, ON THE SERVER. This used to re-derive the name here with
        // its own guess at what a warehouse hash looks like —
        // `length <= 20 || contains a space` — beside `_first_guest_name`,
        // `_looks_like_hash` and `is_internal_booking_name` on the server.
        // Four copies of one rule, and they disagreed: a hash with a space in
        // it passed here, and a real single-word name was rejected. That is
        // why the name looked intermittent rather than simply wrong.
        //
        // `draft.guest_name` is the server's answer, already checked against
        // every source and against the internal-label list. An empty string
        // there means no guest name was found, and `guest_name_note` says
        // which source failed.
        if (draft.guest_name) {
          r.booking.primaryGuestName = draft.guest_name;
          r.booking.guestNameNote = '';
        } else {
          r.booking.primaryGuestName = '';
          // `draft`, not `db`. guest_name_note is a TOP-LEVEL field of the
          // draft payload; `db` is draft.booking, which has never carried it.
          // So the read was always undefined and every one of the three
          // reasons the server works out — the warehouse holds a hash, the
          // linked ticket carries no requester, no ticket was matched at all —
          // collapsed into the one generic fallback below. Two of those are
          // worth opening Zendesk for and one is not, and the card could not
          // tell them apart.
          r.booking.guestNameNote = draft.guest_name_note
            || 'no guest name on the booking or on any linked Zendesk ticket';
        }
      }

      // ── Review date ───────────────────────────────────────────────────────
      if (review && review.received_at) {
        r.booking = r.booking || {};
        r.booking.reviewDate = review.received_at.split('T')[0];
      }

      // ── Lead time: days between booking date and visit date ───────────────
      {
        const bookingStr = (r.booking.bookingDate || r.booking.creationDate || '').split('T')[0];
        const visitStr   = (r.booking.experienceDate || '').split('T')[0];
        if (bookingStr && visitStr) {
          const bookingMs = new Date(bookingStr).getTime();
          const visitMs   = new Date(visitStr).getTime();
          const diffDays  = Math.round((visitMs - bookingMs) / 86400000);
          // A dash for "we had no dates" and a dash for "we had dates and
          // could not read them" is the same dash, and only one of them is
          // something to go and fix. NaN says WHICH.
          r.booking.leadTime = !isFinite(diffDays) ? 'unreadable dates'
                             : diffDays >= 2 ? `${diffDays} days`
                             : diffDays === 1 ? '1 day'
                             : diffDays === 0 ? '0 days'
                             : '—';
        } else {
          r.booking.leadTime = '—';
        }
      }

      // ── Live insights from API ────────────────────────────────────────────
      if (insightsResp.ok) {
        // Accept either shape. The endpoint returns {ok, window, insights};
        // older builds returned the insights dict bare. Unwrapping defensively
        // means a page cached from before a deploy still renders numbers
        // instead of "undefined / undefined", which is what an envelope read
        // one level too shallow looks like on every tile.
        const payload = await insightsResp.json();
        r.liveInsights = unwrapInsights(payload) || r.liveInsights;
      }
    } catch (e) { /* keep demo data for this review if the API is unreachable */ }
  }));
  if (typeof renderRcaCol === 'function' && state.selected) renderRcaCol();
  renderReviewCol();
  renderInbox();
}

// Everything a finished background run can have changed, in the order the
// screen depends on it.
//
// BOTH halves are required and the second one is the one that gets forgotten.
// loadDraftOverlays() refreshes the RCA body; it does not touch r.type, which
// is what decides whether the RCA column draws the analysis or its
// "Locked until a booking is confirmed" gate. Only fetchInbox() recomputes
// that, from the server's own bucket rule. A refresh that calls the overlay
// loader alone leaves a confirmed review typed 'candidates' for the rest of
// the session — the run finished, the data landed, and the card looks exactly
// like one where nothing ran.
async function reloadFromServer() {
  try {
    // fetchInbox keeps the old rows when it cannot reach the server, which is
    // right on screen and wrong to report as a refresh. Its answer is carried
    // out of here rather than dropped.
    const fresh = await fetchInbox();
    await loadDraftOverlays();
    renderInbox(); renderReviewCol(); renderRcaCol();
    if (!fresh) console.error('[reload] the inbox could not be re-read — the '
      + 'cards below are the ones that were already on screen');
    return fresh;
  } catch (e) {
    console.error('[reload] refresh after a background run failed:', e);
    return false;
  }
}

let REVIEWS = [];   // populated live from /api/reviews — no demo/placeholder rows

const state = {
  // A leftover from the mock data; there is no review with this id, so it
  // simply means "nothing selected" until the inbox is clicked.
  selected: null,
  // Must agree with the tab marked `active` in the markup, which is All.
  // It said 'identified' while the All tab rendered as selected, so the
  // dashboard opened claiming to show everything, with the count saying 3,
  // and listed one review. The two it hid were the ones that need a human:
  // the unconfirmed match and the untraceable one.
  filter: 'all',
  // What is typed in the inbox search box. Empty means no search — which is
  // not the same as a search that matched nothing, and the empty state below
  // says which.
  search: '',
  // WHICH SURFACE IS SHOWING. The workbench gives each stage of the flow its
  // own surface instead of three columns at once: 'inbox' is the full-width
  // queue table, 'case' is the selected review's page. Selecting a row moves
  // to 'case'; the ← Inbox control moves back. Nothing is dropped — the case
  // screen still holds every column the old layout did.
  screen: 'inbox',
  // Whether the RCA & response slide-over is open over the case. The case
  // shows the facts first; the RCA opens on demand from the case header, and
  // its DOM is exactly the column it replaced, so every edit/save/delete
  // control inside it is unchanged.
  rcaOpen: false,
  // Which of the six RCA tabs is showing. All six panels stay in the DOM (so
  // every per-render binder attaches); the tab bar only toggles which is
  // visible. Diagnosis first, per the handoff.
  rcaTab: 'diag',
  actionTab: 'sp',
  dssEdit: false,
  rawErrOpen: {},
  trailOpen: {},
  trailSectionOpen: {},
  // 30d matches the server's own default (insights.py window_days(default=30)).
  // They disagreed — the picker highlighted 90d while the server computed 30d —
  // so every first load showed one window's numbers under another window's
  // button. Same value on both sides now.
  insightsWindow: '30d',
  // Why the last window switch did not produce numbers, or ''. A failed switch
  // used to be a console line only, so on screen it was identical to a switch
  // that had worked and returned the same figures.
  insightsError: '',
  // Which RCA sections go into the Slack thread post. All on by default;
  // unticking one drops it from the generated text.
  // Slack post section choices, keyed BY REVIEW ID. A single global map
  // silently carried one review's choices onto the next, so a post could
  // ship without the section the previous analyst had switched off.
  slackSections: {},
  slackPicker: {},
  // Section open/closed state, keyed by section label text.
  collapsed: {},
  wwrOpen: {},      // per-issue open state in What went wrong
  ixOpen: {},       // per-contact open state in Guest <-> support
  // Machinery is hidden by default - it was ~8 of 14 events on a real
  // review, and an associate writing an RCA should not be scrolling past
  // Selenium runs to find the two events that matter.
  tlShowInternal: false,
};

// fire once REVIEWS + state exist; fetchInbox merges API rows then loads drafts
(async () => {
  pollBulk(false);          // reattach to a bulk run already in flight
  await fetchInbox();
  await loadSubThemeOptions();
  await loadDraftOverlays();
  renderInbox();
  if (state.selected) renderRcaCol();
})();

// Which tab a review belongs to. One expression, used by the list AND by the
// counts, because those two disagreeing is what made the dashboard claim to
// show everything while listing one review.
function inTab(r, tab) {
  if (tab === 'all') return true;
  // A sent review belongs to Sent, not to its old working tab — otherwise it
  // counts in two tabs at once and the "N elsewhere" breakdown sums past the
  // unique total. `identified` already excluded it; the other three now match.
  if (tab === 'identified') return r.type === 'identified' && r.status !== 'sent';
  if (tab === 'candidates') return r.type === 'candidates' && r.status !== 'sent';
  if (tab === 'untraceable') return r.type === 'untraceable' && r.status !== 'sent';
  if (tab === 'processing') return r.type === 'processing' && r.status !== 'sent';
  if (tab === 'sent') return r.status === 'sent';
  return false;
}

// Which tab to land on after adding a review, from its pipeline bucket. A
// just-added review is almost always still PROCESSING (the pipeline runs async
// and the switch fires right after the fetch); the mapping used to have no
// processing branch, so it fell through to 'identified' — the Matched tab,
// which inTab() will not put a processing review on — and the review the person
// just added appeared to vanish. Each bucket maps to its own tab; 'identified'
// stays the fallback for anything unexpected (e.g. a straight-to-sent add).
function _tabForNewReview(type) {
  return (type === 'identified' || type === 'candidates'
          || type === 'untraceable' || type === 'processing') ? type : 'identified';
}

// Does this review match what was typed?
//
// Searched across everything the reader might have to hand — the guest's
// name, the booking id, a ZD ticket number, the review text, the
// classification, the review id. A search that only looked at the author
// would answer "no such review" to somebody holding a ticket number, which is
// the same sentence as "it is not here" and means something completely
// different.
//
// Every term must match SOMETHING (AND across terms, OR across fields), so
// "lewis refund" narrows rather than widens.
function matchesSearch(r, q) {
